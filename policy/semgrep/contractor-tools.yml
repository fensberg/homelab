# The contractor does not shell out to gh.
#
# It used to, for one question - are there queued deploy runs for this site -
# and the first integration-tier run in this repository's history halted on
# `exec: "gh": executable file not found in $PATH`. The runner image does not
# carry gh, and installing it would not have helped: that job holds
# contents:read, and listing runs needs actions:read. So the dependency came
# out, and this keeps it out: gh is the kind of tool that is present on every
# developer's machine and absent from every image, which is exactly the shape
# that passes review and fails in CI.
rules:
  - id: the-contractor-does-not-shell-out-to-gh
    languages: [go]
    severity: ERROR
    message: >-
      invokes gh. It is absent from the runner image, and the job that would
      need it holds no actions:read - ask the GitHub API directly instead.
    pattern-either:
      - pattern: exec.Command("gh", ...)
      - pattern: exec.CommandContext($CTX, "gh", ...)
      - pattern: $RUN("gh", ...)
    paths:
      include: ["/scripts/contractor/"]
