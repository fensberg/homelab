# The break-glass identity is read only by the restore path.
#
# The identity exists to be fetched when a human is putting the estate back
# together. Every other phase works with the recipient, which is public; a
# phase that holds the private half could decrypt the backups it is writing,
# which is the property this key exists to deny. Keeping it out of OpenTofu
# and out of the rendered config is breakglass-opentofu.yml and
# policy/conftest/gitops.rego.
rules:
  - id: the-break-glass-identity-is-read-only-by-the-restore-path
    # Followed as data, from the identity's reference - or its path written
    # out - to the call that reads a vault value. restore.go is the one place
    # that fetches the value and uses it, which is what a restore is.
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      reads the break-glass identity. Only the restore path may. Every phase in
      the ignition sequence works with the recipient, which is public - a phase
      that holds the private half is a phase that could decrypt the backups it
      is writing, which is the property this key exists to deny.
    pattern-sources:
      - pattern: BackupIdentityRef
      - pattern: $PKG.BackupIdentityRef
      - pattern: '"=~/state_backup\/identity/"'
    pattern-sinks:
      - pattern: onepassword.Read(...)
    paths:
      exclude: ["*_test.go", /scripts/contractor/internal/phases/restore.go]
