# A connection string written in the code carries no credential of its own.
#
# A secrets scanner reads `scheme://user:password@host` as a credential, and
# is told not to where the string is a format: every part filled in when it
# runs, from a value that came out of the vault. So wherever a connection
# string with a user part is written in OpenTofu or a program, the user part
# is placeholders and nothing else. A test's own fixtures are not the code.
rules:
  - id: a-connection-string-carries-no-credential-of-its-own
    languages: [generic]
    severity: ERROR
    message: >-
      writes a connection string whose user part is not a placeholder. A
      secrets scanner is silenced on strings of this shape on the ground that
      they are formats. One with a name or a password written into it is the
      thing the scanner is for.
    pattern-regex: (?m)^(?![ \t]*(?:#|//)).*?[a-z][a-z0-9+.-]*://(?!(?:%[sdvq]|\$\{[^}]+\})(?::(?:%[sdvq]|\$\{[^}]+\}))?@)[^/"'\s@]+@
    paths:
      include: ["*.tf", "*.go"]
      exclude: ["*_test.go"]

  - id: a-connection-string-with-a-user-part-is-written-somewhere
    languages: [generic]
    severity: INFO
    message: a connection string with a user part, its user part placeholders
    metadata:
      presence: >-
        the scanner's silencing for connection strings rests on there being
        some, every one of them a format
    pattern-regex: (?m)^(?![ \t]*(?:#|//)).*?[a-z][a-z0-9+.-]*://(?:%[sdvq]|\$\{[^}]+\})(?::(?:%[sdvq]|\$\{[^}]+\}))?@
    paths:
      include: ["*.tf", "*.go"]
      exclude: ["*_test.go"]
