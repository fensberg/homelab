---
# Production's world settings.
#
# What is NOT here: the server name, the world name and the password. They come
# from the vault through a Secret OpenTofu writes - see
# management/cluster/workloads.tf. A fork changes its config rather than this
# file.
#
# What IS here is every dial the vendor exposes, listed whether or not it is
# set, so the answer to "can we change X" is in one place rather than in a
# search. Only `preset` is wired into the Deployment's arguments today; adding
# one of the others is a key here and a matching argument pair there.
#
# The reason it is not all wired already: Kubernetes expands $(VAR) into a
# single argument and does not split on spaces, so "extra args in one string"
# does not work without a shell - and the image's entrypoint is the server
# binary, deliberately. Each dial is therefore its own argument pair.
apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim-world
  namespace: valheim
data:
  # -preset. The whole difficulty in one value, and the right starting point
  # because it is a single thing somebody can read back later.
  #
  #   normal | casual | easy | hard | hardcore | immersive | hammer
  preset: "normal"

  # --- individual dials, none of them wired yet ---------------------------
  #
  # Each overrides the preset for that one axis. Passed as
  # `-modifier <key> <value>`, so enabling one means adding a key here and
  # `-modifier <key> "$(VALHEIM_MOD_<KEY>)"` to the Deployment's args.
  #
  #   combat        veryeasy | easy | hard | veryhard
  #   deathpenalty  casual | veryeasy | easy | hard | hardcore
  #   resources     muchless | less | more | muchmore | most
  #   raids         none | muchless | less | more | muchmore
  #   portals       casual | hard | veryhard
  #
  # And the on-or-off ones, passed as `-setkey <flag>` with no value:
  #
  #   nobuildcost | playerevents | passivemobs | nomap
  #
  # There is no "normal" token for the -modifier dials. Omitting one is how it
  # stays at whatever the preset says, which is why they cannot simply all be
  # passed with a default value.
