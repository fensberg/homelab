---
# The game server's address inside the tunnel (#446).
#
# An enrolled WARP device is given a route to this one address, and joins by
# it - 10.96.0.46:2456 - from any network, as if it were on the house LAN. The
# address is fixed rather than allocated, because the tunnel route in
# management/cluster/tunnel.tf names it; tests/go/repo/tunnel_routes_test.go
# holds the two together.
#
# Production-only: the address is one per cluster, and staging does not run
# this workload.
apiVersion: v1
kind: Service
metadata:
  name: valheim-tunnel
  namespace: valheim
spec:
  type: ClusterIP
  clusterIP: 10.96.0.46
  selector:
    app.kubernetes.io/name: valheim
  ports:
    - name: game
      protocol: UDP
      port: 2456
      targetPort: 2456
    - name: query
      protocol: UDP
      port: 2457
      targetPort: 2457
