---
# Staging's overlay: which modules land here, and what differs about them.
#
# The file would exist even while empty. Flux's kustomize-controller
# auto-generates a kustomization when it finds none, which flattens in every
# manifest beneath it recursively - the same trap
# clusters/management/kustomization.yaml exists to avoid.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
