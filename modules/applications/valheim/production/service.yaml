---
# The game server's Service on the cluster network.
#
# At an address Kubernetes gives it. It had one fixed by the address plan
# while it was a route through the tunnel for enrolled devices (#446); nobody
# reached it that way - players join through the game's own relay, which the
# server connects out to - so the route was taken away on 2026-10-12 and
# with it the reason to fix an address.
#
# Named for what it is rather than for the application it belongs to. The
# namespace already says `valheim`, so a Service called `valheim` in it reads
# `valheim.valheim` and tells a reader nothing; `game-server` says which part
# of the application answers here.
#
# Production-only: staging does not run this workload.
apiVersion: v1
kind: Service
metadata:
  name: game-server
  namespace: valheim
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valheim
  ports:
    - name: game
      protocol: UDP
      port: 2456
      targetPort: 2456
    - name: query
      protocol: UDP
      port: 2457
      targetPort: 2457
