---
# The environment-agnostic half. An overlay under environments/ supplies the
# image digest, the replica count and anything else that differs between
# staging and production.
#
# No Deployment yet. It arrives with the image digest to pin it to - an
# unpinned tag is not something this repository commits, and the image cannot
# exist until the build has run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - service-account.yaml
  - world.yaml
  - network-policy.yaml
