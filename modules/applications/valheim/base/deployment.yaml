---
# The server itself.
#
# Deployment rather than StatefulSet: there is one of these and there will
# always be one. A StatefulSet buys ordered identity for a set, and a set of
# one has no order to keep.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valheim
  namespace: valheim
  labels:
    app.kubernetes.io/name: valheim
spec:
  replicas: 1
  # Recreate, not RollingUpdate. The volume is ReadWriteOnce and the world is a
  # single-writer file: two pods would either fail to schedule or, worse,
  # both open it. Taking the server down before bringing it up is correct here
  # and is what a rolling update would prevent.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valheim
  template:
    metadata:
      labels:
        # Matched by the NetworkPolicy beside this file. If this label changes
        # the policy stops selecting the pod, and a pod no policy selects is
        # one with no restrictions at all.
        app.kubernetes.io/name: valheim
    spec:
      serviceAccountName: valheim
      # Belt and braces: the ServiceAccount already declines the token, and
      # saying so here means a pod that is later pointed at a different account
      # does not silently acquire one.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        # The volume is mounted for this group, so the server can write its
        # world without the game files being writable by it.
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: valheim
          # renovate: datasource=docker depName=ghcr.io/fensberg/homelab-valheim
          image: ghcr.io/fensberg/homelab-valheim@sha256:1f202cb87a04d7c5bfcf0f434ba04a872e7aea747b75dda019e37013970e8ca7

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # An attacker who lands in this process cannot write an executable
            # anywhere it could be run from, and cannot tamper with the game
            # files it is serving. Trivy rates the absence of this HIGH and is
            # right to.
            #
            # It needs somewhere writable to exist: the volume for the world,
            # and scratch for whatever the engine puts under a home directory.
            # HOME is pointed at that scratch below, because the image's home
            # is the game directory and that is deliberately not writable.
            readOnlyRootFilesystem: true

          # The password arrives as an environment variable and is expanded
          # into the argument below by Kubernetes, not by a shell. The image's
          # entrypoint is the server binary directly, so there is no shell to
          # do it - and $(VAR) expansion in args is the mechanism that does not
          # need one.
          #
          # It is still visible in the process list inside this container,
          # which is what -password means and is not something a manifest can
          # fix. What it is not is written into git.
          env:
            # The name people see and the world to load. Environment values,
            # not module ones: the overlay supplies them, and staging is not
            # obliged to call itself the same thing production does.
            # All three from the Secret OpenTofu writes out of the vault.
            # Two of them are not credentials - the server name is broadcast to
            # anyone who joins - but they live there so a fork picks its own by
            # changing its config rather than by editing this file, and so a
            # pod is not half-configured from two sources.
            - name: VALHEIM_SERVER_NAME
              valueFrom:
                secretKeyRef:
                  name: valheim-server
                  key: server-name
            - name: VALHEIM_WORLD_NAME
              valueFrom:
                secretKeyRef:
                  name: valheim-server
                  key: world-name
            # Difficulty. Nothing set this before, which meant Normal by
            # default - correct, but by omission rather than by decision.
            - name: VALHEIM_PRESET
              valueFrom:
                configMapKeyRef:
                  name: valheim-world
                  key: preset
            # Somewhere writable that is not the game directory. Unity writes
            # player preferences and logs under the home directory whatever
            # -savedir says, and the game files are read-only to this user.
            - name: HOME
              value: /scratch
            - name: VALHEIM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valheim-server
                  key: password

          args:
            - "-name"
            - "$(VALHEIM_SERVER_NAME)"
            - "-world"
            - "$(VALHEIM_WORLD_NAME)"
            - "-password"
            - "$(VALHEIM_PASSWORD)"
            # The relay, and the reason there is no ingress rule and no port
            # forward. Without this the Steam backend is used, which needs both.
            - "-crossplay"
            # The world lives on the volume rather than under the server's home
            # directory, so nothing depends on where a container's home is.
            # Difficulty, as a named preset. The vendor's presets are
            # Normal, Casual, Easy, Hard, Hardcore, Immersive and Hammer.
            # Individual dials exist too - `-modifier <key> <value>` for
            # combat, deathpenalty, resources, raids and portals, and
            # `-setkey <flag>` for nobuildcost, playerevents, passivemobs and
            # nomap - and a preset is the right starting point because it is
            # one value somebody can read back later.
            - "-preset"
            - "$(VALHEIM_PRESET)"
            - "-savedir"
            - "/data"
            # Not listed in the public browser. The join code is how people get
            # in, and a server nobody can enumerate is one nobody probes.
            - "-public"
            - "0"

          volumeMounts:
            - name: world
              mountPath: /data
            - name: scratch
              mountPath: /scratch

          # Sized from the vendor's own guidance rather than from a guess: 4 GiB
          # for a fresh world at this player count, 6-8 once it is explored and
          # built on. The request is what the scheduler reserves; the limit is
          # what stops a leak taking the node's other tenants with it.
          #
          # THIS DOES NOT FIT COMFORTABLY ON AN 8 GiB WORKER. See the note in
          # docs/epochs/03-workload.md - moving this workload to the shared
          # workers was right on isolation grounds and was not costed on memory.
          resources:
            requests:
              memory: 8Gi
              # Four, and there is deliberately no CPU limit beneath it.
              #
              # A request reserves scheduling room rather than consuming it:
              # the node keeps four cores' worth free for this pod, and
              # anything it is not using is available to everything else.
              #
              # A CPU LIMIT WOULD BE ACTIVELY HARMFUL HERE. Limits are enforced
              # by CFS quota, which stops the process dead at each quota
              # boundary - on an idle node, with cores free - and for a
              # simulation people are moving around in, that is stutter. Memory
              # is different and does have a limit: it is incompressible, so
              # the only alternative to a limit is a neighbour being evicted.
              cpu: "4"
            limits:
              # Request and limit are equal, which makes this Guaranteed rather
              # than Burstable: the kubelet will not evict it under node
              # pressure ahead of anything else, and it cannot grow into a
              # neighbour's memory.
              #
              # It also effectively dedicates a worker. Nine gigabytes
              # allocatable minus eight leaves room for the daemons that run
              # everywhere and very little else, which is a real consequence of
              # asking for the vendor's upper bound rather than an accident.
              memory: 8Gi

      volumes:
        - name: world
          persistentVolumeClaim:
            claimName: world
        # Deliberately not persisted. Anything here is a preference file or a
        # log the engine can rebuild; the world is the thing that matters and
        # it is on the claim above.
        - name: scratch
          emptyDir: {}
