---
# An identity that is handed no credential.
#
# The workload has no use for the Kubernetes API - it is a game server - and the
# policy beside this file denies it the route there anyway. Mounting a token
# would therefore hand over a credential that cannot be spent.
#
# It is still worth not mounting. A credential that cannot be used today is one
# that becomes usable the moment somebody widens a policy for an unrelated
# reason, and the cheaper habit is for it never to have been there. The pod
# references this account rather than the namespace's default, so the default
# staying mountable does not quietly apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: valheim
  namespace: valheim
automountServiceAccountToken: false
