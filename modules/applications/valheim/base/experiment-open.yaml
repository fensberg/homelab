---
# TEMPORARY, authorised by the operator for one test. Experiment 1 of #446:
# does the network policy break joins from outside the house?
#
# Network policies are additive, so this second policy lets the game server send
# and receive anything, while network-policy.yaml stays exactly as it was.
# Removing this file, and its line in kustomization.yaml, is the whole restore.
#
# While this is live the game server can reach the cluster and the house. That
# is what network-policy.yaml exists to prevent. The egress guard does not see
# this file (#448).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valheim-experiment-open
  namespace: valheim
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valheim
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
