---
# =============================================================================
# A long-lived Linux development workstation on a Proxmox host.
#
# THIS IS NOT PART OF THE HOMELAB WORKFLOW.
#
# It shares no configuration with management/, reads nothing from 1Password,
# and is never touched by scripts/contractor. Nothing in the cluster
# lifecycle can create, modify or destroy it - which is the point. The ignition
# run destroys everything it owns when it fails, and a machine you code on for
# the next several years must not be inside that blast radius.
#
# It lives on the hypervisor's own LAN bridge rather than the cluster network,
# so it is reachable directly - ssh, VS Code Remote-SSH, port forwards - with
# no jump host and no dependency on the SDN being healthy.
#
#   cp inventory.example.yml inventory.yml   # point it at your hypervisor
#   ansible-playbook -i inventory.yml provision.yml
#   ansible-playbook -i inventory.yml provision.yml -e state=absent
# =============================================================================
- name: Provision a development workstation
  hosts: hypervisor
  become: true
  gather_facts: false

  vars:
    # 9000 sits far away from anything the homelab assigns. Sites band their
    # VMs at <octet>00 upward - 1000-1099 for octet 10 - so this cannot
    # collide however many sites are added.
    vmid: 9000
    name: devbox

    cores: 6
    memory: 16384
    disk: 200G

    # The hypervisor's LAN bridge. Not the SDN: a development machine should
    # not stop being reachable because the cluster network is being rebuilt.
    bridge: vmbr0
    storage: local-zfs

    # DHCP by default. Set an address to pin it - worth doing for a machine
    # you will connect to daily for years.
    address: dhcp

    username: dev
    state: present

    # The overlay. A workstation that is not on it cannot reach the estate.
    #
    # This is not a convenience. The hypervisor is addressed by its overlay
    # identity, because that is the only address that works from inside the
    # cluster as well as outside it - see #99. A devbox on the LAN alone
    # therefore cannot reach the hypervisor it sits on: it hands the overlay
    # address to the LAN gateway, which black-holes it, and every provider call
    # in `break-ground` and `demolish` waits forever without ever reporting an
    # error. That cost a full day before anybody looked at a route table.
    #
    # Tagged rather than user-owned, and the reason is expiry. A device
    # authenticated by a person carries a node key that expires - 180 days by
    # default - and then silently leaves the tailnet, reproducing that same
    # outage on a timer with nothing to connect the two events. A tagged device
    # does not expire, which is why the hypervisor shows "Expiry disabled".
    #
    # A workstation is not a router and must not wear the router tag: that tag
    # is what autoApprovers trusts to advertise subnet routes, and a laptop
    # that can claim 10.0.0.0/8 is a laptop that can hijack a site.
    overlay: true
    overlay_tag: "tag:homelab-workstation"
    # Minted in the Tailscale console, or by `tailscale login --auth-key`. It is
    # a credential: pass it with -e rather than writing it into an inventory
    # file, and it is consumed once at first boot.
    overlay_auth_key: ""

    image_url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    image_path: "/var/lib/vz/template/iso/debian-13-genericcloud-amd64.qcow2"

  tasks:
    # Fail here rather than at first boot. `tailscale up --auth-key=''`
    # exits zero having joined nothing, so a workstation provisioned without a
    # key comes up looking healthy and cannot reach the estate - which is the
    # defect this whole block exists to prevent, reintroduced by an empty
    # string.
    - name: Refuse to build a workstation that cannot reach the estate
      ansible.builtin.assert:
        that:
          - overlay_auth_key | length > 0
        fail_msg: >-
          overlay is on and overlay_auth_key is empty. Mint a key in the
          Tailscale console that may apply {{ overlay_tag }}, and pass it with
          -e overlay_auth_key=... rather than writing it into an inventory
          file. Set overlay=false only if this machine genuinely has another
          route to the hypervisor's API - it will not have one by default,
          because the hypervisor is addressed by its overlay identity.
        success_msg: "an overlay key was supplied"
      when: overlay and state == "present"
      tags: [always]

    - name: Look for an existing workstation
      ansible.builtin.command: qm status {{ vmid }}
      register: existing
      changed_when: false
      failed_when: false
      check_mode: false

    # --- teardown -----------------------------------------------------------
    - name: Remove the workstation
      when:
        - state == "absent"
        - existing.rc == 0
      block:
        - name: Stop it
          ansible.builtin.command: qm stop {{ vmid }}
          failed_when: false

        - name: Destroy it
          ansible.builtin.command: qm destroy {{ vmid }} --purge

        - name: Report
          ansible.builtin.debug:
            msg: "{{ name }} (VM {{ vmid }}) removed."

      # qm destroy refuses while a disk is locked by a running backup or a
      # migration, and leaves the VM exactly as it was. Say which VM is stuck
      # rather than letting an unexplained non-zero exit stand.
      rescue:
        - name: Explain a teardown that did not finish
          ansible.builtin.fail:
            msg:
              - "Could not remove {{ name }} (VM {{ vmid }})."
              - "Check whether it is locked:  qm config {{ vmid }} | grep lock"
              - "Clear a stale lock with:     qm unlock {{ vmid }}"

    - name: Stop here when tearing down
      ansible.builtin.meta: end_play
      when: state == "absent"

    - name: Report an existing workstation
      ansible.builtin.debug:
        msg:
          - "{{ name }} (VM {{ vmid }}) already exists - leaving it alone."
          - "Rebuild with: -e state=absent, then run this again."
      when: existing.rc == 0

    # --- build --------------------------------------------------------------
    - name: Build the workstation
      when: existing.rc != 0
      block:
        - name: Fetch the Debian cloud image
          ansible.builtin.get_url:
            url: "{{ image_url }}"
            dest: "{{ image_path }}"
            mode: "0644"
            timeout: 120

        # Reusing the keys the hypervisor already trusts means no new key is
        # issued or stored, and whoever can log in there can log in here.
        - name: Collect the keys this hypervisor already trusts
          ansible.builtin.slurp:
            src: /root/.ssh/authorized_keys
          register: host_keys

        - name: Stage them for cloud-init
          ansible.builtin.copy:
            content: "{{ host_keys.content | b64decode }}"
            dest: /var/lib/vz/snippets/{{ name }}-keys.pub
            mode: "0600"

        # VENDOR data, not user data. --cicustom user= REPLACES the user-data
        # Proxmox generates from --ciuser and --sshkeys, so a snippet supplying
        # only packages silently discards the login account and its keys - the
        # VM boots fine and refuses every connection with "Permission denied
        # (publickey)". Vendor-data is processed alongside the generated
        # user-data instead, so both apply.
        #
        # qemu-guest-agent is what lets the hypervisor report the address DHCP
        # handed out, so there is no guessing about where to connect.
        - name: Write a cloud-init vendor-data snippet
          ansible.builtin.copy:
            dest: /var/lib/vz/snippets/{{ name }}-vendor.yml
            mode: "0644"
            content: |
              #cloud-config
              package_update: true
              packages:
                - qemu-guest-agent
                - git
                - curl
                - unzip
                - build-essential
                - python3
                - python3-pip
                - python3-venv
              runcmd:
                - [systemctl, enable, --now, qemu-guest-agent]
              {% if overlay %}
                # Tailscale from its own signed apt repository, the same source
                # and the same method hypervisor-prep.yml uses. Deliberately
                # not the install script: `curl | sh` is the shape this estate
                # keeps an approved-suppliers list to prevent, and the package
                # is signed where the script is merely fetched.
                - [sh, -c, ". /etc/os-release && curl -fsSL -o /usr/share/keyrings/tailscale-archive-keyring.gpg https://pkgs.tailscale.com/stable/debian/$VERSION_CODENAME.noarmor.gpg"]
                - [sh, -c, ". /etc/os-release && echo \"deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian $VERSION_CODENAME main\" > /etc/apt/sources.list.d/tailscale.list"]
                - [apt-get, update]
                - [apt-get, install, -y, tailscale]
                - [systemctl, enable, --now, tailscaled]
                # Deliberately NOT --accept-routes.
                #
                # It was here, with the reasoning that accepting the estate's
                # advertised subnet route made the node subnet reachable "over
                # the overlay rather than only from the hypervisor's own LAN".
                # That premise is false, and it cost an ignition to find out.
                #
                # The node subnet lives in an EVPN VRF. A VRF is a separate
                # routing table, and this one has no route back to the tailnet
                # - measured directly: from inside it the hypervisor cannot
                # reach a tailnet address at all, and a socket cannot even bind
                # the SDN gateway address unless it is VRF-bound. So traffic
                # sent over the overlay reaches the hypervisor, is handed into
                # the VRF, and nothing comes back. The route is a door into a
                # sealed room.
                #
                # Accepting it therefore does not add a path. It REPLACES the
                # working one: tailscaled's table is consulted at rule 5270,
                # ahead of the main table at 32766, so the overlay route wins
                # over the LAN route this workstation already has by sitting on
                # vmbr0. The Verify phase then halted on an unreachable SDN
                # gateway for three runs.
                #
                # This workstation is on the hypervisor's own bridge on purpose
                # (see `bridge` above), which is the arrangement the epoch
                # record already recommends: "Running the button from a machine
                # on the hypervisor's own LAN removes that dependency and
                # leaves the overlay network for remote access, which is what
                # it is actually for."
                #
                # It still joins the tailnet - that is what makes the
                # hypervisor's API reachable if the LAN ever is not, and a
                # direct peer address is not a subnet route, so none of the
                # above applies to it.
                - [sh, -c, "tailscale up --auth-key='{{ overlay_auth_key }}' --advertise-tags='{{ overlay_tag }}'"]
              {% endif %}

        - name: Create the virtual machine
          ansible.builtin.command: >-
            qm create {{ vmid }}
            --name {{ name }}
            --cores {{ cores }}
            --memory {{ memory }}
            --cpu host
            --net0 virtio,bridge={{ bridge }}
            --scsihw virtio-scsi-single
            --ostype l26
            --agent enabled=1

        - name: Import the cloud image as its disk
          ansible.builtin.command: >-
            qm importdisk {{ vmid }} {{ image_path }} {{ storage }}

        - name: Attach the disk and a cloud-init drive
          ansible.builtin.command: >-
            qm set {{ vmid }}
            --scsi0 {{ storage }}:vm-{{ vmid }}-disk-0
            --ide2 {{ storage }}:cloudinit
            --boot order=scsi0
            --serial0 socket
            --vga serial0

        - name: Configure cloud-init
          ansible.builtin.command: >-
            qm set {{ vmid }}
            --ipconfig0 {{ 'ip=dhcp' if address == 'dhcp' else 'ip=' ~ address }}
            --ciuser {{ username }}
            --sshkeys /var/lib/vz/snippets/{{ name }}-keys.pub
            --cicustom "vendor=local:snippets/{{ name }}-vendor.yml"

        - name: Grow the disk
          ansible.builtin.command: qm resize {{ vmid }} scsi0 {{ disk }}

        - name: Start it
          ansible.builtin.command: qm start {{ vmid }}

        # Ask the guest agent rather than assuming an address. First boot
        # installs packages, so allow time for it.
        - name: Wait for the guest agent to answer
          ansible.builtin.command: qm guest cmd {{ vmid }} network-get-interfaces
          register: guest_net
          until: guest_net.rc == 0
          retries: 40
          delay: 15
          changed_when: false
          failed_when: false

        - name: Work out which address it got
          ansible.builtin.set_fact:
            devbox_ip: >-
              {{ (guest_net.stdout | from_json
                  | selectattr('name', 'ne', 'lo')
                  | map(attribute='ip-addresses') | select('defined') | flatten
                  | selectattr('ip-address-type', 'equalto', 'ipv4')
                  | map(attribute='ip-address') | first | default('')) }}
          when: guest_net.rc == 0

        - name: Report how to reach it
          ansible.builtin.debug:
            msg:
              - "{{ name }} (VM {{ vmid }}) is up."
              - ""
              - "    ssh {{ username }}@{{ devbox_ip | default('<address>') }}"
              - ""
              - "VS Code: Remote-SSH to that host and work on it directly."
              - "Pin the address in your router or with -e address=ip=A.B.C.D/24,gw=A.B.C.1"
              - "if you would rather it never moved."
          when: guest_net.rc == 0

        - name: Report that the address could not be read
          ansible.builtin.debug:
            msg:
              - "{{ name }} (VM {{ vmid }}) started, but the guest agent did not answer."
              - "It is probably still running first-boot package installs."
              - "Find its address with:  qm guest cmd {{ vmid }} network-get-interfaces"
              - "or open its console:    qm terminal {{ vmid }}"
          when: guest_net.rc != 0

      # A build that fails partway leaves VM 9000 half-made, and the next run
      # finds it, decides the workstation already exists and leaves it alone -
      # a dead end that reads like success. Say plainly that the VM has to be
      # torn down before trying again.
      rescue:
        - name: Explain a half-built workstation
          ansible.builtin.fail:
            msg:
              - "Building {{ name }} (VM {{ vmid }}) failed partway."
              - "A partial VM may exist, and re-running will find it and skip the build."
              - "Tear it down first:"
              - "    ansible-playbook -i inventory.yml provision.yml -e state=absent"
