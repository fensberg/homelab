# The repository's own markdownlint rules, so the answer does not depend on
# whichever configuration a linter image happens to ship.
#
# Three rules were switched off here to match what already passed: line
# length, inline HTML, and a heading on the first line. Measured in 2026-10,
# the last found nothing, the second found seven placeholders written as bare
# angle brackets, and the first found fifty sentences once tables and code were
# left out of it. The documents were fixed and the rules are on.
config:
  # Line length, for prose. A table row and a code block are as long as what
  # they hold, and a heading is one line by definition, so those three are not
  # measured; a sentence is wrapped.
  MD013:
    line_length: 80
    tables: false
    code_blocks: false
    headings: false

# No `globs` key on purpose. pre-commit passes the tracked files it is checking,
# and cli2 honours those arguments; declaring globs here overrode that list and
# pulled in vendored provider documentation under .terraform, which is gitignored
# and not ours to lint. `ignores` is belt and braces for anyone running the CLI
# directly.
ignores:
  # proved by TestAnExcludedPathHoldsNothingTheToolWasMeantToRead
  - "**/.terraform/**"
  # proved by TestAnExcludedPathHoldsNothingTheToolWasMeantToRead
  - "**/node_modules/**"
