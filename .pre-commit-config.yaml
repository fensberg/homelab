repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Kubernetes manifests legitimately hold several documents in one file,
        # separated by ---. Without this the hook rejects every Flux manifest.
        args: ["--allow-multiple-documents"]
      - id: check-merge-conflict
      - id: detect-private-key

  # rbubley's mirror rather than pre-commit's, which is archived and stuck on
  # prettier 3.1. Keep this version in step with the prettier that Super-Linter
  # pins (dependencies/package.json in the super-linter tag CI uses) - when the
  # two drift, pre-commit passes and CI fails on formatting, which is the least
  # useful failure there is.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [json, yaml, markdown]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.1
    hooks:
      - id: actionlint

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        args: ["-w", "-s", "-i", "0"]

  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt
        language: system
        files: \.tf$

