# Nothing here runs a linter that Super-Linter also runs.
#
# Two copies of prettier is what put formatting errors on a pull request that
# `pre-commit run --all-files` had just passed: this file pinned 3.1 through a
# mirror that has since been archived, and Super-Linter pinned ^3.8.3. Same
# tool, two versions, two answers. The same trap was set for actionlint, shfmt
# and terraform fmt, which were also configured in both places.
#
# So every linter now has exactly one version in the whole stack - the one
# baked into the Super-Linter image, pinned by SHA in pr-validation.yml. Run it
# with `task lint`, or `task fix` to have it correct formatting in place.
#
# What is left below are pre-commit's own hooks. They shell out to nothing, so
# there is no version to drift, and they catch things worth catching before a
# push rather than after one.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
        # Kubernetes manifests legitimately hold several documents in one file,
        # separated by ---. Without this the hook rejects every Flux manifest.
        args: ["--allow-multiple-documents"]
