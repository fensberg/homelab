# Fast checks, run before the commit lands. Everything here finishes in a few
# seconds and most of it fixes the problem rather than reporting it.
#
# The rule that keeps this honest: EACH CHECK HAS EXACTLY ONE OWNER. Formatting
# is owned here, pinned to exact versions, and CI runs this same file rather
# than its own copy of the same tools. Analysis is owned by four pinned tools
# with one CI lane each - checkov, hadolint, zizmor and codespell - plus the
# ShellCheck, Trivy, Semgrep and TruffleHog lanes beside them. One aggregate
# used to own all of that and was replaced for the reason #365 records.
#
# Nothing appears in both places. Two copies of prettier, on two versions, is
# what put formatting errors on a pull request that this file had just passed.
#
# Three stages, three different jobs - default_stages keeps them from
# bleeding into each other. Formatting has no explicit stage, so it inherits
# pre-commit from the default and runs on every commit. The fast guards
# (below) set their own stage to pre-push, and hold a budget: a commit and a
# push together should take under ten seconds, so only what cannot be undone
# after a push, and what answers in milliseconds, runs there - the rest is the
# pull request's job. commitlint sets its own stage to commit-msg, the only
# stage that ever sees the message text at all.
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]
repos:
  # The push guard, before every other repository, because pre-commit runs
  # hooks in the order this file lists them. It sat among the local hooks
  # below and was first among the pre-push hooks only while no earlier hook
  # declared that stage here - pre-commit-hooks' checks ran at pre-push too,
  # from their upstream manifest, where nothing could see the order. Once they
  # became local hooks with their stages written out (#416), the push guard's
  # own test saw it run fourth.
  - repo: local
    hooks:
      - id: enforce-push
        name: refuse a plain git push (pre-push)
        entry: task enforce-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        fail_fast: true
        # First among the pre-push hooks, and fail_fast, on purpose: a push
        # that is going to be refused should cost milliseconds, not the
        # guards that follow. Ordering alone does not achieve
        # that - pre-commit runs every hook and reports at the end - so the
        # two go together. Measured: without fail_fast, a refused push still
        # ran the whole Go and OpenTofu corpus first.
        #
        # A GitHub App cannot hold a signing key, so `task push` has GitHub
        # sign on its behalf through the Git Data API. A plain `git push`
        # also works and produces unsigned commits attributed to whatever
        # local git config says. That was documented in CLAUDE.md and in the
        # taskfile, and documentation was not enough - a session pushed twice
        # with plain git before anyone noticed.
        #
        # It cannot be repaired after the fact either: non_fast_forward
        # applies to feature branches here, so an unsigned commit cannot be
        # rewritten by anybody, agent or admin. The only remedy is a new
        # branch, which is why this is now refused rather than described.
        #
        # The distinction is structural rather than a flag that can be
        # forgotten: signedpush pushes to refs/signing/<tmp> and asks GitHub
        # to create the branch commit, while a plain push updates
        # refs/heads/<branch> directly. See scripts/pushguard.

  # The first checks, from pre-commit-hooks - installed from
  # scripts/deliveries.lock by hash, not cloned by pre-commit.
  #
  # As a hook repository, pre-commit cloned it at a rev: here and pip-installed
  # its dependencies into a virtualenv of its own, unpinned - and its version
  # was decided in this file, where nothing else could read it (#416). As local
  # hooks they run the package scripts/take-delivery.sh put on this
  # machine, at the version scripts/versions.env pins, so there is one version
  # and one lock. Each hook keeps the types, stages, args and excludes the
  # upstream definition gave it at 4.6.0, because a hook that quietly checks
  # fewer files is the failure this whole repository watches for.
  #
  # delivered-python rather than python3 or the console script. The package is
  # installed into an isolated environment the system Python cannot see
  # (#423), and delivered-python is that environment's interpreter, linked into
  # ~/.local/bin beside everything else take-delivery.sh puts there. The
  # githooks shims add that directory to PATH, so a first shell without it
  # still runs the check - and the `-m <module>` form is what lets the Format
  # lane's hook guard see which locked package each hook needs.
  - repo: local
    hooks:
      # The execute bit, which had no owner outside the aggregate that went in
      # #365: Super-Linter's BASH_EXEC checked that a script with a shebang is
      # executable, and nothing else here did. A shell script committed without
      # it fails only when something tries to run it - a git hook that silently
      # never runs is exactly the failure githooks/ exists to prevent.
      - id: check-shebang-scripts-are-executable
        name: check that scripts with shebangs are executable
        entry: delivered-python -m pre_commit_hooks.check_shebang_scripts_are_executable
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: delivered-python -m pre_commit_hooks.check_merge_conflict
        language: system
        types: [text]
      - id: detect-private-key
        name: detect private key
        entry: delivered-python -m pre_commit_hooks.detect_private_key
        language: system
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: delivered-python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
        # Kubernetes manifests legitimately hold several documents in one file,
        # separated by ---. Without this the hook rejects every Flux manifest.
        args: ["--allow-multiple-documents"]
      # A .patch is a generated file whose whitespace is load-bearing: a diff
      # marks a blank context line with a single space, and stripping it is
      # how a valid patch silently becomes one that will not apply. These
      # hooks rewrote one three times running, each time aborting the commit
      # and needing a re-stage, which is a button nobody should have to press.
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: delivered-python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
        exclude: '\.patch$'
      - id: end-of-file-fixer
        name: fix end of files
        entry: delivered-python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
        exclude: '\.patch$'

  # rbubley's mirror rather than pre-commit's, which is archived on prettier
  # 3.1. The rev pins prettier exactly; nothing else in the project runs it.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [json, yaml, markdown]

  # markdownlint, moved here from Super-Linter.
  #
  # Not a new supplier: this is the same tool the Super-Linter image already
  # bundles, run where a person can reach it. Super-Linter is a Docker image and
  # the agent account is deliberately not in the `docker` group, so markdownlint
  # was the one check in this repository that could only ever fail in CI - a
  # missing space after a `#` cost a full push, wait and read cycle to find.
  #
  # So markdownlint is owned here and nowhere else: one owner and one pinned
  # version, with the Format job running this same file, so the CI backstop
  # survives without a second copy on a second version.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2

  # actionlint is not a formatter here: it is what decides which workflow syntax
  # this repository is permitted to use. So the pin is a decision, and this one
  # had not been made since mid-2024 - eleven releases back (#388). A stale
  # linter pin silently narrows what the estate can adopt, and nothing reports
  # that.
  #
  # Bumped v1.7.1 -> v1.7.12 having run it, with shellcheck present, over every
  # workflow here: no new findings. Checked at the same time whether it has
  # started accepting GitHub's `$/` self-repository syntax, which is what #387
  # is waiting on. It has not - its newest release predates the announcement by
  # four months - so that exemption stays and its condition is unchanged.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Only the workflows themselves. GitHub loads workflows from the top
        # of .github/workflows alone, and a subdirectory there holds composite
        # action metadata - mobilize/action.yml - kept beside the workflows so
        # it sits behind the same `workflows` permission. actionlint's hook
        # matches the whole tree and reads an action.yml as a workflow with no
        # `on` or `jobs`, which is a finding about the wrong file type rather
        # than about the action. zizmor audits it as the composite action it is.
        exclude: ^\.github/workflows/[^/]+/

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        args: ["-w", "-s", "-i", "0"]

  - repo: local
    hooks:
      # First, and fail_fast, on purpose.
      #
      # Default deny: every hook below this line is third-party code that runs
      # on this machine with your privileges, on every commit - not in a
      # container and not in CI. Nothing arrives here without somebody deciding
      # it should, and this is what enforces that rather than trusting it.
      #
      # It is ordered first because a commit that is going to be refused should
      # cost milliseconds, and because a guard that runs after the thing it
      # guards has already run is a report. Ordering alone does not achieve
      # that - pre-commit runs every hook and reports at the end - so fail_fast
      # goes with it, the same pairing enforce-push uses.
      #
      # Kept here as well as in githooks/pre-commit, which is the one that
      # actually closes the hole: git invokes that shim before pre-commit has
      # cloned or installed anything. This copy catches somebody running
      # `pre-commit run` directly, where the shim is not in the path - it runs
      # after installation and so cannot prevent a download, but a second place
      # that refuses costs nothing and the two fail the same way.
      - id: delivery-guard
        name: refuse a delivery from an unapproved supplier
        entry: task delivery-guard
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true

      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt
        language: system
        files: \.tf$
        # A system hook: it needs tofu on PATH. CI has no tofu binary in the
        # Format lane, so it sets SKIP=tofu-fmt there and the Validate lane
        # runs `tofu fmt -check` once it has installed one.

      - id: go-fmt
        name: gofmt
        entry: gofmt -w
        language: system
        files: \.go$
        # Same shape as tofu-fmt: needs go on PATH. Super-Linter's Go
        # analysis (golangci-lint, unaffected by this) stays the owner of
        # everything beyond formatting.

      # Refused where the mistake is made rather than where it is discovered.
      #
      # signedpush already refuses a merge commit at push time, correctly - it
      # replays a branch linearly so GitHub can sign each commit, and a merge
      # has two parents. But that refusal lands after the suite has run, and
      # clearing it needs a rebase, which diverges the branch, which needs the
      # ref recreated, which closes the pull request. Three were lost that way
      # in one session (#260).
      #
      # commit-msg is the stage because git does not run pre-commit for merges.
      # The guard refuses only an UNSIGNED merge, which is the same property
      # question enforce-push asks: somebody who signs locally publishes with
      # plain git and needs no replay, so a merge from them is fine.
      - id: enforce-merge
        name: refuse a merge commit signedpush cannot publish (commit-msg)
        entry: task enforce-merge
        language: system
        stages: [commit-msg]
        pass_filenames: false
        always_run: true

      - id: test
        name: the fast guards (pre-push)
        entry: go test -C tests/go -short ./repo
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        # Only what cannot be undone and what answers in milliseconds, so a
        # commit and a push together stay under ten seconds.
        #
        # This used to be `task validate` and the whole of `task test`: 160
        # seconds per push, 107 of them in two checks on the checks - the
        # mutation ledger and the comment-stripping re-run. Every one of those
        # already runs on the pull request, so the push was paying twice for
        # feedback it would get anyway, while the operator sat waiting.
        #
        # What a push must stop is what no later push can repair: an unsigned
        # commit (enforce-push, above), a secret (gitleaks, at commit), a real
        # name or address reaching a public repository (the forkability and
        # transcript guards, which are fast and run here). Everything else is
        # a red check on the pull request, fixed by the next push.
        #
        # -short is what keeps it fast: a guard that costs whole seconds calls
        # heavy() and skips here, saying why. CI's Test lane runs the package
        # without -short, and TestHeavyGuardsRunOnEveryPullRequest refuses a
        # workflow that passes it. Validate, the module unit tests, tofu test
        # and the JS tier run in their lanes and nowhere else.
        #
        # Deliberately NOT the integration, api or e2e tiers. Those need
        # credentials and a real estate; a git hook that could reach either
        # is a git hook that can break production by accident.

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Conventional Commits - see commitlint.config.js at the repo root, the one
  # copy of the rule both this hook and Super-Linter's GIT_COMMITLINT
  # validator read. The standard preset plus one local rule, which forbids a
  # `Co-Authored-By: Claude` trailer on a commit Claude authored; that file
  # says why.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # Pinned exactly, like every other version in this file. Unpinned, a
        # commit-msg hook silently resolves whatever the latest preset is on
        # the day the hook environment is built - so two developers, and CI,
        # can end up enforcing three different conventions. Kept in step with
        # the same package in package.json, which is what the JS/TS tier's
        # commitlint test loads.
        additional_dependencies: ["@commitlint/config-conventional@21.2.2"]
