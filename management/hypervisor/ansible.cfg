# Ansible settings for the hypervisor playbook.
#
# Picked up automatically because the start button runs ansible-playbook with
# this directory as the working directory.

[defaults]
inventory = inventory.yml
interpreter_python = auto_silent

# ansible.builtin.apt_repository is deprecated in favour of deb822_repository
# and is removed in ansible-core 2.25. Migrating means supplying signed_by
# keyrings explicitly for both the Proxmox and Tailscale repositories, which is
# not a change worth making untested against a live hypervisor. Recorded as
# deferred in docs/epochs/01-ignition.md; the warning is muted until then so it
# does not bury real output.
deprecation_warnings = False

[ssh_connection]
# accept-new trusts a host the first time it is seen and pins the key, but
# still refuses a host whose key has CHANGED. That is the protection that
# matters: StrictHostKeyChecking=no would silently accept a substituted host
# forever. There is no interactive prompt available here - Ansible runs ssh
# without a TTY, so an unknown host otherwise fails with
# "ssh_askpass: No such file or directory / Host key verification failed".
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s

# Fewer SSH round trips per task. Safe here because Proxmox does not use
# requiretty in sudoers.
pipelining = True
