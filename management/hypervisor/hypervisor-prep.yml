---
- name: Bootstrap Proxmox VE Nodes for OpenTofu & Mesh Networking
  hosts: hypervisors
  become: true
  gather_facts: true

  vars:
    pve_user: "terraform"
    pve_realm: "pve"
    pve_token_id: "pipeline"
    pve_role: "TerraformProv"
    # Privileges required for OpenTofu/bpg-proxmox provider to manage VMs and storage
    pve_role_privs: "VM.Allocate VM.Clone VM.Config.CDROM VM.Config.CPU VM.Config.Cloudinit VM.Config.Disk VM.Config.HWType VM.Config.Memory VM.Config.Network VM.Config.Options VM.Audit VM.PowerMgmt VM.Monitor Datastore.AllocateSpace Datastore.Audit SDN.Use"
    # Optional: Pass a Tailscale pre-auth key if bootstrapping non-interactively
    tailscale_auth_key: ""

  tasks:
    # ---------------------------------------------------------
    # 1. Clean Enterprise Repositories
    # ---------------------------------------------------------
    - name: Remove Proxmox enterprise repo files
      ansible.builtin.shell: |
        grep -rl 'enterprise.proxmox.com' /etc/apt/ | xargs rm -f
      register: repo_cleanup
      changed_when: repo_cleanup.stdout != ""
      failed_when: false

    - name: Ensure no-subscription repository is present (Debian Trixie / PVE 9)
      ansible.builtin.apt_repository:
        repo: "deb http://download.proxmox.com/debian/pve trixie pve-no-subscription"
        state: present
        filename: "pve-no-subscription"

    # ---------------------------------------------------------
    # 2. System Update & Dependencies
    # ---------------------------------------------------------
    - name: Update apt cache and upgrade system packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - sudo
          - ca-certificates
        state: present

    # ---------------------------------------------------------
    # 3. Tailscale Installation & Setup
    # ---------------------------------------------------------
    - name: Download Tailscale GPG key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg"
        dest: "/usr/share/keyrings/tailscale-archive-keyring.gpg"
        mode: "0644"

    - name: Add Tailscale repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian trixie main"
        state: present
        filename: "tailscale"

    - name: Install Tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Enable and start Tailscale service
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Bring Tailscale up with Pre-Auth Key (if provided)
      ansible.builtin.command: "tailscale up --authkey={{ tailscale_auth_key }}"
      when: tailscale_auth_key != ""
      register: ts_up_auto
      changed_when: "'Success' in ts_up_auto.stdout or ts_up_auto.rc == 0"

    - name: Prompt to run 'tailscale up' interactively if no key provided
      ansible.builtin.debug:
        msg: "No tailscale_auth_key defined. Run 'tailscale up' manually on the host terminal to authenticate."
      when: tailscale_auth_key == ""

    # ---------------------------------------------------------
    # 4. Proxmox RBAC & Token Creation
    # ---------------------------------------------------------
    - name: Check existing Proxmox roles
      ansible.builtin.command: pveum role list
      register: existing_roles
      changed_when: false

    - name: Create OpenTofu management role
      ansible.builtin.command: "pveum role add {{ pve_role }} -privs '{{ pve_role_privs }}'"
      when: pve_role not in existing_roles.stdout

    - name: Check existing Proxmox users
      ansible.builtin.command: pveum user list
      register: existing_users
      changed_when: false

    - name: Create OpenTofu service user
      ansible.builtin.command: "pveum user add {{ pve_user }}@{{ pve_realm }} --comment 'OpenTofu Service Account'"
      when: (pve_user + '@' + pve_realm) not in existing_users.stdout

    - name: Assign permissions to OpenTofu service user
      ansible.builtin.command: "pveum acl modify / -user {{ pve_user }}@{{ pve_realm }} -role {{ pve_role }}"
      changed_when: true

    - name: Check existing API tokens for user
      ansible.builtin.command: "pveum user token list {{ pve_user }}@{{ pve_realm }}"
      register: existing_tokens
      changed_when: false

    - name: Generate API Token
      ansible.builtin.command: "pveum user token add {{ pve_user }}@{{ pve_realm }} {{ pve_token_id }} --privsep 0 --output-format json"
      register: generated_token
      when: pve_token_id not in existing_tokens.stdout

    - name: Display Generated API Token (Store immediately in 1Password)
      ansible.builtin.debug:
        msg:
          - "Token ID: {{ pve_user }}@{{ pve_realm }}!{{ pve_token_id }}"
          - "Token Secret: {{ (generated_token.stdout | from_json).value if (generated_token is defined and generated_token.stdout is defined and generated_token.stdout != '') else 'Token already exists (secret not recoverable)' }}"
      when: generated_token is changed

    # ---------------------------------------------------------
    # 5. Proxmox SDN (Software Defined Network) & DHCP Setup
    # ---------------------------------------------------------
    - name: Install dnsmasq for Proxmox SDN DHCP
      ansible.builtin.apt:
        name: dnsmasq
        state: present

    - name: Disable default dnsmasq service (Proxmox SDN manages its own instances)
      ansible.builtin.systemd:
        name: dnsmasq
        enabled: false
        state: stopped

    - name: Check existing SDN zones
      ansible.builtin.command: pvesh get /cluster/sdn/zones --output-format json
      register: sdn_zones
      changed_when: false

    - name: Create 'internal' SDN zone
      ansible.builtin.command: pvesh create /cluster/sdn/zones -zone internal -type simple -ipam pve
      when: "'internal' not in (sdn_zones.stdout | from_json | map(attribute='zone') | list)"

    - name: Check 'internal' SDN zone DHCP configuration
      ansible.builtin.command: pvesh get /cluster/sdn/zones/internal --output-format json
      register: sdn_zone_internal
      changed_when: false

    - name: Enable DHCP (dnsmasq) on 'internal' SDN zone
      ansible.builtin.command: pvesh set /cluster/sdn/zones/internal -dhcp dnsmasq
      when: "(sdn_zone_internal.stdout | from_json).dhcp | default('') != 'dnsmasq'"
      register: dhcp_configured

    - name: Check existing SDN VNets
      ansible.builtin.command: pvesh get /cluster/sdn/vnets --output-format json
      register: sdn_vnets
      changed_when: false

    - name: Create 'vnetint' VNet
      ansible.builtin.command: pvesh create /cluster/sdn/vnets -vnet vnetint -zone internal
      when: "'vnetint' not in (sdn_vnets.stdout | from_json | map(attribute='vnet') | list)"

    - name: Check existing Subnets for vnetint
      ansible.builtin.command: pvesh get /cluster/sdn/vnets/vnetint/subnets --output-format json
      register: sdn_subnets
      changed_when: false
      failed_when: false # Fails gracefully if vnetint was just created and has no subnets yet

    - name: Create 10.10.10.0/24 Subnet with SNAT
      ansible.builtin.command: pvesh create /cluster/sdn/vnets/vnetint/subnets -type subnet -subnet 10.10.10.0/24 -gateway 10.10.10.1 -snat 1
      when: "sdn_subnets.rc != 0 or '10.10.10.0-24' not in (sdn_subnets.stdout | default('[]') | from_json | map(attribute='subnet') | list)"
      register: subnet_created

    - name: Apply Proxmox SDN Configuration
      ansible.builtin.command: pvesh set /cluster/sdn
      when: subnet_created.changed or dhcp_configured.changed

    - name: Reload Network Interfaces (Apply Bridge to Kernel)
      ansible.builtin.command: ifreload -a
      when: subnet_created.changed or dhcp_configured.changed

    # ---------------------------------------------------------
    # 6. Tailscale Subnet Router Configuration
    # ---------------------------------------------------------
    - name: Enable IPv4 forwarding for Tailscale subnet routing
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    - name: Enable IPv6 forwarding for Tailscale subnet routing
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    - name: Configure Tailscale to advertise the internal SDN subnet
      ansible.builtin.command: tailscale set --advertise-routes=10.10.10.0/24
      register: ts_routes
      changed_when: "'10.10.10.0/24' not in ts_routes.stdout"
