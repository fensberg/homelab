---
# =============================================================================
# Proxmox hypervisor preparation
#
# Safe to run repeatedly. Every task either checks before it acts or is
# naturally idempotent. Nothing here reboots the host, reloads live network
# interfaces, or upgrades packages unless you explicitly ask for it.
#
#   ansible-playbook -i inventory.yml hypervisor-prep.yml
#   ansible-playbook -i inventory.yml hypervisor-prep.yml --check --diff
#   ansible-playbook -i inventory.yml hypervisor-prep.yml --tags sdn
#   ansible-playbook -i inventory.yml hypervisor-prep.yml -e do_dist_upgrade=true
#
# Tags: repos, packages, tailscale, rbac, ssh-import, sdn, routing
# =============================================================================
- name: Bootstrap Proxmox VE nodes for OpenTofu and mesh networking
  hosts: hypervisors
  become: true
  gather_facts: true

  vars:
    # Which config/management.tpl.json site this run provisions secrets for -
    # matches the "site0" in every op://homelab/site0/... reference there.
    site_name: "site0"
    op_vault: "homelab"
    pve_user: "terraform"
    pve_realm: "pve"
    pve_token_id: "pipeline"
    pve_role: "TerraformProv"

    # Privileges the bpg/proxmox provider needs.
    #
    # Datastore.AllocateTemplate is required to download the Talos ISO into a
    # datastore - without it the ISO task fails with a 403.
    #
    # Sys.AccessNetwork is required for the same download-url API call
    # (Datastore.AllocateTemplate alone covers writing into the datastore, not
    # fetching the URL itself) - without it, the call fails with a 403
    # "Permission check failed" before ever reaching the remote host. The
    # older, broader alternative is Sys.Modify on /, which download-url also
    # accepts for backwards compatibility; Sys.AccessNetwork exists precisely
    # so a token that only ever downloads files doesn't need node-wide modify
    # rights.
    #
    # VM.Monitor is deliberately absent: Proxmox VE 9 no longer defines it, and
    # it granted access to the QEMU monitor, which nothing here uses. The guest
    # agent is disabled in compute.tf, so there is no monitor traffic at all.
    #
    # Privilege names change between major Proxmox versions. The task that
    # validates this list against the running host is what turns that from an
    # opaque "400 Parameter verification failed" into a named list.
    pve_role_privs:
      - VM.Allocate
      - VM.Clone
      - VM.Config.CDROM
      - VM.Config.CPU
      - VM.Config.Cloudinit
      - VM.Config.Disk
      - VM.Config.HWType
      - VM.Config.Memory
      - VM.Config.Network
      - VM.Config.Options
      - VM.Audit
      - VM.PowerMgmt
      - Datastore.AllocateSpace
      - Datastore.AllocateTemplate
      - Datastore.Audit
      - SDN.Use
      - Sys.Audit
      - Sys.AccessNetwork

    # A separate, narrower system account for the one thing the Proxmox API
    # token cannot do: bpg/proxmox needs to SSH into the node itself to turn
    # a downloaded disk image into an actual VM disk (see compute.tf). This
    # is not the Talos guest - Talos has no SSH daemon and nothing here
    # reaches one. Kept as its own account, rather than reusing the API
    # token's identity or root, so a leaked key's blast radius is the three
    # sudo rules below and nothing else.
    disk_import_user: "svc-terraform"
    # /var/tmp, not /tmp: /tmp is commonly tmpfs, and community.crypto's
    # openssh_keypair sets file attributes (chattr) as part of writing the
    # key, which tmpfs rejects with "Operation not supported". /var/tmp is
    # meant to survive reboots and is essentially never tmpfs.
    disk_import_key_path: "/var/tmp/{{ disk_import_user }}_ed25519"

    sdn_zone: "internal"
    sdn_vnet: "vnetint"
    sdn_controller: "evpnctl"

    # EVPN, not simple.
    #
    # A 'simple' zone is node-local: every node gets its own isolated bridge
    # carrying the same subnet, so VMs on different nodes cannot reach each
    # other. It works for exactly one hypervisor and breaks silently the moment
    # a second joins the Proxmox cluster - the cluster forms and then fails to
    # talk to itself.
    #
    # EVPN spans nodes and still provides the gateway and SNAT that this design
    # depends on. A plain 'vxlan' zone would give L2 across nodes but no gateway
    # and no SNAT, so it is not a like-for-like replacement.
    #
    # Peers and exit nodes are derived from the inventory rather than
    # configured, so adding a hypervisor to the fleet is genuinely sufficient
    # on this side too.
    sdn_peers: "{{ groups['hypervisors'] | map('extract', hostvars, 'ansible_host') | list }}"
    sdn_exit_nodes: "{{ groups['hypervisors'] | list }}"

    # Every value below is supplied per site by the start button, via
    # site.auto.yml generated from the site index. The defaults are only
    # here so a bare ansible-playbook run fails loudly rather than silently
    # configuring the wrong network.
    sdn_subnet: "UNSET"
    sdn_gateway: "UNSET"

    # Derived from the site's octet so two sites on one tailnet cannot collide
    # on BGP or VXLAN identifiers either. 0 means "not supplied".
    sdn_asn: 0
    sdn_vrf_vni: 0
    sdn_vnet_vni: 0

    # The route advertised over the overlay network is the site's whole /16,
    # not just the node subnet. Advertising the /16 means new subnets at this
    # site need no further route approval.
    advertise_routes: "UNSET"

    # A full dist-upgrade on a live hypervisor can pull a new kernel and leave
    # ZFS or the network wanting a reboot. Opt in deliberately.
    do_dist_upgrade: false

    # Supplied by the Overlay phase via overlay-network.auto.yml, which OpenTofu
    # generates and the Sterilize phase deletes. Empty means "log in by hand".
    overlay_auth_key: ""

    # Exported by overlay-network.tf alongside the key, so the tag checked here
    # is by construction the tag the key carries.
    overlay_router_tag: "tag:homelab-router"

    # Bounded so a login cannot hang forever, but generous: a tailscaled that
    # has just restarted may take well over a minute to sync, and a timeout
    # firing mid-login leaves the host logged out.
    tailscale_login_timeout: "180s"

    # The overlay network is REMOTE ACCESS, not cluster plumbing.
    #
    # The SDN, its gateway and its SNAT are entirely local to the hypervisor
    # and need no overlay at all. The overlay exists so an operator who is not
    # on the hypervisor's LAN can reach that subnet. Welding the two together
    # meant a Tailscale problem blocked cluster provisioning outright, which is
    # backwards - the cluster does not care whether anyone can reach it
    # remotely.
    #
    # Set false when running from the hypervisor's own LAN. Reaching the SDN
    # then needs one static route on the workstation, pointing at the
    # hypervisor - see docs/epochs/01-ignition.md.
    configure_overlay: true

  pre_tasks:
    - name: Confirm this host is actually Proxmox VE
      ansible.builtin.stat:
        path: /usr/bin/pvesh
      register: pvesh_binary
      changed_when: false

    - name: Fail fast if pvesh is missing
      ansible.builtin.assert:
        that: pvesh_binary.stat.exists
        fail_msg: >-
          /usr/bin/pvesh not found. This host does not look like a Proxmox VE
          node. Check your inventory before running again.
        success_msg: "Proxmox VE detected."

    - name: Require per-site network values
      ansible.builtin.assert:
        that:
          - sdn_subnet != "UNSET"
          - sdn_gateway != "UNSET"
          - advertise_routes != "UNSET"
          - (sdn_asn | int) > 0
          - (sdn_vrf_vni | int) > 0
          - (sdn_vnet_vni | int) > 0
        fail_msg: >-
          Per-site network values are missing. Run this through the start
          button, which generates site.auto.yml from the site index, or
          pass them yourself with -e.
        success_msg: "Per-site network values supplied."

    - name: Read the Proxmox version
      ansible.builtin.command: pveversion
      register: pve_version
      changed_when: false
      check_mode: false

    - name: Show what we are about to configure
      ansible.builtin.debug:
        msg:
          - "Host:         {{ inventory_hostname }}"
          - "Proxmox:      {{ pve_version.stdout }}"
          - "Dist-upgrade: {{ 'YES' if do_dist_upgrade else 'no' }}"
          - "SDN subnet:   {{ sdn_subnet }} (gateway {{ sdn_gateway }})"
          - "Advertising:  {{ advertise_routes }}"

  tasks:
    # ========================================================================
    # 1. APT repositories
    # ========================================================================
    - name: Find enterprise repository files
      ansible.builtin.find:
        paths: /etc/apt
        recurse: true
        patterns: ["*.list", "*.sources"]
        contains: ".*enterprise\\.proxmox\\.com.*"
      register: enterprise_repos
      tags: [repos]

    - name: Remove enterprise repository files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ enterprise_repos.files }}"
      loop_control:
        label: "{{ item.path }}"
      tags: [repos]

    - name: Ensure the no-subscription repository is present
      ansible.builtin.apt_repository:
        repo: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription"
        state: present
        filename: "pve-no-subscription"
        update_cache: true
      tags: [repos]

    # ========================================================================
    # 2. Packages
    # ========================================================================
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - sudo
          - ca-certificates
          # EVPN's control plane is BGP, which Proxmox drives through FRR. A
          # 'simple' zone needs none of this; an EVPN zone will not come up
          # without it.
          - frr
          - frr-pythontools
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [packages]

    - name: Upgrade all packages (opt-in only)
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
      when: do_dist_upgrade | bool
      tags: [packages]

    # ========================================================================
    # 3. Tailscale
    # ========================================================================
    - name: Download the Tailscale signing key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"
      when: configure_overlay | bool
      tags: [tailscale]

    - name: Add the Tailscale repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
          https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main
        state: present
        filename: tailscale
        update_cache: true
      when: configure_overlay | bool
      tags: [tailscale]

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
      when: configure_overlay | bool
      tags: [tailscale]

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started
      when: configure_overlay | bool
      tags: [tailscale]

    - name: Check whether Tailscale is already logged in
      ansible.builtin.command: tailscale status --json
      register: ts_status_raw
      changed_when: false
      failed_when: false
      check_mode: false
      when: configure_overlay | bool
      tags: [tailscale, routing]

    - name: Record Tailscale backend state
      ansible.builtin.set_fact:
        ts_running: >-
          {{ ts_status_raw.rc == 0
             and (ts_status_raw.stdout | length) > 0
             and (ts_status_raw.stdout | from_json).BackendState | default('') == 'Running' }}
        # "Running" is not the same as "logged in the way this project needs".
        # A host logged in manually is user-owned and carries no tags, so
        # autoApprovers - which is keyed on the router tag - never applies to
        # it, and every route it advertises waits for a human. Checking the tag
        # is what distinguishes the two.
        ts_tagged: >-
          {{ overlay_router_tag in
             (((ts_status_raw.stdout | default('{}', true) | from_json).Self
               | default({}, true)).Tags | default([], true)) }}
      when: configure_overlay | bool
      tags: [tailscale, routing]

    - name: Report why Tailscale is being re-authenticated
      ansible.builtin.debug:
        msg: >-
          This host is on the tailnet but is not tagged {{ overlay_router_tag }},
          so it is user-owned and autoApprovers cannot apply to it. Re-running
          'tailscale up --force-reauth' with the tagged key to convert it.
      when:
        - ts_running | bool
        - not (ts_tagged | bool)
        - (overlay_auth_key | length) > 0
        - configure_overlay | bool
      tags: [tailscale]

    # Run when not connected at all, OR when connected without the tag.
    # Changing a node from user-owned to tagged requires re-authentication;
    # a plain 'tailscale up' on an already-running node will not do it, which
    # is why --force-reauth is used in that case.
    # --timeout is not optional here. 'tailscale up' blocks until the control
    # plane confirms the login, so a host that cannot reach the coordination
    # server hangs forever with no output rather than failing. Bounding it
    # turns an unrecoverable wait into a diagnosable error.
    #
    # But it must be generous. --force-reauth logs the node OUT first and then
    # logs it back in; a timeout that fires mid-login leaves the host logged
    # out and worse off than before it ran. A freshly restarted tailscaled
    # syncing from scratch can take well over a minute, so 60s was too short
    # and cost exactly that.
    #
    # Retried in place rather than left for a human to notice and re-run the
    # whole start button: a --force-reauth interrupted mid-login leaves the
    # host logged out, and a logged-out host takes the plain login path with
    # no --force-reauth, so the very next attempt is strictly easier than the
    # one that just failed. Bounded at 3 attempts total so a genuinely
    # unreachable coordination server still fails loudly instead of retrying
    # forever.
    - name: Log in to Tailscale and advertise the SDN subnet
      ansible.builtin.command: >-
        tailscale up
        --authkey={{ overlay_auth_key }}
        --advertise-routes={{ advertise_routes }}
        --accept-dns=false
        --timeout={{ tailscale_login_timeout }}
        {{ '--force-reauth' if (ts_running | bool) else '' }}
      register: ts_up
      failed_when: false
      until: ts_up.rc == 0
      retries: 2
      delay: 15
      when:
        - (overlay_auth_key | length) > 0
        - not (ts_running | bool) or not (ts_tagged | bool)
        - configure_overlay | bool
      no_log: true
      tags: [tailscale]

    - name: Fail with the reason Tailscale could not authenticate
      ansible.builtin.assert:
        that: ts_up.rc == 0
        fail_msg: >-
          'tailscale up' did not complete within {{ tailscale_login_timeout }}
          (exit {{ ts_up.rc | default('n/a') }}), even after 3 attempts.

          The host cannot reach the coordination server. Check
          'journalctl -u tailscaled -n 30 --no-pager' and try
          'systemctl restart tailscaled' - a wedged daemon shows exactly these
          symptoms while the network underneath it tests fine.

          If --force-reauth was used, this host may now be logged out. That
          is recoverable, not broken: a logged-out host takes the plain login
          path with no --force-reauth, so re-running the start button once
          the network problem above is fixed will complete the login.
        success_msg: "Tailscale authenticated with the tagged key."
      when:
        - ts_up is defined
        - not (ts_up.skipped | default(false))
        - configure_overlay | bool
      tags: [tailscale]

    - name: Explain how to log in when no key was supplied
      ansible.builtin.debug:
        msg: >-
          Tailscale is installed but not logged in, and no auth key was
          supplied. Run the Overlay phase first, or log in by hand with:
          tailscale up --advertise-routes={{ advertise_routes }}
      when:
        - not (ts_running | bool)
        - (overlay_auth_key | length) == 0
        - configure_overlay | bool
      tags: [tailscale]

    # ========================================================================
    # 4. Proxmox RBAC
    # ========================================================================
    - name: List existing Proxmox roles
      ansible.builtin.command: pveum role list --output-format json
      register: existing_roles
      changed_when: false
      check_mode: false
      tags: [rbac]

    # The built-in Administrator role holds every privilege the running version
    # defines, so it doubles as the authoritative list of valid names.
    - name: Determine which privileges this Proxmox version defines
      ansible.builtin.set_fact:
        # .split() is a string method rather than a filter: Jinja has no split
        # filter, so the pipeline has to end and the method be called on it.
        pve_known_privs: >-
          {{ ((existing_roles.stdout | from_json
               | selectattr('roleid', 'equalto', 'Administrator')
               | map(attribute='privs') | first | default(''))
              | regex_replace('[,\s]+', ' ') | trim).split(' ') }}
      tags: [rbac]

    # pveum reports only the first offender and does so as a bare 400, which
    # says nothing about which name is wrong or why. Checking the whole list
    # up front names every one of them at once.
    - name: Fail on privileges this Proxmox version does not define
      ansible.builtin.assert:
        that: (pve_role_privs | difference(pve_known_privs) | length) == 0
        fail_msg: >-
          This host ({{ pve_version.stdout }}) does not define:
          {{ pve_role_privs | difference(pve_known_privs) | join(', ') }}.
          Privilege names change between major Proxmox versions - update
          pve_role_privs in this playbook.
        success_msg: "All requested privileges exist on this host."
      when: (pve_known_privs | length) > 0
      tags: [rbac]

    - name: Create the OpenTofu management role
      ansible.builtin.command: >-
        pveum role add {{ pve_role }} --privs "{{ pve_role_privs | join(' ') }}"
      when: pve_role not in (existing_roles.stdout | from_json | map(attribute='roleid') | list)
      tags: [rbac]

    # Deliberately no "modify existing role" task. This playbook initialises a
    # host from zero; it does not reconcile one that has drifted. If the role
    # already exists, it was created by a previous run of this same code.
    # Privilege changes ship as a new version and are picked up by a rebuild.

    - name: List existing Proxmox users
      ansible.builtin.command: pveum user list --output-format json
      register: existing_users
      changed_when: false
      check_mode: false
      tags: [rbac]

    - name: Create the OpenTofu service user
      ansible.builtin.command: >-
        pveum user add {{ pve_user }}@{{ pve_realm }} --comment "OpenTofu Service Account"
      when: >-
        (pve_user + '@' + pve_realm) not in
        (existing_users.stdout | from_json | map(attribute='userid') | list)
      tags: [rbac]

    - name: Grant the service user its role at the root path
      ansible.builtin.command: >-
        pveum acl modify / --user {{ pve_user }}@{{ pve_realm }} --role {{ pve_role }}
      changed_when: false
      tags: [rbac]

    - name: List existing API tokens
      ansible.builtin.command: >-
        pveum user token list {{ pve_user }}@{{ pve_realm }} --output-format json
      register: existing_tokens
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [rbac]

    - name: Check whether the token secret already exists in 1Password
      ansible.builtin.command: >-
        op read op://{{ op_vault }}/{{ site_name }}/hypervisor/token_secret
      register: existing_token_secret
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false
      tags: [rbac]

    # A token can exist in Proxmox with no secret anywhere in 1Password if an
    # earlier run created it and then failed before storing it (the same
    # class of gap the SSH credential below guards against). Proxmox never
    # lets an existing token's secret be read back, so "it already exists"
    # is not recoverable here the way it is for the SSH key - the only way
    # out is to delete the orphan and mint a replacement.
    - name: Delete an orphaned token that has no secret stored anywhere
      ansible.builtin.command: >-
        pveum user token remove {{ pve_user }}@{{ pve_realm }} {{ pve_token_id }}
      when: >-
        existing_token_secret.rc != 0 and
        pve_token_id in
        (existing_tokens.stdout | default('[]') | from_json | map(attribute='tokenid') | list)
      tags: [rbac]

    - name: Generate the API token
      ansible.builtin.command: >-
        pveum user token add {{ pve_user }}@{{ pve_realm }} {{ pve_token_id }}
        --privsep 0 --output-format json
      register: generated_token
      when: >-
        existing_tokens.rc != 0 or
        pve_token_id not in
        (existing_tokens.stdout | default('[]') | from_json | map(attribute='tokenid') | list) or
        existing_token_secret.rc != 0
      tags: [rbac]

    # Granting the role to the user (above) is not enough on its own: this
    # token is created with --privsep 0, which normally makes it inherit the
    # owning user's permissions - but a token's privsep can drift independent
    # of this playbook (e.g. a token created before --privsep 0 was added
    # here), and when privsep is 1, Proxmox's permission checks only ever
    # consult ACL entries bound to the token principal itself
    # (user@realm!tokenid), never the owning user's. Binding the role to the
    # token directly makes every check work regardless of that flag, and
    # since `pveum acl modify` is idempotent this is safe to run every time.
    - name: Grant the API token its role directly, independent of privsep
      ansible.builtin.command: >-
        pveum acl modify / --tokens {{ pve_user }}@{{ pve_realm }}!{{ pve_token_id }} --roles {{ pve_role }}
      changed_when: false
      tags: [rbac]

    # Written directly into 1Password rather than shown for a human to paste
    # in - the service account already has write access to this vault, so a
    # secret this sensitive never needs to touch a terminal scrollback.
    # Piped as a JSON template (op item edit's own documented safe path,
    # `cat updated.json | op item edit`) rather than an assignment-statement
    # argument, since those are visible to other processes via the command
    # line - the exact class of exposure this project has hit before.
    - name: Store the new token secret in 1Password
      ansible.builtin.shell:
        executable: /bin/bash
        # A literal block scalar (|), not folded (>-): a folded scalar's
        # newline-to-space rules depend on relative indentation between
        # lines, which a script with several nested indentation levels
        # (like this jq filter) hits unpredictably. | preserves every
        # newline exactly as written, so the script Ansible actually runs
        # matches what is on screen here.
        cmd: |
          set -o pipefail
          op item get {{ site_name }} --vault {{ op_vault }} --format=json | jq --arg tid "{{ pve_user }}@{{ pve_realm }}!{{ pve_token_id }}" '
            (.sections[] | select(.label=="hypervisor") | .id) as $hv
            | .fields |= (
                map(select(.section.id != $hv or (.label != "token_id" and .label != "token_secret")))
                + [
                    {id: "token_id", type: "STRING", label: "token_id", value: $tid, section: {id: $hv}},
                    {id: "token_secret", type: "CONCEALED", label: "token_secret", value: env.TOKEN_SECRET, section: {id: $hv}}
                  ]
              )
          ' | op item edit {{ site_name }} --vault {{ op_vault }}
      environment:
        TOKEN_SECRET: "{{ (generated_token.stdout | from_json).value }}"
      delegate_to: localhost
      become: false
      when: generated_token.changed | default(false)
      tags: [rbac]

    # A write returning success only proves op item edit accepted the
    # request, not that the value which landed matches what Proxmox actually
    # generated - a jq escaping bug or a field written to the wrong section
    # would still exit 0. Read it back and compare exactly before trusting it.
    - name: Read back the stored token secret for verification
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          op item get {{ site_name }} --vault {{ op_vault }} --format=json | jq -c '{
            token_id: ([.fields[] | select(.label=="token_id")][0].value),
            token_secret: ([.fields[] | select(.label=="token_secret")][0].value)
          }'
      register: stored_token
      delegate_to: localhost
      become: false
      when: generated_token.changed | default(false)
      changed_when: false
      tags: [rbac]

    - name: Verify the token secret round-tripped into 1Password correctly
      ansible.builtin.assert:
        that:
          - >-
            (stored_token.stdout | from_json).token_id ==
            pve_user + '@' + pve_realm + '!' + pve_token_id
          - >-
            (stored_token.stdout | from_json).token_secret ==
            (generated_token.stdout | from_json).value
        fail_msg: >-
          The token secret written to 1Password does not match what Proxmox
          generated - do not proceed with a mismatched credential. Check the
          'hypervisor' section on the {{ site_name }} item by hand.
        success_msg: "Token secret verified in 1Password."
      when: generated_token.changed | default(false)
      tags: [rbac]

    # ========================================================================
    # 5. SSH access for disk-import operations
    # ========================================================================
    # Confirmed directly from the provider's source
    # (proxmoxtf/resource/vm/disk/disk.go, this pinned tag): creating a VM
    # disk from a file_id runs exactly three commands over SSH, via sudo if
    # the connected user is not root - `pvesm path`, `qm disk import`, and
    # `qm set`. The sudoers rule below grants exactly those three and nothing
    # more, mirroring how the Proxmox API token above is scoped to a named
    # role rather than Administrator.
    - name: Create the dedicated disk-import service user
      ansible.builtin.user:
        name: "{{ disk_import_user }}"
        system: true
        # Not /usr/sbin/nologin: that shell's entire job is to print "This
        # account is currently not available." and refuse to run anything,
        # for ANY command execution over SSH - not just interactive
        # sessions. bpg/proxmox needs to actually run pvesm/qm commands
        # through this account's SSH session, which nologin blocks
        # unconditionally. The sudoers rule above is what actually restricts
        # this account, not the shell.
        shell: /bin/bash
        create_home: true
      register: disk_import_user_created
      tags: [ssh-import]

    # Confirmed from the provider's own source (proxmox/ssh/client.go,
    # probeSudo): before running the real commands, bpg/proxmox checks
    # whether sudo is usable by running `sudo -n /usr/sbin/pvesm apiinfo`
    # and, if that fails, `sudo -n /usr/sbin/qm --help`. Neither of those
    # was in this list - so `sudo -n` failed silently, the provider decided
    # sudo was not available, and every real command below then ran as the
    # plain unprivileged user instead of root. That is what produced
    # "ipcc_send_rec failed" / "Unable to load access control list" - not a
    # concurrency problem, not a permissions-too-narrow-for-security
    # problem, just these two read-only probe commands missing from the
    # allowlist they need to be on for the probe to succeed at all.
    - name: Grant the service user sudo rights scoped to exactly what bpg/proxmox runs over SSH
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ disk_import_user }}"
        content: |
          {{ disk_import_user }} ALL=(root) NOPASSWD: /usr/sbin/pvesm path *, /usr/sbin/pvesm apiinfo, /usr/sbin/qm disk import *, /usr/sbin/qm set *, /usr/sbin/qm --help
        mode: "0440"
        validate: "visudo -cf %s"
      tags: [ssh-import]

    # Whether to bootstrap the keypair is decided by whether 1Password
    # already has it, not by whether the Linux account was just created in
    # this run - those two can disagree. A run that creates the account but
    # then fails before storing the key (as an earlier run here did, on a
    # chattr/tmpfs error) leaves the account present but no credential
    # anywhere; gating on account-creation would make every later re-run
    # silently skip the entire rest of this section forever, since the
    # account already exists. Checking the actual target resource - same
    # idiom as the role and token existence checks above - avoids that.
    - name: Check whether the SSH credential already exists in 1Password
      ansible.builtin.command: >-
        op read op://{{ op_vault }}/{{ site_name }}/hypervisor/ssh_private_key
      register: existing_ssh_credential
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false
      tags: [ssh-import]

    # Generated fresh on the control node (this devbox), shown once, then
    # removed from local disk - the same one-shot pattern as the API token
    # secret above.
    - name: Generate an SSH keypair for the service user
      community.crypto.openssh_keypair:
        path: "{{ disk_import_key_path }}"
        type: ed25519
        comment: "{{ disk_import_user }}@{{ inventory_hostname }} - bpg/proxmox disk import"
      register: disk_import_keypair
      delegate_to: localhost
      become: false
      when: existing_ssh_credential.rc != 0
      tags: [ssh-import]

    - name: Authorize the public key for the service user
      ansible.posix.authorized_key:
        user: "{{ disk_import_user }}"
        key: "{{ lookup('file', disk_import_key_path + '.pub') }}"
        state: present
      when: existing_ssh_credential.rc != 0
      tags: [ssh-import]

    # Written directly into 1Password rather than shown for a human to paste
    # in - see the token-secret task above for why. --rawfile reads the key
    # straight from the file generated a few tasks up, so the private key
    # never becomes a command-line argument (a jq --arg would) or an Ansible
    # variable that might end up in a log; adds ssh_username/ssh_private_key
    # to the hypervisor section since they don't exist there yet.
    - name: Store the SSH credential in 1Password
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          op item get {{ site_name }} --vault {{ op_vault }} --format=json | jq --arg user "{{ disk_import_user }}" --rawfile key {{ disk_import_key_path }} '
            (.sections[] | select(.label=="hypervisor") | .id) as $hv
            | .fields |= (
                map(select(.section.id != $hv or (.label != "ssh_username" and .label != "ssh_private_key")))
                + [
                    {id: "ssh_username", type: "STRING", label: "ssh_username", value: $user, section: {id: $hv}},
                    {id: "ssh_private_key", type: "CONCEALED", label: "ssh_private_key", value: $key, section: {id: $hv}}
                  ]
              )
          ' | op item edit {{ site_name }} --vault {{ op_vault }}
      delegate_to: localhost
      become: false
      when: existing_ssh_credential.rc != 0
      tags: [ssh-import]

    # Same reasoning as the token-secret verification above: a successful
    # write doesn't prove the value is right. This runs before the local key
    # is deleted on purpose - if the comparison fails, the play stops here
    # and the only good copy of the key is still on disk to recover from.
    - name: Read back the stored SSH credential for verification
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          op item get {{ site_name }} --vault {{ op_vault }} --format=json | jq -c '{
            ssh_username: ([.fields[] | select(.label=="ssh_username")][0].value),
            ssh_private_key: ([.fields[] | select(.label=="ssh_private_key")][0].value)
          }'
      register: stored_ssh
      delegate_to: localhost
      become: false
      when: existing_ssh_credential.rc != 0
      changed_when: false
      tags: [ssh-import]

    - name: Verify the SSH credential round-tripped into 1Password correctly
      ansible.builtin.assert:
        that:
          - >-
            (stored_ssh.stdout | from_json).ssh_username == disk_import_user
          - >-
            (stored_ssh.stdout | from_json).ssh_private_key.rstrip('\n') ==
            lookup('file', disk_import_key_path).rstrip('\n')
        fail_msg: >-
          The SSH private key written to 1Password does not match the key
          generated and authorized on the host. The local copy at
          {{ disk_import_key_path }} has deliberately NOT been deleted -
          check the 'hypervisor' section on the {{ site_name }} item by hand
          before re-running this playbook.
        success_msg: "SSH credential verified in 1Password."
      when: existing_ssh_credential.rc != 0
      tags: [ssh-import]

    - name: Remove the private key from local disk
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ disk_import_key_path }}"
        - "{{ disk_import_key_path }}.pub"
      delegate_to: localhost
      become: false
      when: existing_ssh_credential.rc != 0
      tags: [ssh-import]

    # ========================================================================
    # 6. SDN
    # ========================================================================
    # SDN objects are cluster-wide, so they are created once rather than once
    # per hypervisor. Only the per-node checks further down run everywhere.
    - name: List SDN controllers
      ansible.builtin.command: pvesh get /cluster/sdn/controllers --output-format json
      register: sdn_controllers
      changed_when: false
      check_mode: false
      run_once: true
      tags: [sdn]

    - name: Create the EVPN controller
      ansible.builtin.command: >-
        pvesh create /cluster/sdn/controllers
        --controller {{ sdn_controller }} --type evpn
        --asn {{ sdn_asn }} --peers {{ sdn_peers | join(',') }}
      when: sdn_controller not in (sdn_controllers.stdout | from_json | map(attribute='controller') | list)
      run_once: true
      tags: [sdn]

    # Peers is the list of hypervisors that speak BGP to each other. With one
    # node it contains only itself, which is valid and becomes correct
    # automatically when the fleet grows.
    - name: Keep the controller's peer list in step with the fleet
      ansible.builtin.command: >-
        pvesh set /cluster/sdn/controllers/{{ sdn_controller }}
        --peers {{ sdn_peers | join(',') }}
      when: sdn_controller in (sdn_controllers.stdout | from_json | map(attribute='controller') | list)
      changed_when: false
      run_once: true
      tags: [sdn]

    - name: List SDN zones
      ansible.builtin.command: pvesh get /cluster/sdn/zones --output-format json
      register: sdn_zones
      changed_when: false
      check_mode: false
      run_once: true
      tags: [sdn]

    # A zone's type cannot be changed in place. Refusing loudly is better than
    # half-migrating: switching from simple means deleting the vnet and zone,
    # which detaches every VM already on them.
    - name: Refuse to run against a zone of the wrong type
      ansible.builtin.assert:
        that: >-
          (sdn_zones.stdout | from_json
           | selectattr('zone', 'equalto', sdn_zone)
           | map(attribute='type') | first | default('evpn')) == 'evpn'
        fail_msg: >-
          Zone '{{ sdn_zone }}' already exists and is not an EVPN zone. Its
          type cannot be changed in place. Delete the vnet and the zone - which
          detaches any VM using them - and re-run:
          'pvesh delete /cluster/sdn/vnets/{{ sdn_vnet }}' then
          'pvesh delete /cluster/sdn/zones/{{ sdn_zone }}' then
          'pvesh set /cluster/sdn'.
        success_msg: "Zone '{{ sdn_zone }}' is absent or already EVPN."
      run_once: true
      tags: [sdn]

    - name: Create the EVPN zone
      ansible.builtin.command: >-
        pvesh create /cluster/sdn/zones
        --zone {{ sdn_zone }} --type evpn
        --controller {{ sdn_controller }}
        --vrf-vxlan {{ sdn_vrf_vni }}
        --exitnodes {{ sdn_exit_nodes | join(',') }}
        --ipam pve
      when: sdn_zone not in (sdn_zones.stdout | from_json | map(attribute='zone') | list)
      run_once: true
      tags: [sdn]

    # Exit nodes are the hypervisors that route this subnet to the outside
    # world. Every node is one, so losing a box does not cut off the others.
    - name: Keep the zone's exit nodes in step with the fleet
      ansible.builtin.command: >-
        pvesh set /cluster/sdn/zones/{{ sdn_zone }}
        --exitnodes {{ sdn_exit_nodes | join(',') }}
      when: sdn_zone in (sdn_zones.stdout | from_json | map(attribute='zone') | list)
      changed_when: false
      run_once: true
      tags: [sdn]

    - name: List SDN vnets
      ansible.builtin.command: pvesh get /cluster/sdn/vnets --output-format json
      register: sdn_vnets
      changed_when: false
      check_mode: false
      run_once: true
      tags: [sdn]

    # An EVPN vnet needs a VXLAN VNI, which a simple vnet does not. It is
    # derived from the octet so two sites cannot pick the same one.
    - name: Create the vnet
      ansible.builtin.command: >-
        pvesh create /cluster/sdn/vnets
        --vnet {{ sdn_vnet }} --zone {{ sdn_zone }} --tag {{ sdn_vnet_vni }}
      when: sdn_vnet not in (sdn_vnets.stdout | from_json | map(attribute='vnet') | list)
      run_once: true
      tags: [sdn]

    - name: List subnets on the vnet
      ansible.builtin.command: >-
        pvesh get /cluster/sdn/vnets/{{ sdn_vnet }}/subnets --output-format json
      register: sdn_subnets
      changed_when: false
      failed_when: false
      check_mode: false
      run_once: true
      tags: [sdn]

    # No DHCP. An EVPN zone does not accept Proxmox's dnsmasq DHCP - the API
    # rejects the property outright - and nothing here needs it: the Talos
    # nodes take static addresses from cloud-init, and pods get theirs from the
    # CNI. The gateway and SNAT are what this subnet is actually for.
    - name: Create the subnet with SNAT
      ansible.builtin.command: >-
        pvesh create /cluster/sdn/vnets/{{ sdn_vnet }}/subnets
        --type subnet --subnet {{ sdn_subnet }} --gateway {{ sdn_gateway }} --snat 1
      when: >-
        sdn_subnets.rc != 0 or
        (sdn_subnets.stdout | default('[]') | from_json | length) == 0
      run_once: true
      tags: [sdn]

    # Always commit. 'pvesh set /cluster/sdn' is the API equivalent of the
    # Apply button in the web UI: idempotent, and it reloads only what changed.
    #
    # We deliberately do NOT run 'ifreload -a'. That reloads every interface on
    # a live hypervisor and can drop the management link out from under you.
    - name: Apply the pending SDN configuration
      ansible.builtin.command: pvesh set /cluster/sdn
      changed_when: false
      run_once: true
      tags: [sdn]

    # FRR carries the BGP session that EVPN's control plane runs over. It is
    # not needed by a simple zone, so a host converted from one may never have
    # had it started.
    - name: Enable and start FRR
      ansible.builtin.systemd:
        name: frr
        enabled: true
        state: started
      tags: [sdn]

    - name: Verify the vnet bridge exists on the host
      ansible.builtin.command: ip -brief address show {{ sdn_vnet }}
      register: vnet_state
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [sdn]

    - name: Fail if the vnet bridge was never created
      ansible.builtin.assert:
        that: vnet_state.rc == 0
        fail_msg: >-
          {{ sdn_vnet }} does not exist on this host. The SDN configuration was
          applied but produced no interface. Check
          'pvesh get /cluster/sdn/vnets' and the zone's status.
        success_msg: "{{ sdn_vnet }} exists."
      tags: [sdn]

    # 'pvesh set /cluster/sdn' writes the interface definition but does not
    # bring it up, which leaves the bridge DOWN with its gateway address
    # assigned - reachable from nowhere. The web UI's Apply runs 'ifreload -a'
    # to finish the job, but that reloads every interface on a live hypervisor
    # and can drop the management link. Bringing up this one interface achieves
    # the same result and cannot disturb anything else.
    - name: Bring the vnet bridge up
      ansible.builtin.command: ip link set dev {{ sdn_vnet }} up
      changed_when: "'UP' not in vnet_state.stdout"
      tags: [sdn]

    # A flag check is not enough here: a bridge with no ports attached can
    # report DOWN for lack of carrier while still routing its own address
    # perfectly well. Pinging the gateway from the host settles it.
    - name: Confirm the gateway answers on the host itself
      ansible.builtin.command: ping -c 2 -W 2 {{ sdn_gateway }}
      register: gateway_ping
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [sdn]

    - name: Fail if the gateway does not answer locally
      ansible.builtin.assert:
        that: gateway_ping.rc == 0
        fail_msg: >-
          {{ sdn_gateway }} does not answer on {{ inventory_hostname }} itself,
          so nothing reached over the overlay network will reach it either.
          Inspect with 'ip -br addr show {{ sdn_vnet }}' and
          'journalctl -u pvedaemon -n 50'.
        success_msg: >-
          {{ sdn_gateway }} answers locally - the subnet is live and routable.
      tags: [sdn]

    # ========================================================================
    # 7. Subnet routing
    # ========================================================================
    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true
      tags: [routing]

    # IPv6 forwarding is deliberately OFF, and this task exists to undo it on
    # hosts an earlier version of this playbook turned it on.
    #
    # Enabling it has a side effect that is easy to miss: the kernel stops
    # honouring router advertisements unless accept_ra is also set to 2. A host
    # that gets its IPv6 configuration by SLAAC therefore loses its global
    # address and its default route the moment forwarding is switched on. The
    # symptom is not obviously IPv6 at all - tailscaled keeps selecting IPv6
    # DERP relays and failing with "network is unreachable" while every IPv4
    # test passes, which reads as a wedged daemon.
    #
    # Nothing here needs it. The subnets advertised over the overlay network
    # are IPv4 only. If IPv6 subnet routing is ever added, this must become
    # forwarding=1 AND accept_ra=2, not forwarding alone.
    - name: Ensure IPv6 forwarding is off
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "0"
        sysctl_set: true
        state: present
        reload: true
      register: ipv6_fwd
      tags: [routing]

    - name: Report that IPv6 routing was repaired
      ansible.builtin.debug:
        msg: >-
          IPv6 forwarding was on and has been turned off. The kernel will
          accept router advertisements again, but the existing default route
          is not restored retroactively - restart tailscaled, or wait for the
          next router advertisement, before expecting the overlay network to
          recover.
      when: ipv6_fwd.changed
      tags: [routing]

    - name: Advertise the SDN subnet over Tailscale
      ansible.builtin.command: tailscale set --advertise-routes={{ advertise_routes }}
      when:
        - configure_overlay | bool
        - ts_running | bool
      changed_when: false
      tags: [routing]

    # No approval check here, deliberately.
    #
    # A previous version asserted on Self.PrimaryRoutes from
    # 'tailscale status --json'. That field describes routes a node is primary
    # for as seen from ANOTHER node; the local node's own Self entry leaves it
    # empty whether or not the route is approved, so the check failed closed and
    # blocked a correctly configured tailnet.
    #
    # There is no reliable local signal for control-plane approval, and inventing
    # one that fails closed is worse than not checking. The Verify phase pings
    # the gateway across the overlay network, which tests the thing that actually
    # matters, and its failure message names autoApprovers as the likely cause.
    - name: Explain how to reach the subnet without the overlay
      ansible.builtin.debug:
        msg:
          - "The overlay network is disabled, so nothing advertises {{ sdn_subnet }} off this host."
          - "That is fine for building the cluster - the SDN is local to this hypervisor."
          - ""
          - "To reach it from a workstation, that workstation must be ON THIS HOST'S"
          - "SUBNET. A static route's next hop has to be on-link; naming a gateway on"
          - "another subnet makes the kernel treat it as directly attached, so it ARPs"
          - "for an address nobody answers and loses the route it already had."
          - ""
          - "Same subnet as {{ ansible_host | default(inventory_hostname) }}:"
          - "    Windows : route -p add {{ sdn_subnet.split('/')[0] }} mask 255.255.0.0 {{ ansible_host | default(inventory_hostname) }}"
          - "    Linux   : ip route add {{ sdn_subnet }} via {{ ansible_host | default(inventory_hostname) }}"
          - ""
          - "A different subnet: use the overlay network instead, or add the route on the"
          - "router that joins them. Do NOT point a workstation route at this host."
      when: not (configure_overlay | bool)
      tags: [routing]

    - name: Report the advertised route
      ansible.builtin.debug:
        msg: >-
          {{ advertise_routes }} is advertised over the overlay network. If the
          Verify phase cannot reach {{ sdn_gateway }}, check the Subnets panel
          in the Tailscale admin console - an unapproved route is carried
          nowhere. See docs/tailnet-setup.md.
      when:
        - configure_overlay | bool
        - ts_running | bool
      tags: [routing]
