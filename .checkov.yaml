# Checkov config, read automatically from the repository root.
#
# The Policy Scan lane runs `checkov --directory .` and this is what it obeys.
# It used to be read through Super-Linter, which is gone (#365); the exclusions
# below are unchanged and the reasoning that lived in that file now lives here,
# because a config deferring to a deleted file explains nothing.
#
# clusters/management/flux-system/ is Flux's own generated install and sync
# manifest, committed verbatim. It is not ours to edit, and the broad
# ClusterRole permissions Checkov flags in it are inherent to how a GitOps
# controller has to work rather than a misconfiguration in code we control.
# HEALTHCHECK, which Kubernetes ignores.
#
# CKV_DOCKER_2 wants a HEALTHCHECK instruction in every image. Nothing built
# here runs anywhere but Kubernetes, and the kubelet does not read that
# instruction at all - liveness and readiness probes on the pod are what
# decides whether a container is healthy, and they live in the manifest where
# they can be tuned without rebuilding an image.
#
# Adding one to satisfy this check would add an instruction that never
# executes, which is worse than not having it: it reads as a health check to
# whoever finds it next.
#
# Removed when something here is built to run outside Kubernetes.
skip-check:
  - CKV_DOCKER_2

  # CKV_K8S_8 and CKV_K8S_9: liveness and readiness probes.
  #
  # The game server is a single process in its container. A process that exits
  # takes the container with it and the kubelet restarts it, so a liveness
  # probe would be checking that something which cannot be running is running.
  # Readiness gates a Service, and there is no Service: crossplay means nothing
  # connects inbound.
  #
  # The case a probe would genuinely catch is a hang without an exit. Detecting
  # that means asking the server something over UDP, which needs a client the
  # image deliberately does not carry - and a probe that cannot fail is worse
  # than none, because it reports health nobody measured.
  #
  # Removed when a workload here serves traffic through a Service, or when
  # there is a real check to run.
  - CKV_K8S_8
  - CKV_K8S_9

  # CKV_K8S_11: CPU limits.
  #
  # Deliberately absent, and this is the one where the check is wrong for the
  # workload. CPU limits are enforced by CFS quota, which stops a process at
  # each quota boundary even on an idle node with cores free. For a simulation
  # people are moving around in, that is stutter rather than safety.
  #
  # The CPU request is what protects the node: it reserves scheduling room, so
  # nothing else is placed expecting capacity this needs. Memory is different
  # and does carry a limit - it is incompressible, so the alternative to a
  # limit there is a neighbour being evicted.
  - CKV_K8S_11

  # CKV_K8S_35: secrets as files rather than environment variables.
  #
  # Sound in general and it changes nothing here. The server takes its password
  # as a command-line argument - that is the only interface it has - so the
  # value is in that container's /proc/<pid>/cmdline whichever way it arrives.
  # Mounting a file would add a shell to read it and pass it on, which is more
  # moving parts for an exposure that does not move.
  #
  # What matters is that it is not in git, and it is not: it comes from the
  # vault through a Secret written by OpenTofu.
  #
  # Removed if the server ever learns to read a password from a file.
  - CKV_K8S_35

skip-path:
  - clusters/management/flux-system
  # clusters/bootstrap/ is Cilium's own chart output, committed verbatim for
  # the same reason flux-system is: a version bump should be a reviewable diff
  # of what actually changes in the cluster, not a one-line version bump nobody
  # can see the consequences of.
  #
  # Every finding checkov raises in it is true and is inherent to what a CNI is
  # - privileged, hostNetwork, CAP_NET_ADMIN, hostPath mounts. A CNI is the
  # node's network; there is no version of one that satisfies these rules. That
  # privilege is not being waved away here, it is recorded deliberately in
  # scripts/approved-suppliers.yml, which calls Cilium the most privileged
  # delivery in that file and says why in as many words.
  #
  # What this DOES cost: a future chart version adding a new hostPath or a
  # broader ClusterRole would not be flagged. The compensating control is that
  # the manifest is committed, so that change appears in a pull request diff -
  # which is the whole reason it is committed rather than fetched at apply time.
  - clusters/bootstrap
  # The root kustomization.yaml lists flux-system as a resource, so
  # Checkov's kustomize build starting from this file pulls in the same
  # vendored Deployment/ClusterRole objects and attributes findings about
  # them here instead - same reasoning as the exclusion above.
  - clusters/management/kustomization.yaml
  # tofu test fixtures - deliberately fake values, some deliberately shaped
  # like a real credential (aws-shaped-key.json exists specifically to
  # trigger the AKIA/ASIA check). Checkov's secrets scanner can't tell fake
  # from real by looking at shape/entropy alone, so every fixture trips
  # CKV_SECRET_2/CKV_SECRET_6. Hand-tuning each value to dodge the entropy
  # heuristic is fragile and would just recur on the next fixture; excluding
  # the directory is the same call already made for flux-system above.
  - management/cluster/tests
  # The test trees. tests/go holds Go source with deliberately fake
  # credentials in its fixtures and assertions, and node_modules under
  # tests/ would be third-party code this repository does not own. Same
  # reasoning as the fixtures directory above: a secrets scanner cannot tell
  # a fake credential from a real one by shape alone, and these are all fake
  # by construction.
  - tests
  - node_modules
