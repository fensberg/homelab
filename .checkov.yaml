# Checkov config, read automatically from the repo root (CHECKOV_FILE_NAME
# in .github/super-linter.vars is unset, which defaults to this filename).
#
# Checkov is one of the tools Super-Linter's own docs list as always
# scanning the whole workspace regardless of FILTER_REGEX_EXCLUDE - so
# excluding clusters/management/flux-system/ (Flux's own generated install
# and sync manifest, committed verbatim - see super-linter.vars for the full
# reasoning) needs Checkov's own skip-path mechanism instead. It is not ours
# to edit, and the broad ClusterRole permissions it flags are inherent to
# how a GitOps controller has to work, not a misconfiguration in code we
# control.
skip-path:
  - clusters/management/flux-system
  # clusters/bootstrap/ is Cilium's own chart output, committed verbatim for
  # the same reason flux-system is: a version bump should be a reviewable diff
  # of what actually changes in the cluster, not a one-line version bump nobody
  # can see the consequences of.
  #
  # Every finding checkov raises in it is true and is inherent to what a CNI is
  # - privileged, hostNetwork, CAP_NET_ADMIN, hostPath mounts. A CNI is the
  # node's network; there is no version of one that satisfies these rules. That
  # privilege is not being waved away here, it is recorded deliberately in
  # scripts/approved-suppliers.yml, which calls Cilium the most privileged
  # delivery in that file and says why in as many words.
  #
  # What this DOES cost: a future chart version adding a new hostPath or a
  # broader ClusterRole would not be flagged. The compensating control is that
  # the manifest is committed, so that change appears in a pull request diff -
  # which is the whole reason it is committed rather than fetched at apply time.
  - clusters/bootstrap
  # The root kustomization.yaml lists flux-system as a resource, so
  # Checkov's kustomize build starting from this file pulls in the same
  # vendored Deployment/ClusterRole objects and attributes findings about
  # them here instead - same reasoning as the exclusion above.
  - clusters/management/kustomization.yaml
  # tofu test fixtures - deliberately fake values, some deliberately shaped
  # like a real credential (aws-shaped-key.json exists specifically to
  # trigger the AKIA/ASIA check). Checkov's secrets scanner can't tell fake
  # from real by looking at shape/entropy alone, so every fixture trips
  # CKV_SECRET_2/CKV_SECRET_6. Hand-tuning each value to dodge the entropy
  # heuristic is fragile and would just recur on the next fixture; excluding
  # the directory is the same call already made for flux-system above.
  - management/cluster/tests
  # The test trees. tests/go holds Go source with deliberately fake
  # credentials in its fixtures and assertions, and node_modules under
  # tests/ would be third-party code this repository does not own. Same
  # reasoning as the fixtures directory above: a secrets scanner cannot tell
  # a fake credential from a real one by shape alone, and these are all fake
  # by construction.
  - tests
  - node_modules
