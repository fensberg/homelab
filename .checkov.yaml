# Checkov config, read automatically from the repo root (CHECKOV_FILE_NAME
# in .github/super-linter.vars is unset, which defaults to this filename).
#
# Checkov is one of the tools Super-Linter's own docs list as always
# scanning the whole workspace regardless of FILTER_REGEX_EXCLUDE - so
# excluding clusters/management/flux-system/ (Flux's own generated install
# and sync manifest, committed verbatim - see super-linter.vars for the full
# reasoning) needs Checkov's own skip-path mechanism instead. It is not ours
# to edit, and the broad ClusterRole permissions it flags are inherent to
# how a GitOps controller has to work, not a misconfiguration in code we
# control.
skip-path:
  - clusters/management/flux-system
  # The root kustomization.yaml lists flux-system as a resource, so
  # Checkov's kustomize build starting from this file pulls in the same
  # vendored Deployment/ClusterRole objects and attributes findings about
  # them here instead - same reasoning as the exclusion above.
  - clusters/management/kustomization.yaml
