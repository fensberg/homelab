version: "3"

vars:
  # Which site to deploy. Override: task start SITE=site1
  SITE: '{{.SITE | default "site0"}}'

# The single entrypoint is scripts/Start-Homelab.ps1. These tasks are thin
# wrappers so the same verbs work from any shell.

tasks:
  start:
    desc: "The start button: render -> tailnet -> hypervisor -> verify -> compute -> cluster -> migrate -> backup -> sterilize"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}}

  plan:
    desc: "Show which phases would run, without running them"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -WhatIfPhase

  render-secrets:
    desc: "Hydrate templates from 1Password"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -Phase Render

  verify:
    desc: "Check the network path to the hypervisor and the SDN gateway"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -Phase Verify

  configure-hypervisor:
    desc: "Ansible: Proxmox repos, Tailscale, RBAC, SDN. Safe to re-run."
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -Phase Hypervisor

  check-hypervisor:
    desc: "Dry-run the playbook: show what would change, change nothing"
    dir: management/hypervisor
    cmds:
      - ansible-playbook -i inventory.yml hypervisor-prep.yml --check --diff

  backup-state:
    desc: "Encrypt the current state and push it to Cloudflare R2"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -Phase Backup

  clean-secrets:
    desc: "Wipe every rendered secret and the local state file"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -Phase Sterilize
