version: "3"

vars:
  # Which site to deploy. Override: task start SITE=site1
  SITE: '{{.SITE | default "site0"}}'

  # Keep this tag in step with the SHA pinned in pr-validation.yml. They are
  # the same release, and the point of running it locally is that it is.

# The single entrypoint is scripts/contractor, a Go program. Every task below
# builds it fresh (fast, and always current source - no stale binary to
# remember to rebuild) and then execs the binary directly, rather than
# `go run`. That distinction matters here specifically: `go run`'s wrapper
# process has no signal handler of its own, so a real Ctrl-C can kill it
# before the actual program gets a clean chance to run its own cleanup -
# exactly the failure mode that orphaned infrastructure once already.
# Running the built binary directly is what makes Ctrl-C's cleanup reliable
# for `task`-wrapped phases that never touch real infrastructure on their own.
#
# `start` is deliberately NOT one of those wrapped phases - see its own
# comment below for why.

tasks:
  build:
    desc: "Build the contractor binary"
    cmds:
      - go build -C scripts/contractor -o ../../toolshed/contractor .

  start:
    desc: "Builds the contractor, then tells you to run it directly - see comment"
    # This does not exec build-site itself, on purpose. `task` intercepts SIGINT
    # for itself but does not proxy it to the subprocess it's supervising -
    # a confirmed, currently-open upstream limitation
    # (github.com/go-task/task/issues/1408). A Ctrl-C aimed at `task start`
    # can kill build-site before its own signal handler ever runs, which is
    # exactly what leaves VMs orphaned instead of destroyed. build-site's
    # destroy-then-sterilize cleanup on interrupt only works when something
    # actually delivers it the signal - which means running the binary
    # yourself, not through task. Every other contractor-invoking task below is
    # safe to wrap because none of them can reach the Compute phase, so an
    # interrupted one leaves stale secrets at worst - recoverable with
    # `task clean-secrets` - never an orphaned VM.
    cmds:
      - task: build
      - 'echo "Built. Run directly so Ctrl-C can safely destroy and sterilize:"'
      - 'echo "  ./toolshed/contractor build-site -site {{.SITE}}"'

  plan:
    desc: "Show what a converge would change, without changing it"
    # Safe to wrap: it changes nothing, and an interrupted plan leaves a
    # rendered config and a saved plan file at worst - both removed by
    # 'task clean-secrets'.
    cmds:
      - task: build
      - ./toolshed/contractor plan -site {{.SITE}}

  converge:
    desc: "Apply the config to an estate that already exists"
    # Safe to wrap, unlike start, and for a reason that is worth stating
    # rather than assumed. start is unwrapped because an interrupted ignition
    # can leave VMs nothing is tracking, and only build-site's own signal handler
    # destroys them. A converge cannot reach that state: the estate already
    # exists, its state already lives in Postgres, and build-site never destroys
    # on failure or interrupt in this mode. An interrupted converge leaves a
    # running estate and a state file that still describes it.
    cmds:
      - task: build
      - ./toolshed/contractor converge-site -site {{.SITE}}

  phases:
    desc: "List the phases an ignition would run, without running them"
    # Renamed from 'plan' when `contractor plan` arrived. Two different questions
    # were sharing one word: "which phases run" and "what changes in the
    # estate". The second is the one anybody means by "plan".
    cmds:
      - task: build
      - ./toolshed/contractor build-site -site {{.SITE}} -whatif

  render-secrets:
    desc: "Prove every template renders from 1Password, then wipe what it wrote"
    # It does NOT leave the rendered files behind, and the old description -
    # "Hydrate templates from 1Password" - implied it did. Sterilize runs on
    # every exit including a successful one, so this pulls the secrets, writes
    # them, and removes them again.
    #
    # That is the safeguard working rather than a defect, but the description
    # sent an operator down a path that cannot work: render, then run the phase
    # that needs the rendered files, and find them already gone. Phases now
    # render their own prerequisites in the same process, which is where that
    # need is actually met.
    #
    # What this is still good for is proving the vault resolves and every
    # template substitutes. `task check-inventory` answers the narrower
    # question - do the references resolve - without pulling a single value.
    cmds:
      - task: build
      - ./toolshed/contractor build-site -site {{.SITE}} -phase render

  push:
    desc: "Publish the current branch as GitHub-signed commits"
    # A GitHub App cannot hold a signing key, so GitHub signs on its behalf:
    # a commit created through the Git Data API with an installation token
    # comes back signed with GitHub's own key. See scripts/signedpush.
    #
    # A plain `git push` is refused by the pre-push hook (scripts/security),
    # because it produces unsigned commits. It used to merely be documented,
    # which was not enough - see that command's header.
    cmds:
      - go build -C scripts/signedpush -o ../../toolshed/signedpush .
      - ./toolshed/signedpush {{.CLI_ARGS}}

  # The estate: the Cloudflare account every site stands on, held by the
  # lawyer rather than the contractor. Run with the estate's own 1Password
  # service account exported as OP_SERVICE_ACCOUNT_TOKEN - the lawyer refuses
  # a token that reaches any vault but the estate's. A Ctrl-C reaches tofu and
  # the lawyer waits for it, so these are safe to wrap; demolish-estate is
  # printed rather than run only so that -confirm is typed by a person.
  build-estate:
    desc: "Establish the estate, before any site is built on it"
    cmds:
      - go run -C scripts/lawyer . build-estate

  converge-estate:
    desc: "Apply management/estate/ to the estate that stands"
    cmds:
      - go run -C scripts/lawyer . converge-estate

  demolish-estate:
    desc: "Print the command that tears the estate down, once no site stands"
    cmds:
      - 'echo "go run -C scripts/lawyer . demolish-estate -confirm"'

  survey:
    desc: "Probe every overlay peer from here and report this host's row"
    # Must run on a member of the overlay - the workstation deliberately is
    # not one, so this is for the hypervisors. It reports one row of the
    # reachability matrix; run it on each member and the rows assemble into
    # the whole, which is what localises a fault to a single host.
    #
    # Exits non-zero when a peer is registered and does not answer. That is
    # the condition the vendor's console, the daemon's own service status and
    # this estate's health gate were all unable to report.
    cmds:
      - go build -C scripts/contractor -o ../../toolshed/contractor .
      - ./toolshed/contractor survey {{.CLI_ARGS}}

  enforce-merge:
    desc: "Refuse a merge commit signedpush could not publish (commit-msg hook)"
    # Wired into commit-msg rather than offered as advice, for the same reason
    # enforce-push is: knowing the rule was not enough. signedpush already
    # refuses a merge at push time and says to rebase, and that refusal arrives
    # after the tests have run on the commit and when clearing it costs a
    # rebase, a recreated ref and a closed pull request (#260).
    #
    # commit-msg, not pre-commit: git does not run pre-commit for a merge at
    # all, so a guard there would miss the case entirely.
    cmds:
      - go build -C scripts/superintendent -o ../../toolshed/superintendent .
      - ./toolshed/superintendent enforce-merge

  enforce-push:
    desc: "Refuse a plain git push that would update a branch (pre-push hook)"
    # Wired into the pre-push hook rather than offered as advice. `git push`
    # producing unsigned commits was documented and it was not enough - a
    # session did it twice before anyone noticed, and non_fast_forward means
    # such a commit cannot be repaired afterwards by anybody.
    #
    # Not internal: pre-commit invokes it as a command, so `task` must be
    # willing to run it from the CLI.
    cmds:
      - go build -C scripts/superintendent -o ../../toolshed/superintendent .
      - ./toolshed/superintendent enforce-push

  delivery-guard:
    desc: "Refuse a commit while an unapproved third-party hook is installed (pre-commit)"
    # Default deny, at the point of execution rather than in CI.
    #
    # A test that notices an undeclared hook afterwards is archaeology: by then
    # the code has run on the machine holding the vault session. This runs
    # first, before any hook does its work, and stops the commit.
    #
    # It also answers the question the test cannot. Nothing in the repository
    # can see what is actually installed - pre-commit clones into
    # ~/.cache/pre-commit under generated names, so an eighth repository there
    # looks exactly like the seven that belong, and finding out meant somebody
    # noticing a strange directory and knowing how pre-commit names things.
    #
    # Not internal: pre-commit invokes it as a command.
    cmds:
      - go build -C scripts/security -o ../../toolshed/security .
      - ./toolshed/security guard-deliveries

  egress-guard:
    desc: "Refuse a workflow job whose outbound reach is not what the suppliers list declares"
    # scripts/approved-suppliers.yml owns which job may call out and to what.
    # The workflows carry a copy because harden-runner reads its policy in a
    # pre-step, before any step of the job runs, so nothing in the repository
    # can hand it a value at runtime. This is what makes the copy trustworthy.
    #
    # It walks every job in every workflow rather than a list of them: a job
    # that is not declared is refused, so a new one starts with no egress
    # instead of with an allowlist nobody examined.
    cmds:
      - go build -C scripts/security -o ../../toolshed/security .
      - ./toolshed/security guard-egress

  clear-branches:
    desc: "List local branches whose work has landed. Add -- -apply to delete them."
    # A dry run by default, and the deletion it eventually does is recoverable:
    # `git branch -D` leaves the commits in the reflog for ninety days, and the
    # sha of each is printed so restoring one needs nothing looked up.
    #
    #   task clear-branches            say what would go
    #   task clear-branches -- -apply  take them away
    #
    # It also runs by itself after every pull, from githooks/post-merge, in a
    # quieter mode that only takes local branches. It used to be run by hand
    # only, on the theory that a person would run it when the branch picker got
    # annoying; the picker got annoying and nobody did. Branches on GitHub are
    # only ever taken with an explicit -remote:
    #
    #   task clear-branches -- -apply -remote
    cmds:
      - go build -C scripts/sweeper -o ../../toolshed/sweeper .
      - ./toolshed/sweeper clear-branches {{.CLI_ARGS}}

  gh-token:
    desc: "Mint a 1-hour GitHub App installation token (for gh auth login --with-token)"
    cmds:
      - go build -C scripts/signedpush -o ../../toolshed/signedpush .
      - ./toolshed/signedpush -token

  check-inventory:
    desc: "Prove every op:// reference in the config template resolves (no values read)"
    # Safe to wrap, and the safest thing here: it writes nothing at all - no
    # rendered config, no secrets on disk, nothing for `clean-secrets` to
    # remove - so an interrupted run leaves the workspace exactly as it found
    # it. Run it after editing the template or the vault.
    cmds:
      - task: build
      - ./toolshed/contractor check-inventory -site {{.SITE}}

  verify:
    desc: "Check the network path to the hypervisor and the SDN gateway"
    cmds:
      - task: build
      - ./toolshed/contractor build-site -site {{.SITE}} -phase verify

  configure-hypervisor:
    desc: "Ansible: Proxmox repos, Tailscale, RBAC, SDN. Safe to re-run."
    cmds:
      - task: build
      - ./toolshed/contractor build-site -site {{.SITE}} -phase hypervisor

  check-hypervisor:
    desc: "Dry-run the playbook: show what would change, change nothing"
    # Through the contractor, not beside it.
    #
    # This was a bare ansible-playbook line, so it reached none of the
    # program's preconditions - and with no inventory.yml, which is the NORMAL
    # state of this workspace because Sterilize wipes it on every exit, it
    # matched no hosts, skipped the play, printed an empty recap and exited 0
    # (#322).
    #
    # A dry run that examined nothing is indistinguishable from a dry run that
    # found nothing to change, on the one command an operator uses specifically
    # to gain confidence before touching a hypervisor. Going through the
    # contractor renders the inventory first, proves the host is reachable, and
    # refuses a play that matched nothing.
    cmds:
      - task: build
      - ./toolshed/contractor build-site -site {{.SITE}} -phase hypervisor -check

  backup-state:
    desc: "Encrypt the current state and push it to Cloudflare R2"
    cmds:
      - task: build
      - ./toolshed/contractor build-site -site {{.SITE}} -phase backup

  apply-patches:
    desc: "Apply every outstanding handover patch, or none of them"
    # The agent cannot write .github/workflows/, so a workflow change arrives as
    # a patch and somebody has to apply it. That was a hand-typed loop in a pull
    # request body, and it cost the operator two failed pushes and a divergent
    # branch across one afternoon: a patch was renamed between the instruction
    # being written and being run, the chain half-applied, and the tree ended up
    # in a state neither side could see.
    #
    # ALL OR NONE. The whole point. `git apply --index` on a chain with `&&`
    # stops at the first failure and leaves whatever already applied staged -
    # which is the worst outcome, because it looks finished. This checks every
    # patch applies BEFORE applying any, so the tree is either untouched or
    # fully patched.
    #
    # It deliberately does not commit or push. What the change says and when it
    # goes out are the operator's, and a verb that committed on their behalf
    # would be the agent reaching through the boundary the patches exist for.
    cmds:
      - |
        set -euo pipefail
        shopt -s nullglob
        patches=(.github/patches/*.patch)
        if [ ${#patches[@]} -eq 0 ]; then
          echo "no patches outstanding - nothing to apply"
          exit 0
        fi

        # A dirty tree is how the last one went wrong: a half-applied patch from
        # a previous attempt is indistinguishable from work in progress, and
        # applying over it produces a tree nobody can reason about.
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "the working tree has uncommitted changes, so this is refused." >&2
          echo >&2
          echo "A patch applied over an edited tree cannot be told apart from one" >&2
          echo "applied twice. Commit what you have, or discard it with:" >&2
          echo >&2
          echo "    git reset --hard @{upstream}" >&2
          exit 1
        fi

        echo "checking ${#patches[@]} patch(es) apply before touching anything"
        for p in "${patches[@]}"; do
          if ! git apply --check "$p"; then
            echo >&2
            echo "$p does not apply, so NOTHING has been applied." >&2
            echo >&2
            echo "The likeliest cause is that this checkout is behind. Try:" >&2
            echo >&2
            echo "    git fetch origin && git reset --hard @{upstream}" >&2
            exit 1
          fi
        done

        for p in "${patches[@]}"; do
          git apply --index "$p"
          git rm -q "$p"
          echo "  applied and removed $(basename "$p")"
        done

        echo
        echo "${#patches[@]} patch(es) applied and staged. Nothing is committed."
        echo "Read the diff, then commit and push as you would any change:"
        echo
        echo "    git diff --cached"

  order-deliveries:
    desc: "Order scripts/deliveries.lock from the versions in versions.env, then have security check it"
    # Every tool this estate installs that has no lockfile of its own ecosystem,
    # pinned by version AND by SHA256 (#416). For a Python tool that is its
    # whole dependency closure - a version pin alone fixes the tool and lets
    # over a hundred packages float; for a fetched file it is the file itself.
    #
    # Versions are decided in scripts/versions.env and nowhere else. How each
    # tool is delivered is the pypi: or fetch: field on its tools: entry in
    # scripts/approved-suppliers.yml. Run this after changing either, and
    # commit the result.
    #
    # Two programs, on purpose. Procurement orders - it writes the lock and
    # decides nothing else. Security then refuses a lock that disagrees with
    # the declarations, the same check every commit and the Format lane run,
    # so a lock this writes is one security has already accepted.
    #
    # Needs python3 with pip, and network access to PyPI and to each fetch:
    # address. It installs nothing: pip resolves with --dry-run for each
    # interpreter the lock serves, and each fetched file is only hashed.
    cmds:
      - go run -C scripts/procurement . order
      - go run -C scripts/security . guard-deliveries -before-install

  render-flux-digests:
    desc: "Re-resolve Flux's controller digests from the tags the manifest carries"
    cmds:
      # The step an upgrade used to leave to somebody remembering.
      #
      # `gotk-components.yaml` is generated by `flux bootstrap` and ships its
      # controllers pinned by TAG. The kustomization beside it replaces each tag
      # with a digest, and those digests were resolved by hand. Nothing
      # re-resolved them on an upgrade (#104).
      #
      # The failure is silent and it is a wrong answer rather than an error. The
      # transformer matches on image NAME, not tag, so after a bump it keeps
      # applying the OLD digests to the new manifest: the cluster runs the
      # previous controllers while git says it was upgraded. `task validate`
      # passes because the overlay still builds, and the suppliers test passes
      # because every image is pinned. Both checks are satisfied by a wrong
      # answer, and an operator debugging a controller is reading release notes
      # for a version that is not deployed.
      #
      # Fires on EVERY upgrade unless someone remembers, and the two files that
      # must change together live in different formats and are edited by
      # different mechanisms - one generated by a CLI, one hand-written.
      #
      # Read from gotk-components.yaml rather than from a list here, so a fifth
      # controller is picked up by existing.
      - |
        set -euo pipefail
        for tool in jq curl; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo "$tool is not installed. Run ./scripts/install-dependencies.sh" >&2
            exit 1
          fi
        done
        components=clusters/management/flux-system/gotk-components.yaml
        kustomization=clusters/management/flux-system/kustomization.yaml
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT

        images=$(grep -oE 'ghcr\.io/fluxcd/[a-z-]+:v[0-9.]+' "$components" | sort -u)
        if [ -z "$images" ]; then
          echo "no fluxcd controller images found in $components - the manifest's shape has changed" >&2
          exit 1
        fi

        printf 'images:\n' > "$tmp"
        while read -r image; do
          repo=${image%%:*}
          tag=${image##*:}
          path=${repo#ghcr.io/}
          echo "  -> resolving $repo:$tag" >&2
          token=$(curl -sSfL "https://ghcr.io/token?scope=repository:${path}:pull&service=ghcr.io" | jq -r .token)
          digest=$(curl -sSfI \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${path}/manifests/${tag}" \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          if [ -z "$digest" ]; then
            echo "could not resolve a digest for ${repo}:${tag}" >&2
            exit 1
          fi
          printf '  - name: %s\n    digest: %s\n' "$repo" "$digest" >> "$tmp"
        done <<< "$images"

        # Replace the images: block, leaving everything around it - including
        # the paragraphs explaining why the pin is here - untouched.
        awk -v repl="$tmp" '
          /^images:/ { while ((getline line < repl) > 0) print line; close(repl); skip=1; next }
          skip && /^[ ]*-/ { next }
          skip && /^[ ]/   { next }
          { skip=0; print }
        ' "$kustomization" > "${kustomization}.new"
        mv "${kustomization}.new" "$kustomization"
        echo "resolved $(echo "$images" | wc -l) digest(s) into $kustomization"

  render-cni:
    desc: "Re-render the committed Cilium manifest from the pinned chart version"
    cmds:
      # The manifest is generated and committed, so its image digests are
      # reviewable and suppliers_test.go can read them. That only holds while
      # anyone can reproduce it, so the render is a verb rather than a note
      # telling the next person which helm flags were used.
      #
      # tests/go/repo/cni_test.go checks the committed file against
      # CILIUM_VERSION, and checks the image tags rather than only the header -
      # a comment can be edited, a tag cannot be without changing what deploys.
      - |
        set -euo pipefail
        if ! command -v helm >/dev/null 2>&1; then
          echo "helm is not installed. Run ./scripts/install-dependencies.sh" >&2
          exit 1
        fi
        # shellcheck source=scripts/versions.env
        . ./scripts/versions.env
        values=clusters/bootstrap/cilium-values.yaml
        out=clusters/bootstrap/cilium.yaml
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        {
          echo "# Generated by \`task render-cni\`. Do not edit this file."
          echo "#"
          echo "# chart: cilium ${CILIUM_VERSION} from https://helm.cilium.io"
          echo "# values: ${values}"
          echo "#"
          echo "# Committed rather than fetched at apply time so the image digests are"
          echo "# reviewable here and the supplier guard can read them. Re-render with"
          echo "# \`task render-cni\` after changing the values or the pinned version."
          helm template cilium cilium \
            --repo https://helm.cilium.io \
            --version "${CILIUM_VERSION}" \
            --namespace kube-system \
            --values "${values}"
        } >"$tmp"
        mv "$tmp" "$out"
        trap - EXIT
        echo "rendered cilium ${CILIUM_VERSION} -> ${out}"

  fix:
    desc: "Format everything. Seconds, no Docker. Run this before you push."
    cmds:
      # The same hooks CI's Format lane runs, at the same pinned versions, and
      # they correct the file rather than complaining about it.
      - pre-commit run --all-files

  validate:
    desc: "Prove the code resolves: tofu validate and a kustomize build"
    cmds:
      # What CI's Validate lane does, minus kubeconform - which needs one more
      # binary and catches a class of error (a placeholder in a typed field)
      # that a build failure here would have caught first anyway.
      # TF_VAR_config_path, not a -var flag: `tofu validate` does not accept
      # -var. It points at the placeholder file rather than the Render phase's
      # output, so this task cannot disturb an ignition run happening in
      # another terminal - which it used to, by deleting that output.
      - bash .github/scripts/placeholder-config.sh
      - tofu -chdir=management/cluster init -backend=false -input=false
      - TF_VAR_config_path=../../config/management.placeholder.json tofu -chdir=management/cluster validate
      # The estate's root, validated against its test fixture: it reads none
      # of a site's config, so the placeholder above means nothing to it.
      - tofu -chdir=management/estate init -backend=false -input=false
      - TF_VAR_config_path=./tests/fixtures/valid.json tofu -chdir=management/estate validate
      - kubectl kustomize clusters/management/infrastructure/controllers > /dev/null
      - kubectl kustomize clusters/management/infrastructure/configs > /dev/null
      # flux-system was absent here, which is how its components stayed tag
      # pinned unnoticed. It carries an image transformer now, and a
      # transformer that does not build is a pin that silently is not applied.
      - kubectl kustomize clusters/management/flux-system > /dev/null
      # The workload tier. Empty overlays still have to build: an environment
      # with nothing in it is a valid state, and a kustomization that does not
      # parse is not.
      - kubectl kustomize environments/staging/applications > /dev/null
      - kubectl kustomize environments/production/applications > /dev/null
      - rm -f config/management.placeholder.json
      # Every Go module under scripts/, discovered rather than listed.
      #
      # It was a hand-written list, and clerk and inspector were never on it -
      # nor on test:go's, nor on the coverage gate's. Neither was vetted, built
      # or run by anything, locally or in CI, for its whole life. Every guard
      # written for the clerk had therefore only ever passed in the terminal
      # that wrote it.
      #
      # A module is created by making a directory with a go.mod in it, and
      # nothing about that act suggests three lists elsewhere need editing. So
      # the lists are gone: this finds the modules, and a new one is covered
      # the moment it exists.
      - |
        for dir in scripts/*/; do
          [ -f "$dir/go.mod" ] || continue
          echo "  -> vet and build ${dir%/}"
          go vet -C "$dir" ./...
          go build -C "$dir" -o /dev/null .
        done
      # Who may call out, and to what. One entry per job in
      # scripts/approved-suppliers.yml, and a job that is not there is refused.
      - task: egress-guard
      # Every tier, not just the untagged one. The integration, api and e2e
      # tiers are build-tagged, so a bare `go vet ./...` does not compile them
      # at all - a change to a shared struct can break them and still pass
      # locally, which is exactly how a broken api tier reached CI once.
      - go vet -C tests/go ./...
      - go vet -C tests/go -tags=api ./...
      - go vet -C tests/go -tags=integration ./...
      - go vet -C tests/go -tags=e2e ./...

  test:
    desc: "Every hermetic test: Go, OpenTofu and JS/TS. No credentials needed."
    # `validate` proves the code resolves. This proves it behaves. They were
    # one task until the test tiers arrived; splitting them keeps each check
    # with exactly one owner, and means a failure tells you which kind of
    # wrong it is without reading the log.
    #
    # Everything here is hermetic: no 1Password, no hypervisor, no network
    # beyond a module download. The tiers that need a real estate are
    # test:integration, test:api and test:e2e below, and none of them runs
    # unless you ask for it by name.
    cmds:
      - task: test:go
      - task: test:tofu
      - task: test:repo
      - task: test:js

  test:go:
    desc: "Go unit and contract tests for the ignition button and the push tools"
    cmds:
      # Discovered, not listed - see the note in `validate`.
      - |
        for dir in scripts/*/; do
          [ -f "$dir/go.mod" ] || continue
          go test -C "$dir" ./...
        done

  test:tofu:
    desc: "OpenTofu unit tests: each root's invariants against fixture configs"
    # Fixture configs, never the real rendered one, so this needs no secrets
    # and is safe to run at any time. init is required before test and is a
    # no-op once .terraform exists.
    cmds:
      - tofu -chdir=management/cluster init -backend=false -input=false
      - tofu -chdir=management/cluster test
      - tofu -chdir=management/estate init -backend=false -input=false
      - tofu -chdir=management/estate test

  test:repo:
    desc: "Repository invariants: config keys that are silently declared twice"
    # Untagged, so `./...` picks up only the hermetic tests in tests/go - the
    # integration, api and e2e tiers all carry a build tag and are not
    # compiled by this at all.
    cmds:
      - go test -C tests/go ./...

  test:js:
    desc: "Vitest unit tests, plus a TypeScript typecheck"
    # Self-skipping rather than failing: Node is optional on a workstation
    # that only ever touches the OpenTofu and Go tiers, and a missing
    # toolchain should not turn `task test` red for someone who does not need
    # it. CI always has it, so the lane there always runs.
    cmds:
      - |
        if [ ! -d node_modules ]; then
          if command -v pnpm >/dev/null 2>&1; then
            echo "  -> installing JS dependencies"
            pnpm install --frozen-lockfile
          else
            echo "  [skip] pnpm not found - skipping the JS/TS tier."
            echo "         Install it with ./scripts/install-dependencies.sh"
            exit 0
          fi
        fi
        pnpm typecheck
        pnpm test

  test:coverage:
    desc: "Run the tests with coverage and check it against the committed floor"
    cmds:
      # One floor per module, and the modules are discovered.
      #
      # This measured scripts/contractor alone, so six of the seven Go modules
      # had no coverage floor at all - including two that no task even ran. A
      # single "go" number also could not say which module had lost its tests.
      #
      # The gate refuses a key it has no baseline for, so a new module fails
      # here until somebody writes its floor into tests/coverage-baseline.json.
      # That is deliberate: the file's own reasoning is that a floor should
      # record a decision rather than whatever the last green run happened to
      # hit, and a number nobody chose is not a decision.
      - |
        for dir in scripts/*/; do
          [ -f "$dir/go.mod" ] || continue
          module="$(basename "$dir")"
          go test -C "$dir" -covermode=atomic -coverprofile=coverage-go.out ./...
          pct="$(go -C "$dir" tool cover -func=coverage-go.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')"
          bash scripts/coverage-gate.sh "go/$module" "$pct"
        done
      # tests/go, measured over its HELPERS only.
      #
      # That module was the one deliberately outside the regime, and the
      # reasoning was sound as far as it went: measuring how thoroughly the
      # tests test themselves is a number with no meaning. True of a test
      # FUNCTION - nothing calls it but the runner, so its statements are
      # either executed or the test did not run.
      #
      # It is not true of the rest of the module (#287). tests/go also holds
      # helpers with real logic that decide what the guards CONCLUDE, and a bug
      # in one of those makes a guard wrong rather than absent - which is worse,
      # because it looks green. duplicates.go is a hundred lines of YAML and
      # JSON parsing; harness/ decides what a site's control plane IP is and
      # whether state is readable. Every one of those has been wrong at least
      # once.
      #
      # So the split is by file rather than by module: non-_test.go files get a
      # floor like any other code, and test functions stay excluded for the
      # reason already written down. The profile is filtered rather than the
      # package, because they share one.
      - |
        go test -C tests/go -covermode=atomic -coverprofile=coverage-go.out ./...
        pct="$(awk '!/^mode:/ {
          split($1, a, ":")
          if (a[1] !~ /_test\.go$/) { total += $2; if ($3 > 0) covered += $2 }
        } END { if (total) printf "%.1f", 100 * covered / total; else print "0" }' tests/go/coverage-go.out)"
        bash scripts/coverage-gate.sh "go/tests-helpers" "$pct"
      - |
        if [ -d node_modules ]; then
          pnpm test:coverage
          # v8 reports "Unknown" rather than a number when there is nothing
          # to instrument, which is the honest answer while this tier has no
          # application code under it. Coerce it to 0 so the gate compares a
          # number against the 0 baseline instead of failing to parse.
          pct="$(node -e 'const p=require("./coverage/js/coverage-summary.json").total.statements.pct;console.log(Number.isFinite(p)?p:0)' 2>/dev/null || echo 0)"
          bash scripts/coverage-gate.sh js "$pct"
        else
          echo "  [skip] no node_modules - skipping JS coverage"
        fi

  test:fuzz:
    desc: "Fuzz every target for a bounded time. Slow; `task test` runs their seeds."
    # `go test` already runs each fuzz target against its committed seed corpus,
    # so the ordinary suite exercises them on every run and a failing input found
    # here becomes a seed that fails forever after. This verb is the other half:
    # it generates new input.
    #
    # One target at a time is a Go limitation, not a choice - `-fuzz` takes a
    # single pattern - so this sweeps them. FUZZTIME is per target.
    #
    # Deliberately not in `task test` and not in CI. Fuzzing is unbounded work
    # with a time budget, and a lane whose result depends on how long it ran is
    # a lane that fails for reasons unrelated to the change.
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - |
        for dir in scripts/*/ tests/go; do
          dir="${dir%/}"
          [ -f "$dir/go.mod" ] || continue
          grep -rlE "^func Fuzz[A-Za-z0-9_]+\\(" "$dir" --include='*_test.go' | while read -r file; do
            pkg="./$(realpath --relative-to="$dir" "$(dirname "$file")")"
            [ "$pkg" = "./." ] && pkg="."
            grep -oE "^func Fuzz[A-Za-z0-9_]+" "$file" | sed 's/^func //' | while read -r target; do
              echo "  -> $dir $pkg $target ({{.FUZZTIME}})"
              go test -C "$dir" -run "$target" -fuzz "$target" -fuzztime {{.FUZZTIME}} "$pkg"
            done
          done
        done

  test:integration:
    desc: "Read-only checks against a real, already-built estate. Needs secrets."
    # Reads the same rendered config the start button reads, so rendering it
    # is the setup step and clean-secrets is the teardown. Creates nothing and
    # destroys nothing - see tests/README.md for the tier boundaries.
    cmds:
      - go test -C tests/go -tags=integration -timeout 20m -v ./integration/...

  test:api:
    desc: "Contract checks against the live vendor APIs. Needs secrets."
    cmds:
      - go test -C tests/go -tags=api -timeout 10m -v ./api/...
      - |
        if [ -n "${HOMELAB_BASE_URL:-}" ] && [ -d node_modules ]; then
          pnpm test:api
        else
          echo "  [skip] HOMELAB_BASE_URL unset - no HTTP service to check yet"
        fi

  test:e2e:
    desc: "DESTRUCTIVE. Builds an estate from nothing and tears it down again."
    # Three gates, and this task passes none of them for you: the build tag is
    # here, but HOMELAB_TEST_SITE and HOMELAB_E2E_CONFIRM must be set by hand,
    # to the same disposable site. See tests/go/e2e/ignition_test.go.
    cmds:
      - go test -C tests/go -tags=e2e -timeout 90m -v ./e2e/...

  lint:
    desc: "The slow analysis lane, locally: checkov, hadolint, zizmor, codespell"
    # The same four tools the pull request lanes run, from the same pins in
    # scripts/versions.env, installed by ./scripts/install-dependencies.sh.
    #
    # This used to be one container running thirty checks behind one status.
    # It hung intermittently for its whole timeout, three times in two days,
    # and each hang blocked whatever pull request was in flight - so the
    # aggregate went and its checks were re-homed one by one (#365). Running
    # the tools directly also means a failure names the tool that failed.
    cmds:
      # Policy scanning. Configuration is .checkov.yaml at the root, found
      # automatically, and every exclusion in it carries its reasoning.
      - checkov --directory . --quiet --compact
      # Every Dockerfile this estate builds, discovered rather than listed.
      - git ls-files '*Dockerfile' '*/Dockerfile' | xargs -r hadolint
      # The workflows, which are the part of this repository holding a token.
      - zizmor .github/workflows
      # Prose and code alike.
      - codespell

  destroy:
    desc: "Builds the contractor, then tells you how to tear a site down - see comment"
    # Same shape as `start`, and for the same reason: this reaches real
    # infrastructure, and `task` intercepts Ctrl-C without proxying it to the
    # process it supervises (go-task/task#1408). An interrupted destroy that
    # never received the signal cannot wait for tofu to release its state
    # lock, which is precisely how a half-finished teardown turns into VMs
    # nothing is tracking. Every other contractor-wrapped task here is safe to
    # exec directly because none of them can reach real infrastructure; this
    # one can, so it prints the command instead of running it.
    cmds:
      - task: build
      - 'echo "Built. Run directly so Ctrl-C can wait for tofu to release its lock:"'
      - 'echo "  ./toolshed/contractor demolish-site -site {{.SITE}} -confirm {{.SITE}}"'
      - 'echo ""'
      - 'echo "Add -whatif first if you want to see what that would do."'

  kubeconfig:
    desc: "Write this site's kubeconfig into the workspace, for looking at the cluster"
    # Safe to wrap, like every other build-site task except start and destroy: it
    # reads one tofu output and writes one file, and can no more reach the
    # Compute phase than `render` can. An interrupted run leaves a credential
    # on disk at worst, which `task clean-secrets` removes.
    cmds:
      - task: build
      - ./toolshed/contractor kubeconfig -site {{.SITE}}

  kubectl:
    desc: "Run a command against this site with a kubeconfig that lives only that long"
    # The form to reach for. `task kubeconfig` leaves a live credential in the
    # workspace until `task clean-secrets` removes it; this one never writes
    # into the repository and removes the file on every exit path.
    #   task kubectl SITE=site0 -- kubectl -n arc-runners get pods
    #
    # THE SETUP COST IS PER INVOCATION, NOT PER COMMAND. Each run renders the
    # config from the vault, waits for the state database, initialises the
    # backend, reads one output and wipes all of it again - ten seconds or so,
    # for a command that takes under one. Several questions belong in one call:
    #   task kubectl SITE=site0 -- bash -c 'kubectl get nodes -o wide; kubectl get ds -A'
    # Repeating the single-command form is what makes the safe path tedious, and
    # a tedious safe path is pressure towards `task kubeconfig`, which is the
    # one that leaves a credential lying around.
    cmds:
      - task: build
      - ./toolshed/contractor kubeconfig -site {{.SITE}} -- {{.CLI_ARGS}}

  talosctl:
    desc: "Run talosctl against this site with a talosconfig that lives only that long"
    # Talos has no shell, so this is the only way to see what a node's own
    # network is doing - an interface list, an extension service's state, the
    # routing table. The credential authenticates to Talos rather than to
    # Kubernetes and can reboot or reset a machine, so there is deliberately no
    # form that leaves it on disk.
    #   task talosctl SITE=site0 -- talosctl etcd status
    #
    # No -n: the rendered credential names the control planes as both its
    # endpoints and its nodes, so the quorum commands work with no flags. A
    # worker still needs an explicit -n, because a default that included them
    # would make every etcd command answer three times and error twice.
    #
    # Same per-invocation setup cost as `task kubectl` above, and the same
    # answer: put several questions in one call rather than paying for each.
    cmds:
      - task: build
      - ./toolshed/contractor talosconfig -site {{.SITE}} -- {{.CLI_ARGS}}

  clean-secrets:
    desc: "Wipe every rendered secret and the local state file"
    cmds:
      - task: build
      - ./toolshed/contractor build-site -site {{.SITE}} -phase sterilize
