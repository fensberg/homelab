version: "3"

vars:
  # Which site to deploy. Override: task start SITE=site1
  SITE: '{{.SITE | default "site0"}}'

  # Keep this tag in step with the SHA pinned in pr-validation.yml. They are
  # the same release, and the point of running it locally is that it is.
  LINT_IMAGE: ghcr.io/super-linter/super-linter:slim-v8.7.0

# The single entrypoint is scripts/Start-Homelab.ps1. These tasks are thin
# wrappers so the same verbs work from any shell.

tasks:
  start:
    desc: "The start button: render -> tailnet -> hypervisor -> verify -> compute -> cluster -> migrate -> backup -> sterilize"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}}

  plan:
    desc: "Show which phases would run, without running them"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -WhatIfPhase

  render-secrets:
    desc: "Hydrate templates from 1Password"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -Phase Render

  verify:
    desc: "Check the network path to the hypervisor and the SDN gateway"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -Phase Verify

  configure-hypervisor:
    desc: "Ansible: Proxmox repos, Tailscale, RBAC, SDN. Safe to re-run."
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -Phase Hypervisor

  check-hypervisor:
    desc: "Dry-run the playbook: show what would change, change nothing"
    dir: management/hypervisor
    cmds:
      - ansible-playbook -i inventory.yml hypervisor-prep.yml --check --diff

  backup-state:
    desc: "Encrypt the current state and push it to Cloudflare R2"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -Phase Backup

  fix:
    desc: "Format everything. Seconds, no Docker. Run this before you push."
    cmds:
      # The same hooks CI's Format lane runs, at the same pinned versions, and
      # they correct the file rather than complaining about it.
      - pre-commit run --all-files

  validate:
    desc: "Prove the code resolves: tofu validate and a kustomize build"
    cmds:
      # What CI's Validate lane does, minus kubeconform - which needs one more
      # binary and catches a class of error (a placeholder in a typed field)
      # that a build failure here would have caught first anyway.
      - bash .github/scripts/placeholder-config.sh
      - tofu -chdir=management/cluster init -backend=false -input=false
      - tofu -chdir=management/cluster validate
      - kubectl kustomize clusters/management/infrastructure/controllers > /dev/null
      - kubectl kustomize clusters/management/infrastructure/configs > /dev/null
      - rm -f config/management.rendered.json

  lint:
    desc: "The slow analysis lane: checkov, tflint, ansible-lint, shellcheck"
    cmds:
      # Needs Docker and takes a couple of minutes, which is why `fix` and
      # `validate` exist separately - between them they catch most of what
      # this would, in a fraction of the time. Worth running before opening a
      # pull request, not before every commit.
      - >-
        docker run --rm
        -e RUN_LOCAL=true
        -e DEFAULT_BRANCH=main
        --env-file .github/super-linter.vars
        -v "{{.USER_WORKING_DIR}}:/tmp/lint"
        {{.LINT_IMAGE}}

  clean-secrets:
    desc: "Wipe every rendered secret and the local state file"
    cmds:
      - powershell -NoProfile -File ./scripts/Start-Homelab.ps1 -Site {{.SITE}} -Phase Sterilize
