# Cilium's values, and every one of them is here for a reason Talos gives.
#
# `task render-cni` turns this plus the chart version in scripts/versions.env
# into cilium.yaml beside it. Change this file, re-render, commit both.
#
# Sourced from Sidero's own Cilium guide rather than from a blog post:
# https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium

# Talos assigns pod CIDRs through Kubernetes itself, so Cilium takes them from
# the node spec rather than running its own allocator.
ipam:
  mode: kubernetes

# Cilium replaces kube-proxy entirely; talos.tf sets cluster.proxy.disabled to
# match. Both halves have to move together - one without the other leaves two
# things programming service routing on every node.
kubeProxyReplacement: true

# Where the agents find the API server, and the reason this is not the cluster
# endpoint.
#
# Without kube-proxy there is no ClusterIP to reach the API through, because
# nothing implements ClusterIP until Cilium is the thing implementing it. The
# obvious address is the cluster endpoint, which this estate hardcodes to one
# control plane (#316) - pointing every agent at it would turn a known API
# single point of failure into a pod-network one: lose that machine and no node
# has working networking.
#
# KubePrism is Talos's answer: a TCP load balancer on every machine at
# localhost:7445, spread across all control-plane endpoints and health-filtered.
# talos.tf declares it explicitly rather than relying on it being default-on.
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos mounts the cgroup hierarchy itself, so Cilium must be told not to.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos's documented capability sets. A CNI is the node's network, so these are
# wide by nature - which is why the epoch record calls this the most privileged
# delivery in the chart list and says so in as many words.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Hubble is off, and the reason is not that it is unwanted.
#
# `helm template` with Hubble enabled emits real key material: a `cilium-ca`
# Secret carrying `ca.key`, and `hubble-server-certs` carrying `tls.key`. The
# chart labels them `cilium.io/helm-template-non-idempotent: "true"` itself,
# which is Cilium saying out loud that a re-render produces different keys.
#
# Committing that would publish a CA private key to a public repository, and it
# would make the drift check meaningless - every `task render-cni` would show a
# diff that means nothing. gitleaks caught it on the first render, which is the
# guard doing exactly its job.
#
# Hubble is observability and belongs to epoch 04, so this defers rather than
# discards it. Turning it back on means deciding where its certificates come
# from - cert-manager, or Cilium's own cronJob method - rather than baking them
# into git.
hubble:
  enabled: false

# The MTU is pinned rather than detected, because detection reads the wrong
# interface here.
#
# Since v1.17 Cilium takes the LOWEST link MTU on a node and gives it to every
# pod, as veth MTU and route MTU. On these nodes that is `tailscale0` at 1280,
# which has nothing to do with how a pod reaches the internet: pod traffic
# leaves over eth0 at 1450. Measured on a worker - eth0 1450, every lxc device
# 1280 - so every pod was running 170 bytes smaller than its path allows.
#
# That is not only wasteful, it breaks QUIC outright, which is how it was
# found (#455). 1280 minus Cilium's VXLAN overhead leaves 1230, and quic-go
# refuses to start below its 1252-byte initial packet size, so every
# cloudflared QUIC handshake timed out and the tunnel fell back to HTTP/2 -
# which carries no UDP, and so no game server. Cilium tracks this as an open
# regression, cilium/cilium#37529, still unfixed on 1.18; `MTU` is the escape
# hatch its maintainers point at.
#
# 1450 is eth0's own MTU on these VMs, the hypervisor's SDN having taken its
# own 50 bytes already. Cilium subtracts the tunnel overhead itself, so pods
# land at 1400.
#
# THE COST, STATED. Pod traffic that really does route over the tailnet may
# now be fragmented, where before it was sized for that interface. Inside one
# site nothing does: pods reach each other over VXLAN on eth0, and the tailnet
# carries node-to-node and site-to-site traffic instead. A second site would
# make this a real question again.
#
# tests/go/repo/cni_test.go refuses an unpinned MTU while this holds, and
# tests/go/integration asserts the cluster is running the number pinned here.
MTU: 1450
