---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://github.com/fensberg/homelab
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1h0m0s
  path: ./clusters/management
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-vars
  sourceRef:
    kind: GitRepository
    name: flux-system
