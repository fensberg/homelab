---
# Layer 1: operators and controllers. Nothing here depends on a CRD that does
# not already exist, so this reconciles first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/management/infrastructure/controllers
  prune: true
  wait: true
  # etcd's addresses are node addresses, which this repository keeps out of
  # git. OpenTofu writes them into this secret (management/cluster/
  # monitoring.tf) because it is the only thing that knows them, and the
  # monitoring stack's HelmRelease substitutes them in. A fork gets its own
  # addresses by having its own config, not by editing a manifest.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: monitoring-vars
