---
# Layer 3: what runs ON the platform, as opposed to the platform.
#
# Two Kustomizations rather than one, from two sources, because that is what
# makes the promotion path real rather than described. `main` is what staging
# reconciles; a release pinned in releases.yaml is what production reconciles.
# Merging to main changes what the next release will contain, never what
# production is running.
#
# Both depend on infra-configs: a workload that needs a volume needs the
# storage class, and one that needs a database needs the operator that serves
# it. wait:false, though - unlike the layers below, a workload that will not
# become ready is not a reason to hold the whole reconciliation open. It is a
# reason to go and look at that workload.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workloads-staging
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./environments/staging/applications
  prune: true
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workloads-production
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  # The release pinned in releases.yaml. The name stays workloads-production
  # although it now reads one workload's release: its inventory already holds
  # Valheim's objects, and a renamed or second Kustomization would have this
  # one prune them - the world's volume with them.
  sourceRef:
    kind: OCIRepository
    name: valheim
  path: ./environments/production/applications/valheim
  prune: true
  wait: false
