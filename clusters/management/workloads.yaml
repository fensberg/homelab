---
# Layer 3: what runs ON the platform, as opposed to the platform.
#
# Two Kustomizations rather than one, from two sources, because that is what
# makes the promotion path real rather than described. `main` is what staging
# reconciles; a `v*` tag is what production reconciles. Nothing promotes by
# somebody editing a file in production's directory.
#
# Both depend on infra-configs: a workload that needs a volume needs the
# storage class, and one that needs a database needs the operator that serves
# it. wait:false, though - unlike the layers below, a workload that will not
# become ready is not a reason to hold the whole reconciliation open. It is a
# reason to go and look at that workload.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workloads-staging
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./environments/staging/applications
  prune: true
  wait: false
---
# Production tracks tags, and that is the whole gate.
#
# A second GitRepository rather than a second path on the first: the first is
# pinned to a branch, so pointing production at a different directory of the
# same branch would deploy to production every time anything merged. The tag is
# the deliberate act, and it is the operator's - see the epoch log's "Tag v*
# when the change should reach production".
#
# THIS IS NOT READY UNTIL THE FIRST TAG EXISTS, AND THAT IS CORRECT.
# A semver ref with no matching tag reports the source as failed, which reads
# as a red light and is an accurate one: nothing has been released. It is not
# a reason to point production at a branch.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-production
  namespace: flux-system
spec:
  interval: 10m
  ref:
    semver: ">=0.0.0"
  secretRef:
    name: flux-system
  url: ${SOURCE_CONTROL_REPO_URL}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workloads-production
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-production
  path: ./environments/production/applications
  prune: true
  wait: false
