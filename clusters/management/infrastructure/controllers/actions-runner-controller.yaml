---
# Layer 1: the controller that creates and destroys runner pods.
#
# It holds the GitHub App credential and talks to the GitHub API; it never runs
# a workflow itself. The runners it creates live in their own namespace with
# their own copy of the credential - see management/cluster/runner.tf for why
# that separation is the point rather than an accident.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: actions-runner-controller
  namespace: flux-system
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/actions/actions-runner-controller-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set-controller
  namespace: arc-systems
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      # renovate: datasource=docker depName=ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # One controller is right for a homelab management cluster, for the same
    # reason CloudNativePG runs one: it is not in the data path, and a restart
    # pauses reconciliation rather than losing anything. A job already running
    # is unaffected.
    replicaCount: 1

    # Critical, and off the machines holding quorum.
    #
    # This controller is the thing that creates and destroys every runner pod.
    # It was BestEffort, which made it the OOM controller's first choice on a
    # node under memory pressure - and the pressure is caused by builds, which
    # this is the supervisor of. The failure ate its own supervisor (#237).
    #
    # `requiredDuringScheduling`, not `preferred`, for the reason the runner
    # scale set gives at length: a preference puts the pod back on a control
    # plane exactly when the workers are busiest, which is exactly when etcd
    # can least afford the company. Expressed as "no control-plane role"
    # rather than "has a worker label", because the control-plane label is set
    # by Kubernetes itself and needs nothing added - a label we invented would
    # be one more thing that can be missing.
    #
    # Required placement is only safe because of the priority class beside it:
    # if both workers are full, a critical pod evicts a batch one to make room
    # rather than sitting Pending. The two are one decision, not two.
    resources:
      # Requests, no limits - the estate's standing shape. A request is a
      # reservation and a position in the kubelet's eviction ranking; it caps
      # nothing. So a request that is too small costs only ranking, while a
      # limit that is too small kills the process. Sized by judgement, not by
      # measurement: epoch 04 is what replaces these with numbers.
      requests:
        cpu: 50m
        memory: 128Mi
    priorityClassName: critical

    # Require the properties rather than inherit them (#272).
    #
    # Nothing here changes what the pod does today: the image is
    # gcr.io/distroless/static:nonroot with `USER 65532:65532`, so it already
    # runs unprivileged. That is the problem. A property that comes from an
    # image is invisible to this repository - an upstream base-image change
    # takes it away, the pod keeps starting, and nothing anywhere says the
    # property stopped holding. Asserted, the same change fails to start, which
    # is the outcome this estate prefers everywhere: worthless over unreachable,
    # and loud over silently degraded.
    #
    # Both paths were read out of the pinned chart's own values.yaml (0.14.2)
    # and confirmed against templates/deployment.yaml, because a Helm value at
    # a path the chart does not read is accepted in silence. `podSecurityContext`
    # lands on the pod and `securityContext` on the container; both are `{}` by
    # default and both are wrapped in `{{- with }}`, so an empty map renders
    # nothing at all.
    #
    # runAsNonRoot without runAsUser is deliberate. The image already carries a
    # numeric USER, so naming a uid here would be a second declaration of the
    # same fact - and the one that goes stale. This asserts the property and
    # lets the image keep supplying the number.
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    # readOnlyRootFilesystem is the one that turns a hardening into an outage
    # if the process writes anywhere at runtime, so it is set on evidence
    # rather than on principle: the chart mounts an emptyDir at /tmp
    # unconditionally, which exists for exactly one reason, and the image is
    # distroless static holding a single Go binary with no shell to write
    # anything else. If that reading is wrong the Deployment fails visibly
    # within a minute and this is the line to remove first.
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
