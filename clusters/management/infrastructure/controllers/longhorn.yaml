---
# longhorn-system needs pod-security set to privileged: Talos applies its own
# baseline policy by default, which blocks the host-level access Longhorn's
# node daemons require. See docs/epochs for why Longhorn over Ceph/a
# hypervisor-level CSI at this scale - the short version is that Longhorn
# replicates across whichever Kubernetes nodes it schedules to, independent
# of which physical hypervisor they live on, which is what actually matters
# once a second hypervisor exists.
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      # Nothing bumps this automatically today: Dependabot (what this repo
      # actually runs) has no ecosystem for a Flux HelmRelease chart version,
      # only Renovate does. This is a manual version bump until/unless that
      # changes.
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Talos's documented data path for Longhorn, backed by the UserVolumeConfig
    # in talos.tf and the second disk on each node in compute.tf - not the OS
    # disk, which Talos grows to fill with its own state/ephemeral partitions.
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      # Three control-plane nodes today, one hypervisor - two replicas is
      # what the current node count actually supports without every
      # replica landing back on the same underlying disk. Revisit once a
      # second hypervisor exists (see docs/epochs).
      defaultReplicaCount: 2
    persistence:
      defaultClass: true
