---
# The three lanes, as objects the scheduler can act on.
#
# docs/epochs/02-abstraction.md sorts work by how much delay it tolerates
# rather than by how important it is, and gets three lanes: emergency vehicles
# (nothing may delay them), commuters (in a hurry, delay is the whole cost),
# and logistics (important, slow by nature, nobody watches the clock). This
# file is that model in the only form Kubernetes understands.
#
# WHAT A PriorityClass ACTUALLY DECIDES, because it is two things at once:
#
#   `value` decides who gets the next free slot when several pods are pending.
#   `preemptionPolicy` decides whether a pod may EVICT a running pod to make a
#   slot that does not exist yet.
#
# The lanes want different answers to those two questions, which is the whole
# reason this is a table rather than one number. A commuter should get the next
# gap ahead of a truck. A commuter must NOT be able to throw a truck off the
# road twelve minutes into a thirteen-minute run - preempting a long job to
# admit a 40-second one destroys twelve minutes to save two. So
# `preemptionPolicy: Never` is set on lanes 2 and 3, and preemption exists in
# exactly one place: the lane that protects quorum.
#
# WHY NOT `system-cluster-critical` FOR LANE 1, which is what the epoch record's
# table names. Two reasons, and the second is the one that decided it. The
# built-in classes sit at 2000000000, above the kubelet's own static pods, and
# nothing here has a claim on that. And they are a shared, cluster-reserved
# name: putting the estate's own operators in the same class as the API server
# means a future decision about one is a decision about both. Flux's generated
# manifest already sets `system-cluster-critical` on its four controllers and
# that is left alone - it is upstream's call about upstream's components, and
# re-pointing it here would be an edit to a file Flux rewrites on upgrade.
#
# The numbers are round and widely spaced on purpose. Nothing computes with
# them; they only have to sort, and leaving four zeros between lanes means a
# lane can be split later without renumbering the ones either side.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: lane-1-emergency
value: 1000000
# The default, stated rather than omitted: this is the one lane that may evict
# a running pod, and a policy that important should not be inferred from its
# absence.
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: >-
  Emergency vehicles. Everything yields, including traffic already moving.
  The operators that reconcile the estate, and the state database.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: lane-2-commuter
value: 10000
preemptionPolicy: Never
globalDefault: false
description: >-
  Commuters. In a hurry, and queueing is the entire user-visible cost - the
  fast pull request checks, where the job is 40 seconds and the wait is not.
  Jumps the queue ahead of logistics; runs nobody off the road.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: lane-3-logistics
value: 100
preemptionPolicy: Never
globalDefault: false
description: >-
  Logistics. Deliveries and refuse collection: integration runs, converges,
  image builds, state backups. They must arrive; they need not arrive now.
