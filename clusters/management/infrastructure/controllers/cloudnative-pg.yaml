---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 24h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      # renovate: datasource=helm depName=cloudnative-pg registryUrl=https://cloudnative-pg.github.io/charts
      version: "0.23.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      interval: 12h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Single replica is right for a homelab management cluster: the operator
    # is not in the data path, and a restart only pauses reconciliation.
    replicaCount: 1
    monitoring:
      # Turn on once Prometheus exists on this cluster.
      podMonitorEnabled: false

    # Critical, and off the machines holding quorum.
    #
    # This operator manages the state database - the estate's own OpenTofu
    # backend. It was BestEffort (#237), so a memory spike anywhere on its
    # node killed the thing reconciling the record of what the estate is.
    # It is not in the data path, so the database stays up when it dies; what
    # stops is anything that needs the database's shape to change.
    #
    # The operator moves to a worker. The DATABASE does not, and that is not
    # a compromise: its volumes are OpenEBS Local PV Hostpath, which pins each
    # one to the node whose directory it was created on, and moving the pod
    # would not move the data. docs/epochs/02-abstraction.md records why the
    # database is to this estate what etcd is to the cluster.
    #
    # Verified against the pinned chart's own values.yaml (0.23.0), where
    # `resources`, `affinity` and `priorityClassName` are top-level keys read
    # by templates/deployment.yaml. A Helm value at a path the chart does not
    # read is silently ignored, so these paths are checked rather than assumed
    # - tests/go/repo/workload_placement_test.go holds the version they were
    # checked against, and goes red if the chart moves.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    priorityClassName: critical

    # Declare the floor rather than inherit it (#272).
    #
    # This chart is the well-behaved one: 0.23.0 already ships
    # `runAsNonRoot: true`, `allowPrivilegeEscalation: false`,
    # `readOnlyRootFilesystem: true`, uid/gid 10001, RuntimeDefault seccomp
    # and `drop: [ALL]` as its defaults. #272 described these as "partial",
    # having read the values file's layout rather than its values; reading it
    # properly found nothing missing. So none of this hardens anything today.
    #
    # It is written down anyway, and the reason is the difference between a
    # default and a requirement. A chart upgrade that quietly dropped one of
    # these would downgrade this estate with no diff of ours to notice it in -
    # the version bump would look like every other version bump. Restated here,
    # the same upgrade either keeps the property or produces a manifest that
    # visibly disagrees with what we asked for.
    #
    # This is duplication, and duplication normally drifts - which is why the
    # estate pins versions in exactly one file. It is not the same case: these
    # are not values that have to stay in step with the chart's, they are the
    # minimum below which we will not go. The chart is free to exceed them.
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
