---
# Production's Flux source.
#
# Substituted from cluster-vars rather than written literally, so a fork points
# at its own repository by changing its config. gotk-sync.yaml above does carry
# the URL literally, but that file is generated by Flux's bootstrap rather than
# written here.
#
# Declared in this directory because it is substituted: CI builds these through
# kustomize and pipes them through envsubst, and Flux substitutes them again
# through infra-configs' postBuild. The Flux entrypoints beside
# clusters/management/workloads.yaml are validated as raw files, so a
# placeholder there reaches kubeconform verbatim.
#
# Production tracks tags, and that is the whole gate.
#
# A second GitRepository rather than a second path on the first: the first is
# pinned to a branch, so pointing production at a different directory of the
# same branch would deploy to production every time anything merged. The tag is
# the deliberate act, and it is the operator's - see the epoch log's "Tag v*
# when the change should reach production".
#
# THIS IS NOT READY UNTIL THE FIRST TAG EXISTS, AND THAT IS CORRECT.
# A semver ref with no matching tag reports the source as failed, which reads
# as a red light and is an accurate one: nothing has been released. It is not
# a reason to point production at a branch.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-production
  namespace: flux-system
spec:
  interval: 10m
  ref:
    semver: ">=0.0.0"
  secretRef:
    name: flux-system
  url: ${SOURCE_CONTROL_REPO_URL}
