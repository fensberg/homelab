---
# Layer 2: the scale set itself, which needs the controller's CRDs to exist.
#
# Everything constant here is written literally rather than substituted -
# namespaces, the secret name, the scale set name, the runner group. Only the
# organization URL is a ${VAR}, because it is the one value derived from a
# vault secret and so the only one that must not be committed. Flux substitutes
# it at reconcile time from the runner-vars secret OpenTofu writes (see
# management/cluster/runner.tf).
#
# The literals are not free: they restate what management/cluster/variables.tf
# declares. tests/go/repo/runner_test.go asserts the two agree, which is the
# same shape as registry.tf and config.go implementing one contract twice.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: self-hosted
  namespace: arc-runners
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      # renovate: datasource=docker depName=ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The organization, not the repository. That is the scope the App was
    # granted, and a runner group restricted to this repository is what stops
    # the App's reach widening when a second repository joins the estate.
    githubConfigUrl: ${RUNNER_GITHUB_CONFIG_URL}
    # Substituted rather than written literally, unlike everything else here.
    # Two reasons, and the second is the one that decided it: checkov's
    # CKV_SECRET_6 reads `githubConfigSecret: <hyphenated-identifier>` as a
    # base64 high-entropy string and cannot be talked out of it inline; and
    # substituting from the same local that names the secret OpenTofu creates
    # means the two cannot disagree, which is strictly better than a test
    # asserting they agree.
    #
    # Safe to leave undefined in CI: this is a free-form Helm value, so
    # envsubst rendering it empty produces valid YAML that kubeconform accepts.
    # A ${VAR} in metadata.name would not be, which is why the rest are
    # literals.
    githubConfigSecret: ${RUNNER_SECRET_NAME}
    runnerGroup: homelab

    # What `runs-on:` has to say. It must NOT be "self-hosted".
    #
    # That was the original choice, and it does not work. Runners created by a
    # scale set carry only the scale set's name as a label - not the default
    # self-hosted / linux / x64 that a classic runner registers with - while
    # `runs-on: self-hosted` is routed by GitHub's reserved-label matching,
    # which no scale set participates in. The result is a scale set that
    # registers perfectly, a listener that runs for hours, and a job that sits
    # on "Waiting for a runner to pick up this job..." forever, with nothing
    # anywhere reporting an error.
    #
    # Set explicitly rather than inherited from the release name, so renaming
    # the release cannot silently orphan every workflow that targets it.
    # tests/go/repo/runner_test.go asserts this and runs-on still agree, and
    # selfhosted_test.go reads this value rather than hard-coding it, so the
    # pull-request guard cannot come apart from the name it guards.
    runnerScaleSetName: homelab-management

    # Scale to nothing when idle. A runner pod that exists between jobs is a
    # runner pod that can be reached between jobs, and there is no warm-start
    # benefit worth that: the jobs this runs today are minutes long and start
    # with a checkout regardless.
    minRunners: 0
    maxRunners: 2

    # The image the runner runs in.
    #
    # The stock actions-runner image is deliberately minimal - no op, no tofu,
    # no age, no rclone - so `contractor plan` failed at Render with
    # "1Password CLI not found on PATH". .github/runner-image/ layers exactly
    # the binaries the program shells out to, and nothing else.
    #
    # Pinned by digest, not by tag. A tag is a pointer someone can move; the
    # digest is the image. `:latest` exists for humans reading the registry and
    # must never be what a cluster resolves - "pin everything" means the thing
    # that actually runs, and a mutable tag is the one pin that silently is not
    # one. Renovate updates the digest here the same way it updates the chart
    # version above.
    #
    # renovate: datasource=docker depName=ghcr.io/fensberg/homelab-runner
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/fensberg/homelab-runner@sha256:b60c75d13b2e03ccdd183dabcf885a2c0c716266546a9334a7e63c76ae7da612
            command: ["/home/runner/run.sh"]
