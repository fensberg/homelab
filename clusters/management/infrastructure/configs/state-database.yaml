---
# The database that holds OpenTofu state.
#
# ${VAR} placeholders are substituted by Flux at reconcile time from the
# cluster-vars secret that OpenTofu writes (see management/cluster/database.tf).
# Nothing account-specific is committed here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${STATE_DB_CLUSTER}
  namespace: ${STATE_DB_NAMESPACE}
spec:
  instances: 3

  # Named explicitly rather than relying on whichever StorageClass happens to
  # be marked default - see docs/epochs for why Longhorn over Ceph or a
  # hypervisor-level CSI at this scale.
  storage:
    # Four gigabytes for a database whose entire encrypted backup is under
    # 200KB. It was 10Gi, which was not a considered number - and with a
    # replicated storage engine underneath it did not fit: three instances
    # times 10Gi times two replicas exceeded what three 34GB disks could
    # schedule, so the third instance never came up.
    #
    # This is still four orders of magnitude of headroom over the data, which
    # is the point: what actually consumes space here is WAL accumulating
    # between archive runs, and that is bounded by the 7-day retention below
    # plus the nightly check that archiving has not silently stopped.
    size: 4Gi
    storageClass: openebs-hostpath

  bootstrap:
    initdb:
      database: ${STATE_DB_NAME}
      owner: ${STATE_DB_OWNER}
      secret:
        name: ${STATE_DB_CLUSTER}-app

  # Continuous WAL archiving plus base backups to object storage. This is what
  # point-in-time recovery restores from.
  backup:
    # Seven days, not thirty. This database holds OpenTofu state and nothing
    # else - a few hundred kilobytes - but WAL and base backups accumulate in
    # the same bucket as the state dumps, and this prefix is the one that
    # actually grows. A week is a real point-in-time-recovery window: long
    # enough to notice corruption and rewind past it, short enough that
    # storage stays flat. The estate itself is reproducible by re-running
    # ignition, so a longer window buys less here than it would elsewhere.
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://${OBJECT_STORAGE_BUCKET}/postgres
      endpointURL: ${OBJECT_STORAGE_ENDPOINT}
      s3Credentials:
        accessKeyId:
          name: object-storage-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: object-storage-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip

  postgresql:
    parameters:
      # Modest defaults. The state database sees a handful of connections and
      # a few megabytes of data; it does not need tuning for throughput.
      max_connections: "50"
      shared_buffers: "128MB"

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      memory: "512Mi"
---
# A base backup every night. WAL archiving above is continuous, so this only
# bounds how much WAL has to be replayed on restore.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ${STATE_DB_CLUSTER}-nightly
  namespace: ${STATE_DB_NAMESPACE}
spec:
  # Seconds field first: 02:17 every night, off the hour on purpose.
  schedule: "0 17 2 * * *"
  backupOwnerReference: self
  cluster:
    name: ${STATE_DB_CLUSTER}
---
# The workstation runs OpenTofu from outside the cluster, so the primary needs
# to be reachable over the overlay network. CloudNativePG labels whichever pod
# is currently primary, so this Service follows a failover automatically.
apiVersion: v1
kind: Service
metadata:
  name: ${STATE_DB_CLUSTER}-external
  namespace: ${STATE_DB_NAMESPACE}
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: ${STATE_DB_CLUSTER}
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: ${STATE_DB_NODEPORT}
