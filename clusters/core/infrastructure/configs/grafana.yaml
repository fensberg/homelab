---
# Grafana, by its name.
#
# Its route: a request for the name, arriving at the site's private access,
# goes to Grafana. Grafana serves plainly behind the front door and holds no
# certificate; what a device speaks to is the front door, over HTTPS.
#
# WHO THAT IS. A device enrolled with the estate, and nothing else: the name
# is answered only for an enrolled device, the address is reached only
# through the tunnel, and who may enroll is the estate's member list.
# Grafana asks for no login of its own, which is why its name must never be
# given a public record.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: private-access
      namespace: traefik
      sectionName: grafana
  hostnames:
    - ${NAME_GRAFANA}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
