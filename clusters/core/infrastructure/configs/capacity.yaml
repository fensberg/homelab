---
# How full the site is, and who is not using what they hold.
#
# The site runs lean: work that cannot wait must fit in what the workers
# hold with one of them gone, and everything else runs in whatever is free.
# Nothing here caps a total. What limits the site is what the machines can
# actually do, and these rules are how that is seen.
#
# WHO MUST FIT. Everything on a worker that is not `batch`. Work that can
# wait is not counted against capacity at all: it may be stopped to give
# memory back and is retried, so it is never a reason there is no room.
#
# WHY NOT THE STACK'S OWN OVERCOMMIT ALERT. It asks the same question of
# every machine and every pod. Here the control planes are not where work
# goes, and work that can wait is not owed room, so its answer is about a
# site this is not.
#
# WHAT IS RECORDED AND WHY. Each namespace's reservation beside what it is
# using, kept as series of their own. The gap between them, hour by hour, is
# the pattern idle capacity is to be lent by - and a pattern is only known
# once it has been watched, so the watching starts here.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: capacity
  namespace: monitoring
spec:
  groups:
    - name: capacity.recorded
      interval: 1m
      rules:
        # What the workers hold, and what they hold with the largest gone.
        #
        # A WORKER HERE IS ONE WORK THAT CANNOT WAIT MAY LAND ON. A machine in
        # an untrusted zone is kept for what is sent to it by name and takes
        # nothing else, so its room is not room the site's own work has: it
        # is left out of what the workers hold, and what runs on it is left
        # out of what they are asked for.
        - record: site:workers_allocatable_memory_bytes
          expr: >-
            sum(kube_node_status_allocatable{resource="memory"}
            unless on (node) kube_node_role{role="control-plane"}
            unless on (node) kube_node_spec_taint{key="untrusted-zone"})
        - record: site:workers_allocatable_memory_bytes:one_gone
          expr: >-
            sum(kube_node_status_allocatable{resource="memory"}
            unless on (node) kube_node_role{role="control-plane"}
            unless on (node) kube_node_spec_taint{key="untrusted-zone"})
            -
            max(kube_node_status_allocatable{resource="memory"}
            unless on (node) kube_node_role{role="control-plane"}
            unless on (node) kube_node_spec_taint{key="untrusted-zone"})

        # What work that cannot wait reserves on the workers: every running
        # pod there whose priority is not batch.
        - record: site:must_run_reserved_memory_bytes
          expr: >-
            sum(
              (kube_pod_container_resource_requests{resource="memory"}
               unless on (node) kube_node_role{role="control-plane"}
               unless on (node) kube_node_spec_taint{key="untrusted-zone"})
              * on (namespace, pod) group_left ()
              max by (namespace, pod) (kube_pod_info{priority_class!="batch"})
              * on (namespace, pod) group_left ()
              max by (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1)
            )

        # Each namespace: what it reserves, what it uses, and what it holds
        # and is not using. The last is what could be lent.
        - record: namespace:reserved_memory_bytes
          expr: >-
            sum by (namespace) (
              kube_pod_container_resource_requests{resource="memory"}
              * on (namespace, pod) group_left ()
              max by (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1)
            )
        - record: namespace:used_memory_bytes
          expr: >-
            sum by (namespace) (
              container_memory_working_set_bytes{container!="", container!="POD"}
            )
        - record: namespace:idle_reserved_memory_bytes
          expr: >-
            clamp_min(
              namespace:reserved_memory_bytes
              - on (namespace) namespace:used_memory_bytes,
              0
            )

    # Where a write's time goes, layer by layer (criterion 34).
    #
    # Every machine and the hypervisor already count how long their disks
    # spend on writes and on making a write safe, and nothing read it: why
    # etcd's writes are slow was looked for with three commands run by hand
    # on the hypervisor while the answer, as far as averages go, was here.
    # These keep it as a figure for each disk at each layer - the job says
    # which: a machine's own disk, or the hypervisor's drives and the
    # volumes it makes of them - beside what etcd itself saw.
    #
    # THEY ARE AVERAGES, AND THAT IS THEIR LIMIT. A disk counts the time it
    # spent and how many operations, not how long each took. Read on site0
    # on 2026-10-11: a drive makes a write safe in a millisecond and a half,
    # a machine's disk in under three, and the slowest hundredth of etcd's
    # writes take fourteen. So the usual case is accounted for at every
    # layer and the worst case at none. Placing that needs each layer to
    # keep how long each operation took, which nothing on the site does yet.
    - name: delay.recorded
      interval: 1m
      rules:
        - record: disk:write_seconds
          expr: >-
            rate(node_disk_write_time_seconds_total[5m])
            / (rate(node_disk_writes_completed_total[5m]) > 0)
        - record: disk:made_safe_seconds
          expr: >-
            rate(node_disk_flush_requests_time_seconds_total[5m])
            / (rate(node_disk_flush_requests_total[5m]) > 0)
        - record: etcd:log_write_seconds
          expr: >-
            sum by (instance) (rate(etcd_disk_wal_fsync_duration_seconds_sum[5m]))
            / (sum by (instance) (rate(etcd_disk_wal_fsync_duration_seconds_count[5m])) > 0)
        - record: etcd:log_write_seconds:slowest_hundredth
          expr: >-
            histogram_quantile(0.99, sum by (instance, le) (
              rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])
            ))

    - name: capacity.watched
      rules:
        - alert: MustRunWorkDoesNotFitWithAWorkerGone
          expr: >-
            site:must_run_reserved_memory_bytes
            > site:workers_allocatable_memory_bytes:one_gone
          for: 15m
          labels:
            severity: warning
          annotations:
            first_step: >-
              Open the dashboard of what the site holds and find what reserves
              the most among work that cannot wait. Lower a reservation that
              is not being used, or plan a worker.
            summary: Work that cannot wait would not fit if a worker were lost.
            description: >-
              Everything on the workers that is not batch reserves
              {{ $value | humanize1024 }}B, and the workers hold less than
              that with the largest of them gone. Replacing a worker, or
              losing one, leaves something with nowhere to run. Nothing is
              broken yet.

        # What the scheduler itself says, and the only one of these that is
        # about a machine and not a total.
        #
        # The alert above adds up what is reserved and compares it with what
        # the workers hold, which is a budget: it cannot see that room is
        # spread over machines, or a volume that keeps a pod on one of them.
        # A pull request is tried against the site's own scheduler for that
        # reason (scripts/engineer), and this is the same question asked of
        # the running site: is there work that cannot wait, which the
        # scheduler has looked at and found no machine for. It is what a
        # change the trial could not see, or a machine lost, looks like from
        # here. Work that can wait is left out: waiting is what it does.
        - alert: WorkThatCannotWaitHasNoMachineToRunOn
          expr: >-
            max by (namespace, pod) (
              kube_pod_status_unschedulable
              * on (namespace, pod) group_left ()
              max by (namespace, pod) (kube_pod_info{priority_class!="batch"})
            ) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            first_step: >-
              Run `kubectl -n {{ $labels.namespace }} describe pod {{
              $labels.pod }}` and read the last event. It says whether the
              reason is memory or a volume.
            summary: Work that cannot wait has been without a machine for ten minutes.
            description: >-
              The scheduler has found no machine for {{ $labels.pod }} in
              {{ $labels.namespace }}. Its reason is on the pod: kubectl
              describe it and read the last event. If the reason is memory,
              the site is full for a pod of that size: give room back by
              lowering what something reserves, or add a worker. If it is a
              volume, the pod is held to a machine that is gone or full, and
              it will not move by itself.

        # Said at the time, and not a quarter of an hour later by its effects.
        #
        # When the scheduler has work that outranks what is running and no
        # room for it, it puts the lower-ranked work off its machine. That is
        # the design for work that can wait. It is also what happened to an
        # application that cannot: the network's agent was given a
        # reservation on every machine, and on the one machine that
        # application can use, the agent was placed at its expense
        # (2026-10-11). What said so was "pod not ready", fifteen minutes on,
        # and nothing said why.
        #
        # This says that it happened, as it happens. It cannot say which pod
        # was put off or for what: the scheduler counts its victims and names
        # them only in events, which the site does not keep yet (criterion
        # 25). If the work put off cannot wait and has nowhere else to go, the
        # alert above follows this one within ten minutes and names it.
        - alert: WorkWasPutOffItsMachineForWorkThatOutranksIt
          expr: sum(increase(scheduler_preemption_victims_sum[15m])) > 0
          labels:
            severity: warning
          annotations:
            first_step: >-
              Look at what was merged just before, for a reservation raised on
              something that runs on every machine.
            summary: The scheduler put running work off its machine to place work that outranks it.
            description: >-
              {{ $value | printf "%.0f" }} pod(s) were put off their machines
              in the last quarter of an hour, because something that
              outranks them had no room. If what was put off can wait, it is
              being run again and nothing is wrong. If it cannot, look at
              what changed just before: a reservation raised on something
              that runs on every machine is the usual cause, and the pod it
              cost will be named by the next alert if it has nowhere to go.

        # etcd's disk, held to a written level (criterion 8).
        #
        # etcd answers nothing it has not first written to its log, so how
        # long that write takes is how slow the whole control plane is, and a
        # write slower than a heartbeat is how a member is thought dead. The
        # control planes have no disk of their own: their log shares the
        # hypervisor's pool with every volume on the site.
        #
        # THE LEVEL IS WHAT THIS DISK DOES, AND SOME MORE. Read on site0 over
        # the three days to 2026-10-11, for the slowest hundredth of writes:
        # 14 milliseconds in an ordinary hour, 40 in an ordinary bad five
        # minutes, 46 in the worst. etcd's own guidance is ten, which this
        # disk does not meet at rest and which nothing here has suffered for:
        # no leader was lost in those three days. So the level is not etcd's
        # ten. It is 64 milliseconds held for a quarter of an hour: slower
        # than this disk has been seen to be, for longer than a burst, and
        # still short of the hundred at which a heartbeat is missed. The
        # histogram's own steps are 32 and 64, so a level between them would
        # be a number nothing measures.
        #
        # The stock alert for this fires at half a second, which is a control
        # plane already failing.
        - alert: EtcdIsWaitingOnItsDisk
          expr: >-
            histogram_quantile(0.99, sum by (instance, le) (
              rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])
            )) > 0.064
          for: 15m
          labels:
            severity: warning
          annotations:
            first_step: >-
              Find what is writing heavily to the pool etcd shares: on the
              host, `zpool iostat -v 5`. Move it or slow it.
            summary: etcd's writes to its log are slower than this site's disk has ever made them.
            description: >-
              The slowest hundredth of etcd's log writes on
              {{ $labels.instance }} have taken more than 64 milliseconds for
              a quarter of an hour ({{ $value | humanizeDuration }} now). The
              most seen on this disk before was 46. At a hundred a member
              starts missing heartbeats. Something is using the disk etcd
              shares: look at what was added or is writing heavily, and move
              or slow it. Do not add anything that writes to this pool while
              this fires.

        # The message for work that was stopped on purpose.
        #
        # Work that can wait runs in memory somebody else holds and is not
        # using, and is stopped when that is wanted back. That is the design
        # and not a failure, and it has to say so: a job that only reports
        # "failed" sends somebody looking for a fault that is not there.
        - alert: WorkThatCanWaitWasStoppedForResources
          expr: >-
            max by (namespace, pod) (
              kube_pod_status_reason{reason="Evicted"}
              * on (namespace, pod) group_left ()
              max by (namespace, pod) (kube_pod_info{priority_class="batch"})
            ) > 0
          labels:
            severity: info
          annotations:
            first_step: >-
              Nothing, unless it keeps happening to the same work. Then give
              that work a quieter time to run in.
            summary: Work that can wait was stopped to give resources back, and is being run again.
            description: >-
              {{ $labels.pod }} in {{ $labels.namespace }} was stopped by its
              machine because something that cannot wait needed the memory it
              was running in. Nothing is broken. A job of the cluster's own
              is started again by Kubernetes; a CI job is not, and runs at its
              next schedule. If this keeps happening to the same work, it is
              not getting a quiet enough window to finish in.

        # A decision that was put off, and what reopens it.
        #
        # Idle capacity is lent the way Kubernetes lends it unaided: work
        # that can wait reserves little and runs in what is free, and is
        # stopped when the memory is wanted back. That has no accounting -
        # nothing knows how much is safe to lend - and no foresight. Two
        # projects add both, and were looked at on 2026-10-08:
        #
        #   Koordinator  publishes each machine's idle reservations as
        #                capacity batch work is scheduled against, from recent
        #                use and from a longer prediction. Active. Costs
        #                several controllers and an agent on every machine
        #                with the run of the host; not tried on Talos.
        #   Crane        the one built around finding the cycles in a
        #                workload's use. Unmaintained since 2024, which is why
        #                it was passed over and not because the idea is
        #                wrong: its prediction is the part worth reading
        #                before building or adopting one.
        #
        # They were not taken up because the site had almost no work that can
        # wait. This fires when that has stopped being true.
        #
        # The same alert reopens a second thing put off: running a CI job
        # again when its runner was stopped. GitHub does not do it unaided,
        # and doing it means a workflow started by another holding write
        # access to Actions, which the guard on such workflows refuses. It
        # was not worth that while the only CI work that can wait is a
        # nightly whose next run is the retry. If it is built, it runs again
        # only a job that was stopped and never one that ran and failed: a
        # job that gave its answer gives the same one twice, or is flaky.
        - alert: LendingIdleCapacityNeedsAccounting
          expr: >-
            count(
              max_over_time(
                (kube_pod_status_reason{reason="Evicted"}
                 * on (namespace, pod) group_left ()
                 max by (namespace, pod) (kube_pod_info{priority_class="batch"})
                )[1d:5m]
              ) > 0
            ) > 3
          for: 1h
          labels:
            # A warning and not a note: notes are recorded and not sent, and
            # this is what says a decision put off is now due.
            severity: warning
          annotations:
            first_step: >-
              Read the comment on this rule in the repository, and decide
              whether to reopen the choice it records.
            summary: Work that can wait is being stopped for resources more than occasionally.
            description: >-
              More than three batch pods were evicted in a day. Lending idle
              capacity with no accounting was chosen while almost nothing
              could wait; this is the sign that has changed. The decision to
              reopen is whether to trial Koordinator, which accounts for what
              is safe to lend - see the comment on this rule in the
              repository for what was found and why it was put off.
