# The pool for jobs that download what a build needs.
# What holds every pool is said once, in pull-request-runners.yaml.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pull-requests-builds
  namespace: pull-request-runners
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 12h
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    githubConfigUrl: ${RUNNER_GITHUB_CONFIG_URL}
    githubConfigSecret: ${RUNNER_SECRET_NAME}
    # A group of its own. The estate's other runners are in one that takes
    # only named workflows from the default branch, which a pull request
    # never runs from.
    runnerGroup: pull-requests

    runnerScaleSetName: pr-builds-${SITE}

    minRunners: 0
    # Three, at two gibibytes each: the lanes that compile and test Go, with
    # the meta lane's parts among them. A fourth was here, and is the
    # primary pool's (pull-requests-builds-primary.yaml), so the job every
    # pull request waits on longest never waits for one of these. With the
    # other pools' twelve gibibytes, and one left for what runs on every
    # machine, of the untrusted worker's fourteen. A job past three waits
    # for one to finish.
    #
    # Chosen from what the machine holds, not from what the jobs use: none
    # had run here in full when this was set (2026-10-22). Corrected from
    # what they are read using once they have.
    maxRunners: 3

    listenerTemplate:
      spec:
        terminationGracePeriodSeconds: 60
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        priorityClassName: critical
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        containers:
          - name: listener
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 25m
                memory: 64Mi

    template:
      spec:
        priorityClassName: interactive
        automountServiceAccountToken: false
        # The untrusted zone's machine and no other: the label sends a
        # runner there, and the toleration is what lets it stay.
        nodeSelector:
          ${UNTRUSTED_ZONE}: zone0
        tolerations:
          - key: ${UNTRUSTED_ZONE}
            operator: Equal
            value: zone0
            effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/fensberg/homelab-pull-request-runner@sha256:06f194adc618843dfdba8e8e3da6c3d35039bc996da5b2b697894ea9128a2cf7
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pull-requests-builds
  namespace: pull-request-runners
spec:
  endpointSelector:
    matchLabels:
      actions.github.com/scale-set-name: pr-builds-${SITE}
  egress:
    # The cluster's resolver, and only for the names below: a name that is
    # not asked for is a name nothing can be sent to inside a question.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*.actions.githubusercontent.com"
              - matchPattern: "*.blob.core.windows.net"
              - matchName: api.github.com
              - matchName: codeload.github.com
              - matchName: dl.k8s.io
              - matchName: files.pythonhosted.org
              - matchName: get.opentofu.org
              - matchName: ghcr.io
              - matchName: github.com
              - matchName: go.dev
              - matchName: objects.githubusercontent.com
              - matchName: pkg-containers.githubusercontent.com
              - matchName: proxy.golang.org
              - matchName: pypi.org
              - matchName: raw.githubusercontent.com
              - matchName: registry.opentofu.org
              - matchName: release-assets.githubusercontent.com
              - matchName: storage.googleapis.com
              - matchName: sum.golang.org
    - toFQDNs:
        - matchPattern: "*.actions.githubusercontent.com"
        - matchPattern: "*.blob.core.windows.net"
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: dl.k8s.io
        - matchName: files.pythonhosted.org
        - matchName: get.opentofu.org
        - matchName: ghcr.io
        - matchName: github.com
        - matchName: go.dev
        - matchName: objects.githubusercontent.com
        - matchName: pkg-containers.githubusercontent.com
        - matchName: proxy.golang.org
        - matchName: pypi.org
        - matchName: raw.githubusercontent.com
        - matchName: registry.opentofu.org
        - matchName: release-assets.githubusercontent.com
        - matchName: storage.googleapis.com
        - matchName: sum.golang.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
