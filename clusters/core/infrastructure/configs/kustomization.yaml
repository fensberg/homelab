---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - state-database.yaml
  - runner-scale-set.yaml
  - runner-scale-set-batch.yaml
  - host-metrics.yaml
  - capacity.yaml
  # Asks GitHub whether each scheduled workflow is failing. Needs the
  # ScrapeConfig and PrometheusRule kinds from the monitoring stack.
  - scheduled-workflows.yaml
  # A site's private access: the issuer, the address, the Gateway and each
  # name's listener. Needs the kinds cert-manager and the Gateway API bring,
  # and the address and names from the site's cluster-vars.
  - private-access.yaml
  # Grafana's route by its name, through the Gateway above.
  - grafana.yaml
# The dashboards, one for each question epoch 04 asks of a site (criterion
# 19). Each is a file under dashboards/, kept here so that what a person
# looks at is reviewed like everything else, and handed to Grafana by the
# sidecar that watches for the label below.
#
# Not one of them holds a variable. Flux substitutes into everything it
# applies and the Validate lane substitutes with a tool that takes a bare
# "$name" too, so a dashboard's own variable would be blanked on its way in.
# They are written with none, and tests/go/repo holds them to it. A "$"
# before a digit is part of a pattern and is left alone by both.
configMapGenerator:
  - name: dashboard-what-the-site-holds
    namespace: monitoring
    files: [dashboards/what-the-site-holds.json]
  - name: dashboard-where-the-time-goes
    namespace: monitoring
    files: [dashboards/where-the-time-goes.json]
  - name: dashboard-is-the-network-the-limit
    namespace: monitoring
    files: [dashboards/is-the-network-the-limit.json]
  - name: dashboard-is-the-site-keeping-itself
    namespace: monitoring
    files: [dashboards/is-the-site-keeping-itself.json]
generatorOptions:
  # Named as written: nothing mounts these by name, and a name that changes
  # with every edit leaves the old dashboard behind until it is pruned.
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
