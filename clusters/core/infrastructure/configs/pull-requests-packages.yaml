# The pool for jobs that reach the package registries.
# What holds every pool is said once, in pull-request-runners.yaml.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pull-requests-packages
  namespace: pull-request-runners
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 12h
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    githubConfigUrl: ${RUNNER_GITHUB_CONFIG_URL}
    githubConfigSecret: ${RUNNER_SECRET_NAME}
    # A group of its own. The estate's other runners are in one that takes
    # only named workflows from the default branch, which a pull request
    # never runs from.
    runnerGroup: pull-requests

    runnerScaleSetName: pr-packages-${SITE}

    minRunners: 0
    # Two, at one gibibyte each: the scans, which read and do not build.
    # The three pools together ask twelve of the untrusted worker's thirteen
    # or so, and a job past two waits for one to finish. Chosen from what
    # the machine holds, not from use (2026-10-22), and corrected from what
    # the jobs are read using once they have run here.
    maxRunners: 2

    listenerTemplate:
      spec:
        terminationGracePeriodSeconds: 60
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        priorityClassName: critical
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        containers:
          - name: listener
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 25m
                memory: 64Mi

    template:
      spec:
        priorityClassName: interactive
        automountServiceAccountToken: false
        # The untrusted zone's machine and no other: the label sends a
        # runner there, and the toleration is what lets it stay.
        nodeSelector:
          untrusted-zone: zone0
        tolerations:
          - key: untrusted-zone
            operator: Equal
            value: zone0
            effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/fensberg/homelab-pull-request-runner@sha256:065b85c0393c87129894c733ee41c06ab54f4f64e901e2bc4bf8846a38382e39
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pull-requests-packages
  namespace: pull-request-runners
spec:
  endpointSelector:
    matchLabels:
      actions.github.com/scale-set-name: pr-packages-${SITE}
  egress:
    # The cluster's resolver, and only for the names below: a name that is
    # not asked for is a name nothing can be sent to inside a question.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*.actions.githubusercontent.com"
              - matchPattern: "*.blob.core.windows.net"
              - matchName: api.deps.dev
              - matchName: api.github.com
              - matchName: api.securityscorecards.dev
              - matchName: codeload.github.com
              - matchName: dl.google.com
              - matchName: files.pythonhosted.org
              - matchName: get.trivy.dev
              - matchName: ghcr.io
              - matchName: github.com
              - matchName: go.dev
              - matchName: mirror.gcr.io
              - matchName: nodejs.org
              - matchName: objects.githubusercontent.com
              - matchName: pkg-containers.githubusercontent.com
              - matchName: proxy.golang.org
              - matchName: pypi.org
              - matchName: raw.githubusercontent.com
              - matchName: registry.npmjs.org
              - matchName: release-assets.githubusercontent.com
              - matchName: storage.googleapis.com
              - matchName: sum.golang.org
    - toFQDNs:
        - matchPattern: "*.actions.githubusercontent.com"
        - matchPattern: "*.blob.core.windows.net"
        - matchName: api.deps.dev
        - matchName: api.github.com
        - matchName: api.securityscorecards.dev
        - matchName: codeload.github.com
        - matchName: dl.google.com
        - matchName: files.pythonhosted.org
        - matchName: get.trivy.dev
        - matchName: ghcr.io
        - matchName: github.com
        - matchName: go.dev
        - matchName: mirror.gcr.io
        - matchName: nodejs.org
        - matchName: objects.githubusercontent.com
        - matchName: pkg-containers.githubusercontent.com
        - matchName: proxy.golang.org
        - matchName: pypi.org
        - matchName: raw.githubusercontent.com
        - matchName: registry.npmjs.org
        - matchName: release-assets.githubusercontent.com
        - matchName: storage.googleapis.com
        - matchName: sum.golang.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
