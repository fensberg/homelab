---
# Three priority classes, sorted by how much delay the work tolerates.
#
# Delay tolerance is the property the scheduler can actually act on, and it is
# not the same as importance. A nightly state backup is one of the more
# important things this estate does and it belongs in `batch`, because nothing
# observes its latency. A lint job matters far less and belongs above it,
# because a person is sitting there waiting for it.
#
# The names are the field's own, deliberately, rather than anything thematic:
# `critical` is the word Kubernetes itself uses for this (`system-cluster-
# critical`), and interactive-versus-batch is the standard distinction for
# work a person is waiting on against work that merely has to complete.
# docs/epochs/02-abstraction.md records how the model was arrived at.
#
# WHAT A PriorityClass ACTUALLY DECIDES, because it is two things at once and
# this set wants different answers to them:
#
#   `value` decides who gets the next free slot when several pods are pending.
#   `preemptionPolicy` decides whether a pod may EVICT a running pod to make a
#   slot that does not otherwise exist.
#
# An interactive job takes the next free slot ahead of a batch job, and when
# there is no free slot it takes one from batch work. That second half is new
# (2026-10-15), and replaces a decision that said the opposite: interactive
# work was set never to evict anything, because killing a batch job twelve
# minutes into a thirteen-minute run to save two minutes of waiting looked a
# bad trade.
#
# What changed is what the site is for. It is run full on purpose
# (docs/epochs/04-observability.md): every byte the work that cannot wait
# does not need is handed to batch work, and the only buffer is batch itself,
# which gives its room back when it is wanted. With interactive work unable
# to take it back, a full site makes a converge, a pull request's checks and
# a player wait for batch work to finish, which is the delay those exist to
# avoid; and the room kept for a worker going down sits idle instead of
# working. The operator: "I want to take EVERY spare piece of hardware and put
# it to use systematically and then roll them off seamlessly ready to pick up
# the next piece of work... I want the smallest buffer that we can possibly
# have."
#
# Preemption only ever takes from a lower class, and the only class below
# interactive is batch. So interactive work puts off batch work and nothing
# else - never another interactive pod, never critical work. What it costs is
# what the old decision weighed: a batch job put off part-way is lost, and an
# Actions job that is lost is not run again (re-running it is parked in
# docs/epochs/04-observability.md, criterion 6). tests/go/repo holds the
# ladder to this.
#
# WHY NOT `system-cluster-critical` FOR THE TOP CLASS. Not because it ranks
# higher than anything here needs - it does, at 2000000000 - but because it is
# already occupied. A placement audit of the live cluster found Talos using it
# for the API server, the scheduler, the controller manager, CoreDNS and
# kube-proxy, with `system-node-critical` above that for the CNI. Putting the
# estate's own operators in the same class would mean a future decision about
# the API server is a decision about them too.
#
# The name is reserved as well: the API server refuses a user-created class
# whose name begins `system-`, so these three could not have been called that
# even if it were wanted. Flux's generated manifest already sets
# `system-cluster-critical` on three of its four controllers and that is left
# alone - upstream's call about upstream's components.
#
# The result is a ladder: Kubernetes' own machinery on top, these three below
# it, and an unclassified pod at zero underneath all of them.
#
# The numbers are round and widely spaced because nothing computes with them.
# They only have to sort, and four zeros between classes means one can be
# split later without renumbering the others.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: critical
  annotations:
    # Replaced rather than edited when its value or policy changes; see the
    # interactive class.
    kustomize.toolkit.fluxcd.io/force: Enabled
value: 1000000
# The default, stated rather than omitted: critical work may evict anything
# below it, and a policy that consequential should not be inferred from its
# absence.
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: >-
  Tolerates no delay at all, and may evict running work to avoid one. The
  operators that reconcile the estate, and the state database.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: interactive
  annotations:
    # A class's value and its preemption policy cannot be changed on a class
    # the cluster already has: the API server refuses the edit, and Flux's
    # apply of this whole layer with it. Changing either means replacing the
    # class, which Flux does when an object asks it to. The class is gone for
    # the moment between the two, and a pod asking for it then is refused and
    # made again by whatever made it. Found when this class's policy was
    # changed on 2026-10-15 and the layer stood refused (#766).
    kustomize.toolkit.fluxcd.io/force: Enabled
value: 10000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: >-
  Somebody is waiting for it, so queueing is the entire cost - a converge
  after a merge, a player on a server, a pull request's checks. Takes room
  from batch work when there is none free, and from nothing else: the only
  class below it is batch, so it can never put off work of its own kind or
  anything above.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: batch
  annotations:
    # Replaced rather than edited when its value or policy changes; see the
    # interactive class.
    kustomize.toolkit.fluxcd.io/force: Enabled
value: 100
preemptionPolicy: Never
globalDefault: false
description: >-
  Must complete; need not complete now, and may be stopped and started
  again. Integration runs and anything else nobody is waiting on. It is not
  counted against a site's capacity: it runs in what is free and gives it
  back when asked.
