---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # First, because every workload below names one of these classes and a pod
  # naming a PriorityClass that does not exist is refused admission rather
  # than defaulted.
  - priority-classes.yaml
  # After the classes it tells a refused pod to choose from. Everything
  # below is held to it from the moment it is made.
  - uncounted-pods.yaml
  - cloudnative-pg.yaml
  - openebs.yaml
  # Needs its namespace, token and authority from
  # modules/infrastructure/platform/storage.tf.
  - storage-driver.yaml
  - actions-runner-controller.yaml
  - kube-prometheus-stack.yaml
  # Needs its namespace and token from modules/infrastructure/platform/tunnel.tf.
  - cloudflared.yaml
