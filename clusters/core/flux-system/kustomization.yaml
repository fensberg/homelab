apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml

# Pin Flux's own controllers by digest.
#
# `gotk-components.yaml` is generated by `flux bootstrap` and ships its four
# controllers pinned by tag. A tag is a mutable pointer, so this repository's
# "pin everything" invariant was not actually being met by the component that
# applies everything else - which is the worst place to have missed it.
#
# It is done here rather than by editing the generated manifest, because that
# file is rewritten wholesale on every Flux upgrade and an edit would be lost
# without warning. This overlay is the mechanism Flux documents for customising
# its own components, and kustomize's image transformer replaces the tag with
# the digest at build time.
#
# The digests are resolved from the registry for exactly the tags the generated
# manifest carries, not copied from anywhere:
#
#   ghcr.io/v2/fluxcd/<controller>/manifests/<tag>  ->  Docker-Content-Digest
#
# UPGRADING: run `task render-flux-digests`. It reads the tags out of
# gotk-components.yaml and rewrites the block below, so the two files cannot
# drift apart.
#
# That was a step somebody had to remember, and forgetting it is a WRONG ANSWER
# rather than an error (#104). The transformer matches on image NAME, not tag,
# so after a bump it keeps applying the old digests to the new manifest: the
# cluster runs the previous controllers while git says it was upgraded.
# `task validate` passes, because the overlay still builds. The suppliers test
# passes, because every image is pinned. Both checks are satisfied by a wrong
# answer, and an operator debugging a controller reads release notes for a
# version that is not deployed. It fires on EVERY upgrade unless someone
# remembers, and the two files that must change together live in different
# formats and are edited by different mechanisms.
#
# The suppliers test still fails if a tag ever reaches the cluster unpinned, so
# a controller with no entry here is a red build rather than a silent
# unpinning - and TestEveryFluxControllerIsPinnedHere refuses one that the
# generated manifest carries and this block does not name.
images:
  - name: ghcr.io/fluxcd/helm-controller
    digest: sha256:16ada99456385100698a5d7adf90aba8a2089d987ab541c9566b6d7b0e897038
  - name: ghcr.io/fluxcd/kustomize-controller
    digest: sha256:2b8bec54ffb6caf421bd2a6c005d27f567d5dd4db7feb55794fb51fcabd69b8f
  - name: ghcr.io/fluxcd/notification-controller
    digest: sha256:071c351a0fb163eeb6a2bb82f1e894f51b6b0734216d2e97d3d99c9ab9d710b9
  - name: ghcr.io/fluxcd/source-controller
    digest: sha256:8a8ed0a57b8b86f561d5a4309a69f65e62f0cebe4de8801593c5ff35a3bc3c23

# Flux's own controllers run on the workers, not on the machines holding
# quorum.
#
# Unlike the three HelmReleases under infrastructure/controllers, Flux is not
# BestEffort and never was: the generated manifest already gives all four
# controllers requests and limits, and gives three of them
# `priorityClassName: system-cluster-critical`. Those three are left alone -
# upstream's call about upstream's components, and re-pointing it here would
# put the estate's own class on pods the cluster treats as its own.
#
# notification-controller is the exception, and it is not an oversight
# upstream: it is the one Flux controller whose death does not stop
# reconciliation, so it alone is left unclassified. Unclassified is priority
# zero, which puts the component that REPORTS failures below every class this
# estate declares, and lowest exactly when things are going wrong. It is given
# `critical` below - not because alerts outrank reconciliation, but because a
# tiny always-on process whose whole job is to tell you something broke
# tolerates delay exactly as poorly as the things it reports on.
#
# Patched here for the same reason the image digests above are: gotk-components
# .yaml is rewritten wholesale by `flux bootstrap`, so an edit to it disappears
# on the next upgrade without warning. A strategic-merge patch against
# `kind: Deployment` reaches exactly the four controllers - gotk-sync.yaml
# contributes a GitRepository and a Kustomization and no Deployment at all.
#
# THIS IS SELF-MODIFYING, and worth saying out loud. kustomize-controller
# applies this patch to its own Deployment, is terminated, and comes back on a
# worker to finish the job. That is ordinary Flux behaviour, but the failure
# mode is not ordinary: if the selector were wrong, Flux would become
# unschedulable and could not reconcile its way back out. Recovery is a direct
# kubectl, not a commit:
#
#   contractor kubeconfig -site <site> -- \
#     kubectl -n flux-system patch deploy kustomize-controller \
#       --type=json -p '[{"op":"remove","path":"/spec/template/spec/affinity"}]'
#
# The expression itself is not new or untested - it is the one already proven
# on the live estate by the runner scale set, which placed a runner on a worker
# and kept it off the control plane.
#
# Safe at ignition, and this was checked rather than assumed: gitops.tf's
# bootstrap depends on `data.talos_cluster_health.this`, which since the worker
# pool landed lists `worker_nodes` and depends on the worker configuration
# apply. Workers are therefore Ready before Flux is installed, so there is no
# window in which these pods have nowhere to go. Recovery from losing every
# worker also does not need Flux: workers are built by OpenTofu, which does not
# depend on Flux in either direction.
patches:
  - target:
      kind: Deployment
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: patched-by-target-selector
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
  - target:
      kind: Deployment
      name: notification-controller
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: notification-controller
      spec:
        template:
          spec:
            priorityClassName: critical
