# Regal's settings for the configuration rules (policy/conftest), read by
# the guard that lints them. Every rule Regal has is on: this changes only
# how long a line may be, which is a setting and not a silence.
rules:
  style:
    line-length:
      # A refusal is written as one line of prose, so the limit is the
      # longest line the rules hold today and not Regal's 120. Raised, not
      # met: whether to wrap the messages is #813.
      level: error
      max-line-length: 645
