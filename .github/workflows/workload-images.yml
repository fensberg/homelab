name: Workload Images

# The images this estate builds for the software it self-hosts.
#
# One workflow rather than one per workload: the build is the same shape every
# time - a Dockerfile under modules/applications/<name>/image, published to the
# organisation's registry, pinned by digest wherever it is used - and a
# workflow per application would be that shape copied and then drifting.
#
# Rebuilt when a Dockerfile changes. Not on a schedule: an image that rebuilds
# itself is one whose contents nobody reviewed, and the whole point of building
# these is that what runs is a specific set of bytes somebody chose.
on:
  push:
    branches: [main]
    paths:
      - "modules/applications/*/image/**"
      - "scripts/versions.env"
      - ".github/workflows/workload-images.yml"
  workflow_dispatch:

# Same reasoning as runner-image.yml: read at the top, packages:write only on
# the job that publishes, so a job added later does not inherit the registry.
permissions:
  contents: read

concurrency:
  group: workload-images
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    permissions:
      contents: read
      packages: write
    name: Build and publish
    runs-on: ubuntu-latest
    # Longer than the runner image's thirty minutes, and bounded for the same
    # reason everything here is: a game server's depots are gigabytes, and the
    # download is the slow part. Bounded so a hung fetch cannot bill for hours.
    timeout-minutes: 60
    strategy:
      # One workload's build failing should not hide another's result.
      fail-fast: false
      matrix:
        workload: [valheim]
    steps:
      # Audit, not block: SteamCMD reaches Valve's content servers, a set of
      # hosts Valve changes (approved-suppliers.yml records it), so an
      # allowlist would break on Valve's schedule. The expediter's build job
      # carries the same setting for the same reason.
      - name: Harden Runner
        with:
          # audit, and the reason is in scripts/approved-suppliers.yml under
          # game-server-delivery: SteamCMD's depot content comes from a rotating
          # set of CDN hosts chosen per request, and no fixed list describes
          # them. An allowlist here would be a guess that breaks quietly the
          # first time Valve moves a host.
          #
          # What bounds this is not the network. The job produces an artifact
          # that is pinned by digest and pulled from this estate's own registry,
          # so what reaches the cluster is a specific set of bytes somebody can
          # point at, whatever the build did to obtain them.
          egress-policy: audit
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build and publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.workload }}
          SHA: ${{ github.sha }}
          WORKLOAD: ${{ matrix.workload }}
        run: |
          set -euo pipefail
          docker build \
            -t "${IMAGE}:${SHA}" \
            -t "${IMAGE}:latest" \
            "modules/applications/${WORKLOAD}/image"
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"

          # The digest, not the tag, is what a manifest should reference - so
          # print it where whoever is about to write that manifest will find it
          # rather than making them go and look it up.
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${SHA}")
          echo "published ${IMAGE}:${SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "pin this: ${digest}" >> "$GITHUB_STEP_SUMMARY"
