# How every job starts: check out the repository, from one place.
#
# Every job calls this first:
#
#   - uses: $/.github/workflows/mobilize
#
# It hardened the runner first, with step-security's harden-runner, until
# 2026-11-12. The operator cut the agent from every job that day: on GitHub's
# runners it failed to start on some jobs (#725, #791) and left others that
# GitHub never heard finish, and on the estate's runners it never held
# anything. What a job may reach is still declared in
# scripts/approved-suppliers.yml. On GitHub's runners nothing holds a job to
# that list until epoch 16, decision 16 does, which runs a pull request's
# code with no network at all (#795). The pools are still held by the
# cluster's network. Every job starting here is what lets that land in one
# place.
#
# WHY `$/` AND NOT `./`. .github/actions/secure-checkout tried this with `./`
# and every job failed: "Can't find 'action.yml' ... Did you forget to run
# actions/checkout before running your local action?" A `./` reference is read
# out of the workspace, and this is the step that fills it. `$/` resolves
# against the repository at the running commit with no checkout.
#
# WHY IT LIVES UNDER .github/workflows. It decides how every job starts, so
# it sits behind the same `workflows` permission the agent does not hold.
# GitHub loads workflows only from the top of that directory.
name: "Mobilize"
description: >-
  Check out the repository - the first step of every job in this repository.

inputs:
  checkout:
    description: >-
      "false" for a job that never needs the repository. There is no way to
      check out anything but the commit the run is for; see #409.
    required: false
    default: "true"
  fetch-depth:
    description: How much history to check out; 0 is all of it.
    required: false
    default: "1"

runs:
  using: composite
  steps:
    # A value other than "true" or "false" is refused rather than read as
    # false: a typo would silently skip the checkout and leave every later
    # step running against an empty workspace.
    - name: Refuse an unrecognised value
      if: inputs.checkout != 'true' && inputs.checkout != 'false'
      shell: bash
      env:
        CHECKOUT: ${{ inputs.checkout }}
      run: |
        echo "::error::mobilize takes checkout as \"true\" or \"false\"; it was given '$CHECKOUT'."
        exit 1

    - name: Check out the repository
      if: inputs.checkout == 'true'
      uses: $/.github/workflows/checkout
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
