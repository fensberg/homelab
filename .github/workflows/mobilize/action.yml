# How every job starts: harden the runner, then check out the repository.
#
# THE ONE PLACE THE HARDEN-RUNNER COMMIT IS WRITTEN. It was restated in 31
# jobs and the copies agreed only because nobody had made a mistake yet. A job
# calls this instead:
#
#   - uses: $/.github/workflows/mobilize
#     with:
#       egress-policy: block
#       allowed-endpoints: >
#         github.com:443
#
# PROVEN, NOT ASSUMED. harden-runner installs its policy in a pre-step, and
# GitHub documents pre-steps as unsupported for local actions. Under `$/` they
# run: .github/workflows/egress-proof.yml requires a host outside the allowlist
# to be refused through this action, and its run shows "Pre Mobilize" and
# "Post Mobilize" executing harden-runner's own pre and post steps.
#
# WHY `$/` AND NOT `./`. .github/actions/secure-checkout tried this with `./`
# and every job failed: "Can't find 'action.yml' ... Did you forget to run
# actions/checkout before running your local action?" A `./` reference is read
# out of the workspace, and this is the step that fills it. `$/` resolves
# against the repository at the running commit with no checkout.
#
# WHY IT LIVES UNDER .github/workflows. It decides what every job may reach, so
# it sits behind the same `workflows` permission the agent does not hold.
# GitHub loads workflows only from the top of that directory.
name: "Mobilize"
description: >-
  Harden the runner, then check out the repository - the first step of every
  job in this repository.

inputs:
  egress-policy:
    description: >-
      block or audit, exactly as scripts/approved-suppliers.yml declares for the
      calling job. No default: harden-runner refuses an empty policy, which is
      the right answer for a job that did not say.
    required: true
  allowed-endpoints:
    description: >-
      The calling job's allowlist, copied from its entry in
      scripts/approved-suppliers.yml. `security guard-egress` refuses drift.
    required: false
    default: ""
  checkout:
    description: >-
      "false" for a job that never needs the repository, or that checks out
      later through $/.github/workflows/checkout once it knows what to fetch.
    required: false
    default: "true"
  fetch-depth:
    description: How much history to check out; 0 is all of it.
    required: false
    default: "1"
  ref:
    description: What to check out; empty means the commit that triggered the run.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Harden the runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: ${{ inputs.egress-policy }}
        allowed-endpoints: ${{ inputs.allowed-endpoints }}

    # A value other than "true" or "false" is refused rather than read as
    # false: a typo here would otherwise silently skip the checkout and leave
    # every later step running against an empty workspace.
    - name: Refuse an unrecognised checkout value
      if: inputs.checkout != 'true' && inputs.checkout != 'false'
      shell: bash
      env:
        VALUE: ${{ inputs.checkout }}
      run: |
        echo "::error::mobilize was given checkout: '$VALUE'. Use \"true\" or \"false\"."
        exit 1

    - name: Check out the repository
      if: inputs.checkout == 'true'
      uses: $/.github/workflows/checkout
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        ref: ${{ inputs.ref }}
