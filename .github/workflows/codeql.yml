name: "CodeQL"

# Moved off GitHub's default setup and into a workflow file so it is pinned,
# reviewable and reported alongside the other pull request checks.
#
# BEFORE THIS WORKS, default setup has to be turned off:
#   Settings -> Advanced Security -> Code scanning -> Default setup -> Disable
# The two are mutually exclusive. While default setup is on, the upload from
# this workflow is rejected.
#
# TO MAKE IT BLOCK A MERGE, add a ruleset on main with "Require code scanning
# results", listing CodeQL as a required tool. A branch protection status check
# only proves the workflow ran; the ruleset is what refuses a merge because of
# what the workflow found.
on:
  # The same branches the "protected branches" ruleset covers.
  #
  # `Analyze (actions)` is a required status check there, and that ruleset
  # covers `main` and `epoch/**` - but this workflow only ran for pull requests
  # into `main`. So every pull request into an epoch branch waited forever on a
  # check that could not report, with no failure to read and nothing to re-run.
  # A required check that cannot run is not a strict gate, it is a stuck one.
  #
  # tests/go/api/required_checks_report_test.go asserts that every check a
  # ruleset requires is one some workflow can actually report on those
  # branches.
  pull_request:
    branches:
      - main
      - epoch/**
  push:
    branches:
      - main
  schedule:
    # Queries improve after code is written, so re-analysing unchanged code
    # still finds new things. Sunday, off the critical path.
    - cron: "41 5 * * 0"

permissions: read-all

# GitHub's default shell for `run:` is `bash -e {0}`, which has no
# pipefail: in `a | b` only b's exit status counts, so a failing command
# feeding a working one is a green step. Naming the shell explicitly gets
# `bash --noprofile --norc -eo pipefail {0}` instead.
#
# Not theoretical here. `tofu plan | tee` reported success and posted an
# empty pull request comment, and `rclone version | head -1` verified
# nothing while passing - both silent, both green, both wrong answers
# rather than errors. It is set on every workflow, including those with no
# `run:` step today, so the one added tomorrow is already covered.
#
# tests/go/repo/pipefail_test.go asserts this is present.
defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: ubuntu-latest
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      # Required only when the repository is private. It is not today, but this
      # repository is the template for client engagements, where it will be -
      # and the failure mode there is a 403 from init that reads like a bug.
      # `packages: read`, which GitHub's template also suggests, is genuinely
      # not needed: that is for fetching private CodeQL packs, and the queries
      # below are public ones.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` is the whole list, and that is not an oversight. CodeQL
        # analyses source code; this repository is HCL, YAML and PowerShell,
        # none of which it supports. Workflows it does support, and workflows
        # are the part of this repository that runs with a token and can be
        # influenced by a pull request - which is exactly where a CodeQL
        # finding would matter most.
        language: ["actions"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default suite is the conservative one. security-extended adds
          # the queries that trade a higher false-positive rate for catching
          # more, which is the right trade when the plan is to block merges on
          # what this finds - a gate is only worth having if it looks hard.
          #
          # Deliberately not security-and-quality: the extra queries there are
          # maintainability rather than security, and style opinions have no
          # business refusing a merge.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          category: "/language:${{ matrix.language }}"
