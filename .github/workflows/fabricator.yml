name: Fabricator
# The one workflow that builds what the estate runs.
#
# On a construction site, fabrication happens off site: components are made
# to the drawings in a shop and delivered finished. The fabricator does the
# same with every image this repository defines. It builds what the drawings
# say and publishes it, addressed by digest. It decides nothing: it never
# writes to the repository and never chooses what is installed where. Pinning
# a product is a release, and releases belong to somebody else.
#
# It builds from work orders and nothing else. scripts/work-orders.json says
# what to build and from which directory, and the fabricator reads it and
# builds each order - it does not go looking for work, and it does not judge
# whether an order is complete. That judgement belongs to a guard:
# tests/go/repo/fabricator_test.go refuses a Dockerfile with no work order,
# and a work order with no Dockerfile, on the pull request that caused it.
#
# It replaces runner-image.yml and workload-images.yml, which were the same
# job written twice with the version wiring done by hand in one and not at all
# in the other.
#
# GitHub-hosted for now. Moving it onto the estate is #503, and the parked
# work for that is on the feat/fabricator branch.
on:
  push:
    branches: [main]
    paths:
      - ".github/runner-image/**"
      - "modules/applications/**"
      - "environments/production/applications/**"
      - "scripts/versions.env"
      - "scripts/work-orders.json"
      - ".github/workflows/fabricator.yml"
  workflow_dispatch:
# Read at the top. packages:write is granted on the build job alone, which is
# the only thing that publishes, so a job added here later does not inherit the
# registry. Scorecard flags the workflow-level form.
permissions:
  contents: read
concurrency:
  group: fabricator
  cancel-in-progress: false
# GitHub's default shell for `run:` is `bash -e {0}`, which has no pipefail.
# tests/go/repo/pipefail_test.go asserts this is present on every workflow.
defaults:
  run:
    shell: bash
jobs:
  orders:
    name: Read the work orders
    runs-on: ubuntu-latest
    # Bounded so a stuck job cannot bill a metered vendor for six hours, which
    # is what GitHub's default timeout allows.
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      orders: ${{ steps.orders.outputs.orders }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Read the work orders
        id: orders
        run: |
          orders="$(jq -c '.orders' scripts/work-orders.json)"
          echo "orders=${orders}" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "- \(.name): \(.context)"' <<<"$orders" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.order.name }}
    needs: orders
    runs-on: ubuntu-latest
    # Longer than most jobs here because a game server's depots are gigabytes,
    # and the download is the slow part. Bounded so a hung fetch cannot bill
    # for hours.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # One order failing should not hide another's result.
      fail-fast: false
      matrix:
        order: ${{ fromJSON(needs.orders.outputs.orders) }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Audit, not block: the builds reach package archives, release
          # downloads and Valve's content servers, a set this repository has
          # never transcribed (approved-suppliers.yml records why).
          egress-policy: audit
          disable-sudo-and-containers: "false"

      - name: Read pinned versions
        uses: ./.github/actions/versions

      # Every build argument a Dockerfile declares without a default is a
      # pin, and it is filled from scripts/versions.env - automatically, so no
      # workflow restates the list. The runner image's list was written out
      # by hand and a test checked four of its five entries; that shape is
      # what this replaces.
      #
      # A bare ARG that versions.env does not pin fails here, naming it,
      # rather than building with an empty value - which for a version is
      # "whatever the installer's default is today".
      #
      # tests/go/repo/fabricator_test.go runs this step's script against
      # every Dockerfile in the repository.
      - name: Take the pins each Dockerfile asks for
        id: pins
        env:
          CONTEXT: ${{ matrix.order.context }}
        run: |
          args=""
          while IFS= read -r name; do
            # BuildKit fills these itself from the platform being built for.
            case "$name" in
              TARGETPLATFORM | TARGETOS | TARGETARCH | TARGETVARIANT | BUILDPLATFORM | BUILDOS | BUILDARCH | BUILDVARIANT) continue ;;
            esac
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              echo "::error file=${CONTEXT}/Dockerfile::ARG ${name} has no default and scripts/versions.env pins no ${name}. Pin it there; the fabricator will pass it."
              exit 1
            fi
            args="${args} --build-arg ${name}=${value}"
          done < <(sed -n 's/^ARG[[:space:]]\{1,\}\([A-Za-z_][A-Za-z0-9_]*\)[[:space:]]*$/\1/p' "${CONTEXT}/Dockerfile" | sort -u)
          echo "args=${args# }" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # No secret reaches the build. The images are public, and a build
      # argument survives in the layer metadata; the registry credential
      # belongs to the login step above and nowhere else.
      - name: Build and publish
        id: build
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.order.name }}
          CONTEXT: ${{ matrix.order.context }}
          PINS: ${{ steps.pins.outputs.args }}
          SHA: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # shellcheck disable=SC2086 # PINS is a list of flags by construction
          docker build $PINS \
            --label "org.opencontainers.image.revision=${SHA}" \
            --label "org.opencontainers.image.source=${SOURCE}" \
            -t "${IMAGE}:${SHA}" \
            -t "${IMAGE}:latest" \
            "$CONTEXT"
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${SHA}")"
          {
            echo "### ${IMAGE##*/}"
            echo ""
            echo "Built from \`${CONTEXT}\` at ${SHA}."
            echo ""
            echo "\`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      # --- A release, for an order that asks for one -------------------------
      #
      # What production runs is a release: the production overlay and the
      # module it builds on, with the image just built pinned by digest,
      # published as one OCI artifact. Its tag is the version the built thing
      # reports, plus a counter for rebuilds of the same version.
      #
      # Everything specific to the workload - which overlay, how to start the
      # image, what the version line looks like - comes from the order.
      # tests/go/repo/fabricator_test.go runs each of these steps as shipped.

      - name: Take delivery of the Flux CLI
        if: matrix.order.release
        run: scripts/take-delivery.sh flux

      # Started once, with the environment the order gives it, and read from
      # its own log. A build whose version cannot be read fails rather than
      # guessing one: a release named for the wrong version is worse than no
      # release.
      - name: Read the version the build carries
        id: version
        if: matrix.order.release
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.order.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE: ${{ toJSON(matrix.order.release) }}
        run: |
          pattern="$(jq -r '.version.pattern' <<<"$RELEASE")"
          # Each variable the order names gets its own random throwaway value.
          # They exist only so the image will start; nothing reaches the
          # probe, and nothing password-shaped is written in the repository.
          envs=()
          while IFS= read -r name; do
            envs+=(-e "${name}=probe-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')")
          done < <(jq -r '.version.env[]' <<<"$RELEASE")
          docker run -d --name version-probe "${envs[@]}" "${IMAGE}@${DIGEST}" >/dev/null
          version=""
          for _ in $(seq 1 "${PROBE_ATTEMPTS:-60}"); do
            found="$(docker logs version-probe 2>&1 | sed -n "s/.*${pattern}.*/\1/p")"
            version="${found%%$'\n'*}"
            [ -n "$version" ] && break
            sleep "${PROBE_INTERVAL:-5}"
          done
          docker rm -f version-probe >/dev/null
          if [ -z "$version" ]; then
            echo "::error::the built image never printed a line matching the order's version pattern, so there is no version to release it as"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The next counter for this version, from the tags the registry already
      # holds. None yet - the package does not exist - is the first release.
      - name: Number the release
        id: number
        if: matrix.order.release
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}-${{ matrix.order.name }}-release
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$(gh api "users/${OWNER}" --jq .type)" in
            Organization) base="orgs/${OWNER}" ;;
            User) base="users/${OWNER}" ;;
            *)
              echo "::error::could not tell whether ${OWNER} is an organization or a user"
              exit 1
              ;;
          esac
          tags=""
          if listed="$(gh api --paginate "${base}/packages/container/${PACKAGE}/versions" --jq '.[].metadata.container.tags[]' 2>&1)"; then
            tags="$listed"
          elif ! grep -q "HTTP 404" <<<"$listed"; then
            echo "::error::could not list the release tags of ${PACKAGE}: ${listed}"
            exit 1
          fi
          n=0
          while IFS= read -r tag; do
            case "$tag" in
              "${VERSION}"-*)
                m="${tag#"${VERSION}"-}"
                if [[ "$m" =~ ^[0-9]+$ ]] && [ "$m" -gt "$n" ]; then
                  n="$m"
                fi
                ;;
            esac
          done <<<"$tags"
          echo "tag=${VERSION}-$((n + 1))" >> "$GITHUB_OUTPUT"

      - name: Stage and publish the release
        id: release
        if: matrix.order.release
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.order.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARTIFACT: ghcr.io/${{ github.repository }}-${{ matrix.order.name }}-release
          TAG: ${{ steps.number.outputs.tag }}
          RELEASE: ${{ toJSON(matrix.order.release) }}
          SHA: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          overlay="$(jq -r '.overlay' <<<"$RELEASE")"
          module="$(jq -r '.module' <<<"$RELEASE")"
          stage="${RUNNER_TEMP}/release"
          rm -rf "$stage"
          for dir in "$module" "$overlay"; do
            mkdir -p "${stage}/$(dirname "$dir")"
            cp -R "$dir" "${stage}/${dir}"
          done
          # The image this release runs, pinned by digest over whatever the
          # manifests in git name.
          printf '%s\n' "images:" "  - name: ${IMAGE}" "    digest: ${DIGEST}" >> "${stage}/${overlay}/kustomization.yaml"
          flux push artifact "oci://${ARTIFACT}:${TAG}" \
            --path="$stage" \
            --source="$SOURCE" \
            --revision="${TAG}@sha1:${SHA}" \
            --annotations="org.opencontainers.image.base.name=${IMAGE}@${DIGEST}" \
            --reproducible \
            --output=json > "${RUNNER_TEMP}/pushed.json"
          pushed="$(jq -r '.digest' "${RUNNER_TEMP}/pushed.json")"
          echo "digest=${pushed}" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "Released as \`${ARTIFACT}:${TAG}\` (\`${pushed}\`), from \`${overlay}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Procurement brings the finished work to the gate. For every work order that
  # makes a release, the newest one the registry holds is compared with the pin
  # in clusters/management/releases.yaml, and when they differ a pull request
  # moves the pin. Merging it is letting the delivery in, and that is a
  # person's: superintendent enforce-standing-order passes a delivery so it can
  # be merged, and refuses it whenever anything would merge it without review.
  #
  # The fabricator's own jobs hold no credential that can write to the
  # repository. This one holds procurement's, scoped to contents and pull
  # requests on this repository, and runs one procurement verb: deliver.
  deliver:
    name: Bring the releases to the gate
    needs: [orders, build]
    runs-on: ubuntu-latest
    # Bounded so a stuck job cannot bill a metered vendor for six hours, which
    # is what GitHub's default timeout allows.
    timeout-minutes: 10
    permissions:
      contents: read
      # The registry's list of releases, read with this workflow's own token.
      packages: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Read pinned versions
        uses: ./.github/actions/versions

      - name: Setup Go
        uses: $/.github/workflows/setup-go

      - name: Mint the procurement token
        id: token
        uses: $/.github/workflows/app-token
        with:
          client-id: ${{ secrets.PROCUREMENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROCUREMENT_BOT_PRIVATE_KEY }}
          # Contents to commit the moved pin; pull requests to open the
          # delivery and close the one it supersedes. Nothing else the App was
          # granted at installation.
          permission-contents: write
          permission-pull-requests: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Through the API rather than git push: a commit created there is signed
      # by GitHub on the App's behalf, which the ruleset requiring signatures
      # on every branch accepts. One pull request per release, on a branch
      # named for it; an older delivery of the same workload still open is
      # closed, because branches here cannot be force-updated.
      - name: Deliver
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ORDERS: ${{ needs.orders.outputs.orders }}
          RELEASES: clusters/management/releases.yaml
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$(GH_TOKEN="$READ_TOKEN" gh api "users/${OWNER}" --jq .type)" in
            Organization) base_path="orgs/${OWNER}" ;;
            User) base_path="users/${OWNER}" ;;
            *) echo "::error::could not tell whether ${OWNER} is an organization or a user"; exit 1 ;;
          esac
          main="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          base_tree="$(gh api "repos/${REPO}/git/commits/${main}" --jq .tree.sha)"

          while IFS= read -r name; do
            package="${REPO_NAME}-${name}-release"
            read -r tag digest < <(GH_TOKEN="$READ_TOKEN" gh api --paginate "${base_path}/packages/container/${package}/versions" \
              --jq '.[] | select(.metadata.container.tags | length > 0) | "\(.created_at) \(.metadata.container.tags[0]) \(.name)"' \
              | sort -r | head -n 1 | cut -d' ' -f2-)
            if [ -z "${tag:-}" ]; then
              echo "::error::${package} holds no release, although the ${name} order makes one"
              exit 1
            fi

            gh api "repos/${REPO}/contents/${RELEASES}?ref=${main}" --jq .content | base64 -d > "$RUNNER_TEMP/releases.yaml"
            before="$(sha256sum < "$RUNNER_TEMP/releases.yaml")"
            go run -C scripts/procurement . deliver -releases "$RUNNER_TEMP/releases.yaml" -name "$name" -tag "$tag" -digest "$digest"
            if [ "$(sha256sum < "$RUNNER_TEMP/releases.yaml")" = "$before" ]; then
              echo "${name}: production already runs ${tag}" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            branch="deliver/${name}-${tag}"
            if [ -n "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
              echo "${name}: ${tag} is already at the gate" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            blob="$(gh api "repos/${REPO}/git/blobs" -f content="$(base64 -w0 "$RUNNER_TEMP/releases.yaml")" -f encoding=base64 --jq .sha)"
            tree="$(gh api "repos/${REPO}/git/trees" -f base_tree="$base_tree" \
              -f "tree[][path]=${RELEASES}" -f "tree[][mode]=100644" -f "tree[][type]=blob" -f "tree[][sha]=${blob}" --jq .sha)"
            commit="$(gh api "repos/${REPO}/git/commits" -f tree="$tree" -f "parents[]=${main}" \
              -f message="feat(${name}): release ${tag}" --jq .sha)"
            gh api "repos/${REPO}/git/refs" -f ref="refs/heads/${branch}" -f sha="$commit" >/dev/null
            url="$(gh pr create --repo "$REPO" --base main --head "$branch" --title "feat(${name}): release ${tag}" \
              --body "$(printf '%s\n' \
                "## Actions for you" "" \
                "Merging this releases ${name} ${tag} to production, which restarts it. Merge when that disturbs nobody." "" \
                "## What this is" "" \
                "The fabricator published \`${tag}\` (\`${digest}\`). This moves the pin in \`${RELEASES}\` to it, and changes nothing else." "" \
                "Procurement opened this; it is never merged without review." "" \
                "Delivered by: ${RUN_URL}")")"
            echo "${name}: ${tag} delivered as ${url##*/}" >> "$GITHUB_STEP_SUMMARY"

            # Older deliveries of this workload are superseded by this one.
            gh pr list --repo "$REPO" --state open --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"deliver/${name}-\")) | select(.headRefName != \"${branch}\") | .number" \
              | while IFS= read -r old; do
                  gh pr close "$old" --repo "$REPO" --delete-branch --comment "Superseded by ${url##*/}, which delivers a newer release." >/dev/null
                done
          done < <(jq -r '.[] | select(.release) | .name' <<<"$ORDERS")
