name: "Epoch Automated Worker"

on:
  schedule:
    - cron: "0 */5 * * *" # Every 5 hours
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  run-epoch-task:
    name: "Execute Autonomous Epoch Task"
    runs-on: self-hosted
    steps:
      - name: Load Secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_ID: "op://homelab/source-control/gemini-bot/app_id"
          PRIVATE_KEY_B64: "op://homelab/source-control/gemini-bot/private_key"
          GEMINI_API_KEY: "op://homelab/source-control/gemini-bot/api_key" # Ensure this is also in 1Password

      - name: Decode Private Key
        id: decode-key
        run: |
          {
            echo 'PEM_CONTENT<<EOF'
            echo "$PRIVATE_KEY_B64" | base64 -d
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Generate Bot Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PEM_CONTENT }}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true # Allows the Python script to run git push

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Epoch Worker
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: go run cmd/epoch-worker/main.go
