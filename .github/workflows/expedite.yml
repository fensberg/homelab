name: "Expedite"

# Expediting: keeping the game server on the build Valve publishes.
#
# Expediting is one duty of procurement (scripts/procurement), and the only one
# that holds elevated permission. On a construction site, expediting chases an
# order with a supplier and gets material to site when it is needed, without
# building or installing anything. This does the same for one item from one
# approved supplier: when Valve
# publishes a new build of the Valheim dedicated server, it records the build
# in scripts/versions.env and submits that one line. The fabricator builds the
# image and the release from it.
#
# WHY IT EXISTS. Valheim clients update themselves through Steam and refuse a
# server on an older build, so every game patch strands every player until the
# server is rebuilt. Before this, that meant a person dispatching a build,
# copying a digest out of a log, editing a manifest, opening, merging and
# tagging - six steps, none of them a decision, and each one a way to get it
# wrong (the log prints the local image id right beside the manifest digest).
#
# THREE JOBS, BECAUSE THEY COST WILDLY DIFFERENT AMOUNTS.
#
#   check    one HTTPS call to Steam's news API. Has Valve posted anything?
#   deliver  only when check says to look: SteamCMD for the real build id,
#            and a pull request changing VALHEIM_STEAM_BUILD_VERSION
#   release  at 4am local: merge that pull request, wait for the fabricator
#            to deliver the release built from it, and merge the delivery if
#            the Steam build is all that changed
#
# The first version of this ran the whole check every fifteen minutes, which
# meant installing a 32-bit library and SteamCMD ninety-six times a day to ask
# one question that changes a few times a year. The operator's objection was
# exactly right, and the split is the answer to it.
#
# WHY CHECK IS A DOORBELL AND NOT A RECEIPT. Steam has no cheap first-party way
# to ask for a dedicated server's build id - ISteamApps/UpToDateCheck refuses
# every dedicated-server appid, and the server appid's news feed carries press
# articles rather than Valve's own posts. The client appid's announcement feed
# does carry them, so that is the doorbell, and SteamCMD in `deliver` remains
# the authority. A missed post must therefore never be the only reason this
# estate believes it is current: the daily pass below takes the authoritative
# route whatever the doorbell said.
#
# WHAT A MERGE DOES NOW. Production runs the release pinned in
# clusters/management/releases.yaml (#510). Merging the expediter's pull
# request changes what the fabricator builds; the fabricator publishes a
# release and procurement delivers it as a pull request moving that pin. The
# 4am window takes both - the second only when its release differs from
# production's by the Steam build alone - so a Steam patch reaches production
# in one window with nobody pressing anything, and anything a person wrote
# still waits for a person.
#
# WHAT KEEPS IT HONEST. The standing order is the procurement GitHub App
# being a bypass actor on the "protected branches" ruleset. That ruleset holds
# the review rule and the required checks together, so the bypass skips both:
# a required check cannot bound it. The release job therefore takes only pull
# requests the App itself opened, runs `superintendent enforce-standing-order`
# against the exact head commit it is about to merge - refusing an expediter
# change beyond the Steam build line, and a delivery whose release differs
# from production's by more than that build, judged from the commits both
# releases were built from - and merges that commit and no later one. The same check runs in
# Sensitive Paths so the verdict shows on the pull request, but it is the one
# here that binds.
#
# ONE APP, ONE DUTY UNDER IT. The App is procurement's - it is procurement
# doing the expediting - but only the expedite duty runs under its credential.
# Procurement's other duties, ordering scripts/deliveries.lock, hold no
# permission, and tests/go/repo refuses any step here that runs a procurement
# verb outside expedite-* (#416).
#
# Configuration, all on the repository rather than in this file so a fork
# brings its own:
#
#   secrets.PROCUREMENT_BOT_CLIENT_ID
#       The App's Client ID, the one beginning "Iv", from its settings page,
#       passed as `client-id`. This was EXPEDITE_BOT_APP_ID, and every
#       delivery from 12 September failed minting a token with "Integration
#       not found" (#439): what was stored was not an ID of this App at all,
#       and the name did not say which value belonged there. It does now, and
#       a guard holds every token input to that.
#   secrets.PROCUREMENT_BOT_PRIVATE_KEY
#       Its private key, generated on the same settings page as the Client ID
#       above - a key from any other App is refused with "A JSON web token
#       could not be decoded". The .pem exactly as GitHub generated it,
#       newlines and all; actions/create-github-app-token cannot parse base64.
#   vars.PROCUREMENT_BOT_LOGIN
#       Its bot login, <app-slug>[bot].
#
# That is now the ONE convention both Apps here use. The clerk used to insist
# on base64 of the PEM, so whoever set this App up copied the App that already
# existed and put base64 where the action wanted a PEM - failing at the token
# step with a message pointing at neither (#382). scripts/clerk/github.go
# accepts both shapes now, so the raw PEM is correct for both and
# copying either App's setup works.
#
# All three were EXPEDITER_* until #416 renamed the role, and EXPEDITE_BOT_*
# until the App was named for the role that holds it. The login is the App's
# slug - the last part of its settings page address - followed by [bot], and a
# slug that does not match the App exactly means nothing is ever released: the
# release job takes only pull requests that login opened.

on:
  schedule:
    # The doorbell, hourly. Off the hour because every other scheduler on the
    # platform fires on it, and GitHub drops scheduled runs under load.
    - cron: "7 * * * *"
    # The authoritative pass, once a day at 08:00 UTC - 3am or 2am in Chicago,
    # so a delivery it finds is built and checked before the release window an
    # hour or two later. This is what catches a post the doorbell missed.
    - cron: "0 8 * * *"
    # The release window: 4am in Chicago is 09:00 UTC in summer and 10:00 UTC in
    # winter. GitHub's scheduler speaks UTC only, so both are asked and
    # `procurement expedite-release-due` says which one is really 4am today. Exactly one of
    # them is, on every day of the year including the two the clocks change on,
    # which that program's tests assert day by day.
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
  # A dispatch by hand runs the whole chain now, ignoring both the doorbell and
  # the hour: for when Valve has just published and everybody is locked out.
  # Deliberately no inputs - Checkov's CKV_GHA_7 refuses any, because an input
  # lets whoever dispatches steer what is built, and the event says enough.
  workflow_dispatch:

permissions:
  contents: read

# One at a time. Two runs taking the same delivery would open the same pull
# request twice and race each other to merge it.
concurrency:
  group: expedite
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The one line the expediter moves. The fabricator builds the image and the
  # release from it; the expediter builds nothing.
  PIN: scripts/versions.env
  APP_ID: "896660"
  REPO: ${{ github.repository }}

jobs:
  check:
    name: "Check deliveries"
    # Not on the release crons: those have nothing to check, they only take what
    # is already waiting.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '7 * * * *' ||
      github.event.schedule == '0 8 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      look: ${{ steps.ask.outputs.look }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            api.steampowered.com:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      # Versions come from scripts/versions.env, which is the only place one
      # is written. See .github/actions/versions for why this is a step
      # rather than a setup job.
      - name: Read pinned versions
        uses: ./.github/actions/versions

      - name: Setup Go
        uses: $/.github/workflows/setup-go

      - name: Ask whether Valve has published anything
        id: ask
        env:
          # The daily pass and a hand dispatch skip the doorbell entirely and go
          # straight to the authority, so a post nobody saw cannot strand the
          # server for longer than a day.
          AUTHORITATIVE: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *' }}
        run: |
          set -euo pipefail
          if [ "$AUTHORITATIVE" = "true" ]; then
            echo "taking the authoritative route: SteamCMD decides, not the news feed"
            echo "look=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A window longer than the gap between checks, so a post made just
          # after one run is still fresh at the next.
          verdict="$(go run -C scripts/procurement . expedite-check -within 90m)"
          echo "look=$([ "$verdict" = look ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deliver:
    name: "Take delivery"
    needs: check
    if: needs.check.outputs.look == 'true'
    runs-on: ubuntu-latest
    # Bounded so a stuck run cannot bill forever. It asks SteamCMD one
    # question and commits one line; the image is the fabricator's to build.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Audit, not block, and this is why: SteamCMD reaches Valve's content
      # servers, which are a changing set of hosts - approved-suppliers.yml
      # records that Valve moves them - so an allowlist would break on Valve's
      # schedule rather than this estate's. The same reasoning, and the same
      # setting, as the image build beside it.
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: audit
          disable-sudo-and-containers: "false"

      - name: Ask SteamCMD what the build actually is
        id: build
        run: |
          set -euo pipefail

          # SteamCMD is a 32-bit binary, the same reason the Dockerfile
          # installs this library.
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 >/dev/null

          steam="$RUNNER_TEMP/steamcmd"
          mkdir -p "$steam"
          curl -fsSL -o "$steam/steamcmd.tar.gz" https://media.steampowered.com/client/steamcmd_linux.tar.gz
          tar -xzf "$steam/steamcmd.tar.gz" -C "$steam"
          # It updates itself on first run and a request in that same run can
          # fail; the Dockerfile learned the same thing.
          "$steam/steamcmd.sh" +quit >/dev/null 2>&1 || true

          # Through scripts/retry.sh rather than a loop of its own.
          #
          # This was a hand-rolled `for attempt in 1 2 3`, and it was the second
          # implementation of one policy - bounded attempts, never a verdict,
          # every attempt reported. Two is two places for that to drift and the
          # third would have been written by somebody who knew about neither.
          #
          # The helper refuses anything not on its declared list, so a caller
          # cannot quietly start retrying a check. steamcmd is on that list
          # because Valve's app_info lookup reports no public build under load,
          # which has nothing to do with the change being tested.
          # $RUNNER_TEMP, never $TMPDIR (#440). GitHub-hosted runners do not
          # set TMPDIR, and under `set -u` the redirect below failed with
          # "TMPDIR: unbound variable" - so SteamCMD never ran, the parser read
          # nothing, and every pass from 17 September reported "no public
          # build". It arrived with #400 on 16 September. Printing the output
          # on failure is what found it, on its first run; the guess made
          # before that evidence existed was wrong, and is not carried here.
          info=""
          if scripts/retry.sh 3 15 "$steam/steamcmd.sh" +login anonymous \
            +app_info_update 1 +app_info_print "$APP_ID" +quit >"$RUNNER_TEMP/steam.out" 2>&1; then
            info="$(cat "$RUNNER_TEMP/steam.out")"
          fi
          build="$(awk '/"branches"/ {b=1} b && /"public"/ {p=1} p && /"buildid"/ {gsub(/[^0-9]/, ""); print; exit}' <<<"$info")"
          if [ -z "$build" ]; then
            # Keep the evidence (#440). This step used to fail with one line
            # and the output that would have explained it discarded, and that
            # is how a week of failures produced nothing anybody could read.
            # SteamCMD logs in anonymously, so there is no credential in it.
            echo "::group::What SteamCMD printed (last 80 lines)"
            tail -n 80 "$RUNNER_TEMP/steam.out" 2>/dev/null || echo "(no output was captured)"
            echo "::endgroup::"
            echo "::error::Steam reported no public build for app ${APP_ID}, so there is nothing to compare. SteamCMD's own output is in the group above."
            exit 1
          fi

          recorded="$(sed -n 's/^VALHEIM_STEAM_BUILD_VERSION=\([0-9]*\)$/\1/p' "$PIN" | head -n 1)"
          echo "Steam's public build: ${build}; pinned in ${PIN}: ${recorded:-nothing}"

          if [ "$build" = "$recorded" ]; then
            echo "no delivery: the server already runs build ${build}" >> "$GITHUB_STEP_SUMMARY"
            echo "deliver=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "delivery: Steam build ${build}, replacing ${recorded:-nothing}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "deliver=true"
            echo "build=${build}"
            echo "recorded=${recorded}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint the expedite token
        id: token
        if: steps.build.outputs.deliver == 'true'
        uses: $/.github/workflows/app-token
        with:
          client-id: ${{ secrets.PROCUREMENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROCUREMENT_BOT_PRIVATE_KEY }}
          # Only what the steps below use, not everything the App was granted
          # at installation (zizmor's github-app audit). Contents to commit the
          # pin; pull requests to open one.
          permission-contents: write
          permission-pull-requests: write
          # This repository only - the token cannot reach anything else the
          # App happens to be installed on.
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Through the API rather than git push. A commit created there is signed
      # by GitHub on the App's behalf, which the ruleset requiring signatures on
      # every branch accepts; a push from this runner would be unsigned and
      # refused - the same reasoning scripts/signedpush documents.
      - name: Submit it
        id: submit
        if: steps.build.outputs.deliver == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BUILD: ${{ steps.build.outputs.build }}
          RECORDED: ${{ steps.build.outputs.recorded }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="expedite/valheim-steam-${BUILD}"

          # A delivery already submitted is picked up again, not submitted
          # twice - the release window may not have come round yet.
          pr="$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            echo "pull request #${pr} already carries this delivery"
            exit 0
          fi

          # Edit main as it is now, not the checkout: main can have moved since
          # this run started, and the commit's parent is main.
          base="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          base_tree="$(gh api "repos/${REPO}/git/commits/${base}" --jq .tree.sha)"
          gh api "repos/${REPO}/contents/${PIN}?ref=${base}" --jq .content | base64 -d > "$RUNNER_TEMP/pin.yaml"

          sed -i -E "s#^VALHEIM_STEAM_BUILD_VERSION=[0-9]*\$#VALHEIM_STEAM_BUILD_VERSION=${BUILD}#" "$RUNNER_TEMP/pin.yaml"
          if ! grep -qx "VALHEIM_STEAM_BUILD_VERSION=${BUILD}" "$RUNNER_TEMP/pin.yaml"; then
            echo "::error::could not find the VALHEIM_STEAM_BUILD_VERSION line in ${PIN}; its shape has changed and this needs updating"
            exit 1
          fi

          blob="$(gh api "repos/${REPO}/git/blobs" -f content="$(base64 -w0 "$RUNNER_TEMP/pin.yaml")" -f encoding=base64 --jq .sha)"
          tree="$(gh api "repos/${REPO}/git/trees" \
            -f base_tree="$base_tree" \
            -f "tree[][path]=${PIN}" \
            -f "tree[][mode]=100644" \
            -f "tree[][type]=blob" \
            -f "tree[][sha]=${blob}" \
            --jq .sha)"
          message="$(printf '%s\n' \
            "feat: take delivery of Valheim server build ${BUILD}" \
            "" \
            "Valve published a new build of the dedicated server, and clients refuse" \
            "a server on an older one. Pins it; the fabricator builds the image and" \
            "the release from the pin." \
            "" \
            "Taken by expediting: ${RUN_URL}")"
          # No author, committer or signature field: GitHub signs on the App's
          # behalf and attributes the commit to it.
          commit="$(gh api "repos/${REPO}/git/commits" -f message="$message" -f tree="$tree" -f "parents[]=${base}" --jq .sha)"
          gh api "repos/${REPO}/git/refs" -f ref="refs/heads/${branch}" -f sha="$commit" >/dev/null

          url="$(gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "feat: take delivery of Valheim server build ${BUILD}" \
            --body "$(printf '%s\n' \
              "## What this is" \
              "" \
              "Valve published build **${BUILD}** of the Valheim dedicated server. Players' clients update themselves and refuse a server on an older build, so this pins it in \`${PIN}\`: Steam build \`${RECORDED:-unknown}\` → \`${BUILD}\`." \
              "" \
              "## What happens next" \
              "" \
              "Nothing needs you. At 4am America/Chicago the expediter merges this under its standing order, which covers this one line and refuses anything more. The fabricator then builds the image and the release, procurement delivers it, and the same window merges that delivery if the Steam build is all that changed. A release carrying anything else waits for a review." \
              "" \
              "Taken by expediting: ${RUN_URL}")")"
          echo "opened ${url##*/}" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: "Release what is waiting"
    # After deliver when there is one, on its own when the window comes round
    # and something is already waiting. always(), because a skipped deliver is
    # the ordinary case at 4am.
    needs: [check, deliver]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.schedule == '0 9 * * *' ||
       github.event.schedule == '0 10 * * *')
    runs-on: ubuntu-latest
    # Long enough to merge the expediter's pull request, wait for the
    # fabricator to build and deliver the release, and take that too.
    timeout-minutes: 100
    # Actions read, to find and follow the fabricator's run on the merge.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      # Versions come from scripts/versions.env, which is the only place one
      # is written. See .github/actions/versions for why this is a step
      # rather than a setup job.
      - name: Read pinned versions
        uses: ./.github/actions/versions

      - name: Setup Go
        uses: $/.github/workflows/setup-go

      # 4am in Chicago, decided by the program rather than by which cron fired,
      # so the hour is right on both sides of the daylight-saving change.
      - name: Is it the hour
        id: window
        env:
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$DISPATCHED" = "true" ]; then
            echo "dispatched by hand: releasing now rather than waiting for the window"
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verdict="$(go run -C scripts/procurement . expedite-release-due)"
          echo "due=$([ "$verdict" = due ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Mint the expedite token
        id: token
        if: steps.window.outputs.due == 'true'
        uses: $/.github/workflows/app-token
        with:
          client-id: ${{ secrets.PROCUREMENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROCUREMENT_BOT_PRIVATE_KEY }}
          # Contents to merge; pull requests to find, comment on and
          # merge; checks and statuses to see whether the required checks passed.
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Find what is waiting
        id: waiting
        if: steps.window.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HOLDER: ${{ vars.PROCUREMENT_BOT_LOGIN }}
        run: |
          set -euo pipefail
          # Only what the holder itself opened, from this repository. A branch
          # name is not an identity: anyone who can push an expedite/ branch
          # could otherwise put their pull request in front of the bypass.
          # With no holder configured there is no standing order and nothing
          # is taken.
          if [ -z "$HOLDER" ]; then
            echo "no standing order is configured (PROCUREMENT_BOT_LOGIN is unset), so nothing is released" >> "$GITHUB_STEP_SUMMARY"
            echo "pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The oldest open delivery, so two waiting are taken in the order they
          # were submitted rather than newest first.
          pr="$(gh api "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '[.[] | select(.user.login == env.HOLDER and .head.repo.full_name == env.REPO and (.head.ref | startswith("expedite/valheim-steam-")))] | sort_by(.number) | .[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "nothing ${HOLDER} opened is waiting to be released" >> "$GITHUB_STEP_SUMMARY"
            echo "pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          gh pr view "$pr" --repo "$REPO" --json title --jq '"releasing #'"$pr"': \(.title)"'

      - name: Wait for every required check
        if: steps.waiting.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.waiting.outputs.pr }}
        run: |
          set -euo pipefail
          # Checks register a few seconds after a pull request opens, and asking
          # before then is answered "no checks reported". gh answers 0 when
          # every check has passed and 8 while any is still pending; either
          # means they are registered.
          for _ in $(seq 1 20); do
            rc=0
            gh pr checks "$PR" --repo "$REPO" --required >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 8 ]; then break; fi
            sleep 15
          done
          if ! timeout 25m gh pr checks "$PR" --repo "$REPO" --required --watch --interval 30 --fail-fast; then
            gh pr comment "$PR" --repo "$REPO" --body "A required check did not pass, so expediting is leaving this for a person. If it was the Super-Linter hang (#365), re-running that job is usually enough; merging is then an ordinary review."
            exit 1
          fi

      - name: Merge under the standing order
        id: merge
        if: steps.waiting.outputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.waiting.outputs.pr }}
          HOLDER: ${{ vars.PROCUREMENT_BOT_LOGIN }}
        run: |
          set -euo pipefail
          # The bypass skips the whole "protected branches" ruleset - review
          # and required checks alike, because they are one ruleset. So the
          # order is judged here, at the point of use, against the exact commit
          # about to merge, rather than trusted from a check that ran earlier
          # with whatever PROCUREMENT_BOT_LOGIN said then.
          read -r author head target <<<"$(gh api "repos/${REPO}/pulls/${PR}" --jq '"\(.user.login) \(.head.sha) \(.base.ref)"')"
          if [ -z "$HOLDER" ] || [ "$author" != "$HOLDER" ]; then
            echo "::error::#${PR} was opened by ${author}, and the standing order is held by '${HOLDER}'. Nothing is merged under the bypass for anyone else."
            exit 1
          fi
          base="$(gh api "repos/${REPO}/compare/${target}...${head}" --jq .merge_base_commit.sha)"
          git fetch --no-tags --depth=1 origin "$base" "$head"
          # -bypass: this merge skips review, so only what the order covers
          # passes - a delivery of a release never does.
          if ! go run -C scripts/superintendent . enforce-standing-order -bypass -author "$author" -base "$base" -head "$head"; then
            gh pr comment "$PR" --repo "$REPO" --body "Refused under the standing order at merge time: this changes more than the Steam build. It waits for a review."
            exit 1
          fi
          build="$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq '.headRefName | sub("^expedite/valheim-steam-"; "")')"
          # --admin is how a ruleset bypass actor merges: without it gh refuses
          # on its own side ("the base branch policy prohibits the merge") and
          # never asks. --match-head-commit makes GitHub refuse if anything was
          # pushed after the commit judged above.
          #
          # An explicit message, kept inside commitlint's line limits, rather
          # than whatever the repository's squash default assembles from the
          # pull request body - which carries a table and long lines.
          if ! gh pr merge "$PR" --repo "$REPO" --squash --admin --match-head-commit "$head" \
            --subject "feat: take delivery of Valheim server build ${build} (#${PR})" \
            --body "Merged by expediting under its standing order, in the 4am release window, after every required check passed."; then
            gh pr comment "$PR" --repo "$REPO" --body "Every required check passed and the change is within the standing order, but GitHub refused the merge. The procurement App is probably not a bypass actor on the \"protected branches\" ruleset; until it is, this waits for a review."
            exit 1
          fi
          echo "merged #${PR}: Steam build ${build}" >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$(gh pr view "$PR" --repo "$REPO" --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"

      # The pull request just merged only changes what the fabricator builds.
      # Production moves when the release built from it is delivered, so the
      # window waits for that delivery rather than leaving it for tomorrow's:
      # players' clients update the day Valve ships and refuse an older server.
      - name: Wait for the fabricator to deliver the release
        if: steps.merge.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          run=""
          for _ in $(seq 1 20); do
            run="$(gh run list --repo "$REPO" --workflow fabricator.yml --commit "$SHA" --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run" ] && break
            sleep 15
          done
          if [ -z "$run" ]; then
            echo "::error::the fabricator never started for ${SHA}, so there is no release to take"
            exit 1
          fi
          if ! timeout 60m gh run watch "$run" --repo "$REPO" --exit-status --interval 30 >/dev/null; then
            echo "::error::the fabricator's run ${run} did not succeed, so its release is left for a person"
            exit 1
          fi
          echo "the fabricator finished run ${run}" >> "$GITHUB_STEP_SUMMARY"

      # Every delivery the holder opened is taken if the release changes
      # nothing but the Steam build - judged against the commits its releases
      # were built from, which the registry records. Anything else waits for a
      # review, however it arrived.
      - name: Release the deliveries whose only change is the Steam build
        if: steps.window.outputs.due == 'true' && !failure()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HOLDER: ${{ vars.PROCUREMENT_BOT_LOGIN }}
        run: |
          set -euo pipefail
          if [ -z "$HOLDER" ]; then
            echo "no standing order is configured, so no delivery is released" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          prs="$(gh api "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '[.[] | select(.user.login == env.HOLDER and .head.repo.full_name == env.REPO and (.head.ref | startswith("deliver/")))] | sort_by(.number) | .[].number')"
          if [ -z "$prs" ]; then
            echo "no delivery is waiting" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for pr in $prs; do
            for _ in $(seq 1 20); do
              rc=0
              gh pr checks "$pr" --repo "$REPO" --required >/dev/null 2>&1 || rc=$?
              if [ "$rc" -eq 0 ] || [ "$rc" -eq 8 ]; then break; fi
              sleep 15
            done
            if ! timeout 20m gh pr checks "$pr" --repo "$REPO" --required --watch --interval 30 --fail-fast >/dev/null; then
              echo "#${pr}: a required check did not pass, so it is left for a person" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            read -r author head target <<<"$(gh api "repos/${REPO}/pulls/${pr}" --jq '"\(.user.login) \(.head.sha) \(.base.ref)"')"
            base="$(gh api "repos/${REPO}/compare/${target}...${head}" --jq .merge_base_commit.sha)"
            git fetch --no-tags --depth=1 origin "$base" "$head"
            if ! go run -C scripts/superintendent . enforce-standing-order -bypass -author "$author" -base "$base" -head "$head"; then
              echo "#${pr}: the release changes more than the Steam build, so it waits for a review" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            title="$(gh pr view "$pr" --repo "$REPO" --json title --jq .title)"
            if ! gh pr merge "$pr" --repo "$REPO" --squash --admin --match-head-commit "$head" \
              --subject "${title} (#${pr})" \
              --body "Merged under the standing order in the 4am window: the release changes nothing but the Steam build."; then
              gh pr comment "$pr" --repo "$REPO" --body "The release changes nothing but the Steam build and every required check passed, but GitHub refused the merge. It waits for a review."
              continue
            fi
            echo "merged #${pr}: ${title}" >> "$GITHUB_STEP_SUMMARY"
          done
