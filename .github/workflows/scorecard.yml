name: "Scorecard"

# Scorecard grades the repository, not the diff: branch protection, token
# permissions, pinned actions, whether a security policy exists. Almost none of
# that can change in a pull request, so running it on every one spent two
# minutes to re-derive the same grade and told nobody anything new.
#
# Weekly, and on merges to main, is when the answer can actually differ.
on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: read-all

# GitHub's default shell for `run:` is `bash -e {0}`, which has no
# pipefail: in `a | b` only b's exit status counts, so a failing command
# feeding a working one is a green step. Naming the shell explicitly gets
# `bash --noprofile --norc -eo pipefail {0}` instead.
#
# Not theoretical here. `tofu plan | tee` reported success and posted an
# empty pull request comment, and `rclone version | head -1` verified
# nothing while passing - both silent, both green, both wrong answers
# rather than errors. It is set on every workflow, including those with no
# `run:` step today, so the one added tomorrow is already covered.
#
# tests/go/repo/pipefail_test.go asserts this is present.
defaults:
  run:
    shell: bash

jobs:
  scorecard:
    name: "Repository Posture"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Scorecard queries several public datasets to build its grade.
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            api.securityscorecards.dev:443
            fulcio.sigstore.dev:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: results.sarif
