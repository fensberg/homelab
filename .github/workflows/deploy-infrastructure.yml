name: Deploy Infrastructure
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "environments/**/infrastructure/**"
      - "modules/infrastructure/**"

permissions:
  contents: read

jobs:
  apply:
    name: Apply OpenTofu
    runs-on: self-hosted
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Stays audit, not block, until this job has actually run: it
          # applies whatever `environments/` and `modules/` turn out to
          # need - Proxmox, Cloudflare, Tailscale, object storage, the state
          # Postgres, the OpenTofu registry - and none of those hosts are
          # known yet because neither directory exists (epoch 02/03, not
          # started; this workflow's path filters mean it cannot trigger
          # today). Flip to block with the observed allowed-endpoints before
          # this job ever runs for real - not before, since a guessed
          # allowlist on the one job with write access to real
          # infrastructure is worse than an audited one.
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine Target Directory
        id: set-env

        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" == "tag" ]; then
            echo "DIR=environments/production/infrastructure/" >> "$GITHUB_ENV"
            echo "🚀 Deploying to Production (Tag: $REF_NAME)"
          else
            echo "DIR=environments/staging/infrastructure/" >> "$GITHUB_ENV"
            echo "🛠️ Deploying to Staging (Branch: main)"
          fi

      - name: Tofu Init
        run: tofu init
        working-directory: ${{ env.DIR }}

      - name: Tofu Apply
        run: tofu apply -auto-approve
        working-directory: ${{ env.DIR }}
