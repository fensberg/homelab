name: Deploy Infrastructure

# Two halves of one gate.
#
# A pull request touching infrastructure gets a plan, posted back to it. A
# merge applies THAT PLAN - saved to a file and applied from the file, so what
# lands is what was reviewed rather than whatever a second, later plan happens
# to resolve. `tofu apply -auto-approve` with no plan anywhere, which is what
# this workflow used to do, is the version where nobody ever sees the change
# before it happens.
#
# Neither half has ever run: environments/ and modules/ do not exist yet
# (epochs 02 and 03), and the path filters mean nothing here can trigger. That
# is exactly why it is worth fixing now - the gate is cheap to add before the
# first real deployment and awkward to retrofit after.
on:
  pull_request:
    paths:
      - "environments/**/infrastructure/**"
      - "modules/infrastructure/**"
      - "management/**"
      - "config/management.tpl.json"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      # The ignition tier. A merge here converges the estate that already
      # exists; it never ignites one. See CLAUDE.md, "Ignition is local-only;
      # convergence is not".
      - "management/**"
      - "config/management.tpl.json"
      - "environments/**/infrastructure/**"
      - "modules/infrastructure/**"

permissions:
  contents: read

# One at a time, and never cancelled mid-flight. There is one estate and one
# state lock; a cancelled apply is how state gets left locked or half-written.
concurrency:
  group: deploy-infrastructure-${{ github.ref }}
  cancel-in-progress: false

# GitHub's default shell for `run:` is `bash -e {0}`, which has no
# pipefail: in `a | b` only b's exit status counts, so a failing command
# feeding a working one is a green step. Naming the shell explicitly gets
# `bash --noprofile --norc -eo pipefail {0}` instead.
#
# Not theoretical here. `tofu plan | tee` reported success and posted an
# empty pull request comment, and `rclone version | head -1` verified
# nothing while passing - both silent, both green, both wrong answers
# rather than errors. It is set on every workflow, including those with no
# `run:` step today, so the one added tomorrow is already covered.
#
# tests/go/repo/pipefail_test.go asserts this is present.
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------
  # ROUTING - which tier does this change touch, and which sites exist?
  #
  # Runs on both events. The site list comes from the config and never
  # depended on the diff; the classification does, and a pull request needs
  # it just as much as a push - without it, a management-only PR would plan
  # a workload directory that the change never touched.
  #
  # Hermetic, so it stays off the self-hosted runner: deciding what to run
  # needs no credentials, and giving it any would widen what a mistake here
  # reaches.
  # ---------------------------------------------------------------------
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 10
    outputs:
      management: ${{ steps.filter.outputs.management }}
      workload: ${{ steps.filter.outputs.workload }}
      sites: ${{ steps.sites.outputs.sites }}
    steps:
      # This job had no harden-runner at all until the building code went in -
      # it began at checkout. Hermetic and credential-free, so the exposure was
      # small, but it is the classification step for the workflow that applies
      # OpenTofu, and "small" is not the standard the other jobs are held to.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deep enough to diff a pull request against its base. This
          # repository is small; the cost is seconds and the alternative is
          # guessing at a merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A tag is always a workload-tier production release. management/ is
          # never released by tag - the estate has one version, the running one.
          if [ "${EVENT}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            echo "management=false" >> "$GITHUB_OUTPUT"
            echo "workload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${EVENT}" = "pull_request" ]; then
            files="$(git diff --name-only "${PR_BASE}" "${PR_HEAD}")"
          elif ! files="$(git diff --name-only "${PUSH_BEFORE}" "${PUSH_AFTER}" 2>/dev/null)"; then
            files="$(git diff --name-only HEAD~1 HEAD)"
          fi

          echo "changed files:"; echo "${files}"
          mgmt=false; work=false
          grep -qE '^(management/|config/management\.tpl\.json$)' <<<"${files}" && mgmt=true
          grep -qE '^(environments/|modules/)' <<<"${files}" && work=true
          echo "management=${mgmt}" >> "$GITHUB_OUTPUT"
          echo "workload=${work}" >> "$GITHUB_OUTPUT"

      - name: List the sites the config declares
        id: sites
        run: |
          set -euo pipefail
          # The template, not the rendered config: this job holds no vault
          # credentials. Site keys are plaintext structure; only their values
          # are op:// references.
          sites="$(jq -c '.sites | keys' config/management.tpl.json)"
          echo "sites=${sites}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # PLAN - on a pull request. Reads real state, changes nothing.
  # ---------------------------------------------------------------------
  plan:
    name: Plan
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.workload == 'true'
    # A fork's pull request must never reach this job. It runs on the
    # self-hosted runner with real credentials, and the condition above is
    # what keeps an outside contributor's branch away from them - the same
    # boundary pr-validation.yml holds by being hermetic.
    runs-on: homelab-management
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # audit, not block, for the reason the apply job below gives: the
          # endpoints this reaches are not known until it has actually run
          # once, and a guessed allowlist on a job that touches real
          # infrastructure is worse than an audited one.
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine Target Directory
        run: echo "DIR=environments/staging/infrastructure/" >> "$GITHUB_ENV"

      - name: Tofu Init
        run: tofu init -input=false
        working-directory: ${{ env.DIR }}

      # -detailed-exitcode: 0 = no changes, 2 = changes pending, 1 = the plan
      # itself failed. Only 1 is a failure worth stopping for; 2 is the normal
      # reason a deployment pull request exists at all.
      - name: Tofu Plan
        id: plan
        working-directory: ${{ env.DIR }}
        run: |
          set +e
          tofu plan -input=false -no-color -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" = "1" ]; then
            echo "::error::tofu plan failed"
            tail -50 plan.txt
            exit 1
          fi
          tofu show -no-color tfplan > plan-readable.txt

      # The readable plan goes to the job summary rather than into a pull
      # request comment. Terraform redacts values it knows are sensitive, but
      # "sensitive" is a property somebody has to have declared - anything
      # not marked stays in plain text, and a plan is full of resource
      # attributes nobody thought of that way. The summary is visible to
      # whoever can already see the run; the comment below carries only
      # counts and a link.
      - name: Write the plan to the job summary
        working-directory: ${{ env.DIR }}
        run: |
          {
            echo "### Plan: \`${DIR}\`"
            echo
            echo '```terraform'
            head -c 60000 plan-readable.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the plan summary on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
          DIR: ${{ env.DIR }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.DIR}/plan-readable.txt`, 'utf8');
            const m = plan.match(/Plan: (\d+) to add, (\d+) to change, (\d+) to destroy/);
            const counts = m
              ? `**${m[1]}** to add · **${m[2]}** to change · **${m[3]}** to destroy`
              : (process.env.EXITCODE === '0' ? 'No changes.' : 'Could not parse a change count.');
            const body = [
              `### OpenTofu plan — \`${process.env.DIR}\``,
              '',
              counts,
              '',
              m && Number(m[3]) > 0
                ? '> This plan **destroys** resources. Read the full plan before approving.'
                : '',
              '',
              `The full plan is in the [job summary](${context.payload.repository.html_url}/actions/runs/${context.runId}) — it is not posted here, because a plan can contain attribute values nobody remembered to mark sensitive.`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ---------------------------------------------------------------------
  # APPLY - on merge to main, or a tag. Applies a plan made in this run.
  # ---------------------------------------------------------------------
  apply:
    name: Apply
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.workload == 'true'
    runs-on: homelab-management
    # The environment is the human gate. Configure required reviewers on
    # `production` so a tag cannot deploy unattended; `staging` is where a
    # merge to main lands.
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # Stays audit, not block, until this job has actually run: it
          # applies whatever `environments/` and `modules/` turn out to
          # need - Proxmox, Cloudflare, Tailscale, object storage, the state
          # Postgres, the OpenTofu registry - and none of those hosts are
          # known yet because neither directory exists. Flip to block with
          # the observed allowed-endpoints before this job ever runs for
          # real - not before, since a guessed allowlist on the one job with
          # write access to real infrastructure is worse than an audited one.
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine Target Directory
        id: set-env
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" == "tag" ]; then
            echo "DIR=environments/production/infrastructure/" >> "$GITHUB_ENV"
            echo "🚀 Deploying to Production (Tag: $REF_NAME)"
          else
            echo "DIR=environments/staging/infrastructure/" >> "$GITHUB_ENV"
            echo "🛠️ Deploying to Staging (Branch: $REF_NAME)"
          fi

      - name: Tofu Init
        run: tofu init -input=false
        working-directory: ${{ env.DIR }}

      # Plan to a file, then apply that file. Not `apply -auto-approve`, which
      # re-plans internally and applies whatever it finds at that moment -
      # including a change that arrived between the review and the merge.
      - name: Tofu Plan
        working-directory: ${{ env.DIR }}
        run: tofu plan -input=false -no-color -out=tfplan

      - name: Show what is about to be applied
        working-directory: ${{ env.DIR }}
        run: |
          {
            echo "### Applying: \`${DIR}\`"
            echo
            echo '```terraform'
            tofu show -no-color tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tofu Apply
        working-directory: ${{ env.DIR }}
        run: tofu apply -input=false tfplan
  # ---------------------------------------------------------------------
  # CONVERGE - on merge to main, for the ignition tier.
  #
  # Not `apply` with a different directory. The workload tier is plain
  # OpenTofu in a folder; the estate is a phased program that renders
  # secrets, attaches to state living in this cluster, applies, re-backs-up
  # and sterilises. `contractor converge` is that sequence.
  #
  # READ BEFORE WIDENING: this runner lives inside the cluster it is
  # converging. Adding a control-plane node is safe. A change that disrupts
  # the control plane or the state database kills this job midway through its
  # own apply. If that becomes routine, add required reviewers to the
  # environment below - the merge stops being the only gate.
  # ---------------------------------------------------------------------
  converge:
    name: Converge ${{ matrix.site }}
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.management == 'true'
    runs-on: homelab-management
    environment: management
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      # Each site has its own state database and its own lock, so two sites
      # converge independently. fail-fast off: one site failing is not a
      # reason to abandon another that was fine.
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.sites) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # audit, not block, for the same reason the apply job gives: this
          # reaches 1Password, Proxmox, Tailscale, Cloudflare, the Kubernetes
          # API and the OpenTofu registry, and several of those addresses are
          # deliberately not in git. Transcribe the observed endpoints after
          # the first real run, then flip to block.
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          # No cache. scripts/contractor has zero external dependencies, so the
          # cache saves nothing - and on a self-hosted runner it persists
          # between jobs, which is a poisoning surface for no benefit.
          cache: false

      # Built and run directly, not through `task`: task does not proxy SIGINT
      # to the process it supervises (go-task/task#1408).
      - name: Converge
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SITE: ${{ matrix.site }}
        run: |
          go build -C scripts/contractor -o contractor .
          set +e
          ./scripts/contractor/contractor converge -site "$SITE"
          code=$?
          set -e
          # The verdict, not just the failure. contractor exits 2 when the
          # estate is provably untouched and 1 when something was written or
          # it could not tell - see reportPreexistingFailure in main.go. The
          # aftermath job below can only be exact about a revert if it knows
          # which of those happened, and an exit code is the only channel that
          # survives without parsing prose out of a log.
          mkdir -p verdict
          echo "$code" > "verdict/$SITE"
          exit $code

      # Written even on success, so a missing file means the job died rather
      # than that everything was fine. Absent and "exit 0" must not look the
      # same to the job that decides whether to revert.
      - name: Record the verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: converge-verdict-${{ matrix.site }}
          path: verdict/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # AFTERMATH - make main stop being wrong after a failed converge.
  #
  # `main` is not a request. plan compares against it, demolish evaluates
  # cluster health against it, and the next converge computes a diff from it.
  # When a converge fails, the merge that caused it stays on main and every one
  # of those reads a statement about real infrastructure that is not true
  # (#130).
  #
  # Branch protection cannot fix this: required checks run before a merge and
  # the converge runs after it. So the answer is not to prevent the merge, it
  # is to stop main being wrong afterwards.
  #
  # Deliberately a separate job on a GitHub-hosted runner. The converge job
  # holds the vault token and applies real infrastructure; it stays at
  # contents: read. This one can write a branch and cannot reach the estate.
  # ---------------------------------------------------------------------
  aftermath:
    name: Aftermath
    needs: [changes, converge]
    if: always() && needs.converge.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # persist-credentials: false, like every other checkout here. The push
      # below carries the token on the remote URL for the one command that
      # needs it, rather than leaving it in .git/config for the rest of the
      # job - which is what zizmor's artipacked audit is about, and it is
      # right: a credential in a file outlives the step that wanted it.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect the verdicts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: converge-verdict-*
          path: verdicts
          merge-multiple: true

      # Exact, or not at all.
      #
      # A blind revert is a machine that deletes infrastructure in response to
      # a flaky failure: fail while creating the fourth of five machines and
      # reality is four, so reverting the config to three makes main wrong in
      # the other direction and the next converge plans a destroy.
      #
      # So reverting needs every site to have reported 2 - provably untouched.
      # Anything else, including a missing verdict, is "not known" and gets an
      # alarm instead. Not knowing and nothing being wrong must not look the
      # same, which is this estate's standing rule about checks that can be off.
      - name: Decide whether a revert is exact
        id: verdict
        env:
          SITES: ${{ needs.changes.outputs.sites }}
        run: |
          exact=true
          detail=""
          for site in $(echo "$SITES" | tr -d '[]"' | tr ',' ' '); do
            f="verdicts/$site"
            if [ ! -f "$f" ]; then
              exact=false
              detail="${detail}- ${site}: no verdict recorded, so the job died before it could say\n"
              continue
            fi
            code=$(tr -d '[:space:]' < "$f")
            case "$code" in
              0) detail="${detail}- ${site}: converged\n" ;;
              2) detail="${detail}- ${site}: failed before anything was applied\n" ;;
              *) exact=false
                 detail="${detail}- ${site}: failed with exit ${code} - something may have been written\n" ;;
            esac
          done
          echo "exact=$exact" >>"$GITHUB_OUTPUT"
          {
            echo "detail<<VERDICT_EOF"
            printf '%b' "$detail"
            echo "VERDICT_EOF"
          } >>"$GITHUB_OUTPUT"

      # The estate is provably untouched, so returning main to the last
      # converged state is exact rather than a guess.
      #
      # A pull request rather than a push. It keeps the change visible and
      # re-mergeable once the cause is fixed, and it does not put an automated
      # commit on main - which is the thing this repository is careful about
      # everywhere else.
      - name: Revert the merge, as a pull request
        if: steps.verdict.outputs.exact == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DETAIL: ${{ steps.verdict.outputs.detail }}
        run: |
          branch="revert/converge-failed-${SHA::8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          # -m 1 only for a merge commit. This repository squash-merges, so the
          # commit on main usually has one parent and -m would be refused.
          if [ "$(git rev-list --parents -n 1 "$SHA" | wc -w)" -gt 2 ]; then
            git revert --no-edit -m 1 "$SHA"
          else
            git revert --no-edit "$SHA"
          fi

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --base main --head "$branch" \
            --title "revert: the converge for ${SHA::8} failed before it applied anything" \
            --body "$(printf '%s\n' \
              "The converge that should have applied ${SHA::8} failed, and \`main\` now describes an estate that does not exist." \
              "" \
              "Per site:" \
              "$DETAIL" \
              "Every site failed **before anything was applied**, so the estate is provably untouched and returning \`main\` to the previous state is exact rather than a guess. That is the only case this is opened automatically for." \
              "" \
              "Merging this makes the repository true again. The original change is not lost - re-open it once the cause is fixed." \
              "" \
              "Failed run: $RUN_URL")"

      # Not knowing is the loud case.
      #
      # No revert here: something may have been written, so returning the
      # config would make main wrong in the other direction. An issue rather
      # than a passing mention, because this does not self-clear - it stays
      # open until somebody converges or corrects the config.
      - name: Alarm, because the estate's state is not known
        if: steps.verdict.outputs.exact != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DETAIL: ${{ steps.verdict.outputs.detail }}
        run: |
          gh issue create \
            --title "A converge failed after it may have applied something (${SHA::8})" \
            --label "priority:P1,type:correctness,epoch:01" \
            --body "$(printf '%s\n' \
              "\`main\` says one thing and the estate may say another. This was **not** reverted, deliberately." \
              "" \
              "Per site:" \
              "$DETAIL" \
              "A converge that failed partway through applying leaves reality somewhere between the old config and the new one. Reverting would make \`main\` wrong in the other direction, and the next converge would compute a diff from a baseline nobody checked - which is how an automated revert becomes a machine that destroys infrastructure in response to a flaky failure." \
              "" \
              "**What to do:** run \`task plan SITE=<site>\` to see what is actually there, then either converge again or correct the config to match. This issue does not close itself." \
              "" \
              "Failed run: $RUN_URL")"

  # ---------------------------------------------------------------------
  # PLAN THE ESTATE - on a pull request touching management/.
  # Reads real state, changes nothing. Structure only, never a value:
  # this comment is world-readable.
  # ---------------------------------------------------------------------
  plan-estate:
    name: Plan ${{ matrix.site }}
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.management == 'true'
    runs-on: homelab-management
    environment: management
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.sites) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: false

      - name: Plan
        id: plan
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SITE: ${{ matrix.site }}
        run: |
          go build -C scripts/contractor -o contractor .
          ./scripts/contractor/contractor plan -site "$SITE" -comment-out plan-comment.md

      - name: Comment the plan on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The body is written by `contractor plan`, not assembled here.
            // Copy that needs a workflow edit to fix is copy that stays wrong,
            // because the agent cannot edit workflows - the same reason
            // sensitive-paths.yml builds its comment in a script.
            const fs = require('fs');
            const body = fs.readFileSync('plan-comment.md', 'utf8');
            const marker = body.split('\n')[0];

            // Replace this site's previous plan rather than adding another.
            // A pull request that planned three times carried three comments
            // and the reader had to work out which one was current.
            const {data: comments} = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            const args = {owner: context.repo.owner, repo: context.repo.repo, body};
            if (existing) {
              await github.rest.issues.updateComment({...args, comment_id: existing.id});
            } else {
              await github.rest.issues.createComment({...args, issue_number: context.issue.number});
            }

  # ---------------------------------------------------------------------
  # NO PLAN, SAID OUT LOUD - #156.
  #
  # `Plan site0` is not a required status check, and making it one would
  # deadlock this estate: the runner is a pod inside the cluster, so when the
  # cluster is down no plan can be produced - precisely when the estate most
  # needs the pull request that rebuilds it. That circularity is the one epoch
  # 01 is built around, and it applies to the gate as much as to the tooling.
  #
  # So this is visibility, not enforcement. #140 changed the machine count,
  # its plan job was cancelled against a runner that did not exist, and the
  # pull request read "24 of 25 checks passed" and merged. Nothing anywhere
  # said a change to real infrastructure had landed unplanned.
  #
  # An absent comment currently looks identical to a change nobody thought
  # needed one. This makes those two different.
  # ---------------------------------------------------------------------
  plan-absence:
    name: Plan absence
    needs: [changes, plan-estate]
    # always(), so this still runs when plan-estate was cancelled or skipped -
    # which is the whole case it exists for.
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.management == 'true' &&
      needs.plan-estate.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Say that no plan was produced
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.plan-estate.result }}
        with:
          script: |
            const marker = '<!-- plan-absence -->';
            const body = [
              marker,
              '## No plan was produced for this change',
              '',
              'This pull request changes `management/`, and the plan job ended as' +
              ' **`' + process.env.RESULT + '`** rather than succeeding. Nothing here' +
              ' compared the proposed configuration against the estate that exists.',
              '',
              'That is not a blocker and is not meant to be. The plan runs on a runner' +
              ' inside the cluster, so when the cluster is down no plan can be produced -' +
              ' which is exactly when the pull request rebuilding it needs to merge.' +
              ' Requiring a plan would deadlock that.',
              '',
              'What it means for a reviewer: approving this is approving HCL rather than' +
              ' its consequences. If the estate is up, re-running the plan job is worth' +
              ' more than reading the diff again.',
            ].join('\n');

            // One comment per pull request, replaced rather than appended. The
            // workload plan comment already does this; the estate plan comment
            // does not, which is #160.
            const {data: comments} = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            const args = {owner: context.repo.owner, repo: context.repo.repo, body};
            if (existing) {
              await github.rest.issues.updateComment({...args, comment_id: existing.id});
            } else {
              await github.rest.issues.createComment({...args, issue_number: context.issue.number});
            }
