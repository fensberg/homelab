name: Deploy Infrastructure

# Named for what the run does (#155): "Deploy Infrastructure  main  Queued"
# said nothing about which change it was converging.
run-name: "Converge: ${{ github.event.head_commit.message }}"

# The merge half of one gate; plan-infrastructure.yml is the pull request's.
#
# A pull request touching infrastructure gets a plan, posted back to it. A
# merge applies THAT PLAN - saved to a file and applied from the file, so what
# lands is what was reviewed rather than whatever a second, later plan happens
# to resolve. `tofu apply -auto-approve` with no plan anywhere, which is what
# this workflow used to do, is the version where nobody ever sees the change
# before it happens.
#
# Neither half has ever run: environments/ and modules/ do not exist yet
# (epochs 02 and 03), and the path filters mean nothing here can trigger. That
# is exactly why it is worth fixing now - the gate is cheap to add before the
# first real deployment and awkward to retrofit after.
on:
  push:
    branches: [main]
    # No tags. A v* tag used to start this as "a production release" of
    # workload infrastructure that has never existed (#561). A tag now names
    # a version of the platform, which the fabricator publishes and a site
    # pins; publishing one deploys nothing, so no tag starts anything here.
    paths:
      # The ignition tier. A merge here converges the estate that already
      # exists; it never ignites one. See CLAUDE.md, "Ignition is local-only;
      # convergence is not".
      - "management/**"
      - "config/management.tpl.json"
      - "environments/**/infrastructure/**"
      - "modules/infrastructure/**"
      # What Flux deploys. A merge here changes what runs on a site with no
      # help from a converge, and that was the trouble: nothing took a record
      # afterwards, so the site's capacity - what a pull request's change is
      # held against - stayed as it was before the merge, and a second
      # change was judged against room the first had already taken. A
      # converge here applies nothing of its own. It waits for Flux to
      # settle and takes the record, which is the point.
      - "clusters/**"
  # The machine roll (management/roll), every hour. Each site keeps its own
  # clock (its timezone in config/management.tpl.json) and the play decides
  # whether that site's window is open; outside it the run is over in a
  # minute. Under this workflow's own lock, so a roll and a converge never
  # run at once.
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

# One at a time per ref. A converge is never cancelled mid-flight: there is one
# estate and one state lock, and a cancelled apply is how state gets left
# locked or half-written. Only pushes start this workflow, so no pull request's
# run can share its group - which is how #570's converge was cancelled by its
# own pull request closing, when plans lived in this file (#573).
concurrency:
  group: deploy-infrastructure-${{ github.ref }}
  cancel-in-progress: false

# GitHub's default shell for `run:` is `bash -e {0}`, which has no
# pipefail: in `a | b` only b's exit status counts, so a failing command
# feeding a working one is a green step. Naming the shell explicitly gets
# `bash --noprofile --norc -eo pipefail {0}` instead.
#
# Not theoretical here. `tofu plan | tee` reported success and posted an
# empty pull request comment, and `rclone version | head -1` verified
# nothing while passing - both silent, both green, both wrong answers
# rather than errors. It is set on every workflow, including those with no
# `run:` step today, so the one added tomorrow is already covered.
#
# policy/conftest/rules/workflow_pipefail/workflow_pipefail.rego asserts this
# is present.
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------
  # ROUTING - which tier does this change touch, and which sites exist?
  #
  # Hermetic, so it stays off the self-hosted runner: deciding what to run
  # needs no credentials, and giving it any would widen what a mistake here
  # reaches.
  # ---------------------------------------------------------------------
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 10
    outputs:
      management: ${{ steps.filter.outputs.management }}
      workload: ${{ steps.filter.outputs.workload }}
      sites: ${{ steps.sites.outputs.sites }}
    steps:
      # This job had no harden-runner at all until the building code went in -
      # it began at checkout. Hermetic and credential-free, so the exposure was
      # small, but it is the classification step for the workflow that applies
      # OpenTofu, and "small" is not the standard the other jobs are held to.
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          # Deep enough to diff a push against the commit before it. This
          # repository is small; the cost is seconds and the alternative is
          # guessing.
          fetch-depth: 0

      - name: Classify the change
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A timer is the machine roll's, and changes nothing. Without this
          # it fell through to the diff below with no push to diff, compared
          # the last commit with its parent, and converged every hour the
          # last merge had touched management/.
          if [ "${EVENT}" = "schedule" ]; then
            echo "management=false" >> "$GITHUB_OUTPUT"
            echo "workload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # THE WORKLOAD TIER HAS WORK ONLY WHEN ITS DIRECTORY EXISTS (#370).
          #
          # The apply job cds into environments/<env>/infrastructure/. No such
          # directory has ever existed - this workflow's own header says both
          # halves have never run - yet every tag used to be declared "a
          # workload-tier production release", unconditionally. GitHub does not
          # evaluate path filters on tag pushes, so each v* tag started an
          # apply job that waited for production approval and would then have
          # failed on the missing directory. Those waiting runs are what kept
          # the security patrol red.
          #
          # So the target directory is part of the question. management/ is
          # never released by tag - the estate has one version, the running
          # one.
          if [ "${EVENT}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            target="environments/production/infrastructure"
          else
            target="environments/staging/infrastructure"
          fi

          if [ "${EVENT}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            work=false
            [ -d "${target}" ] && work=true
            [ "${work}" = "false" ] && echo "::notice::${target}/ does not exist at this tag, so there is no workload infrastructure to apply"
            echo "management=false" >> "$GITHUB_OUTPUT"
            echo "workload=${work}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! files="$(git diff --name-only "${PUSH_BEFORE}" "${PUSH_AFTER}" 2>/dev/null)"; then
            files="$(git diff --name-only HEAD~1 HEAD)"
          fi

          echo "changed files:"; echo "${files}"
          mgmt=false; work=false
          # The estate's root is the lawyer's, and converging a site does not
          # touch it, so a change only there is no site's work. Filtered into
          # a variable rather than piped: under pipefail, grep -q exiting at
          # its first match can fail the writer with SIGPIPE and turn a match
          # into a miss.
          site_files="$(grep -vE '^management/estate/' <<<"${files}" || true)"
          # clusters/ is here for the record a converge ends with, not for
          # anything it applies: see the trigger's paths above.
          grep -qE '^(management/|clusters/|config/management\.tpl\.json$)' <<<"${site_files}" && mgmt=true
          # The same paths the trigger filters on, not a broader guess at them.
          # This used to match any file under environments/ or modules/, so a
          # change to an application module - the game server's Deployment -
          # counted as infrastructure work, and the job then cd'd into a
          # directory that is not there. Two gates answering one question
          # differently, and the looser one ran.
          grep -qE '^(environments/[^/]+/infrastructure/|modules/infrastructure/)' <<<"${files}" && work=true
          if [ "${work}" = "true" ] && [ ! -d "${target}" ]; then
            echo "::notice::infrastructure paths changed, but ${target}/ does not exist, so there is nothing to apply"
            work=false
          fi
          echo "management=${mgmt}" >> "$GITHUB_OUTPUT"
          echo "workload=${work}" >> "$GITHUB_OUTPUT"

      - name: List the sites the config declares
        id: sites
        run: |
          set -euo pipefail
          # The template, not the rendered config: this job holds no vault
          # credentials. Site keys are plaintext structure; only their values
          # are op:// references.
          sites="$(jq -c '.sites | keys' config/management.tpl.json)"
          echo "sites=${sites}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # The workload tier has no plan on a pull request, deliberately. Its plan
  # read real state on the estate's runner, and no pull-request job may reach
  # that runner (#554, tests/go/repo/selfhosted_test.go). environments/*/
  # infrastructure/ does not exist, so the job could never trigger; when the
  # workload tier gets infrastructure of its own, it gets a plan against an
  # as-built record of it, the way the estate's plan works.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  apply:
    name: Apply
    needs: changes
    if: needs.changes.outputs.workload == 'true'
    # A site's runners, since the estate's are registered per site. This tier
    # has no sites of its own yet, so it takes the first the config declares.
    runs-on: homelab-${{ fromJSON(needs.changes.outputs.sites)[0] }}
    # The environment is the human gate. Configure required reviewers on
    # `production` so a tag cannot deploy unattended; `staging` is where a
    # merge to main lands.
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    timeout-minutes: 60
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Stays audit, not block, until this job has actually run: it
          # applies whatever `environments/` and `modules/` turn out to
          # need - Proxmox, Cloudflare, Tailscale, object storage, the state
          # Postgres, the OpenTofu registry - and none of those hosts are
          # known yet because neither directory exists. Flip to block with
          # the observed allowed-endpoints before this job ever runs for
          # real - not before, since a guessed allowlist on the one job with
          # write access to real infrastructure is worse than an audited one.
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: audit
          disable-sudo-and-containers: "false"

      - name: Determine Target Directory
        id: set-env
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" == "tag" ]; then
            echo "DIR=environments/production/infrastructure/" >> "$GITHUB_ENV"
            echo "🚀 Deploying to Production (Tag: $REF_NAME)"
          else
            echo "DIR=environments/staging/infrastructure/" >> "$GITHUB_ENV"
            echo "🛠️ Deploying to Staging (Branch: $REF_NAME)"
          fi

      - name: Tofu Init
        run: tofu init -input=false
        working-directory: ${{ env.DIR }}

      # Plan to a file, then apply that file. Not `apply -auto-approve`, which
      # re-plans internally and applies whatever it finds at that moment -
      # including a change that arrived between the review and the merge.
      - name: Tofu Plan
        working-directory: ${{ env.DIR }}
        run: tofu plan -input=false -no-color -out=tfplan

      - name: Show what is about to be applied
        working-directory: ${{ env.DIR }}
        run: |
          {
            echo "### Applying: \`${DIR}\`"
            echo
            echo '```terraform'
            tofu show -no-color tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tofu Apply
        working-directory: ${{ env.DIR }}
        run: tofu apply -input=false tfplan
  # ---------------------------------------------------------------------
  # CONVERGE - on merge to main, for the ignition tier.
  #
  # Not `apply` with a different directory. The workload tier is plain
  # OpenTofu in a folder; the estate is a phased program that renders
  # secrets, attaches to state living in this cluster, applies, re-backs-up
  # and sterilises. `contractor converge-site` is that sequence.
  #
  # READ BEFORE WIDENING: this runner lives inside the cluster it is
  # converging. Adding a control-plane node is safe. A change that disrupts
  # the control plane or the state database kills this job midway through its
  # own apply. If that becomes routine, add required reviewers to the
  # environment below - the merge stops being the only gate.
  # ---------------------------------------------------------------------
  converge:
    name: Converge ${{ matrix.site }}
    needs: changes
    if: needs.changes.outputs.management == 'true'
    # Each site's converge runs on that site's own runners: the scale set is
    # named for the site it is in (clusters/core, runner-scale-set.yaml).
    runs-on: homelab-${{ matrix.site }}
    environment: management
    permissions:
      contents: read
      # To fetch the release of the platform the site runs. The package is
      # public; the registry wants a token all the same.
      packages: read
    timeout-minutes: 60
    strategy:
      # Each site has its own state database and its own lock, so two sites
      # converge independently. fail-fast off: one site failing is not a
      # reason to abandon another that was fine.
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.sites) }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # audit, not block, for the same reason the apply job gives: this
          # reaches 1Password, Proxmox, Tailscale, Cloudflare, the Kubernetes
          # API and the OpenTofu registry, and several of those addresses are
          # deliberately not in git. Transcribe the observed endpoints after
          # the first real run, then flip to block.
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: audit
          disable-sudo-and-containers: "false"

      - name: Read pinned versions
        uses: $/.github/actions/versions

      # No cache. scripts/contractor has zero external dependencies, so the
      # cache saves nothing - and on a self-hosted runner it persists
      # between jobs, which is a poisoning surface for no benefit.
      - name: Setup Go
        uses: $/.github/workflows/setup-go

      # Built and run directly, not through `task`: task does not proxy SIGINT
      # to the process it supervises (go-task/task#1408).
      - name: Converge
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # For the registry: the roots fetch the release the site's line
          # names (management/versions.json).
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ matrix.site }}
        run: |
          # toolshed/, like everything else that builds here.
          #
          # This built to scripts/contractor/contractor while the taskfile built
          # to toolshed/contractor, so one program had two build outputs
          # depending on who was building it (#215). Both worked; together they
          # meant the program printed CI's path to somebody standing at a
          # workstation, in the message telling them how to recover from a total
          # loss. Four Go messages and three documents had drifted onto the CI
          # path, and a real ignition printed one of them.
          go build -C scripts/contractor -o ../../toolshed/contractor .
          set +e
          ./toolshed/contractor converge-site -site "$SITE" -record-out "as-built/$SITE" 2>&1 | tee converge.log
          code=${PIPESTATUS[0]}
          set -e
          # The verdict, not just the failure. contractor exits 2 when the
          # estate is provably untouched and 1 when something was written or
          # it could not tell - see reportPreexistingFailure in main.go. The
          # aftermath job below can only be exact about a revert if it knows
          # which of those happened, and an exit code is the only channel that
          # survives without parsing prose out of a log.
          mkdir -p verdict
          echo "$code" > "verdict/$SITE"
          # And why, in the converge's own words: from where it halted to its
          # end. A revert that is opened leads with this, so that whoever is
          # asked to merge it reads what failed before being told what to do
          # (#713). It is what the log above already says and nothing more.
          sed -n '/HALTED:/,$p' converge.log | sed 's/\x1b\[[0-9;]*m//g' | head -30 > "verdict/$SITE.why" || true
          # 3 is a converge main had already moved past: nothing applied and
          # nothing failed, so the run is not red. The verdict still says so,
          # for the aftermath of a matrix where another site did fail (#557).
          if [ "$code" = 3 ]; then
            exit 0
          fi
          exit "$code"

      # Written even on success, so a missing file means the job died rather
      # than that everything was fine. Absent and "exit 0" must not look the
      # same to the job that decides whether to revert.
      # The as-built record the converge took once the estate matched main
      # (#554): what every pull request's plan is compared with. Taken only
      # when it came out quiet and held nothing real; a converge that could
      # not take one saves nothing, and plans read the previous record.
      - name: Publish the as-built record
        if: success()
        uses: $/.github/workflows/upload-artifact
        with:
          name: as-built-${{ matrix.site }}
          path: as-built/${{ matrix.site }}/
          if-no-files-found: ignore
          retention-days: 90

      - name: Record the verdict
        if: always()
        uses: $/.github/workflows/upload-artifact
        with:
          name: converge-verdict-${{ matrix.site }}
          path: verdict/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # THE MACHINE ROLL - every machine moved to the Talos the cluster says it
  # should run, one at a time, in the night's window (management/roll).
  #
  # On the site's own runners, holding the converge's credential and its
  # lock: the play reads the Talos client configuration the converge keeps in
  # the site's vault, through op run, for as long as the run. Most runs find
  # the window shut or nothing behind and are over in a minute.
  # ---------------------------------------------------------------------
  roll:
    name: Roll ${{ matrix.site }}
    needs: changes
    if: github.event_name == 'schedule'
    runs-on: homelab-${{ matrix.site }}
    environment: management
    permissions:
      contents: read
      # To start the integration tier against the site and read how it went,
      # and to read which jobs passed on the canary.
      actions: write
    # Three machines, a soak and two runs of the integration tier, with room.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.sites) }}
    outputs:
      handed_over: ${{ steps.roll.outputs.handed_over }}
      touched: ${{ steps.roll.outputs.touched }}
      machine: ${{ steps.roll.outputs.machine }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # audit, for the converge's reason: harden-runner does nothing on
          # this runner. Owned by scripts/approved-suppliers.yml under
          # `egress:`, which says which job may reach what.
          egress-policy: audit
          disable-sudo-and-containers: "false"

      - name: Read pinned versions
        uses: $/.github/actions/versions

      # ansible-core, Ansible's collections and the Kubernetes client the
      # collection's modules import, from the lock by hash.
      - name: Take delivery of the roll's tools
        run: scripts/take-delivery.sh ansible-core ansible kubernetes

      - name: Roll
        id: roll
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE: ${{ matrix.site }}
        run: |
          # The access lives in this directory for the length of the run and
          # no longer; op run hands it to the play and masks it in the log.
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          printf 'TALOS_ACCESS=op://%s/talos/talosconfig\n' "$SITE" > "$workdir/vault.env"
          ROLL_WORKDIR="$workdir" op run --env-file "$workdir/vault.env" -- \
            ansible-playbook management/roll/talos-upgrade.yml 2>&1 | tee roll.log

      # The play's own words where it stopped, for the issue the aftermath
      # opens. What the play prints is structure: machines, versions, checks.
      - name: Record why it stopped
        if: failure()
        run: |
          grep -m1 '^fatal:' roll.log | sed 's/^[^{]*//' | jq -r '.msg // "The roll stopped without saying why."' > roll-why.txt || echo "The roll stopped without saying why." > roll-why.txt

      - name: Keep why it stopped
        if: failure()
        uses: $/.github/workflows/upload-artifact
        with:
          name: roll-why-${{ matrix.site }}
          path: roll-why.txt
          if-no-files-found: ignore
          retention-days: 7

  # The machine the first job ran on, which it cordoned rather than drain
  # under itself. This job is placed elsewhere because that machine is
  # cordoned, and finishes it.
  roll-handover:
    name: Roll ${{ matrix.site }}, its last machine
    needs: [changes, roll]
    if: needs.roll.outputs.handed_over == 'true'
    runs-on: homelab-${{ matrix.site }}
    environment: management
    permissions:
      contents: read
      actions: write
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.sites) }}
    outputs:
      touched: ${{ steps.roll.outputs.touched }}
      machine: ${{ steps.roll.outputs.machine }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # As the roll's, for its reason.
          egress-policy: audit
          disable-sudo-and-containers: "false"

      - name: Read pinned versions
        uses: $/.github/actions/versions

      - name: Take delivery of the roll's tools
        run: scripts/take-delivery.sh ansible-core ansible kubernetes

      - name: Roll
        id: roll
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE: ${{ matrix.site }}
        run: |
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          printf 'TALOS_ACCESS=op://%s/talos/talosconfig\n' "$SITE" > "$workdir/vault.env"
          ROLL_WORKDIR="$workdir" op run --env-file "$workdir/vault.env" -- \
            ansible-playbook management/roll/talos-upgrade.yml 2>&1 | tee roll.log

      - name: Record why it stopped
        if: failure()
        run: |
          grep -m1 '^fatal:' roll.log | sed 's/^[^{]*//' | jq -r '.msg // "The roll stopped without saying why."' > roll-why.txt || echo "The roll stopped without saying why." > roll-why.txt

      - name: Keep why it stopped
        if: failure()
        uses: $/.github/workflows/upload-artifact
        with:
          name: roll-why-${{ matrix.site }}
          path: roll-why.txt
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # A ROLL THAT STOPPED - said where somebody will see it, and nothing
  # retried. Like the converge's aftermath, on GitHub's runner, holding
  # nothing that reaches the estate.
  #
  # A roll that refused before its first machine changed nothing: an issue
  # says why, and the next night's run asks again. One that stopped part-way
  # left that machine cordoned: an issue says which, and when the bump was a
  # patch release a pull request reverting it is opened, for the operator to
  # merge or not. Reverted, the next window rolls the moved machines back.
  # Across a minor version there is no revert: Talos goes forward only.
  # ---------------------------------------------------------------------
  roll-aftermath:
    name: Roll aftermath
    needs: [roll, roll-handover]
    if: always() && (needs.roll.result == 'failure' || needs.roll-handover.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
          fetch-depth: 0

      - name: Collect why it stopped
        uses: $/.github/workflows/download-artifact
        with:
          pattern: roll-why-*
          path: why
          merge-multiple: true

      - name: Decide what a revert would be
        id: bump
        env:
          TOUCHED: ${{ needs.roll-handover.outputs.touched || needs.roll.outputs.touched }}
        run: |
          # The change that moved the machines: the last commit to touch the
          # module that declares their version.
          sha=$(git log -1 --format=%H -- modules/infrastructure/machine-image/)
          version=$(sed -n 's/^ *talos_version *= *"\(v[0-9.]*\)".*/\1/p' modules/infrastructure/machine-image/machine-image.tf)
          from=$(sed -n 's/^ *talos_upgrades_from *= *"\(v[0-9.]*\)".*/\1/p' modules/infrastructure/machine-image/machine-image.tf)
          patch=false
          [ "${version%.*}" = "$from" ] && patch=true
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "revertible=$([ "$TOUCHED" = true ] && [ "$patch" = true ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Mint the revert token
        id: revert-token
        if: steps.bump.outputs.revertible == 'true'
        uses: $/.github/workflows/app-token
        with:
          client-id: ${{ secrets.PROCUREMENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROCUREMENT_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # The module put back as it was before the bump, and nothing else: the
      # tree is main's with that one directory swapped, signed by GitHub as
      # the converge's revert is. A pull request, never merged here.
      - name: Offer a revert of the bump
        id: revert
        if: steps.bump.outputs.revertible == 'true'
        env:
          GH_TOKEN: ${{ steps.revert-token.outputs.token }}
          SHA: ${{ steps.bump.outputs.sha }}
          VERSION: ${{ steps.bump.outputs.version }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          before=$(git rev-parse "$SHA^:modules/infrastructure/machine-image")
          tree=$(gh api "repos/$REPO/git/trees" \
            -f base_tree="$(git rev-parse "HEAD^{tree}")" \
            -f "tree[][path]=modules/infrastructure/machine-image" \
            -f "tree[][mode]=040000" \
            -f "tree[][type]=tree" \
            -f "tree[][sha]=$before" \
            --jq .sha)
          commit=$(gh api "repos/$REPO/git/commits" \
            -f message="revert: the machines go back from Talos $VERSION" \
            -f tree="$tree" \
            -f "parents[]=$(git rev-parse HEAD)" \
            --jq .sha)
          branch="revert/roll-stopped-${SHA::8}"
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$commit" >/dev/null
          url=$(gh pr create --draft --base main --head "$branch" \
            --title "revert: the machine roll to Talos $VERSION stopped" \
            --body "$(printf '%s\n' \
              "The machine roll to Talos $VERSION stopped part-way. Merging this puts modules/infrastructure/machine-image back as it was before ${SHA::8}; the next window then rolls the machines already moved back to the version before, the same way they went forward. Talos moves between patch versions in either direction." \
              "" \
              "**Do not merge it if the failure is not the version's** - a runner, the cluster, a check of the roll's own. Read the issue the roll opened, and the run, first." \
              "" \
              "Run: $RUN_URL")")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Say the roll stopped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOUCHED: ${{ needs.roll-handover.outputs.touched || needs.roll.outputs.touched }}
          MACHINE: ${{ needs.roll-handover.outputs.machine || needs.roll.outputs.machine }}
          VERSION: ${{ steps.bump.outputs.version }}
          REVERT: ${{ steps.revert.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          why="$(cat why/roll-why.txt 2>/dev/null || echo 'The roll left no account of why it stopped. Read the run.')"
          if [ "$TOUCHED" = true ]; then
            title="The machine roll to Talos $VERSION stopped on $MACHINE"
            what="**$MACHINE is left cordoned**, deliberately: nothing is retried, and a machine that will not come back is replaced rather than repaired. The machines before it are on $VERSION."
            if [ -n "$REVERT" ]; then
              what="$what A revert of the bump is open, unmerged: $REVERT"
            else
              what="$what There is no revert: the bump crosses a minor version, and Talos goes forward only. Fix forward."
            fi
            labels="priority:P1,type:correctness,epoch:05"
          else
            title="The machine roll to Talos $VERSION has not started"
            what="**Nothing was touched.** The roll refused before its first machine, and asks again in the next window."
            labels="priority:P2,type:correctness,epoch:05"
          fi
          body="$(printf '%s\n' "$what" "" "The roll's own words, where it stopped:" "" '```' "$why" '```' "" "Run: $RUN_URL")"
          # One issue for a roll that will not start, not one an hour: the
          # same refusal tomorrow is a comment on today's.
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label "$labels" --body "$body"
          fi

  # ---------------------------------------------------------------------
  # AFTERMATH - make main stop being wrong after a failed converge.
  #
  # `main` is not a request. plan compares against it, demolish evaluates
  # cluster health against it, and the next converge computes a diff from it.
  # When a converge fails, the merge that caused it stays on main and every one
  # of those reads a statement about real infrastructure that is not true
  # (#130).
  #
  # Branch protection cannot fix this: required checks run before a merge and
  # the converge runs after it. So the answer is not to prevent the merge, it
  # is to stop main being wrong afterwards.
  #
  # Deliberately a separate job on a GitHub-hosted runner. The converge job
  # holds the vault token and applies real infrastructure; it stays at
  # contents: read. This one can write a branch and cannot reach the estate.
  # ---------------------------------------------------------------------
  aftermath:
    name: Aftermath
    needs: [changes, converge]
    if: always() && needs.converge.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 10
    steps:
      # persist-credentials: false, like every other checkout here. The push
      # below carries the token on the remote URL for the one command that
      # needs it, rather than leaving it in .git/config for the rest of the
      # job - which is what zizmor's artipacked audit is about, and it is
      # right: a credential in a file outlives the step that wanted it.
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
          fetch-depth: 0

      - name: Collect the verdicts
        uses: $/.github/workflows/download-artifact
        with:
          pattern: converge-verdict-*
          path: verdicts
          merge-multiple: true

      # Exact, or not at all.
      #
      # A blind revert is a machine that deletes infrastructure in response to
      # a flaky failure: fail while creating the fourth of five machines and
      # reality is four, so reverting the config to three makes main wrong in
      # the other direction and the next converge plans a destroy.
      #
      # So reverting needs every site to have reported 2 - provably untouched.
      # Anything else, including a missing verdict, is "not known" and gets an
      # alarm instead. Not knowing and nothing being wrong must not look the
      # same, which is this estate's standing rule about checks that can be off.
      - name: Decide whether a revert is exact
        id: verdict
        env:
          SITES: ${{ needs.changes.outputs.sites }}
        run: |
          exact=true
          superseded=false
          waiting=false
          elsewhere=false
          detail=""
          for site in $(echo "$SITES" | tr -d '[]"' | tr ',' ' '); do
            f="verdicts/$site"
            if [ ! -f "$f" ]; then
              exact=false
              detail="${detail}- ${site}: no verdict recorded, so the job died before it could say\n"
              continue
            fi
            code=$(tr -d '[:space:]' < "$f")
            case "$code" in
              0) detail="${detail}- ${site}: converged\n" ;;
              2) detail="${detail}- ${site}: failed before anything was applied\n" ;;
              # Superseded: main moved on before this converge ran. Nothing
              # was applied and nothing failed; the newer commit converges on
              # its own, so there is nothing to revert or report (#557).
              3) superseded=true
                 detail="${detail}- ${site}: superseded - main had moved on, so it did not run\n" ;;
              # The cluster was not at rest and the converge gave up waiting,
              # having applied nothing. Nothing under management/ is known to
              # be at fault, and returning it cannot bring a cluster to rest:
              # the first of these was answered with a revert of two files the
              # converge does not apply, which told the operator to merge it
              # (#713). So it is neither a revert nor "not known".
              4) waiting=true
                 detail="${detail}- ${site}: the cluster was not ready, and nothing was applied\n" ;;
              # A converge for the workstation: it has a template to build,
              # which needs SSH to the hypervisor, and that does not answer
              # from inside the cluster. Nothing was applied and the change
              # is not at fault, so it is neither a revert nor "not known"
              # (#741).
              5) elsewhere=true
                 detail="${detail}- ${site}: a converge for the workstation, and nothing was applied\n" ;;
              *) exact=false
                 detail="${detail}- ${site}: failed with exit ${code} - something may have been written\n" ;;
            esac
          done
          # A superseded site means main already carries something newer, and
          # reverting this commit would undo part of what the newer converge
          # applies. Unless something is unknown, there is nothing to do.
          if [ "$exact" = true ] && [ "$superseded" = true ]; then
            exact=none
          fi
          # One site waiting is enough to hold a revert back: whatever the
          # others did, the cluster is the first thing to look at.
          if [ "$exact" = true ] && [ "$waiting" = true ]; then
            exact=waiting
          fi
          # And one site whose converge is the workstation's holds a revert
          # back the same way: the change is good and is waiting for a person.
          if [ "$exact" = true ] && [ "$elsewhere" = true ]; then
            exact=workstation
          fi
          why=""
          for f in verdicts/*.why; do
            [ -s "$f" ] || continue
            why="${why}$(basename "$f" .why):\n$(cat "$f")\n\n"
          done
          echo "exact=$exact" >>"$GITHUB_OUTPUT"
          {
            echo "detail<<VERDICT_EOF"
            printf '%b' "$detail"
            echo "VERDICT_EOF"
            echo "why<<WHY_EOF"
            printf '%b' "$why"
            echo "WHY_EOF"
          } >>"$GITHUB_OUTPUT"

      # The estate is provably untouched, so returning main to the last
      # converged state is exact rather than a guess.
      #
      # A pull request rather than a push. It keeps the change visible and
      # re-mergeable once the cause is fixed, and it does not put an automated
      # commit on main - which is the thing this repository is careful about
      # everywhere else.
      # Bounded, signed, and it does not pretend to reopen anything.
      #
      # Three defects, all found the first time this ever executed (#198).
      #
      # SCOPE. It ran `git revert` on the whole merge commit, so a converge
      # failing because a binary was missing from a runner would have removed
      # 83 files - the attestation gate, the push guard, the mutation ledger,
      # the git hooks and eleven building-code assertions among them. Only
      # `management/` drives the estate; nothing else here is applied by a
      # converge, and nothing else should move because one failed. The estate
      # rule is to enumerate what will be acted on by address, so a targeted
      # action cannot become unbounded, and a whole-merge revert is the
      # opposite construction.
      #
      # SIGNATURE. It used plain git, which produces unsigned commits, and
      # `required_signatures` applies to every branch here - so this path could
      # only ever fail, and its first real execution was its first test. The
      # commit is built through the Git Data API instead: GITHUB_TOKEN is an
      # installation token, and a commit created with one comes back signed
      # with GitHub's own key. No new credential.
      #
      # REOPENING. GitHub cannot reopen a merged pull request, so the thing
      # asked for is not available. The revert pull request carries the link
      # instead, and reverting it restores the change - which is the same
      # outcome by the only route that exists.
      # The procurement App's token, not GITHUB_TOKEN. GitHub refuses to let
      # Actions open a pull request here, and one opened with GITHUB_TOKEN
      # would run no checks and could never merge - so every revert this job
      # ever tried pushed a branch and stopped (#380). The App already opens
      # the expediter's pull requests; a revert is the same kind of
      # proposal, and the operator approves it like any other.
      - name: Mint the revert token
        id: revert-token
        if: steps.verdict.outputs.exact == 'true'
        uses: $/.github/workflows/app-token
        with:
          client-id: ${{ secrets.PROCUREMENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROCUREMENT_BOT_PRIVATE_KEY }}
          # Contents to make the commit and branch; pull requests to open one.
          permission-contents: write
          permission-pull-requests: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Revert management/, as a signed pull request
        if: steps.verdict.outputs.exact == 'true'
        env:
          GH_TOKEN: ${{ steps.revert-token.outputs.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DETAIL: ${{ steps.verdict.outputs.detail }}
          WHY: ${{ steps.verdict.outputs.why }}
        run: |
          # A revert returns main to the LAST CONVERGED STATE. If this merge
          # was itself that revert, main already holds it - so there is nothing
          # to return to, and reverting again would move main AWAY from the
          # estate rather than toward it. Provable from where things are,
          # rather than assumed about why they failed.
          #
          # Qualified on the source branch, not on the failure. Two converges
          # failing is not evidence that they failed for the same reason, and a
          # message claiming it was would be asserting something nobody
          # measured (#212).
          #
          # Checked two ways because either can be unavailable. The API answers
          # what branch the merge came from; the commit subject carries the
          # revert pull request's title through a squash, and needs no network.
          # Not knowing and nothing being wrong must not look the same, so a
          # lookup that fails falls back rather than silently proceeding.
          source=$(gh pr list --state merged --search "$SHA" --limit 1 --json headRefName --jq '.[0].headRefName // empty' || true)
          subject=$(git log -1 --format=%s "$SHA")
          case "$source$subject" in
            revert/converge-failed-* | *"failed before it applied anything"*)
              echo "::notice::this merge was itself a converge-failure revert, so main already describes the last converged state - there is nothing to return to, and this converge needs looking at on its own terms"
              exit 0
              ;;
          esac

          # Nothing a site's converge applies changed, so there is nothing to
          # return. management/estate/ is the lawyer's: it is converged by
          # hand and never by this job, so a change there cannot be what a
          # site's converge failed at, and returning it would undo something
          # that was never the question (#713).
          if git diff --quiet "$SHA^" "$SHA" -- management/ ':(exclude)management/estate'; then
            echo "::notice::the failed converge changed nothing under management/ that a site's converge applies, so main already describes the estate"
            exit 0
          fi

          before=$(git rev-parse "$SHA^:management")
          estate=$(git rev-parse "$SHA:management/estate")
          root=$(git rev-parse "$SHA^{tree}")

          # base_tree is the current tree with one subtree swapped back. Every
          # object referenced already exists on the server, reachable from the
          # parent commit, so nothing has to be uploaded.
          tree=$(gh api "repos/$REPO/git/trees" \
            -f base_tree="$root" \
            -f "tree[][path]=management" \
            -f "tree[][mode]=040000" \
            -f "tree[][type]=tree" \
            -f "tree[][sha]=$before" \
            --jq .sha)
          # And the estate's own directory put back as the merge left it, in
          # a second step because one request cannot name a directory and
          # something inside it.
          tree=$(gh api "repos/$REPO/git/trees" \
            -f base_tree="$tree" \
            -f "tree[][path]=management/estate" \
            -f "tree[][mode]=040000" \
            -f "tree[][type]=tree" \
            -f "tree[][sha]=$estate" \
            --jq .sha)

          # No author, committer or signature field is sent, deliberately:
          # GitHub then signs on the installation's behalf and attributes it
          # correctly, which is the same reasoning scripts/signedpush documents.
          message=$(printf '%s\n' \
            "revert: return management/ to the last converged state" \
            "" \
            "The converge for ${SHA::8} failed before it applied anything, so" \
            "main described an estate that does not exist. Only management/ is" \
            "returned; nothing else here is applied by a converge.")

          commit=$(gh api "repos/$REPO/git/commits" \
            -f message="$message" \
            -f tree="$tree" \
            -f "parents[]=$SHA" \
            --jq .sha)

          branch="revert/converge-failed-${SHA::8}"
          gh api "repos/$REPO/git/refs" \
            -f ref="refs/heads/$branch" \
            -f sha="$commit" >/dev/null

          # The pull request this merge came from, so the trail survives.
          origin=$(gh pr list --state merged --search "$SHA" --limit 1 --json number --jq '.[0].number // empty')
          trail="The original pull request could not be identified from the merge commit."
          if [ -n "$origin" ]; then
            trail="Original: #${origin}. GitHub cannot reopen a merged pull request, so that one stays closed - reverting THIS pull request restores the change once the cause is fixed."
          fi

          revert_url=$(gh pr create --base main --head "$branch" \
            --title "revert: the converge for ${SHA::8} failed before it applied anything" \
            --body "$(printf '%s\n' \
              "## What failed" \
              "" \
              "The converge's own words, from where it halted:" \
              "" \
              '```' \
              "${WHY:-The converge left no account of why it halted. Read the failed run before deciding.}" \
              '```' \
              "" \
              "## What you need to do" \
              "" \
              "Read the above first. **Merge this if what failed is something the change did under \`management/\`.** It then makes the repository true again." \
              "" \
              "**Do not merge it if the failure is about something else** - a runner, a vendor, the cluster. This returns what a site's converge applies under \`management/\` and nothing more, and cannot fix what it did not change." \
              "" \
              "## Why this was opened" \
              "" \
              "The converge that should have applied ${SHA::8} failed, and \`main\` now describes an estate that does not exist." \
              "" \
              "Per site:" \
              "$DETAIL" \
              "Every site failed **before anything was applied**, so the estate is provably untouched and returning \`main\` is exact rather than a guess. That is the only case this is opened automatically for." \
              "" \
              "## Scope" \
              "" \
              "**Only \`management/\`, and not \`management/estate/\`**, which is converged by hand and never by this job. That is what a converge applies. Nothing else in the original change is touched - the first version of this reverted the whole merge commit, which would have removed 83 files including the guards (#198)." \
              "" \
              "$trail" \
              "" \
              "Failed run: $RUN_URL")")

          # Only now, with a revert that exists to point at. The first
          # version said "has been returned" before opening anything, and
          # said it every time the opening failed (#380).
          if [ -n "$origin" ]; then
            gh pr comment "$origin" --body "The converge for \`${SHA::8}\` failed before applying anything. The revert that returns \`management/\` to its previous state is ${revert_url}, awaiting approval. Failed run: $RUN_URL"
          fi

      # The cluster was not ready, which is its own case and not a revert.
      #
      # An issue, like the alarm below, because it does not clear itself: the
      # merge is on main and has not been converged. Lower than that alarm,
      # because here what the estate holds is known - it is as it was.
      - name: Say that the converge is the workstation's
        if: steps.verdict.outputs.exact == 'workstation'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DETAIL: ${{ steps.verdict.outputs.detail }}
          WHY: ${{ steps.verdict.outputs.why }}
        run: |
          gh issue create \
            --title "A converge is waiting to be run from the workstation (${SHA::8})" \
            --label "priority:P2,type:correctness,epoch:05" \
            --body "$(printf '%s\n' \
              "The converge for \`${SHA::8}\` stopped before its first change: it has a template to build, which needs SSH to the hypervisor, and that does not answer from inside the cluster. **Nothing was reverted, deliberately**: nothing is wrong with the change, and \`main\` says what the site is about to be." \
              "" \
              "The converge's own words, from where it halted:" \
              "" \
              '```' \
              "${WHY:-The converge left no account of why it halted. Read the failed run.}" \
              '```' \
              "" \
              "Per site:" \
              "$DETAIL" \
              "**What to do:** run the converge from the workstation, as the words above say, and close this when it has finished." \
              "" \
              "Run: ${RUN_URL}")"

      - name: Say that the cluster was not ready
        if: steps.verdict.outputs.exact == 'waiting'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DETAIL: ${{ steps.verdict.outputs.detail }}
          WHY: ${{ steps.verdict.outputs.why }}
        run: |
          gh issue create \
            --title "A converge gave up waiting for the cluster, and applied nothing (${SHA::8})" \
            --label "priority:P2,type:correctness,epoch:01" \
            --body "$(printf '%s\n' \
              "The converge for \`${SHA::8}\` stopped before its first change, because the cluster was not at rest. **Nothing was reverted, deliberately**: returning \`management/\` cannot bring a cluster to rest." \
              "" \
              "The converge's own words, from where it halted:" \
              "" \
              '```' \
              "${WHY:-The converge left no account of why it halted. Read the failed run.}" \
              '```' \
              "" \
              "Per site:" \
              "$DETAIL" \
              "**What to do:** find what the cluster is waiting on - \`task kubectl SITE=<site> -- kubectl get kustomizations -n flux-system\` says which layer Flux has not applied and why - fix that, and run the converge again. The estate is as it was before the merge." \
              "" \
              "Failed run: $RUN_URL")"

      # Not knowing is the loud case.
      #
      # No revert here: something may have been written, so returning the
      # config would make main wrong in the other direction. An issue rather
      # than a passing mention, because this does not self-clear - it stays
      # open until somebody converges or corrects the config.
      - name: Alarm, because the estate's state is not known
        if: steps.verdict.outputs.exact == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DETAIL: ${{ steps.verdict.outputs.detail }}
        run: |
          gh issue create \
            --title "A converge failed after it may have applied something (${SHA::8})" \
            --label "priority:P1,type:correctness,epoch:01" \
            --body "$(printf '%s\n' \
              "\`main\` says one thing and the estate may say another. This was **not** reverted, deliberately." \
              "" \
              "Per site:" \
              "$DETAIL" \
              "A converge that failed partway through applying leaves reality somewhere between the old config and the new one. Reverting would make \`main\` wrong in the other direction, and the next converge would compute a diff from a baseline nobody checked - which is how an automated revert becomes a machine that destroys infrastructure in response to a flaky failure." \
              "" \
              "**What to do:** run \`task plan SITE=<site>\` to see what is actually there, then either converge again or correct the config to match. This issue does not close itself." \
              "" \
              "Failed run: $RUN_URL")"
