# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: "Dependency Review"
on:
  pull_request:
  # As sensitive-paths.yml: the merge queue wants an answer from every
  # required check, and this one compares a pull request's two ends, which
  # were compared when it was pushed. The run starts and its job does not.
  merge_group:

permissions:
  contents: read

# A newer push to the same pull request replaces this run. It reads the
# pull request as it now is, and an answer about a commit that has been
# pushed over is an answer nobody will read.
concurrency:
  group: dependency-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# GitHub's default shell for `run:` is `bash -e {0}`, which has no
# pipefail: in `a | b` only b's exit status counts, so a failing command
# feeding a working one is a green step. Naming the shell explicitly gets
# `bash --noprofile --norc -eo pipefail {0}` instead.
#
# Not theoretical here. `tofu plan | tee` reported success and posted an
# empty pull request comment, and `rclone version | head -1` verified
# nothing while passing - both silent, both green, both wrong answers
# rather than errors. It is set on every workflow, including those with no
# `run:` step today, so the one added tomorrow is already covered.
#
# policy/conftest/rules/workflow_pipefail/workflow_pipefail.rego asserts this
# is present.
defaults:
  run:
    shell: bash

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 10
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
      - name: "Dependency Review"
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
