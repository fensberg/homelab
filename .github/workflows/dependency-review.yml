# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: "Dependency Review"
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # The comment that used to sit here said this action "only ever
          # queries GitHub's own advisory data ... no third-party endpoint to
          # allow for." That was true while this repository had almost no
          # dependencies, and stopped being true the moment it gained some:
          # the action also enriches each dependency with OpenSSF Scorecard
          # and deps.dev data, and those are third-party endpoints.
          #
          # The symptom was a bare `Error: fetch failed` three seconds in,
          # with nothing naming a host. The cause is in harden-runner's own
          # Post-step log, which records every DNS request it drops:
          #
          #   [dns-request-dropped] domain=api.securityscorecards.dev. matchedPolicy=NONE
          #   [dns-request-dropped] domain=api.deps.dev.           matchedPolicy=NONE
          #
          # Both endpoints below are transcribed from that log rather than
          # guessed, which is the same method the Semgrep lane's comment in
          # pr-validation.yml describes: run it, read what it actually
          # reached for, then allow exactly that.
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Dependency Review"
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
