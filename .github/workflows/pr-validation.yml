name: "PR Validation"

on:
  # After a merge, main runs what a pull request does not: the whole ledger
  # and the removal check, and nothing that has already passed on this tree.
  # A failure here is a failing check on the commit, and every pull request
  # then runs that lane on its own tree, so only one that clears it can land
  # (main-failing).
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      # Epoch branches are pull request targets too, when one is in use. A
      # pull request into an epoch branch got two checks out of ten while the
      # filter named main alone - neither of them one of the eight lanes that
      # decide whether a change is correct - so a broken workflow sat green.
      - "epoch/**"
  # The merge queue. A pull request that passes here passed against main
  # as it was when it was pushed, and main moves: two that each pass can
  # break it together, and nothing ran on main to say so. The queue runs
  # this workflow again on each pull request as it would land, on top of
  # whatever is ahead of it, and merges it only if that passes.
  merge_group:

permissions: read-all
# The meta-tests, named once. The Repository invariants lane skips them and
# the Meta-tests lane runs only them, both through this variable, so a test
# cannot be dropped by the two lists disagreeing.
env:
  META_TESTS: "^(TestTheLedgerProvesEachGuardFailsWhenItShould)$"
  # The guards that judge what another lane already ran, named once in the
  # same way: the Go modules lane runs every module's tests with coverage, so
  # the guard over that coverage runs there, on the profiles it wrote, and the
  # invariants lane skips it rather than running every module's tests again
  # (#815).
  OWN_LANE_TESTS: "^(TestEveryUncoveredFunctionIsDeclared)$"
  # The guard that removes each application and runs the whole suite twice in
  # copies, named once in the same way. It took the invariants lane to Go's
  # thirty-minute limit, where a run finished or not by seconds (epoch 16).
  REMOVAL_TESTS: "^(TestAnApplicationIsRemovedByDeletingItsDirectoryAndItsBlocks)$"

# Cancel in-progress runs if a new commit is pushed to the PR
concurrency:
  # By the event and the pull request's number, or for a place in the merge
  # queue by its own ref, which no other run has: one place in the queue is
  # never cancelled by another.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Not on main: a run half way through is the answer about a commit, and the
  # next waits for it.
  cancel-in-progress: ${{ github.event_name != 'push' }}

# All lanes run in parallel, Format included. Formatting is enforced by the
# git hook `install-dependencies.sh` wires up (`pre-commit install`), which is
# where it belongs - shift left, catch it in seconds on the machine that wrote
# it, not minutes later in CI. Format's own lane here exists only as the
# backstop for whoever's local hook is missing or bypassed: a first-time
# contributor who never ran the setup script, a bot PR that never touches a
# git hook at all. Gating every other lane on Format used to buy a faster
# failure for a formatting slip, but it also meant a bot or outside PR with
# nothing wrong except formatting would never even get its other lanes run -
# and their results would land staggered by however long Format took, rather
# than together. Running everything at once costs a bit more compute on a
# branch that turns out to have a formatting slip, in exchange for every lane
# - Format included - actually running for every PR, and their results
# landing together.
#
# NOTHING IS REMOVED beyond that, and nothing should be: Semgrep, Trivy and
# checkov overlap on purpose. They are an independent check on code an LLM
# helped write, so a scanner that finds nothing this week is not redundant -
# it is the one that catches what nobody thought to look for.

# GitHub's default shell for `run:` is `bash -e {0}`, which has no
# pipefail: in `a | b` only b's exit status counts, so a failing command
# feeding a working one is a green step. Naming the shell explicitly gets
# `bash --noprofile --norc -eo pipefail {0}` instead.
#
# Not theoretical here. `tofu plan | tee` reported success and posted an
# empty pull request comment, and `rclone version | head -1` verified
# nothing while passing - both silent, both green, both wrong answers
# rather than errors. It is set on every workflow, including those with no
# `run:` step today, so the one added tomorrow is already covered.
#
# policy/conftest/rules/workflow_pipefail/workflow_pipefail.rego asserts this
# is present.
defaults:
  run:
    shell: bash

jobs:
  # What main is failing, and so what this run owes beyond its own lanes.
  main-failing:
    name: "check what main is failing"
    runs-on: pr-source-${{ vars.pull_request_runners_site }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mutation: ${{ steps.read.outputs.mutation }}
      removal: ${{ steps.read.outputs.removal }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Read main's last finished run
        id: read
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: scripts/main-failing.sh >> "$GITHUB_OUTPUT"

  # Whether the merge queue is being asked to test something that has already
  # been tested.
  #
  # A pull request passes this workflow before it may join the queue, and the
  # queue then runs it again on the pull request as it would land: on top of
  # main as it now is, and of anything ahead of it. That second run says
  # something only when the two differ. For a pull request that is level with
  # main and alone in the queue they are the same files, and the same files
  # give the same answer - six minutes spent hearing it twice.
  #
  # So this compares the two as trees, which is the files themselves and not
  # the commits that carry them, and asks that this workflow did pass on the
  # pull request's own head. When both hold, every lane below is skipped,
  # which the queue reads as passed. When main has moved, or something is
  # ahead in the queue, the trees differ and everything runs: which is the
  # case the queue is for. So does a main that has started failing since the
  # pull request passed, or the queue would land past it.
  already-tested:
    name: "skip if already tested"
    needs: main-failing
    if: github.event_name == 'merge_group'
    runs-on: pr-source-${{ vars.pull_request_runners_site }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      identical: ${{ steps.compare.outputs.identical }}
      # Whether the whole ledger has already passed on the tree the queue
      # would land, in any run: the queue then does not prove it again (#885).
      whole-ledger: ${{ steps.compare.outputs.whole-ledger }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Compare what the queue would land with what the pull request tested
        id: compare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          QUEUED: ${{ github.event.merge_group.head_ref }}
          MAIN_MUTATION: ${{ needs.main-failing.outputs.mutation }}
          MAIN_REMOVAL: ${{ needs.main-failing.outputs.removal }}
        run: |
          identical=false
          tree="$(git rev-parse 'HEAD^{tree}')"
          proved="$(curl --proto '=https' -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPO}/actions/artifacts?name=whole-ledger-${tree}&per_page=100" |
            jq '[.artifacts[] | select(.expired | not)] | length')"
          if [ "${proved}" -ge 1 ]; then
            echo "whole-ledger=true" >> "$GITHUB_OUTPUT"
            echo "::notice::the whole ledger has already passed on this tree, so the queue does not prove it again"
          else
            echo "whole-ledger=false" >> "$GITHUB_OUTPUT"
          fi
          # The queue names its branch for the pull request at its head:
          # gh-readonly-queue/<base>/pr-<number>-<the commit it sits on>.
          number="$(sed -n 's#^refs/heads/gh-readonly-queue/.*/pr-\([0-9][0-9]*\)-[0-9a-f]*$#\1#p' <<<"${QUEUED}")"
          if [ "${MAIN_MUTATION}" = true ] || [ "${MAIN_REMOVAL}" = true ]; then
            echo "::notice::main is failing, so what would land has to clear it"
          elif [ -z "${number}" ]; then
            echo "::notice::the queue's branch is not named for one pull request, so everything runs"
          else
            git fetch --no-tags --depth=1 origin "refs/pull/${number}/head"
            tested="$(git rev-parse 'FETCH_HEAD^{commit}')"
            tree="$(git rev-parse 'HEAD^{tree}')"
            # A pull request's run tests the branch merged with main and keeps
            # that tree's id. Found for this pull request's head, the queue
            # would land what passed; not found, main has moved since.
            # curl and jq rather than gh, which the pull-request pools'
            # image does not carry.
            kept="$(curl --proto '=https' -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${REPO}/actions/artifacts?name=tested-tree-${tree}&per_page=100" |
              jq --arg head "${tested}" '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_sha == $head)] | length')"
            if [ "${kept}" -ge 1 ]; then
              identical=true
              echo "::notice::what would land is, file for file, what pull request ${number} passed at ${tested}"
            else
              echo "::notice::pull request ${number} at ${tested} did not pass this tree, so everything runs"
            fi
          fi
          echo "identical=${identical}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------
  # LANE 1: Formatting - fast, and the only lane that also runs locally
  # -----------------------------------------------------------------
  format:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "lint / format"
    runs-on: pr-packages-${{ vars.pull_request_runners_site }}
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      # The same .pre-commit-config.yaml a developer runs, at the same pinned
      # versions. That is the point: there is no second copy of prettier here
      # to disagree with the one on your machine.
      #
      # The gate stands in front of the delivery, not behind it.
      #
      # `pre-commit run` installs every hook repository before it runs any
      # hook - cloning it and building its environment, which executes setup
      # code. So a guard that is itself a hook can only ever report after the
      # download it exists to prevent, however early it is ordered and whatever
      # fail_fast says. On a workstation githooks/pre-commit solves that,
      # because git invokes it first. This lane had no equivalent: its first
      # act was `pre-commit run`, and seven third-party repositories were
      # fetched and executed on the runner before anything could object.
      #
      # So the same program runs here first, with -before-install: it answers
      # only what can be answered with no cache - is every configured
      # repository approved, and does scripts/deliveries.lock say what the
      # declarations say - and refuses before anything is installed.
      #
      # tests/go/repo/hookshim_test.go asserts this step comes before the one
      # that installs anything. Ordering is the whole property; a gate after
      # the delivery is a receipt.
      - name: Read pinned versions
        uses: $/.github/actions/versions

      - name: Setup Go
        uses: $/.github/workflows/setup-go

      - name: Refuse an unapproved supplier before anything is downloaded
        run: go run -C scripts/security . guard-deliveries -before-install

      # pre-commit, and pre-commit-hooks whose checks .pre-commit-config.yaml
      # runs as local system hooks, from scripts/deliveries.lock by hash - the
      # version scripts/versions.env pins, not one restated here (#416). This
      # used to be `pipx install pre-commit==4.6.2`: a second copy of the
      # version, and every dependency of pre-commit resolved fresh.
      - name: Take delivery of pre-commit
        run: scripts/take-delivery.sh pre-commit pre-commit-hooks

      # Every `language: system` hook is skipped here, and each is owned by a
      # lane that has what it needs. This one installs pre-commit and
      # pre-commit-hooks and nothing else, on purpose - it is the fast lane -
      # so a system hook naming a binary it does not have fails with
      # "executable not found", which is a red check that says nothing about
      # the repository. The pre-commit-hooks checks are system hooks too, and
      # run here because this lane took delivery of their package above.
      #
      # tofu-fmt and go-fmt: no pinned binary here. ubuntu-24.04 ships some Go
      # toolchain, not necessarily the one this repo pins. The Validate lane
      # installs both pinned and runs `tofu fmt -check` and `gofmt -l` there.
      # Go formatting used to be enforced by the aggregate's Go analysis, which
      # went in #365 - leaving it owned by nothing until Validate took it.
      #
      # delivery-guard: already ran, above, somewhere it could still refuse.
      # As a hook it would answer nothing new - this runner's cache was built
      # moments earlier from the committed config, so what is installed and
      # what is configured are equal by construction, and both were checked
      # before either existed. The cache half of the guard is a workstation
      # question, where a cache can outlive the config that filled it.
      #
      # tests/go/repo/hookshim_test.go asserts this list and the set of system
      # hooks stay equal, so a new one cannot quietly turn this lane red.
      - name: Run pre-commit
        env:
          SKIP: tofu-fmt,go-fmt,delivery-guard
        run: pre-commit run --all-files --show-diff-on-failure --color always

  # -----------------------------------------------------------------
  # LANE 2: Shell scripts - the sole owner of ShellCheck. A dedicated lane
  # for the same one-owner-per-check reason every other lane here has one:
  # this repo has a handful of shell scripts, so it costs nothing and leaves
  # no shared version or config surface to keep in sync.
  #
  # The execute-bit check that used to sit beside it inside the aggregate is
  # now check-shebang-scripts-are-executable in .pre-commit-config.yaml (#365).
  # It is not shellcheck and does not overlap with this.
  # -----------------------------------------------------------------
  shellcheck:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "lint / shell"
    runs-on: pr-source-${{ vars.pull_request_runners_site }}
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Read pinned versions
        uses: $/.github/actions/versions

      # From scripts/deliveries.lock by hash. This lane used
      # ludeeus/action-shellcheck, which downloaded the binary itself and
      # checked nothing about what arrived (#416). The version is the one
      # install-dependencies.sh puts on the devbox, where actionlint needs it
      # too (#398), read from scripts/versions.env rather than written here.
      - name: Take delivery of shellcheck
        run: scripts/take-delivery.sh shellcheck

      # The files the action chose, from what git tracks rather than whatever
      # is on the runner's disk: every script named for a shell, and every
      # extensionless executable whose shebang names one. All in one run, as
      # the action's check_together did.
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(git ls-files -z -- '*.sh' '*.bash' '*.ksh' '*.zsh')
          while IFS= read -r -d '' f; do
            case "${f##*/}" in *.*) continue ;; esac
            [ -x "$f" ] || continue
            if head -n1 "$f" | grep -Eqs '^#! */[^ ]*/(env *)?[abk]*sh'; then
              files+=("$f")
            fi
          done < <(git ls-files -z)
          # Nothing found is a refusal, not a pass: it means the selection has
          # stopped matching this repository, and a clean run would say so
          # about files it never read.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no shell scripts were found, so nothing was checked"
            exit 1
          fi
          echo "checking ${#files[@]} scripts"
          shellcheck "${files[@]}"

  # -----------------------------------------------------------------
  # LANE 3: Does it actually work?
  # -----------------------------------------------------------------
  # Linting says the code is tidy. This says it is correct: that the OpenTofu
  # resolves, that the config template still carries every key the OpenTofu
  # reads, and that the manifests Flux will apply are valid Kubernetes - which
  # no linter could tell, because on disk they are templates full of ${...}
  # placeholders.
  validate:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "validate / infrastructure"
    runs-on: pr-builds-${{ vars.pull_request_runners_site }}
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      # Versions come from scripts/versions.env, which is the only place one
      # is written. See .github/actions/versions for why this is a step
      # rather than a setup job.
      - name: Read pinned versions
        uses: $/.github/actions/versions

      - name: Install OpenTofu
        # The installer script from scripts/deliveries.lock by hash, run into
        # directories the runner account owns - this job runs with sudo
        # removed (#410). Until #416 the script was fetched and executed with
        # nothing checking what arrived.
        run: scripts/take-delivery.sh opentofu

      # CI has no 1Password credentials and must not have any. The rendered
      # config is a stand-in with the same shape, which is enough for validate
      # and is itself a check: it fails if the template stops being valid JSON
      # once injected, or stops carrying a key the OpenTofu reads.
      - name: Render a placeholder config
        run: bash .github/scripts/placeholder-config.sh

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive management/

      - name: Validate OpenTofu
        working-directory: management/cluster
        env:
          # The placeholder render writes its own filename, never the Render
          # phase's, so nothing here can collide with a real run. `tofu
          # validate` takes no -var flag, hence the environment variable.
          TF_VAR_config_path: ../../config/management.placeholder.json
          # A root fetches its modules from a release of the platform.
          # Validating a change means validating the modules as they are in
          # this checkout, which only a check names; a run against a site
          # clears it and fetches the release its line names.
          TF_VAR_unreleased: ../..
        run: |
          tofu init -backend=false -input=false
          tofu validate

      # A site is two roots: the cluster above, and what is put on it.
      - name: Validate OpenTofu (platform)
        working-directory: management/platform
        env:
          TF_VAR_config_path: ../../config/management.placeholder.json
          TF_VAR_unreleased: ../..
        run: |
          tofu init -backend=false -input=false
          tofu validate

      # The estate's root reads none of a site's config, so it is validated
      # against its own test fixture rather than the placeholder above.
      - name: Validate OpenTofu (estate)
        working-directory: management/estate
        env:
          TF_VAR_config_path: ./tests/fixtures/valid.json
        run: |
          tofu init -backend=false -input=false
          tofu validate

      # `tofu test` used to run here. It moved to the Test lane below, along
      # with `go test`: this lane answers "does it resolve", that one answers
      # "does it behave", and one owner per check is the rule everywhere else
      # in this file too.

      # From scripts/deliveries.lock by hash, into ~/.local/bin - this job runs
      # with sudo removed (#410). Until #416 this archive was downloaded with no
      # checksum at all.
      - name: Install kubeconform and kustomize
        run: scripts/take-delivery.sh kubeconform kustomize

      # Build the kustomization and substitute the placeholders before
      # validating, so what is checked is what Flux will apply. Shape is
      # exactly what was going unchecked - a nodePort has to be an integer,
      # and on disk it is the string "${STATE_DB_NODEPORT}".
      #
      # The stand-in values are in tests/flux-substitutions.env rather than in
      # an `env:` block here. They were here, which made adding one a change
      # to a protected path: a patch for the operator to apply, for a list of
      # deliberately fake values. A guard holds that file and the manifests to
      # each other in both directions.
      - name: Validate Kubernetes manifests
        run: |
          set -a
          # shellcheck source=tests/flux-substitutions.env
          . tests/flux-substitutions.env
          set +a

          # And the ones the file does not list: what the platform hands a
          # site's applications - where releases are published, and the
          # address of each route an application declares - derived so that
          # the list of stand-ins names no application and holds nothing
          # only an application uses.
          .github/scripts/application-standins.sh > "$RUNNER_TEMP/application-standins.env"
          set -a
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/application-standins.env"
          set +a

          schema='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for dir in clusters/core/infrastructure/*/ clusters/core/flux-system/; do
            echo "==> ${dir}"
            kustomize build "${dir}" | envsubst | kubeconform \
              -strict -summary -ignore-missing-schemas \
              -schema-location default -schema-location "${schema}" -
          done

          # Every entrypoint at the top of every directory a site's Flux can
          # be pointed at - the core, and each site's own - found by the
          # kustomization.yaml that makes it one rather than listed: a list
          # only validates what somebody remembered to add to it, and the next
          # site's directory is not one anybody will remember. The
          # kustomization.yaml itself is kustomize's own and has no schema to
          # hold it to. Substituted like the directories above, because Flux
          # substitutes these too.
          for dir in clusters/*/; do
            [ -f "${dir}kustomization.yaml" ] || continue
            echo "==> ${dir} (Flux entrypoints)"
            for file in "${dir}"*.yaml; do
              [ "$(basename "$file")" = kustomization.yaml ] && continue
              envsubst < "$file" | kubeconform -strict -summary -ignore-missing-schemas \
                -schema-location default -schema-location "${schema}" -
            done
            # And the directory builds: a site's reaches the core through it.
            kustomize build "${dir}" > /dev/null
          done

          # Every application's settings for every environment it has them
          # for: each directory of an application's own, but its base, that
          # holds a kustomization. Globbed rather than listed, so the next
          # application and the next environment are validated by existing
          # rather than by somebody remembering this line.
          for dir in modules/applications/*/*/; do
            [ -f "${dir}kustomization.yaml" ] || continue
            if [ "$(basename "$dir")" = base ]; then
              continue
            fi
            echo "==> ${dir}"
            kustomize build "${dir}" | envsubst | kubeconform \
              -strict -summary -ignore-missing-schemas \
              -schema-location default -schema-location "${schema}" -
          done

      # Go vetting and building belong here, on whole packages and not
      # diff-limited. The aggregate that used to offer Go linting handed
      # changed files to golangci-lint as a flat list, which go/packages
      # rejects when they span more than one directory - a confirmed upstream
      # bug (super-linter/super-linter#6294). That tool is gone (#365); this
      # lane was already the honest owner and now it is the only one.
      # No go.sum: scripts/contractor has zero external dependencies, so
      # there is nothing meaningful to cache.
      - name: Setup Go
        uses: $/.github/workflows/setup-go

      - name: Validate Go
        working-directory: scripts/contractor
        run: |
          go vet ./...
          go build -o /dev/null .

      # The test-only module is deliberately NOT vetted here. It has real
      # dependencies, so vetting it needs proxy.golang.org, and this lane's
      # egress allowlist does not carry it - on purpose. scripts/contractor has
      # no dependencies, and a Validate lane that cannot reach a module proxy
      # at all is the cheapest possible proof of that. It is vetted in the
      # Vet lane instead, which has both the endpoints and the module cache.

      # Formatting, with the pinned toolchain. The pre-commit hook skips this
      # in the Format lane because ubuntu-24.04's Go is not necessarily the
      # one this repository pins, so it is checked here where it is.
      #
      # NUL-delimited and piped rather than $(git ls-files) spliced into the
      # argument list. Unquoted command substitution splits on whitespace, so a
      # path containing a space would reach gofmt as two paths that do not
      # exist; and with no Go files at all it would reach gofmt as no arguments
      # at all, which makes gofmt read stdin and wait - a lane that hangs for
      # its whole timeout rather than passing. xargs -0r answers both: NUL is
      # the one byte a path cannot contain, and -r declines to run the command
      # on an empty list. actionlint's shellcheck pass (SC2046) is what asked.
      - name: Check Go formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  # -----------------------------------------------------------------
  # LANE 4: Does it behave? Parallel lanes behind one required check
  # -----------------------------------------------------------------
  # Validate above proves the code resolves. This proves it does the right
  # thing: the Go unit tests, the config-contract tests that hold
  # scripts/contractor and modules/infrastructure/cluster/registry.tf to the same rules,
  # the repository invariants, the OpenTofu invariant tests, and the
  # JavaScript/TypeScript tier.
  #
  # Everything here is hermetic - no 1Password, no hypervisor, no cluster.
  # The tiers that need a real estate live in integration-tests.yml, on a
  # self-hosted runner, and cannot be triggered by a pull request. That
  # separation is the point: a fork PR runs these lanes in full and still
  # cannot reach a credential or a machine.
  #
  # These were one job running every step in sequence, and it was the
  # slowest thing on every pull request: 8m47s on #505, of which the
  # repository tier was 274s and vetting every build tag 165s. It was one job
  # on the argument that splitting would repeat the toolchain install in each
  # lane. That cost is real but small - Setup Go is seconds once its cache is
  # warm, and warm-caches.yml keeps main's warm so a pull request's first run
  # is not a cold compile. Nothing in the job depended on anything before it
  # except the toolchains, so it is now five lanes that run at once, and the
  # pull request waits for the slowest one rather than for the sum.
  #
  # The required check keeps its name. "Test (go, tofu, vitest)" is required
  # by the rulesets, so it stays - as the job that waits for the five lanes
  # and fails if any did. A ruleset change is a settings change a person has
  # to make; keeping the name means there is none to make, and a lane added
  # later is covered by adding it to `needs` below.
  test-go:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "test / unit"
    runs-on: pr-builds-${{ vars.pull_request_runners_site }}
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    # Thirty on the builds pool, where it took past fifteen at a quarter of a
    # processor (the nightly runs before 2026-10-22). Set again from what it
    # takes there now.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The engineer's test of the real scheduler skips on a machine that has
      # none of its programs. Here they are delivered, so a missing one is a
      # failure and not a quiet pass.
      ENGINEER_NEEDS_SCHEDULER: "1"
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      # Versions come from scripts/versions.env, which is the only place one
      # is written. See .github/actions/versions for why this is a step
      # rather than a setup job.
      - name: Read pinned versions
        uses: $/.github/actions/versions

      - name: Setup Go
        uses: $/.github/workflows/setup-go
        with:
          # tests/go is the only module here with dependencies to cache;
          # scripts/contractor has none, so there is no go.sum of its own to key on.
          cache-dependency-path: tests/go/go.sum

      # Before the Go tests, not after them: the contractor asks the address
      # plan module through `tofu console`, so its tests need the binary.
      - name: Install OpenTofu and kustomize
        # The installer script from scripts/deliveries.lock by hash, run into
        # directories the runner account owns - this job runs with sudo
        # removed (#410). Until #416 the script was fetched and executed with
        # nothing checking what arrived.
        run: scripts/take-delivery.sh opentofu kustomize

      # The engineer's own tests run a real scheduler over a small site, so
      # that what it reads is what a scheduler really says.
      - name: Take delivery of the scheduler a change is tried with
        run: scripts/take-delivery.sh kwokctl etcd kube-apiserver kube-scheduler kubectl

      # Every OpenTofu root with a tests/ directory, discovered rather than
      # listed - the cluster and estate roots and every module. A list of
      # roots is a list a new module is silently missing from. Fixtures and
      # mocks only, so nothing here needs a credential; the Go contract tests
      # above assert the cluster root's corpus and the Go one are the same.

      # Every Go module under scripts/, discovered rather than listed.
      #
      # This step named scripts/contractor and nothing else, so the tests of
      # signedpush, security, attestation, clerk, inspector and collector had
      # never run in CI - including the guards that refuse an unsigned push and
      # the program that reads the App private key. Two of those modules were
      # absent from the taskfile's lists as well, so their tests had never run
      # anywhere but the terminal that wrote them.
      #
      # A list of what to test is an allow list, and everything missing from it
      # is invisible rather than red. taskfile.yml sweeps scripts/*/go.mod for
      # the same reason; #281 covers removing this duplicate of it.
      #
      # Each module's tests run once, here, and write their coverage to one
      # directory: the gate below and the uncovered-function guard after it
      # read what this run measured. They ran three times - here, in the gate
      # and in the guard - and the third was most of the invariants lane
      # (#815).
      - name: Unit and contract tests (Go)
        env:
          GO_COVERAGE_PROFILES: ${{ runner.temp }}/go-coverage
        run: |
          mkdir -p "$GO_COVERAGE_PROFILES"
          for dir in scripts/*/ .github/workflows/*/*/; do
            [ -f "$dir/go.mod" ] || continue
            echo "::group::$dir"
            go test -C "$dir" -covermode=atomic -coverprofile="$GO_COVERAGE_PROFILES/$(basename "$dir").out" ./...
            echo "::endgroup::"
          done

      # Reported on every run, enforced as a ratchet: a pull request may not
      # push coverage below the committed floor, and is free to leave it
      # exactly where it found it. See tests/coverage-baseline.json.
      # One floor per module. A single number over one module could not say
      # which module had lost its tests, and six of the seven had no floor at
      # all. The gate refuses a key it has no baseline for, so a new module
      # fails here until its floor is written into tests/coverage-baseline.json.
      - name: Coverage gate (Go)
        env:
          GO_COVERAGE_PROFILES: ${{ runner.temp }}/go-coverage
        run: |
          for dir in scripts/*/ .github/workflows/*/*/; do
            [ -f "$dir/go.mod" ] || continue
            module="$(basename "$dir")"
            pct="$(go -C "$dir" tool cover -func="$GO_COVERAGE_PROFILES/$module.out" \
              | awk '/^total:/ {print substr($3, 1, length($3)-1)}')"
            bash scripts/coverage-gate.sh "go/$module" "$pct"
          done

      # The guards' helpers, held to their floor as the modules are. A bug in
      # one makes a guard wrong rather than absent, which looks green, and
      # tests/go/parsed is the one reader every guard reads the repository
      # through. The floor sat in tests/coverage-baseline.json while no lane
      # measured it (#792). Measured as task test counts it: each package
      # that holds code, by its own tests; Go instruments no _test.go file, so
      # the guards themselves are not in the figure. The packages are found,
      # not listed.
      - name: Coverage gate (the guards' helpers)
        env:
          GO_COVERAGE_PROFILES: ${{ runner.temp }}/go-coverage
        run: |
          mapfile -t packages < <(go -C tests/go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./...)
          go -C tests/go test -covermode=atomic -coverprofile="$GO_COVERAGE_PROFILES/tests-helpers.out" "${packages[@]}"
          pct="$(go -C tests/go tool cover -func="$GO_COVERAGE_PROFILES/tests-helpers.out" \
            | awk '/^total:/ {print substr($3, 1, length($3)-1)}')"
          bash scripts/coverage-gate.sh "go/tests-helpers" "$pct"

      # Every function the tests above did not run is declared, judged on the
      # profiles they wrote. The invariants and removal lanes skip it by
      # $OWN_LANE_TESTS.
      - name: Every uncovered function is declared
        working-directory: tests/go
        env:
          GO_COVERAGE_PROFILES: ${{ runner.temp }}/go-coverage
          GOFLAGS: -v
        run: go test ./repo/ -run "$OWN_LANE_TESTS"

      # --- OpenTofu --------------------------------------------------------
      - name: Invariant tests (OpenTofu)
        run: |
          for root in $(git ls-files '*.tftest.hcl' | xargs -n1 dirname | xargs -n1 dirname | sort -u); do
            echo "::group::${root}"
            tofu -chdir="${root}" init -backend=false -input=false
            tofu -chdir="${root}" test
            echo "::endgroup::"
          done

  vet:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "lint / go vet"
    runs-on: pr-builds-${{ vars.pull_request_runners_site }}
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    # Thirty on the builds pool, where it took past fifteen at a quarter of a
    # processor (the nightly runs before 2026-10-22). Set again from what it
    # takes there now.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      # Versions come from scripts/versions.env, which is the only place one
      # is written. See .github/actions/versions for why this is a step
      # rather than a setup job.
      - name: Read pinned versions
        uses: $/.github/actions/versions

      - name: Setup Go
        uses: $/.github/workflows/setup-go
        with:
          # tests/go is the only module here with dependencies to cache;
          # scripts/contractor has none, so there is no go.sum of its own to key on.
          cache-dependency-path: tests/go/go.sum

      # Every build tag, because `go vet ./...` compiles none of the tiers
      # that carry one. A compile error in the integration or e2e tier should
      # surface on the pull request that caused it, not the night someone
      # first reaches for that suite.
      - name: Vet the test module (every tier)
        working-directory: tests/go
        run: |
          go vet ./...
          go vet -tags=api ./...
          go vet -tags=integration ./...
          go vet -tags=e2e ./...

  invariants:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "test / repo policy"
    # GitHub's runner: the check runs with no network, in the image the
    # pull-request pools run (offline, below; epoch 16, decision 16).
    runs-on: ubuntu-24.04
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows; above Go's own bound
    # on the tests below, so a slow run fails as a timeout that names the
    # test rather than as a cancelled job that names nothing.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # All of it, for the tags: the configuration rules plan each site
          # with the release it runs, read from that release's tag (#843).
          fetch-depth: 0

      # Untagged, so this compiles and runs only the hermetic tests in
      # tests/go: the repository-invariant checks and the state-encryption
      # cutover rehearsal. The integration, api and e2e tiers all carry a
      # build tag and are not reachable here. With no network, in the image
      # the pull-request pools run, which holds every tool the guards and the
      # plays they run take: what the lockfiles name is fetched first, and
      # what each pinned action runs (#881).
      #
      # The meta-tests and the removal guard run in the lanes below, in
      # parallel with this one, and the coverage guard in the Go modules lane.
      # Each set is skipped by the same variable that selects it there, so one
      # declaration decides both and no test can fall between the two.
      - name: Repository invariants and the encryption rehearsal
        uses: $/.github/workflows/offline
        with:
          run: go test ./... -skip "$META_TESTS|$OWN_LANE_TESTS|$REMOVAL_TESTS"
          working-directory: tests/go
          tools: opentofu kustomize conftest opa regal semgrep kwokctl etcd kube-apiserver kubectl ansible-core ansible kubernetes
          env: META_TESTS OWN_LANE_TESTS REMOVAL_TESTS GOFLAGS
        env:
          # Go's default of ten minutes is not a budget anybody set, and the
          # guards passed it on #790 while they moved onto tests/parsed.
          # This is a ceiling for a stuck run, not the target. -v prints each
          # guard's time, which is what says where the time went.
          GOFLAGS: -timeout=30m -v

  removal:
    # On main after a merge, and on a pull request only when main is failing
    # it (main-failing). Skipped, which the queue reads as passed, when the
    # queue would land exactly what the pull request already tested
    # (already-tested).
    needs: [main-failing, already-tested]
    if: ${{ !cancelled() && needs.main-failing.outputs.removal == 'true' && needs.already-tested.outputs.identical != 'true' }}
    name: "test / app removal"
    # GitHub's runner, for the reason the ledger's parts are there (meta).
    runs-on: ubuntu-24.04
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows; above Go's own bound
    # on the tests below, so a slow run fails as a timeout that names the
    # test rather than as a cancelled job that names nothing.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # All of it, for the tags: the configuration rules plan each site
          # with the release it runs, read from that release's tag (#843).
          fetch-depth: 0

      # Every guard against a copy of the repository, and again against a copy
      # without the application, in the image the pull-request pools run and
      # with no network: what the lockfiles name is fetched first, and the
      # plays' tools are in the image (epoch 16, decision 16).
      - name: Removing an application breaks nothing outside it
        uses: $/.github/workflows/offline
        with:
          # The copies are handed this -skip, so the tests of other lanes do
          # not run in them. Without it they would run the coverage guard.
          run: go test ./repo/ -run "$REMOVAL_TESTS" -skip "$META_TESTS|$OWN_LANE_TESTS"
          working-directory: tests/go
          tools: opentofu kustomize conftest opa regal semgrep kwokctl etcd kube-apiserver kubectl ansible-core ansible kubernetes
          # GOFLAGS: a ceiling for a stuck run, not the target. -v prints the
          # guard's time, which is what says where the time went.
          env: REMOVAL_TESTS META_TESTS OWN_LANE_TESTS GOFLAGS
        env:
          GOFLAGS: -timeout=30m -v

  meta:
    # On a pull request, the proofs its change could alter, and the whole
    # ledger where main is failing it (main-failing). In the queue, the whole
    # ledger, always - even when the queue would land exactly what the pull
    # request tested, which proved only part of it - unless the whole ledger
    # has already passed on that tree (already-tested). And on main after a
    # merge. A change whose reach the pull request could not see is proved
    # before it lands, not after: #879 passed its part and broke main (#885).
    needs: [main-failing, already-tested]
    if: ${{ !cancelled() && needs.main-failing.result == 'success' && (github.event_name == 'merge_group' && needs.already-tested.outputs.whole-ledger != 'true' || github.event_name != 'merge_group') }}
    name: "test / mutation (${{ matrix.part }} of ${{ strategy.job-total }})"
    # GitHub's runner, a machine for each part: the job holds no credential,
    # and on the untrusted worker the four parts and the removal check
    # together waited for a processor most of the time and ran out of time
    # (#855; epoch 16, decision 1).
    runs-on: ubuntu-24.04
    # The parts share the ledger's proofs, each in a job of its own. One job,
    # it ran past ten minutes. Each job learns which part it is from GitHub's
    # own count (META_PART, below), so no number written here can come to
    # disagree with how many parts there are, and a proof falls in exactly
    # one of them.
    #
    # Four ledger parts, each on a GitHub runner of its own. Each part pays
    # its own setup before it proves anything, so more parts buy less. Always
    # four, however little a change reaches: what it reaches is known
    # only once Go has read it, and one change can reach the whole ledger,
    # which does not fit in one job's limit below (#854).
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows. Above the tests' own
    # bound below, so that a slow run is reported by Go, naming the test,
    # rather than cut off by the runner.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # All of it, for the tags: the configuration rules plan each site
          # with the release it runs, read from that release's tag (#843).
          fetch-depth: 0

      # The test that proves the other tests: the mutation ledger breaks each
      # guarded file and checks its guard fails. It re-runs a large part of
      # the tier, so it was about half its time, and here it runs beside it
      # instead of after it. In the image the pull-request pools run and with
      # no network: what the lockfiles name is fetched first, and the tools
      # each proof's guard runs are in the image (epoch 16, decision 16).
      - name: Prove the guards fail when they should
        uses: $/.github/workflows/offline
        with:
          run: go test ./repo/ -run "$META_TESTS"
          working-directory: tests/go
          tools: opentofu kustomize conftest opa regal semgrep kwokctl etcd kube-apiserver kubectl ansible-core ansible kubernetes
          env: META_TESTS GOFLAGS META_PART PROOFS_CHANGED_SINCE
        env:
          # Go's default of ten minutes is not a budget anybody set, and the
          # two tests together passed it on #779 while the ledger was being
          # made faster: the bound stopped the work that shortens it. This is
          # a ceiling for a stuck run, not the target; the lane's own time is.
          GOFLAGS: -timeout=30m
          # Which part this job is, as <index>/<total>; empty for one job,
          # which is then the whole of both tests.
          META_PART: ${{ strategy.job-total > 1 && format('{0}/{1}', strategy.job-index, strategy.job-total) || '' }}
          # What this run compares itself with: a pull request's base. Empty -
          # the whole ledger - in the queue, on main, and where main is failing it.
          PROOFS_CHANGED_SINCE: ${{ needs.main-failing.outputs.mutation != 'true' && github.event.pull_request.base.sha || '' }}

  test-js:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "test / frontend"
    runs-on: pr-packages-${{ vars.pull_request_runners_site }}
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      # Versions come from scripts/versions.env, which is the only place one
      # is written. See .github/actions/versions for why this is a step
      # rather than a setup job.
      - name: Read pinned versions
        uses: $/.github/actions/versions

      # --- JavaScript / TypeScript ----------------------------------------
      # Before setup-node, so that setup-node's pnpm cache has a pnpm to
      # find. The version comes from package.json's packageManager field, so
      # the pin lives with the project rather than in this file.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The type checker, not a linter: it reads the same tsconfig.json a
      # developer's editor does, and it is the sole owner of TypeScript
      # correctness in this repository.
      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test:coverage

      - name: Coverage gate (JS)
        run: |
          pct="$(node -e 'const p=require("./coverage/js/coverage-summary.json").total.statements.pct;console.log(Number.isFinite(p)?p:0)' 2>/dev/null || echo 0)"
          bash scripts/coverage-gate.sh js "$pct"

  # The one check a merge is held to from this workflow. It waits on every
  # lane, so a lane can be added, renamed or moved without touching the
  # ruleset, and policy/conftest/rules/plan_required_checks refuses a job here
  # that it does not reach unless the job says continue-on-error.
  tests-passed:
    name: "tests passed"
    needs:
      [
        main-failing,
        already-tested,
        format,
        shellcheck,
        validate,
        test-go,
        vet,
        invariants,
        removal,
        meta,
        test-js,
        policy,
        dockerfiles,
        workflowscan,
        spelling,
        semgrep,
        trivy,
        secrets,
      ]
    # always(), or a failed lane would SKIP this job - and a skipped required
    # check counts as passing. The result is read explicitly instead.
    if: always()
    runs-on: pr-source-${{ vars.pull_request_runners_site }}
    timeout-minutes: 5
    permissions:
      contents: read
      # To ask again what main is failing (scripts/main-failing.sh).
      actions: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Every lane passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          IDENTICAL: ${{ needs.already-tested.outputs.identical }}
          WHOLE: ${{ needs.already-tested.outputs.whole-ledger }}
          LEDGER: ${{ needs.meta.result }}
          GATE: ${{ needs.already-tested.result }}
          EVENT: ${{ github.event_name }}
          REMOVAL: ${{ needs.main-failing.outputs.removal }}
          MUTATION: ${{ needs.main-failing.outputs.mutation }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # What main is failing now, and not when this run began. Rerunning
          # a failed lane keeps the answer the run started with, so a lane
          # main came to owe since then would never run (#856).
          if [ "${EVENT}" != "push" ]; then
            now="$(scripts/main-failing.sh)"
            if grep -qx 'mutation=true' <<<"${now}" && [ "${MUTATION}" != "true" ]; then
              echo "::error::main is now failing the ledger, and this run did not run all of it. Push, or update the branch, to run it."
              exit 1
            fi
            if grep -qx 'removal=true' <<<"${now}" && [ "${REMOVAL}" != "true" ]; then
              echo "::error::main is now failing the removal check, and this run did not run it. Push, or update the branch, to run it."
              exit 1
            fi
          fi
          # The queue would land exactly what the pull request tested, and
          # the lanes were skipped for it: said by the comparison itself, and
          # only when the comparison succeeded.
          if [ "${GATE}" = "success" ] && [ "${IDENTICAL}" = "true" ]; then
            # The pull request proved part of the ledger; the queue proves the
            # whole of it, unless it already passed on this tree.
            if [ "${LEDGER}" = "success" ] || { [ "${LEDGER}" = "skipped" ] && [ "${WHOLE}" = "true" ]; }; then
              echo "already tested: nothing was run again but the whole ledger"
              exit 0
            fi
            echo "::error::the whole ledger finished as ${LEDGER} on what the queue would land"
            exit 1
          fi
          # Every need this run owes, and not the comparison, which does not
          # run on a pull request. Main owes only what runs after a merge, and
          # the removal check is owed elsewhere only while main is failing it.
          # The ledger is skipped, and passes, where the whole of it has
          # already passed on this tree.
          if [ "${LEDGER}" = "skipped" ] && [ "${WHOLE}" = "true" ]; then
            NEEDS="$(jq 'del(.meta)' <<<"${NEEDS}")"
          fi
          failed="$(jq -r --arg event "${EVENT}" --arg removal "${REMOVAL}" '
            del(."already-tested")
            | if $event == "push" then with_entries(select(.key | IN("main-failing", "removal", "meta"))) else . end
            | if $removal == "true" then . else del(.removal) end
            | to_entries[] | select(.value.result != "success") | "\(.key) finished as \(.value.result)"' <<<"${NEEDS}")"
          if [ -n "${failed}" ]; then
            echo "::error::${failed}"
            exit 1
          fi

      # What this run tested: the branch merged with main, which is what a
      # pull_request run checks out. The queue looks for this tree, so it
      # reruns nothing unless main has moved (already-tested).
      - name: Record the tree that passed
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p tested
          git rev-parse 'HEAD^{tree}' | tee tested/tree
          echo "TESTED_TREE=$(cat tested/tree)" >> "$GITHUB_ENV"

      - name: Keep it for the queue
        if: github.event_name == 'pull_request'
        uses: $/.github/workflows/upload-artifact
        with:
          name: tested-tree-${{ env.TESTED_TREE }}
          path: tested/tree
          if-no-files-found: error
          retention-days: 30

      # When this run proved the whole ledger - every part, compared with
      # nothing - the tree is kept by that name too, so a queue landing it
      # does not prove the ledger again (#885).
      - name: Record the tree the whole ledger passed on
        if: needs.meta.result == 'success' && (github.event_name != 'pull_request' || needs.main-failing.outputs.mutation == 'true')
        run: |
          mkdir -p whole
          git rev-parse 'HEAD^{tree}' | tee whole/tree
          echo "WHOLE_TREE=$(cat whole/tree)" >> "$GITHUB_ENV"

      - name: Keep the tree the whole ledger passed on
        if: needs.meta.result == 'success' && (github.event_name != 'pull_request' || needs.main-failing.outputs.mutation == 'true')
        uses: $/.github/workflows/upload-artifact
        with:
          name: whole-ledger-${{ env.WHOLE_TREE }}
          path: whole/tree
          if-no-files-found: error
          retention-days: 30

  # WHEN MAIN FAILS AFTER A MERGE, THE MERGE IS OFFERED BACK (#885).
  #
  # A change can pass its own pull request and the queue and still break
  # main: what CI itself runs on can take effect only after it lands (#878,
  # #879). This opens the revert of the merge that broke it, and the operator
  # decides: merging it is one approval like any other, and nothing here
  # merges it. A lane that failed by chance costs one click either way - run
  # the failed lanes again, and the offer is withdrawn when they pass.
  #
  # Only on a push to main, so only main's code runs here and nothing a pull
  # request brings. No merge waits on it, which is what continue-on-error
  # says to plan_required_checks: it comes after the gate, never before.
  offer-revert:
    name: "offer the revert"
    needs: [tests-passed]
    if: always() && github.event_name == 'push' && needs.tests-passed.result == 'failure'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The whole history, so origin/main is main as it is now and the
      # revert is made on top of it rather than of this run's commit.
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          fetch-depth: 0

      - name: Make the revert
        id: revert
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short="${SHA::8}"
          branch="revert/main-failed-${short}"
          subject="$(git log -1 --format=%s "$SHA")"
          # A revert that leaves main failing says the cause is not the
          # merge before it, and reverting the revert would put back what
          # was taken out. Nothing is offered; the run needs reading.
          case "$subject" in
            revert:*)
              echo "::error::${short} is itself a revert and main still fails, so the cause is not the merge it took back. Nothing is offered: read this run."
              exit 1
              ;;
          esac
          if gh api "repos/${REPO}/git/ref/heads/${branch}" --silent 2>/dev/null; then
            echo "::notice::the revert of ${short} is already offered on ${branch}"
            echo "offered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          origin="$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number // empty')"
          git switch -q -c "$branch" origin/main
          if ! git revert --no-commit "$SHA"; then
            git revert --abort
            echo "::error::${short} no longer reverts cleanly onto main, which has moved on since. Nothing is offered: revert it by hand, or fix forward."
            exit 1
          fi
          git -c user.name=revert -c user.email=revert@invalid commit -q \
            -m "revert: ${subject:0:90}" \
            -m "This reverts commit ${SHA}: main failed after it (${RUN_URL})."
          {
            echo "offered=true"
            echo "branch=${branch}"
            echo "title=revert: ${origin:+#${origin} }broke main (${short})"
            echo "body<<END_OF_BODY"
            echo "## Actions for you"
            echo ""
            echo "Read the failed run first: ${RUN_URL}"
            echo ""
            echo "- **If the change broke main, merge this.** It takes ${origin:+#${origin}, }${short} out, and main is what it was before."
            echo "- **If a lane failed by chance, do not merge it.** Run the failed lanes again; when they pass, this is closed for you."
            echo ""
            echo "## What this is"
            echo ""
            echo "main's checks failed after ${short} merged: ${subject}"
            echo ""
            echo "A merged pull request cannot be reopened. To land the change again once it is fixed, revert this."
            echo "END_OF_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Mint the pull-request token
        id: token
        if: steps.revert.outputs.offered == 'true'
        uses: $/.github/workflows/app-token
        with:
          client-id: ${{ secrets.PROCUREMENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROCUREMENT_BOT_PRIVATE_KEY }}
          # Contents to publish the branch; pull requests to open it.
          permission-contents: write
          permission-pull-requests: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Offer it
        id: offer
        if: steps.revert.outputs.offered == 'true'
        uses: $/.github/workflows/signed-pull-request
        with:
          token: ${{ steps.token.outputs.token }}
          branch: ${{ steps.revert.outputs.branch }}
          title: ${{ steps.revert.outputs.title }}
          body: ${{ steps.revert.outputs.body }}

      - name: Say where
        if: steps.revert.outputs.offered == 'true'
        env:
          URL: ${{ steps.offer.outputs.url }}
        run: echo "main failed after this merge; its revert is offered as ${URL}" >> "$GITHUB_STEP_SUMMARY"

  # The other half: the failed lanes run again and pass, so main was not
  # broken, and the revert offered for it is closed rather than left for
  # somebody to merge by mistake.
  withdraw-revert:
    name: "withdraw the revert"
    needs: [tests-passed]
    if: always() && github.event_name == 'push' && github.run_attempt > 1 && needs.tests-passed.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Find the offer
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          branch="revert/main-failed-${SHA::8}"
          number="$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Mint the pull-request token
        id: token
        if: steps.find.outputs.number != ''
        uses: $/.github/workflows/app-token
        with:
          client-id: ${{ secrets.PROCUREMENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROCUREMENT_BOT_PRIVATE_KEY }}
          # Contents to delete the branch; pull requests to close it.
          permission-contents: write
          permission-pull-requests: write
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Withdraw it
        if: steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.find.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr close "$NUMBER" --repo "$REPO" --delete-branch \
            --comment "main's checks passed when run again (${RUN_URL}), so main was not broken and nothing needs taking back."
          echo "main passed when run again; the revert offered as #${NUMBER} is withdrawn" >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------
  # LANES 5-8: Static analysis, one tool each
  # -----------------------------------------------------------------
  # These four were one lane running one image that bundled thirty checks
  # behind a single status. It hung intermittently for its whole timeout,
  # three times in two days, and each hang blocked whatever pull request was
  # in flight (#365). Each tool is now taken from its publisher, pinned in
  # scripts/versions.env, declared in scripts/approved-suppliers.yml, and owned
  # by exactly one lane - so a failure names the tool that failed.
  policy:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "scan / policy"
    runs-on: pr-packages-${{ vars.pull_request_runners_site }}
    # Bounded so a stuck job cannot bill a metered vendor for six hours, which
    # is what GitHub's default timeout allows.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      # Versions come from scripts/versions.env, which is the only place one
      # is written. See .github/actions/versions for why this is a step
      # rather than a setup job.
      - name: Read pinned versions
        uses: $/.github/actions/versions

      # checkov and every package it pulls in, from scripts/deliveries.lock by
      # hash (#416). A version pin alone left over a hundred dependencies to
      # resolve fresh on every run.
      - name: Install checkov (locked)
        run: scripts/take-delivery.sh checkov

      # --skip-download, deliberately. Checkov asks api0.prismacloud.io for
      # policy metadata on startup, that host is not on the allowlist above and
      # will not be, and the attempt is simply time spent waiting for a
      # connection this estate refuses. The checks themselves are local.
      #
      # Configuration is .checkov.yaml at the repository root, read
      # automatically, and every exclusion in it carries its reasoning.
      - name: Run Checkov
        run: checkov --directory . --quiet --compact --skip-download

  dockerfiles:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "scan / containers"
    runs-on: pr-source-${{ vars.pull_request_runners_site }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Read pinned versions
        uses: $/.github/actions/versions

      # A single static binary from the publisher's own release, installed only
      # if its SHA256 matches scripts/deliveries.lock, into ~/.local/bin - this
      # job runs with sudo removed (#410).
      - name: Install hadolint (locked)
        run: scripts/take-delivery.sh hadolint

      # Every Dockerfile this estate builds, discovered rather than listed, so
      # a new image is covered the moment it exists.
      - name: Run hadolint
        run: git ls-files '*Dockerfile' '*/Dockerfile' | xargs -r hadolint

  workflowscan:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "scan / workflows"
    runs-on: pr-packages-${{ vars.pull_request_runners_site }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Read pinned versions
        uses: $/.github/actions/versions

      - name: Install zizmor (locked)
        run: scripts/take-delivery.sh zizmor

      # The workflows are the part of this repository that runs with a token,
      # which is why this lane exists at all: it caught the procurement App's
      # token inheriting every permission its installation held. The token
      # below is what lets its online audits ask about the actions in use.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor .github/workflows

  spelling:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "lint / spelling"
    runs-on: pr-packages-${{ vars.pull_request_runners_site }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Read pinned versions
        uses: $/.github/actions/versions

      - name: Install codespell (locked)
        run: scripts/take-delivery.sh codespell

      # Prose and code alike. It reads the epoch records, which is how it
      # caught a quotation carrying the operator's own typos into the history.
      - name: Run codespell
        run: codespell

  semgrep:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "scan / code"
    runs-on: ubuntu-24.04
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 15
    permissions:
      contents: read
    # Semgrep is taken the way every Python tool here is - pinned in
    # scripts/versions.env, its closure hashed in scripts/deliveries.lock -
    # so this lane, the code rules' harness and a workstation run the one
    # version. It ran in a container whose tag was a second copy of that
    # version, refreshed by hand.
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          fetch-depth: 0
      - name: Read pinned versions
        uses: $/.github/actions/versions
      - name: Take delivery of Semgrep
        run: scripts/take-delivery.sh semgrep
      - name: Run Semgrep CI
        # clusters/bootstrap/ is Cilium's chart output, committed verbatim so a
        # version bump is a reviewable diff rather than a one-line pin change.
        # Its hostNetwork and privilege-escalation findings are true and are
        # inherent to what a CNI is - it is the node's network. Excluded here
        # rather than in a root .semgrepignore, because that file REPLACES
        # semgrep's built-in ignore list rather than adding to it, and silently
        # losing those defaults is a bigger hole than the one being closed.
        #
        # One registry rule is excluded, and it duplicates a check with an
        # owner. github-actions-mutable-action-tag refuses any `uses:` without a
        # 40-character commit and exempts `./` and `docker://` - but not `$/`,
        # GitHub's self-repository reference, which resolves to the running
        # commit and is as immutable as a reference gets. Every job starts with
        # `uses: $/.github/workflows/mobilize`, so the rule fires on every job.
        #
        # Nothing is lost: zizmor's unpinned-uses owns "is this pinned to a
        # commit" under a blanket hash policy, fails the Workflow Scan lane on a
        # tag, and reads composite actions as well as workflows - checked with a
        # tag-pinned step in each. Two owners of one check is the arrangement
        # this repository refuses anyway.
        #
        # Removed when: the rule exempts `^\$/` the way it exempts `^\./`.
        run: >-
          semgrep ci --exclude=clusters/bootstrap
          --exclude-rule=yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        env:
          SEMGREP_RULES: "p/default"

  # -----------------------------------------------------------------
  # LANE 7: Infrastructure Misconfigurations + Dependency Vulnerabilities
  # (IaC + vuln) - the sole owner of Trivy. It was pulled out of the
  # aggregate that also bundled Trivy, because two invocations with two
  # different configs is exactly the failure mode that put an unformatted
  # 11k-line file on a PR that pre-commit had already passed. scan-type "fs"
  # with scanners vuln+misconfig covers gomod vulnerability scanning and
  # Kubernetes/Terraform misconfiguration scanning in a single pass; secret
  # scanning is
  # deliberately left off scanners here because Secrets Scan (TruffleHog)
  # already owns that.
  # -----------------------------------------------------------------
  trivy:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "scan / infrastructure"
    runs-on: pr-packages-${{ vars.pull_request_runners_site }}
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          fetch-depth: 0

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scanners: "vuln,misconfig"
          hide-progress: false
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          # clusters/core/flux-system/ is Flux's own generated install
          # manifest, committed verbatim (.checkov.yaml carries the full
          # reasoning, and excludes it for the same reason). Its ClusterRoles need broad permissions to reconcile
          # arbitrary resource types - that is how Flux has to work, not a
          # misconfiguration in code we control - so this is excluded from
          # scanning entirely rather than suppressing the specific rule IDs
          # project-wide, which would also silence real findings elsewhere.
          #
          # clusters/bootstrap/ is Cilium's chart output, committed for the same
          # reason and excluded on the same grounds: a CNI runs privileged, on
          # the host network, with CAP_NET_ADMIN and hostPath mounts, and no
          # version of one satisfies these rules. The privilege is recorded
          # deliberately in scripts/approved-suppliers.yml rather than waved
          # away here. The cost is that a future chart version adding a new
          # mount would not be flagged; the compensating control is that the
          # manifest is committed, so it shows up in a pull request diff.
          skip-dirs: "clusters/core/flux-system,clusters/bootstrap"

  # -----------------------------------------------------------------
  # LANE 8: Secrets - waits for nothing
  # -----------------------------------------------------------------
  secrets:
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "scan / secrets"
    runs-on: ubuntu-24.04
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          fetch-depth: 0

      # Versions come from scripts/versions.env, which is the only place one
      # is written. See .github/actions/versions for why this is a step
      # rather than a setup job.
      - name: Read pinned versions
        uses: $/.github/actions/versions

      # Not the marketplace action: its own action.yml runs
      # `docker run "${IMAGE}:${VERSION}"` with VERSION defaulting to
      # `latest` and no input that can express a digest (the template is
      # hardcoded to `image:tag`, never `image@sha256:...`). SHA-pinning the
      # action only pins its orchestration script - it still silently pulls
      # whatever `latest` resolves to today, on a job that reaches any host
      # by design. Taking delivery of the release
      # archive from scripts/deliveries.lock by hash closes that gap the same
      # way it does for tofu and kubeconform in the Validate lane above.
      - name: Install trufflehog (locked)
        run: scripts/take-delivery.sh trufflehog

      - name: Setup Go
        uses: $/.github/workflows/setup-go

      # The scan the push hook runs, by the same verb, so the two cannot come
      # to differ: security guard-secrets holds the flags, and writes its
      # findings as annotations here. base/head come straight from the
      # pull_request event - this workflow no longer has a push trigger (see
      # the on: block above), so that is the only case worth handling.
      - name: Run TruffleHog
        env:
          # A pull request's own two ends, or a place in the merge queue's.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: go run -C scripts/security . guard-secrets -base "${BASE_SHA}" -head "${HEAD_SHA}"

  # -----------------------------------------------------------------
  # SHARED ACTIONS: that the actions every job reaches through $/ still do
  # what they claim. Mobilize checks out the repository, and the shared
  # github-script action hands a calling step's env to the script beside it.
  # Both are referenced with $/, which GitHub resolves at the running commit;
  # a change in how it does is found here, on the pull request that meets it.
  #
  # It also proved harden-runner's block until the agent was cut on
  # 2026-11-12 (#795), as "test / egress blocked".
  # -----------------------------------------------------------------
  shared-actions:
    # Nothing waits on this.
    continue-on-error: true
    # Skipped, which the queue reads as passed, when the queue would land
    # exactly what the pull request already tested (already-tested).
    needs: already-tested
    if: ${{ !cancelled() && github.event_name != 'push' && needs.already-tested.outputs.identical != 'true' }}
    name: "test / shared actions"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: The repository was checked out
        run: |
          if [ ! -f CLAUDE.md ]; then
            echo "::error::mobilize ran and the workspace holds no checkout."
            exit 1
          fi

      # The plan-comment scripts are files beside the shared github-script
      # action and read their values from process.env set on the calling step.
      # Those jobs run only on infrastructure changes, so a script that cannot be
      # read under $/, or env that stopped arriving, is found here first.
      - name: A calling step's env reaches a script beside the shared action
        uses: $/.github/workflows/github-script
        env:
          PROOF: reached
        with:
          name: env-reaches-script

  # ---------------------------------------------------------------------
  # POOL PROOF (source) - one of the estate's own pools for a pull request's
  # jobs, tried from inside. The pool for jobs that need nothing beyond the source control.
  #
  # On the untrusted zone's machine, held to its pool's hosts by the
  # cluster's network (clusters/core, pull-requests-source.yaml). The site
  # is the estate's to say (management/estate, the repository's variable).
  #
  # NOTHING WAITS ON THIS, on purpose: it is what shows a pool works before
  # any job a merge is held to is moved onto it. A pool that is not taking
  # work leaves this queued and holds nothing up.
  # ---------------------------------------------------------------------
  pool-source:
    # Nothing waits on this.
    continue-on-error: true
    if: github.event_name != 'push'
    name: "test / runner isolation (source)"
    runs-on: pr-source-${{ vars.pull_request_runners_site }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Prove the pool holds
        uses: $/.github/workflows/pool-proof
        with:
          reaches: https://github.com

  # ---------------------------------------------------------------------
  # POOL PROOF (builds) - one of the estate's own pools for a pull request's
  # jobs, tried from inside. The pool for jobs that download what a build needs.
  #
  # On the untrusted zone's machine, held to its pool's hosts by the
  # cluster's network (clusters/core, pull-requests-builds.yaml). The site
  # is the estate's to say (management/estate, the repository's variable).
  #
  # NOTHING WAITS ON THIS, on purpose: it is what shows a pool works before
  # any job a merge is held to is moved onto it. A pool that is not taking
  # work leaves this queued and holds nothing up.
  # ---------------------------------------------------------------------
  pool-builds:
    # Nothing waits on this.
    continue-on-error: true
    if: github.event_name != 'push'
    name: "test / runner isolation (builds)"
    runs-on: pr-builds-${{ vars.pull_request_runners_site }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Prove the pool holds
        uses: $/.github/workflows/pool-proof
        with:
          reaches: https://proxy.golang.org

  # ---------------------------------------------------------------------
  # POOL PROOF (packages) - one of the estate's own pools for a pull request's
  # jobs, tried from inside. The pool for jobs that reach the package registries.
  #
  # On the untrusted zone's machine, held to its pool's hosts by the
  # cluster's network (clusters/core, pull-requests-packages.yaml). The site
  # is the estate's to say (management/estate, the repository's variable).
  #
  # NOTHING WAITS ON THIS, on purpose: it is what shows a pool works before
  # any job a merge is held to is moved onto it. A pool that is not taking
  # work leaves this queued and holds nothing up.
  # ---------------------------------------------------------------------
  pool-packages:
    # Nothing waits on this.
    continue-on-error: true
    if: github.event_name != 'push'
    name: "test / runner isolation (packages)"
    runs-on: pr-packages-${{ vars.pull_request_runners_site }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Prove the pool holds
        uses: $/.github/workflows/pool-proof
        with:
          reaches: https://registry.npmjs.org
