name: "PR Validation"

on:
  pull_request:
    branches:
      - main
      
# Cancel in-progress runs if a new commit is pushed to the PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicitly grant the ephemeral token permissions to post PR statuses
permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  # -----------------------------------------------------------------
  # LANE 1: Secrets Scanning
  # -----------------------------------------------------------------
  secrets:
    name: "Secrets Scan (TruffleHog)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@3a3bf924430cd864380eb922c070a2ea9c77da71 # v3.82.1
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # -----------------------------------------------------------------
  # LANE 2: Code Quality & Linting
  # -----------------------------------------------------------------
  lint:
    name: "Code Quality (Super-Linter)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run Super-Linter
        uses: super-linter/super-linter/slim@b92721f792f381cd90f1eaebbc2a138c20573e34 # v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CHECKOV: false # Disabled to prevent overlap with Trivy

  # -----------------------------------------------------------------
  # LANE 3: Static Application Security Testing (SAST)
  # -----------------------------------------------------------------
  semgrep:
    name: "Logic Scan (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Semgrep CI
        run: semgrep ci
        env:
          SEMGREP_RULES: "p/default"

  # -----------------------------------------------------------------
  # LANE 4: Infrastructure Misconfigurations (IaC)
  # -----------------------------------------------------------------
  trivy:
    name: "IaC Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@18f2510ee396b22414fa39620583b632eb9b4376 # v0.28.0
        with:
          scan-type: "config"
          hide-progress: false
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  # -----------------------------------------------------------------
  # LANE 5: Custom Business Logic (Policy as Code)
  # -----------------------------------------------------------------
  #conftest: