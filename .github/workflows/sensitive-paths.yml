name: Sensitive Paths

# The acknowledgement is a review conversation, not a label.
#
# It used to be a label, and the label outlived the diff it acknowledged.
# GitHub dismisses stale reviews when a branch moves and never touches labels,
# so `sensitive-reviewed` survived every later commit: touch a sensitive path,
# read the comment, apply the label, push a fixup, merge. The gate was
# satisfied for a diff nobody had looked at, and a fixup is exactly where a
# deleted assertion hides.
#
# A conversation fixes that by construction rather than by a rule bolted on
# top. It is anchored to the file in the diff, so resolving it means somebody
# was in the change rather than clicking a checkbox on the side of the page. It
# is keyed to a digest of the sensitive part of the diff, so changing that part
# opens a new one and leaves the old acknowledgement behind. And GitHub's own
# "require conversation resolution before merging" enforces it, which is one
# fewer thing for this workflow to be the only guarantee of.
#
# What is left for this workflow to check is the one thing GitHub will not:
# **who** resolved it. An acknowledgement closed by whoever opened the pull
# request is not an acknowledgement. That check should never fire.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# There is deliberately no trigger for a conversation being resolved.
#
# `pull_request_review_thread` is a webhook event that was never ported to
# workflow triggers - actionlint refuses it, and GitHub's own community
# discussions confirm it. So nothing re-runs this check when somebody resolves
# a thread.
#
# That constrains what this check may refuse. It must never block on anything
# only a human action can clear - an absent conversation, or an open one -
# because there would be no event to turn it green again, and the gate would be
# a deadlock rather than a gate. GitHub's "require conversation resolution
# before merging" already blocks the merge while a thread is open, immediately
# and with no workflow involved, so that half needs nothing from here.
#
# What is left is the half GitHub will not do: refusing a resolution by a
# machine. Clearing that needs a push, which is the right cost for something
# that should never happen.

permissions:
  contents: read

# GitHub's default shell for `run:` is `bash -e {0}`, which has no
# pipefail: in `a | b` only b's exit status counts, so a failing command
# feeding a working one is a green step. Naming the shell explicitly gets
# `bash --noprofile --norc -eo pipefail {0}` instead.
#
# tests/go/repo/pipefail_test.go asserts this is present.
defaults:
  run:
    shell: bash

jobs:
  tripwire:
    name: Sensitive Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned, not whatever the image ships. scripts/attestation has zero
      # external dependencies, so there is nothing to cache and nothing to
      # fetch - which is also why the blocked egress policy above needs no
      # module proxy in its allowlist.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: false

      - name: Which sensitive paths were touched
        id: sensor
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE" "$HEAD" \
            | .github/scripts/sensitive-paths.sh >>"$GITHUB_OUTPUT"

      # The digest is what binds an acknowledgement to content rather than to a
      # moment. It covers only the sensitive files, so a push that reformats
      # something unrelated does not invalidate a review somebody already did -
      # and a push that changes one of these does, which is the whole point.
      - name: Digest the sensitive part of the diff
        id: digest
        if: steps.sensor.outputs.tripped == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FILES: ${{ steps.sensor.outputs.files }}
        run: |
          mapfile -t paths <<<"$FILES"
          d=$(git diff "$BASE" "$HEAD" -- "${paths[@]}" | sha256sum | cut -c1-12)
          echo "digest=$d" >>"$GITHUB_OUTPUT"
          echo "anchor=${paths[0]}" >>"$GITHUB_OUTPUT"

      # The decision is not written here. It is scripts/attestation, a Go
      # program with a test for every branch, for the reason
      # sensitive-paths.sh already gives about itself: a script is reviewable,
      # is linted, and can be run against known input. Behaviour that exists
      # only as YAML inside a workflow is a convention somebody remembered to
      # write, and a convention fails.
      #
      # tests/go/repo/tripwire_ack_test.go asserts this step exists, that the
      # invocation is one that can actually run, and that nothing here has
      # gone back to labels.
      #
      # `go run -C <dir> .` rather than `go run ./scripts/attestation`: this
      # repository has no module at its root, deliberately - each program is
      # its own module so one program's dependency is not every program's.
      # From the root there is no main module to resolve a ./... path against,
      # so the second form cannot ever work here. It shipped anyway, because
      # the test asserted the string rather than the invocation.
      #
      # Every expansion is bound to an environment variable rather than
      # interpolated into the script. A `${{ }}` inside `run:` is textual
      # substitution into the shell source before bash sees it, so a value
      # containing shell syntax becomes shell syntax; `$VAR` is a value
      # whatever it holds. zizmor's template-injection audit is what enforces
      # this, and it is the reason to write it this way even where the
      # particular value is a digest that could not contain anything nasty.
      - name: Require an acknowledgement nobody gave themselves
        if: steps.sensor.outputs.tripped == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.sensor.outputs.report }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          ANCHOR: ${{ steps.digest.outputs.anchor }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$REPORT" >/tmp/sensitive-report.md
          go run -C scripts/attestation . \
            -repo "$REPO" \
            -pr "$PR" \
            -digest "$DIGEST" \
            -anchor "$ANCHOR" \
            -head "$HEAD" \
            -report /tmp/sensitive-report.md
