name: Sensitive Paths

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# GitHub's default shell for `run:` is `bash -e {0}`, which has no
# pipefail: in `a | b` only b's exit status counts, so a failing command
# feeding a working one is a green step. Naming the shell explicitly gets
# `bash --noprofile --norc -eo pipefail {0}` instead.
#
# Not theoretical here. `tofu plan | tee` reported success and posted an
# empty pull request comment, and `rclone version | head -1` verified
# nothing while passing - both silent, both green, both wrong answers
# rather than errors. It is set on every workflow, including those with no
# `run:` step today, so the one added tomorrow is already covered.
#
# tests/go/repo/pipefail_test.go asserts this is present.
defaults:
  run:
    shell: bash

jobs:
  tripwire:
    name: Sensitive Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Set up
        uses: ./.github/actions/setup
        with:
          fetch-depth: 0

      - name: Which sensitive paths were touched
        id: sensor
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE" "$HEAD" \
            | .github/scripts/sensitive-paths.sh >>"$GITHUB_OUTPUT"

      # The comment body is built entirely by the script, so changing the
      # wording never means touching this file. Copy that needs a workflow edit
      # to fix is copy that stays wrong, and the agent cannot edit workflows.
      - name: Say what is at risk
        if: steps.sensor.outputs.tripped == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT: ${{ steps.sensor.outputs.report }}
        with:
          script: |
            const body = process.env.REPORT;
            const marker = '<!-- sensitive-paths -->';
            const {data: comments} = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const args = {owner: context.repo.owner, repo: context.repo.repo, body};
            if (existing) {
              await github.rest.issues.updateComment({...args, comment_id: existing.id});
            } else {
              await github.rest.issues.createComment({...args, issue_number: context.issue.number});
            }

      # Not just "does the label exist" - who applied it. The agent's App holds
      # issues: write, needed to comment at all, and the same permission lets it
      # label a pull request. Demonstrated on #49 before this was written.
      - name: Require an explicit acknowledgement
        if: steps.sensor.outputs.tripped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          who=$(gh api "repos/${REPO}/issues/${PR}/timeline" \
            --jq '[.[]|select(.event=="labeled" and .label.name=="sensitive-reviewed")]|last|.actor.login // empty')
          case "$who" in
            "")
              echo "::error::This pull request changes a safety property. Read the comment, then apply the 'sensitive-reviewed' label."
              exit 1 ;;
            *"[bot]")
              echo "::error::'sensitive-reviewed' was applied by ${who}, which is a bot. The acknowledgement has to come from a human - that is the entire point of it. Remove the label and re-apply it yourself."
              exit 1 ;;
            *)
              echo "acknowledged by ${who}" ;;
          esac
