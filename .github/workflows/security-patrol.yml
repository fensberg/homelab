name: "Security Patrol"

# Site security's patrol: the estate, watched from outside it.
#
# Renamed from "Estate Canary" alongside the program it runs - scripts/canary
# became scripts/security's `patrol` verb, on the reasoning that guarding
# deliveries, guarding pushes and watching the perimeter are one role wearing
# three names rather than three separate things. This file kept the old name
# after that change landed, which is exactly the failure the construction
# theme exists to catch: a name that no longer describes what runs.
#
# "Canary" stays as the word for the PATTERN, because it is a real term of
# art and renaming it away would obscure rather than clarify - this still is
# a dead-man's-switch, watched from outside, for the same reason a canary is
# carried into a mine rather than tested at the entrance. What changed is
# only which noun names the workflow: security patrol, not canary.
#
# And then "gatehouse patrol" became "security patrol", because a gatehouse is
# a building and a building does not patrol. The role was security before it
# was the gatehouse; see scripts/security/main.go.
#
# Everything else that reports on this estate runs inside it, and all of it
# was blind to the failure that actually happened: the estate stopped being
# able to run jobs at all, and nothing said so for three days. The nightly
# drift check sat queued from 29 to 31 August without ever failing, because a
# job that never starts cannot fail - timeout-minutes only counts once a job
# is running, and a stale queued run is cancelled after about a day with no
# alarm.
#
# So this runs on a GitHub-hosted runner, where the estate cannot starve it.
# It deliberately holds no credential that reaches the estate: the cluster's
# API is on the overlay network, and getting to it from here would mean a
# tailnet key stored outside the estate, which is a worse trade than the
# blindness it buys.

on:
  schedule:
    # REQUESTED hourly. It does not run hourly, and every threshold below is
    # set against what actually happens rather than what is requested (#221).
    #
    # GitHub delays scheduled workflows under load and drops them when the delay
    # grows long enough. Observed on this repository over two weeks: runs
    # between four and five hours apart, never at a predictable minute - for
    # example 00:12, 04:43, 09:43, 14:27 on 2026-09-11. That is documented
    # behaviour and cannot be configured away from here.
    #
    # So this notices a stuck queue within about FIVE hours, not one. That is
    # still the difference between five hours and the three days the original
    # failure went unseen, and it is worth having - but it has to be said as five,
    # because a switch believed to have one-hour windows gets thresholds tuned to
    # a check that is not happening.
    #
    # What this cannot do is report its own death: if the schedule stops
    # entirely, nothing here notices. That needs a watcher outside GitHub, which
    # is a new supplier and its own decision - left recorded on #221.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: security-patrol
  # Safe to cancel, unlike a converge: this reads and changes nothing, so a
  # newer answer is strictly better than an older one still in flight.
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  patrol:
    name: "Security Patrol"
    runs-on: ubuntu-latest
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 10
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Read pinned versions
        uses: $/.github/actions/versions

      # scripts/security has no dependencies, so there is nothing to cache.
      - name: Setup Go
        uses: $/.github/workflows/setup-go

      - name: Ask whether the estate is answering for itself
        env:
          # Read-only, and scoped to this repository by GitHub. The canary
          # needs no estate credential at all, which is the point.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          go build -C scripts/security -o ../../toolshed/security .
          ./toolshed/security patrol | tee "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # EVERY APP KEY STILL MINTS A TOKEN (#527).
  #
  # An App's key is used only when there is something to do with it, so one
  # that has stopped working is found on the day it is needed. Procurement's
  # sat unparseable for an unknown time, every run in between green because
  # none had a delivery to make, and it surfaced the morning a game update
  # had locked players out.
  #
  # So each key is used here, every patrol, the way its own consumer uses it,
  # and the token is thrown away: the action for procurement's, the clerk's
  # own code for the clerk's - the two read a key differently, and a check
  # that read one the other's way would prove something else. A key that no
  # longer mints is a red patrol within the hour.
  #
  # A job of its own, so the patrol that looks at the estate goes on holding
  # no key at all. tests/go/repo/app_keys_test.go holds this to every App key
  # any workflow is handed: a new one that is not proved here is refused.
  # ---------------------------------------------------------------------
  keys:
    name: "Every App key still mints"
    runs-on: ubuntu-latest
    # Bounded so a stuck job cannot bill a metered vendor for six hours,
    # which is what GitHub's default timeout allows.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Read pinned versions
        uses: $/.github/actions/versions

      # scripts/clerk has no dependencies, so there is nothing to cache.
      - name: Setup Go
        uses: $/.github/workflows/setup-go

      # The least a token can be asked for: to read this repository, which
      # the job could do anyway. The action revokes it when the job ends.
      - name: Procurement's key mints a token
        uses: $/.github/workflows/app-token
        with:
          client-id: ${{ secrets.PROCUREMENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROCUREMENT_BOT_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: The clerk's key mints a token
        env:
          CLERK_BOT_APP_ID: ${{ vars.CLERK_BOT_APP_ID || secrets.CLERK_BOT_APP_ID }}
          CLERK_BOT_PRIVATE_KEY: ${{ secrets.CLERK_BOT_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: go run -C scripts/clerk . sign-in
