name: Plan Infrastructure

# A pull request that touches what a site is built from gets a plan, per site,
# posted back to it. The merge's converge is Deploy Infrastructure's.
#
# THE PLAN HOLDS A MERGE. Its last job, "Plan", is one of the checks a
# change has to pass (management/estate/repository/rulesets.tf). A plan
# knows whether a site's hypervisor has room for what a change asks, and
# whether the site can hold it; a change that breaches either was once
# planned, approved and merged all the same, and refused only by the
# converge, with main left declaring what could not be built (#732).
#
# So this runs on every pull request and in the merge queue, and not only
# when the paths below are touched: a check a change has to pass has to
# answer for every change, and one that only answered for some would leave
# every other pull request waiting on it for ever. A change that touches
# none of those paths is passed at once, with nothing planned.
#
# Two workflows rather than one with each job gated on the event. As one file,
# every pull request listed the converge's jobs - Apply, Converge, Aftermath -
# as skipped checks, and the plan's jobs were skipped on every merge: noise a
# reviewer had to learn to read past, in the one workflow whose checks matter
# most.
run-name: "Plan: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    # closed as well, so closing a pull request cancels its plan: the run it
    # starts joins the same concurrency group, cancels whatever of that pull
    # request is still queued, and does nothing itself.
    types: [opened, synchronize, reopened, closed]
  # A change is planned again as it will land: behind whatever is ahead of
  # it in the queue, which may have taken the room it was planned into.
  merge_group:

permissions:
  contents: read

# A plan reads and changes nothing, so a newer push, or the pull request
# closing, replaces it rather than queueing behind it. Keyed by the pull
# request's number: a merged pull request reports its base branch as
# github.ref (#573).
# In the queue there is no pull request, and each entry is its own commit.
# The event's name is in the key so that a pull request's run and a queue's
# never share a group and cancel each other.
concurrency:
  group: plan-infrastructure-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

# GitHub's default shell for `run:` is `bash -e {0}`, which has no pipefail.
# policy/conftest/rules/workflow_pipefail/workflow_pipefail.rego asserts this
# is present.
defaults:
  run:
    shell: bash

jobs:
  # The sites the config declares. The template, not the rendered config:
  # this job holds no vault credential, and site keys are plaintext structure.
  sites:
    name: Sites
    # Nothing to plan for a pull request that has closed; that run exists only
    # to cancel the plan before it.
    if: github.event.action != 'closed'
    runs-on: pr-source-${{ vars.pull_request_runners_site }}
    timeout-minutes: 5
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
      touched: ${{ steps.touched.outputs.touched }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          # The change and what it is a change to: the commit under test is
          # a merge on a pull request and the queue's own on a merge group,
          # and either way its first parent is what it would land on.
          fetch-depth: "2"

      - name: List the sites the config declares
        id: sites
        run: |
          set -euo pipefail
          sites="$(jq -c '.sites | keys' config/management.tpl.json)"
          echo "sites=${sites}" >> "$GITHUB_OUTPUT"

      # Whether the change touches what a site is built from. These were the
      # workflow's own path filter; they are asked here so that the workflow
      # can answer for a change that touches none of them.
      #
      # clusters/ and modules/applications/ are what Flux deploys. A change
      # there plans as no change to any root and is planned all the same:
      # the plan is where a change is held to what the site can hold, and
      # these are the changes that add to it.
      - name: Whether the change touches what a site is built from
        id: touched
        run: |
          set -euo pipefail
          files="$(git diff --name-only 'HEAD^1' HEAD)"
          touched=false
          if grep -qE '^(environments/[^/]+/infrastructure/|modules/infrastructure/|management/|config/management\.tpl\.json$|clusters/|modules/applications/)' <<<"${files}"; then
            touched=true
          fi
          echo "touched=${touched}" >> "$GITHUB_OUTPUT"
          echo "touches what a site is built from: ${touched}"

  # ---------------------------------------------------------------------
  # PLAN EACH SITE - on a pull request touching what a site is built from.
  #
  # Against the as-built record, not the estate (#554). The record is the
  # state as last converged with every real value replaced, published by the
  # converge and the nightly from main. So this job holds no credential of
  # the estate's, needs no environment, and runs on GitHub's runner: nothing a pull request
  # can run here reaches the estate, which is what lets the environments go
  # without a reviewer. It cannot see drift since the record was taken; the
  # nightly's real plan reports that.
  #
  # Structure only, never a value: this comment is world-readable.
  # ---------------------------------------------------------------------
  plan:
    name: Plan ${{ matrix.site }}
    needs: sites
    # A fork's branch plans nothing: the record and the comment are this
    # repository's. Nor does a change that touches nothing a site is built
    # from. In the queue there is no pull request to be a fork's.
    #
    # The queue is told by its own commit and NOT by the event's name. A
    # test of the event's name here reads, to the guard that keeps a pull
    # request's code off the estate's runner, as this job being some other
    # event's and none of a pull request's; and it stopped looking at it.
    if: >-
      needs.sites.outputs.touched == 'true'
      && (github.event.merge_group.head_sha != ''
          || github.event.pull_request.head.repo.full_name == github.repository)
    # A pull request's code never runs on the estate's own runner, the one
    # that converges. It runs in a pool on the untrusted worker.
    runs-on: pr-builds-${{ vars.pull_request_runners_site }}
    permissions:
      contents: read
      # To find and download the record another run published.
      actions: read
      # To fetch the release of the platform the site runs. The package is
      # public; the registry wants a token all the same.
      packages: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.sites) }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # The Go toolchain and OpenTofu with its providers, as the Validate
          # lane fetches them, GitHub's API for the record, and its registry
          # for the release of the platform the site runs.
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            dl.k8s.io:443
            get.opentofu.org:443
            ghcr.io:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            proxy.golang.org:443
            registry.opentofu.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
          # The commit this is checked out at is the pull request merged into
          # its base, and the one before it is the base. The engineer reads
          # both to say what the change adds.
          fetch-depth: "2"

      - name: Read pinned versions
        uses: $/.github/actions/versions

      - name: Setup Go
        uses: $/.github/workflows/setup-go

      - name: Install OpenTofu
        run: scripts/take-delivery.sh opentofu

      # The newest record of this site that main published. Only main: a
      # record is what a plan is trusted to compare with, so one a pull
      # request uploaded - from its own branch, or a fork's branch that
      # happens to be called main - is never taken.
      - name: Find the as-built record
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          SITE: ${{ matrix.site }}
        run: |
          # Asked with curl: GitHub's command-line client is on GitHub's
          # runners and not in the pools' image, and this is one request.
          run_id="$(curl -fsSL --proto '=https' -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/artifacts?name=as-built-${SITE}&per_page=100" | jq -r "
            [.artifacts[]
              | select(.expired | not)
              | select(.workflow_run.head_branch == \"main\" and .workflow_run.head_repository_id == ${REPO_ID})]
            | sort_by(.created_at) | last | .workflow_run.id // empty")"
          if [ -z "${run_id}" ]; then
            echo "::error::no as-built record of ${SITE} has been published from main yet. The next converge or nightly takes one."
            exit 1
          fi
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Download the as-built record
        uses: $/.github/workflows/download-artifact
        with:
          name: as-built-${{ matrix.site }}
          run-id: ${{ steps.record.outputs.run-id }}
          github-token: ${{ github.token }}
          path: as-built-record

      # The token is for the registry and nothing else: the roots fetch the
      # release the site's line names (management/versions.json), and the
      # registry refuses an anonymous fetch even of a public package.
      - name: Plan
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ matrix.site }}
        # A plan that is refused has still written its comment, which
        # leads with why. So the refusal is kept for the last step and the
        # comment is handed on first: failing here left the pull request
        # told only that no plan was produced.
        run: |
          go build -C scripts/contractor -o ../../toolshed/contractor .
          code=0
          ./toolshed/contractor plan-as-built -site "$SITE" -record as-built-record -comment-out plan-comment.md || code=$?
          echo "${code}" > plan.code
          if [ "${code}" != "0" ] && [ ! -s plan-comment.md ]; then
            echo "::error::the plan failed before it had anything to report"
            exit "${code}"
          fi

      # What the change adds to what the site must hold, against what the
      # site can hold: the engineer's, and its answer joins the plan's in the
      # same comment. It is not failed here. A refusal has to reach the pull
      # request before the job stops, so the answer is kept and the last
      # step is what refuses.
      # The engineer has the site's own scheduler try the change, and these are
      # that scheduler: Kubernetes' store, API server and scheduler, and the
      # tool that starts them, each from scripts/deliveries.lock by hash - and
      # the renderer the drafter builds an application's directory with.
      - name: Take delivery of the scheduler a change is tried with
        run: scripts/take-delivery.sh kwokctl etcd kube-apiserver kube-scheduler kustomize kubectl

      - name: Hold the change to what the site can hold
        env:
          SITE: ${{ matrix.site }}
        run: |
          go build -C scripts/engineer -o ../../toolshed/engineer .
          code=0
          ./toolshed/engineer stamp -site "$SITE" -record as-built-record -base 'HEAD^1' > stamp.txt 2>&1 || code=$?
          cat stamp.txt
          # Said on the pull request only when it is refused. A change that
          # fits is the ordinary case, and the engineer says nothing of it.
          if [ "${code}" != "0" ]; then
            {
              echo
              echo "### ${SITE} cannot hold this change"
              echo
              echo '```text'
              cat stamp.txt
              echo '```'
            } >> plan-comment.md
          fi
          echo "${code}" > stamp.code

      # Handed to the job that reports it. This job runs the pull request's
      # own code - the contractor is built from the branch - and the token
      # that code can read is this job's, so this job may write nothing.
      - name: Hand the plan to the report
        uses: $/.github/workflows/upload-artifact
        with:
          name: plan-comment-${{ matrix.site }}
          path: plan-comment.md
          if-no-files-found: error
          retention-days: 1

      - name: Refuse a change the site cannot hold
        run: |
          code="$(cat plan.code)"
          if [ "${code}" != "0" ]; then
            echo "::error::the plan refused this change; its reasons lead the plan's comment and are in the Plan step above"
            exit "${code}"
          fi
          code="$(cat stamp.code)"
          if [ "${code}" != "0" ]; then
            echo "::error::the engineer did not stamp this change; its reasons are in the plan's comment and in the step above"
            exit "${code}"
          fi

  # ---------------------------------------------------------------------
  # REPORT EACH SITE'S PLAN - the only job here that may write to the pull
  # request, and it runs nothing but the two scripts beside the github-script
  # action.
  #
  # It was two steps of the plan job, which held pull-requests: write for
  # them. Then the plan step was handed the job's token, to fetch the release
  # a site runs (#612), and with it the contractor and the roots - built and
  # read from the branch - held a token that can write to the branch's own
  # pull request. Split so that what plans can only read. What writes checks
  # nothing out and runs only what sits under .github/workflows, which is
  # behind the `workflows` permission the agent does not hold.
  # ---------------------------------------------------------------------
  report:
    name: Report the plan for ${{ matrix.site }}
    needs: [sites, plan]
    # Whatever the plan did - that is the point of saying so - but not for a
    # pull request with no sites to plan, or a fork's, which planned nothing.
    # Nor in the queue, where there is no pull request to write on, nor for
    # a change that touched nothing a site is built from.
    if: >-
      always() && needs.sites.result == 'success'
      && needs.sites.outputs.touched == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pr-source-${{ vars.pull_request_runners_site }}
    permissions:
      pull-requests: write
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.sites) }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`, which says
          # which job may reach what; `security guard-egress` refuses any drift.
          # The copy lives here because harden-runner reads its policy in a
          # pre-step, before any step of this job can run.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
          # The repository is not this job's to read: the plan arrives as an
          # artifact and the scripts through the action.
          checkout: "false"

      # A plan that failed handed nothing over, and that is not this job's
      # failure: the step after next says so on the pull request.
      - name: Take the plan from the job that made it
        id: taken
        continue-on-error: true
        uses: $/.github/workflows/download-artifact
        with:
          name: plan-comment-${{ matrix.site }}
          path: .

      - name: Comment the plan on the pull request
        if: steps.taken.outcome == 'success'
        uses: $/.github/workflows/github-script
        with:
          name: estate-plan-comment

      # NO PLAN, SAID OUT LOUD (#156). An absent comment looks identical to a
      # change nobody thought needed one: #140 changed the machine count, its
      # plan never ran, and the pull request read "24 of 25 checks passed" and
      # merged. So a plan that failed or was cancelled writes the site's plan
      # comment anyway, saying so - the same comment, so the latest of the two
      # always replaces the other (#576).
      #
      # This job always runs, so it is never the skipped check a job that ran
      # only on failure was.
      - name: Say that no plan was produced
        if: steps.taken.outcome != 'success'
        uses: $/.github/workflows/github-script
        env:
          SITE: ${{ matrix.site }}
          RESULT: ${{ needs.plan.result }}
        with:
          name: plan-absence-comment

  # ---------------------------------------------------------------------
  # PLAN - the one answer for the whole change, and the check a merge is
  # held to.
  #
  # The jobs above are one per site and are skipped for a change that needs
  # no plan, and a check that is skipped or absent cannot be required: the
  # platform waits on it for ever. This job always runs and always answers.
  #
  #   - A change that touches nothing a site is built from passes, with
  #     nothing planned.
  #   - A change that was planned passes when every site's plan did, and
  #     fails when any was refused or could not be made.
  #   - A change that should have been planned and was not - a fork's, which
  #     has no record to plan against - fails. A plan that could not be made
  #     is not a plan that came out well.
  #
  # It checks nothing out and holds no token.
  # ---------------------------------------------------------------------
  held:
    name: Plan
    needs: [sites, plan]
    if: always() && github.event.action != 'closed'
    runs-on: pr-source-${{ vars.pull_request_runners_site }}
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          # Owned by scripts/approved-suppliers.yml under `egress:`.
          egress-policy: block
          disable-sudo-and-containers: "true"
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          checkout: "false"

      - name: Whether this change may land
        env:
          SITES: ${{ needs.sites.result }}
          TOUCHED: ${{ needs.sites.outputs.touched }}
          PLAN: ${{ needs.plan.result }}
        run: |
          set -euo pipefail
          if [ "${SITES}" != "success" ]; then
            echo "::error::it could not be worked out whether this change needs a plan (${SITES}), so it is not passed"
            exit 1
          fi
          if [ "${TOUCHED}" != "true" ]; then
            echo "this change touches nothing a site is built from: nothing to plan"
            exit 0
          fi
          if [ "${PLAN}" = "success" ]; then
            echo "every site's plan was made and none refused the change"
            exit 0
          fi
          echo "::error::this change touches what a site is built from and its plan was ${PLAN}. The plan's comment on the pull request leads with why"
          exit 1
