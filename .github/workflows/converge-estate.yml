name: Converge Estate

run-name: "Converge the estate: ${{ github.event.head_commit.message }}"

# The estate is applied when what declares it is merged, and by nothing
# else here. Until this it was applied when somebody remembered to: a wall
# written in git and merged stood nowhere until a person ran the lawyer.
#
# NEVER FROM A PULL REQUEST. This is the one job handed the estate's own
# credential, which can take every wall of the repository down. Three things
# hold that, none of them in this file's gift:
#
#   - the `estate` environment hands its secret to a job on the default
#     branch and to no other (management/estate/repository/environments.tf);
#   - the estate's runners take this workflow only as it is on the default
#     branch (management/estate/source-control.tf);
#   - tests/go/repo refuses a pull request's job on the estate's runner.
#
# Not on a timer yet. A setting changed by hand at the source control stays
# changed until the next merge here (#535).
on:
  push:
    branches: [main]
    paths:
      - "management/estate/**"
      - "config/estate.tpl.json"
      - "scripts/lawyer/**"

permissions:
  contents: read

# One at a time, and never cancelled: an apply stopped part-way is the
# state nobody can reason about.
concurrency:
  group: converge-estate
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # The estate has no runner of its own; it borrows a site's. Which site is
  # read from the config and not written here.
  runner:
    name: Which runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      site: ${{ steps.site.outputs.site }}
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Pick the first site the config declares
        id: site
        run: |
          site="$(jq -r '.sites | keys | first // empty' config/management.tpl.json)"
          if [ -z "${site}" ]; then
            echo "::error::the config declares no site, so there is no runner to converge the estate from"
            exit 1
          fi
          echo "site=${site}" >> "$GITHUB_OUTPUT"

  converge:
    name: Converge the estate
    needs: runner
    runs-on: homelab-${{ needs.runner.outputs.site }}
    environment: estate
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Mobilize
        uses: $/.github/workflows/mobilize

      - name: Read pinned versions
        uses: $/.github/actions/versions

      # No cache, for the reason the site's converge gives: on a self-hosted
      # runner it persists between jobs, which is a poisoning surface.
      - name: Setup Go
        uses: $/.github/workflows/setup-go

      # The lawyer knows this log is public and shows nothing tofu prints:
      # each thing by its address and what is done to it, and never a value.
      - name: Converge
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: go run -C scripts/lawyer . converge-estate

  # Whether the allowed-actions setting the converge just applied lets
  # through every action the approved suppliers list allows (#882).
  #
  # A pull request that changes the setting cannot prove it: its checks run
  # under the setting already applied, and the new one first applies here.
  # GitHub checks every action a job references while setting the job up,
  # before any step runs - a skipped step's included. So this job references
  # each allowed action in a step that never runs, and is refused at "Set up
  # job" exactly when the setting refuses one: the same check every other job
  # relies on, at the moment the setting changes. It runs nothing and holds
  # nothing.
  #
  # Each commit is a witness, not a pin to keep current: the setting allows
  # an action at every commit, so any real commit of it proves it.
  # policy/conftest/rules/allowed_actions_probe holds this job to every
  # allowed action and nothing else; the suppliers list names it under
  # actions_probe.
  probe-allowed-actions:
    name: Prove the allowed actions
    needs: converge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: actions/cache
        if: github.run_attempt == '0'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae

      - name: actions/cache/restore
        if: github.run_attempt == '0'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae

      - name: actions/cache/save
        if: github.run_attempt == '0'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae

      - name: actions/checkout
        if: github.run_attempt == '0'
        # zizmor reads this step as if it ran. It never does, so what it finds
        # cannot happen: proved by TestTheConfigurationRulesHold, whose rule
        # (policy/conftest/rules/allowed_actions_probe) holds every step of this
        # job to the condition github.run_attempt == '0', which is never true.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]

      - name: actions/create-github-app-token
        if: github.run_attempt == '0'
        # zizmor reads this step as if it ran. It never does, so what it finds
        # cannot happen: proved by TestTheConfigurationRulesHold, whose rule
        # (policy/conftest/rules/allowed_actions_probe) holds every step of this
        # job to the condition github.run_attempt == '0', which is never true.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # zizmor: ignore[github-app]

      - name: actions/dependency-review-action
        if: github.run_attempt == '0'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

      - name: actions/download-artifact
        if: github.run_attempt == '0'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c

      - name: actions/github-script
        if: github.run_attempt == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3

      - name: actions/setup-go
        if: github.run_attempt == '0'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e

      - name: actions/setup-node
        if: github.run_attempt == '0'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1

      - name: actions/upload-artifact
        if: github.run_attempt == '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a

      - name: aquasecurity/setup-trivy
        if: github.run_attempt == '0'
        # zizmor reads this step as if it ran. It never does, so what it finds
        # cannot happen: proved by TestTheConfigurationRulesHold, whose rule
        # (policy/conftest/rules/allowed_actions_probe) holds every step of this
        # job to the condition github.run_attempt == '0', which is never true.
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # zizmor: ignore[unpinned-tools]

      - name: aquasecurity/trivy-action
        if: github.run_attempt == '0'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25

      - name: github/codeql-action/analyze
        if: github.run_attempt == '0'
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef

      - name: github/codeql-action/init
        if: github.run_attempt == '0'
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef

      - name: github/codeql-action/upload-sarif
        if: github.run_attempt == '0'
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef

      - name: ossf/scorecard-action
        if: github.run_attempt == '0'
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e

      - name: pnpm/action-setup
        if: github.run_attempt == '0'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

  # When the converge fails - the apply, or the read-back finding the estate
  # did not settle - or the probe is refused, the merge that caused it is
  # offered back as a revert, for the operator to merge or leave. Nothing is
  # put back by itself: a restore nobody chose is drift nobody sees. A run
  # that fails by chance is run again, and passing withdraws the offer.
  #
  # Its own branch, revert/estate-failed-<commit>, so main's checks passing
  # again never withdraws it. On GitHub's runner: it holds the pull-request
  # App's key, which opens a pull request, and nothing of the estate's.
  offer-revert:
    name: Offer the revert
    needs: [converge, probe-allowed-actions]
    if: always() && (needs.converge.result == 'failure' || needs.probe-allowed-actions.result == 'failure')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The whole history, so origin/main is main as it is now and the
      # revert is made on top of it rather than of this run's commit.
      - name: Mobilize
        uses: $/.github/workflows/mobilize
        with:
          fetch-depth: 0

      - name: Offer the revert
        uses: $/.github/workflows/offer-revert
        with:
          failed: estate
          what: the estate's converge
          client-id: ${{ secrets.PROCUREMENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROCUREMENT_BOT_PRIVATE_KEY }}

  withdraw-revert:
    name: Withdraw the revert
    needs: [converge, probe-allowed-actions]
    if: always() && github.run_attempt > 1 && needs.converge.result == 'success' && needs.probe-allowed-actions.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Withdraw the revert
        uses: $/.github/workflows/withdraw-revert
        with:
          failed: estate
          what: the estate's converge
          client-id: ${{ secrets.PROCUREMENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROCUREMENT_BOT_PRIVATE_KEY }}
