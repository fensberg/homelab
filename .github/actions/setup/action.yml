name: "Set up a job"
description: >
  Check out the repository and export every version pinned in
  scripts/versions.env. The one way a job gets a workspace.

# Why this does not also harden the runner, which is the obvious thing to want:
#
# A local action (`uses: ./...`) is read out of the workspace, so it cannot run
# until actions/checkout has produced one. harden-runner has to be a job's
# FIRST step, before anything else touches the network. Those two facts are
# incompatible - wrapping harden-runner here would mean checking out first and
# hardening second, which is the wrong order for the one step whose whole job
# is to be watching before anything else runs.
#
# So harden-runner stays written out in each job, with its own allowlist, and
# tests/go/repo/joblaw_test.go enforces that every job begins with it. The
# duplication is deliberate and the building code is what makes it safe.

inputs:
  fetch-depth:
    description: >
      Commits to fetch. 0 for full history, which the tripwire, TruffleHog,
      Semgrep, Trivy and the path filter all need to diff against a base.
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        # Not an input. Leaving the token on disk lets any later step, or
        # anything a later step runs, push with the job's credentials. No job
        # here needs it, and making it an input makes it a thing to forget.
        persist-credentials: false

    - name: Read pinned versions
      uses: ./.github/actions/versions
