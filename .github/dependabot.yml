version: 2
updates:
  # cooldown on every ecosystem: a package published minutes ago has had no
  # chance for anyone to notice it's malicious or broken. Waiting out a
  # window before Dependabot will even propose it is cheap insurance -
  # flagged independently by both Semgrep (dependabot-missing-cooldown) and
  # zizmor (dependabot-cooldown) the first time this file changed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /scripts/steward
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # versions.tf pins every provider version with a ~> constraint. Dependabot
  # bumps within that constraint the same way it would a package's semver
  # range - this is the one directory in the repo with a required_providers
  # block; modules/ and environments/ get their own entry once they exist.
  - package-ecosystem: terraform
    directory: /management/cluster
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # The test-only Go module, tracked separately from /scripts/steward because
  # it is a separate module with a completely different dependency profile:
  # ignite has none at all, and this one has Terratest's ~280. Keeping them
  # apart is what stops a Terratest bump ever appearing as a pull request
  # against the program that can destroy infrastructure.
  - package-ecosystem: gomod
    directory: /tests/go
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # The JavaScript/TypeScript test toolchain. devDependencies only - there is
  # no application here yet - so a bump can break the Test lane but can never
  # reach anything that runs against real infrastructure.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

# What Dependabot has no ecosystem for at all, so it isn't a config gap here:
# - Ansible Galaxy collections (management/hypervisor/requirements.yml)
# - A Flux HelmRelease's chart version (clusters/management/.../longhorn.yaml)
# - A container image pinned inside a workflow's container: block
#   (pr-validation.yml's Semgrep job)
# All three are Renovate's job, once there's a cluster for it to run in -
# see docs/epochs/01-ignition.md's Deferred section.
