# Paths whose modification demands deliberate review, not a reflexive approval.
#
# This list lives here rather than inline in a workflow for the same reason
# commitlint.config.js does: it is the rule, it is reviewable in a diff, and
# tests/go/repo/sensitivepaths_test.go checks it. A path list buried in YAML is
# a rule nobody reads and nothing verifies.
#
# What belongs here is narrower than "important". The test is whether a change
# could remove a safety property **while looking routine in a diff**. A pull
# request that deletes one assertion from a guard test is three green lines and
# a smaller file; it is also the single highest-value change an attacker - or a
# tired maintainer - could make. That asymmetry is what this list exists for.
#
# What does not belong here: things that break loudly. A broken provider or a
# malformed manifest fails CI on its own and needs no extra shouting.

paths:
  - path: tests/go/repo/
    why: >-
      The code laws themselves. Every rule that keeps the break-glass identity
      out of OpenTofu, keeps a credential out of the Flux sync, keeps the vault
      check from disclosing a secret, and keeps an unguarded pull_request path
      away from the self-hosted runner lives here. Deleting an assertion is a
      smaller file and a green build.

  - path: scripts/ignite/internal/onepassword/
    why: >-
      Every secret this project holds passes through here. probe.go in
      particular returns a Status and deliberately never the value it read -
      widening that return type is a one-word change that removes the
      guarantee entirely.

  - path: scripts/ignite/internal/phases/sterilize.go
    why: >-
      The workspace is sterilized on every exit. A change that makes this skip
      a file leaves secrets on disk and reports success.

  - path: scripts/ignite/internal/phases/teardown.go
    why: >-
      Destroys real infrastructure. Ordering here is what stops state being
      wiped before the VMs it describes are gone.

  - path: scripts/ignite/internal/phases/backup.go
    why: >-
      Pipes state into age without writing plaintext to disk. A change that
      buffers to a file breaks the property the whole backup design rests on.

  - path: scripts/ignite/internal/phases/restore.go
    why: >-
      The only place in the program that reads the break-glass private key.

  - path: scripts/ignite/internal/phases/encryption.go
    why: >-
      Sets TF_ENCRYPTION. Without it a bare tofu run cannot read state, and
      with it wrong, state is written in plaintext to a database that streams
      to object storage.

  - path: scripts/signedpush/
    why: >-
      Reads the GitHub App private key. A supply chain that reaches this can
      mint tokens for this repository.

  - path: config/management.tpl.json
    why: >-
      The contract with the vault. Every op:// reference the estate depends on
      is declared here, and an unwrapped one is valid JSON that reaches a
      provider as literal text.

  - path: management/cluster/registry.tf
    why: >-
      The invariants a bad config is refused by. These are preconditions, so
      removing one does not fail anything - it just stops refusing.

  - path: .github/workflows/
    why: >-
      Everything that runs with a token. The agent cannot write here at all;
      a change means a human did it deliberately, and it should be read that
      way.

  - path: .pre-commit-config.yaml
    why: >-
      Owns formatting and the commit-msg hook, pinned to exact versions. An
      unpinned hook silently resolves whatever is latest on the day the
      environment is built.

  - path: .github/sensitive-paths.yml
    why: >-
      This file. A change that shortens it is a change that turns the alarm
      off, and it should never be an incidental part of a larger diff.
