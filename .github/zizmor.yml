# zizmor's exemptions, and the guard that proves each one may stand.
#
# There are none. Until 2026-10 twelve workflows were excused from the
# self-repository audit, because they reached the local composite action with
# a relative `uses:` and actionlint refused the `$/` form zizmor asks for. That
# stopped being true when actionlint was told to accept `$/` by its message
# (.github/actionlint.yaml), and the workflows were moved to it.
#
# An entry here names the guard that makes its reason true, in the comment
# above it: tests/go/repo/suppressions_test.go refuses one that does not.
rules: {}
