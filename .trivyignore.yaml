# Findings Trivy raises that are wrong here, scoped to where they are wrong.
#
# Scoped rather than global on purpose. A bare .trivyignore lists an ID and
# silences it everywhere, which turns one wrong finding into a permanent blind
# spot for every future file. Each entry here names the path it applies to and
# says what would remove it.
#
# Empty, and meant to stay that way where an application is concerned: a
# finding about one application is answered in that application's directory,
# not by naming it here.
misconfigurations: []
