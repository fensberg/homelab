# The one place a GitHub Action's commit may be decided.
#
# ─────────────────────────────────────────────────────────────────────────────
#  A SHA IS WRITTEN HERE, ONCE, AND NOWHERE ELSE IS A SOURCE.
#
#  `actions/checkout` appears in 30 workflow steps, `harden-runner` in 31,
#  `actions/setup-go` in 12 - 91 pinned references in all. They agreed, and
#  nothing made them agree: the guard that reads them matched on the action
#  NAME and a bare `@`, so a single lane drifting to a different commit of
#  checkout satisfied every check in the repository.
#
#  Those 91 occurrences cannot be replaced by a reference. GitHub resolves
#  `uses:` before any expression context exists, so `${{ }}` is not available
#  there at any price - which is why .github/actions/versions can centralise
#  scripts/versions.env but not this. The occurrences therefore stay, and they
#  stay as CHECKED COPIES of this file rather than as 91 peers.
#
#  tests/go/repo/action_pins_test.go refuses any `uses:` whose commit or
#  version comment disagrees with the row below, refuses an action that has no
#  row, and refuses a row nothing uses.
# ─────────────────────────────────────────────────────────────────────────────
#
# KEYED BY REPOSITORY, NOT BY ACTION PATH. A commit belongs to a repository, so
# `github/codeql-action/init` and `github/codeql-action/analyze` are one entry
# and are required to share it. Pinning two subpaths of one repository to two
# commits is a mistake with no legitimate form, and keying this by path would
# have permitted it silently.
#
# DUPLICATES ARE STRUCTURALLY IMPOSSIBLE. This is a mapping, so a repeated key
# is not two rows - it is one row silently winning, which is the exact failure
# TestRepositoryHasNoDuplicateKeys exists to refuse, and it reads this file
# like any other.
#
# WHEN AN UPDATER BUMPS AN ACTION, the workflows change and this file does not,
# so the guard fails naming both commits. Update the row to the new commit;
# that is the whole fix, and it is one line in a file the agent can push -
# .github/workflows/ is protected, so a scheme that regenerated workflows from
# this file would have turned every routine bump into operator work.

