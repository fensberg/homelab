# Which tier covers the code the unit tests do not, and where nothing does.
#
# 108 of this program's 201 functions report 0% in the unit coverage profile.
# That number on its own says nothing useful: most of them run tofu, ansible,
# talosctl, kubectl, op or rclone against a real estate, and the unit tier
# cannot reach them by construction.
#
# What it does NOT mean is that they are untestable. This repository has three
# tiers that need real infrastructure - integration, api and e2e - each behind
# a build tag with its own taskfile verb, and they already cover the ignition
# path end to end, node readiness, Flux reconciliation, backup freshness, WAL
# archiving and drift against deployed state. An earlier draft of this file
# described "a test suite that needs infrastructure to run" as one of the
# alternatives nobody would want. That was wrong, and the estate had already
# built it.
#
# So every entry names the tier that covers it, and `covered_by: nothing` is a
# legitimate and deliberately uncomfortable answer. That turns this from a list
# of excuses into a map of real gaps.
#
# THE RULE: `uncovered` must EXACTLY match what the unit coverage profile
# reports for that file. Not "at most" - exactly.
#
# At most drifts, which is what happened to tests/coverage-baseline.json: it
# sat at 24.5 while the real figure was 34.1, so a third of the coverage could
# have gone without the gate noticing. Exact means adding an uncovered function
# fails until somebody writes the new number down, AND covering one fails until
# somebody lowers it - so this file tightens as the program gets better tested
# rather than sagging. A file with no entry may have no uncovered functions.
#
# tests/go/repo/coverage_exemptions_test.go enforces the counts.

files:
  # --- covered_by: e2e -------------------------------------------------
  #
  # Exercised end to end by tests/go/e2e - TestIgnitionBuildsAndTearsDownAnEstate
  # builds an estate and tears it down, and TestDemolishRemovesAnEstateWhose
  # MachinesAreStopped covers the teardown path. Not visible in the unit
  # coverage profile because that tier is build-tagged and needs a real
  # hypervisor, which is the point of it rather than a shortcoming.
  - path: contractor/internal/ansible/ansible.go
    uncovered: 2
    covered_by: e2e
  - path: contractor/internal/phases/attach.go
    uncovered: 1
    covered_by: e2e
  - path: contractor/internal/phases/cluster.go
    uncovered: 3
    covered_by: e2e
  - path: contractor/internal/phases/compute.go
    uncovered: 6
    covered_by: e2e
  - path: contractor/internal/phases/destroy.go
    uncovered: 3
    covered_by: e2e
  - path: contractor/internal/phases/hypervisor.go
    uncovered: 1
    covered_by: e2e
  - path: contractor/internal/phases/migrate.go
    uncovered: 2
    covered_by: e2e
  - path: contractor/internal/phases/overlay.go
    uncovered: 1
    covered_by: e2e
  - path: contractor/internal/phases/render.go
    uncovered: 2
    covered_by: e2e
  - path: contractor/internal/phases/sterilize.go
    uncovered: 6
    covered_by: e2e
  - path: contractor/internal/phases/teardown.go
    uncovered: 3
    covered_by: e2e
  - path: contractor/internal/phases/verify.go
    uncovered: 1
    covered_by: e2e
  - path: contractor/internal/run/adopt.go
    uncovered: 2
    covered_by: e2e
  - path: contractor/internal/run/exec.go
    uncovered: 15
    covered_by: e2e
  - path: contractor/internal/run/net.go
    uncovered: 1
    covered_by: e2e

  # --- covered_by: integration -----------------------------------------
  #
  # Covered by tests/go/integration against a running estate: nodes Ready and
  # the count odd, the Talos API answering, Flux reconciled, the newest
  # backup fresh and well formed, backup generations bounded, WAL archiving
  # healthy, and the deployed estate matching the code.
  - path: contractor/internal/phases/backup.go
    uncovered: 2
    covered_by: integration
  - path: contractor/internal/phases/health.go
    uncovered: 11
    covered_by: integration
  - path: contractor/internal/phases/health_etcd.go
    uncovered: 2
    covered_by: integration
  - path: contractor/internal/phases/plan.go
    uncovered: 2
    covered_by: integration
  - path: contractor/internal/phases/prune.go
    uncovered: 3
    covered_by: integration
  - path: contractor/internal/survey/run.go
    uncovered: 3
    covered_by: integration

  # --- covered_by: nothing ---------------------------------------------
  #
  # NOT COVERED BY ANY TIER. This is the honest half of the file and the part
  # worth reading: these run against a real vault or a real estate and no
  # test of any kind exercises them today.
  #
  # restore.go is the sharpest - it is the only code that reads the
  # break-glass private key, and the total-loss drill it belongs to is
  # recorded in Deferred as never having been executed. encryption.go sets
  # TF_ENCRYPTION, where being wrong writes plaintext state to a database
  # that ships off-site.
  - path: contractor/internal/onepassword/onepassword.go
    uncovered: 6
    covered_by: nothing
  - path: contractor/internal/onepassword/probe.go
    uncovered: 2
    covered_by: nothing
  - path: contractor/internal/onepassword/upsert.go
    uncovered: 2
    covered_by: nothing
  - path: contractor/internal/phases/checkvault.go
    uncovered: 1
    covered_by: nothing
  - path: contractor/internal/phases/converge_preconditions.go
    uncovered: 1
    covered_by: nothing
  - path: contractor/internal/phases/encryption.go
    uncovered: 1
    covered_by: nothing
  - path: contractor/internal/phases/restore.go
    uncovered: 3
    covered_by: nothing
  - path: contractor/internal/phases/secrets.go
    uncovered: 4
    covered_by: nothing

  # --- covered_by: not-worth-testing -----------------------------------
  #
  # Printing and process control. A test asserting that a banner prints a
  # banner is the change detector this repository refuses; what matters
  # about these is read by a person, and is asserted instead by
  # failures_are_reported_test.go, which requires a failure to name its
  # cause and not only its remedy. main.go's one real decision,
  # selectPhases, is covered.
  - path: contractor/internal/phases/registry.go
    uncovered: 2
    covered_by: not-worth-testing
  - path: contractor/internal/run/context.go
    uncovered: 1
    covered_by: not-worth-testing
  - path: contractor/internal/run/log.go
    uncovered: 6
    covered_by: not-worth-testing
  - path: contractor/main.go
    uncovered: 8
    covered_by: not-worth-testing

  # --- the other six programs ------------------------------------------
  #
  # This file covered scripts/contractor alone, so a function with no coverage
  # anywhere else was invisible. Six of the seven modules were in that state,
  # including the gatehouse - whose functions refuse unsigned pushes and
  # unapproved deliveries - and signedpush, which reads the App private key.
  #
  # Every one is `covered_by: nothing`, and that is the honest answer rather
  # than a placeholder: these are local tools, so no integration, api or e2e
  # tier reaches them. Unlike the contractor's entries above, there is no other
  # tier quietly doing the work - these are simply untested, and each is a
  # candidate for an ordinary unit test rather than a tier decision.
  - path: attestation/main.go
    uncovered: 5
    covered_by: nothing
  - path: clerk/github.go
