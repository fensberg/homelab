# Where an application is named outside the places it lives, and on how many
# lines.
#
# An application is modular when removing it costs its directory and its block
# in each site that runs it (#590, docs/epochs/02-abstraction.md). That holds
# only if nothing else knows it by name. Each line below is a file that does:
# a mechanism written for one application rather than reading what
# applications declare, or an application's own test, pin or proof kept in a
# shared place.
#
# THE RULE: each count must EXACTLY match what
# tests/go/repo/applications_test.go finds. A new mention fails until it is
# written down here, and a removed one fails until the number comes down, so
# this file only shrinks. It is done when it is empty, and the removal test
# can then pass.
#
# A path that holds the name counts once on top of its lines.
named_outside:
  .github/patches/applications-are-removed-by-deleting-them.patch: 252
  .github/workflows/expedite.yml: 14
  .trivyignore.yaml: 2
  clusters/core/infrastructure/controllers/cloudflared.yaml: 2
  config/management.tpl.json: 5
  environments/production/applications/kustomization.yaml: 1
  modules/infrastructure/platform/variables.tf: 1
  modules/infrastructure/platform/workloads.tf: 13
  scripts/contractor/internal/phases/secrets.go: 1
  scripts/procurement/deliver_test.go: 12
  scripts/procurement/expedite-check_test.go: 2
  scripts/superintendent/enforce-standing-order.go: 3
  scripts/superintendent/enforce-standing-order_test.go: 5
  scripts/superintendent/steam-only_test.go: 7
  scripts/versions.env: 2
  scripts/work-orders.json: 8
  tests/go/repo/fabricator_test.go: 32
  tests/go/repo/kubernetes_gate_test.go: 1
  tests/go/repo/plain_workloads_test.go: 1
  tests/go/repo/valheim_entrypoint_test.go: 16
  tests/go/repo/workload_egress_test.go: 2
  tests/go/repo/world_backup_test.go: 12
  tests/mutations.yml: 28
