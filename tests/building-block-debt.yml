  # --- The standing order's pin file (1)
  #
  # superintendent's standing order names the game server's Deployment as the
  # one file expedite may change without review, and the pod-shape guard in
  # tests/go/repo/world_backup_test.go reads that file. Goes when the standing
  # order moves off it to releases.yaml (#510, R2b).
  - "modules/applications/valheim/base/deployment.yaml"

  # --- Field names two separate documents happen to share (9)
  #
  # The estate's rendered config (config/estate.tpl.json, read by the lawyer)
  # and a site's (config/management.tpl.json, read by the contractor) describe
  # the same vendor's credentials in the same words. They are kept as two types
  # on purpose: sharing one would put the lawyer's reading of its config in the
  # contractor's package, across the credential boundary the two programs
  # exist to hold. errors and result are Cloudflare's envelope, which also
  # happens to be GitHub's and Prometheus's vocabulary.
  - 'json:"access_key_id"'
  - 'json:"account_id"'
  - 'json:"api_token"'
  - 'json:"errors"'
  - 'json:"provider"'
  - 'json:"result"'
  - 'json:"secret_access_key"'
  - 'json:"state"'
  - 'json:"vault_provider"'
