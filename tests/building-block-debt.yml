# Strings restated in more than one Go module.
#
# Each is a fact with no single home: the next change to it has to find every
# copy, and the one it misses fails quietly. That is how the integration tier
# came to report healthy backups as broken.
#
# tests/go/repo/building_blocks_test.go refuses a NEW crossing, and refuses an
# entry here that no longer crosses. So this list only shrinks, and a change
# that retires a copy deletes its line. Do not add to it to get past the guard
# without saying why in the commit.
debt:
  # --- A GitHub API client, rebuilt per program (15)
  - ".github/workflows"
  - "Authorization"
  - "Content-Type"
  - "GITHUB_REPOSITORY"
  - "GITHUB_TOKEN"
  - "X-GitHub-Api-Version"
  - "application/json"
  - "application/vnd.github+json"
  - "bad credentials for "
  - "https://api.github.com"
  - 'json:"workflow_runs"'
  - "no repository given: pass -repo owner/name or set GITHUB_REPOSITORY"
  - "owner/name to inspect"
  - "pull_request"
  - "refs/heads/main"

