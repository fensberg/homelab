guard: TestAMachinesMemoryIsTheSameWhereItIsMadeAndWhereItIsBudgeted
file: modules/infrastructure/cluster/compute.tf
find: "    dedicated = 10240"
replace: "    dedicated = 12288"
mentions: "a worker is made with 12288 MiB and budgeted at 10240 MiB"
why: >
  A worker is given two more gibibytes, in the one file where a
  machine's size is visibly set. The plan shows three machines changing
  and the budget, which counts them at their old size, says the host
  has room. It may not: the check that exists to refuse a site its host
  cannot hold is now two gibibytes a worker short of the truth.
