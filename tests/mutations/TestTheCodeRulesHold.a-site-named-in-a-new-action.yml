guard: TestTheCodeRulesHold
rule: no-workflow-or-task-picks-a-site-by-name
file: .github/workflows/a-new-action/action.yaml
create: |
  name: "A new action"
  description: Planted by the ledger.
  runs:
    using: composite
    steps:
      - run: echo "deploying site0"
        shell: bash
mentions: "names a site as a value. Take the site from the config template instead - a workflow from its sites keys"
why: >
  A file nobody has written yet, with the extension no workflow uses today.
  The rule finds what it reads by its kind and its place, never from a list
  of the files there now, and only a new file shows it.
