guard: TestEveryGeneratedFileIsWhatItsGeneratorMakes
file: scripts/details/facts/untrusted-zone.generated.go
reads_source: true
find: '"untrusted-zone/not-yet-clean"'
replace: '"untrusted-zone/unclean"'
mentions: "does not give what is committed"
why: >
