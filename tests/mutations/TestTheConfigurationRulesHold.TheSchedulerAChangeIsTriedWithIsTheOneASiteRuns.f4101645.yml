guard: TestTheConfigurationRulesHold
rule: versions
file: scripts/versions.env
find: "KUBERNETES_VERSION=1.36.3"
replace: "KUBERNETES_VERSION=1.35.9"
mentions: "a change is tried with Kubernetes"
why: >
  The site's Kubernetes is moved in the cluster's module and this pin sits
  in another file, for another tool, so moving one and not the other is
  the ordinary way to do it. Nothing would fail: the trial would start,
  the scheduler would answer, and the answer would be an older
  scheduler's.
