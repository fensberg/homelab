guard: TestEstateObjectsAreDeclaredOnlyInTheEstateRoot
file: modules/infrastructure/platform/tunnel.tf
find: 'resource "kubernetes_namespace" "tunnel" {'
replace: 'resource "cloudflare_zero_trust_tunnel_cloudflared" "tunnel" {'
mentions: "which is the estate's"
why: >
  An estate object declared in a site root is in that site's state, so the
  site's demolish destroys it for every site in the account. That is how
  the WARP enrollment application was lost and the next build failed
  (#531).
