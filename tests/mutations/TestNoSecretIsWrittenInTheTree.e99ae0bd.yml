guard: TestNoSecretIsWrittenInTheTree
file: clusters/core/infrastructure/controllers/cloudflared.yaml
find: "kind: NetworkPolicy"
replace: "kind: Secret"
mentions: "is a Secret, written in the repository"
why: >
  A Secret in a manifest is a credential in a public repository. Checkov's
  rule about how secrets reach a workload is off on the ground that every
  one comes from the vault, so a Secret committed here is exactly what
  that reasoning assumes cannot exist.
