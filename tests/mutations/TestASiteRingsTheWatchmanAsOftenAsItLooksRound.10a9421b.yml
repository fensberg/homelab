guard: TestASiteRingsTheWatchmanAsOftenAsItLooksRound
file: clusters/core/infrastructure/controllers/kube-prometheus-stack.yaml
find: "              receiver: \"watchman\"\n              group_wait: 0s\n              group_interval: 5m\n              repeat_interval: 9m"
replace: "              receiver: \"watchman\"\n              group_wait: 0s\n              group_interval: 5m\n              repeat_interval: 30m"
mentions: "looks round every 10"
why: >
  Every ten minutes reads as a lot of noise for an alert that never
  changes, and stretching the repeat is one line that looks like tidying.
  At half an hour the site rings less often than the watchman allows a
  silence to last, so it is said to have gone quiet, over and over, while
  nothing is wrong - and the channel learns to ignore the one message
  that means a site is really down.
