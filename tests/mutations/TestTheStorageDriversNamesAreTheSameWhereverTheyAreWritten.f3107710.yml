guard: TestTheStorageDriversNamesAreTheSameWhereverTheyAreWritten
file: modules/infrastructure/platform/storage.tf
find: 'volume_storage = "${var.site}-volumes"'
replace: 'volume_storage = "${var.site}-storage"'
mentions: "which is the one the hypervisor makes for it and grants it"
why: >
  The storage is renamed where OpenTofu tells the driver about it, to
  something that reads better. The hypervisor still makes and grants the
  old name, from the program that renders its playbook's values. Each
  half is right when read alone; together the driver is pointed at a
  storage that does not exist, and every claim on it waits forever.
