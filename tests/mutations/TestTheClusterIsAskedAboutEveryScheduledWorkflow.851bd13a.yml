guard: TestTheClusterIsAskedAboutEveryScheduledWorkflow
file: clusters/core/infrastructure/configs/scheduled-workflows.yaml
find: "/actions/workflows/site-sweep.yml/runs"
replace: "/actions/workflows/site-sweeper.yml/runs"
mentions: "runs on a schedule and the cluster is not asked about it"
why: >
  A scheduled workflow is added, or one is renamed, and the list of
  addresses the cluster asks about is not touched because nothing in the
  workflow points at it. The new schedule can fail every night and the
  alert that exists for exactly that never fires - which is the week the
  expediter failed unnoticed, and the five nights the nightly did.
