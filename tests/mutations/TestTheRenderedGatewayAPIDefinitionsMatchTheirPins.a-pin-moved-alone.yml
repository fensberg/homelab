guard: TestTheRenderedGatewayAPIDefinitionsMatchTheirPins
file: scripts/versions.env
find: "GATEWAY_API_VERSION=1.5.1\n"
replace: "GATEWAY_API_VERSION=1.6.1\n"
mentions: "says it is of Gateway API"
why: >
  A pin is one line and the file it stands for is a megabyte nobody reads,
  so the pin is what gets bumped. The definitions go on being the old ones,
  the repository says otherwise, and the first thing to find out is a route
  written for a version the cluster does not have.
