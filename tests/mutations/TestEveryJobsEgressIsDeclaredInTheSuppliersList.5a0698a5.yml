guard: TestEveryJobsEgressIsDeclaredInTheSuppliersList
file: scripts/approved-suppliers.yml
find: "  - job: pr-validation.yml/shared-actions\n"
replace: "  - job: pr-validation.yml/shared-actions-was-here\n"
mentions: "pr-validation.yml/shared-actions is not declared in the suppliers list"
why: >
  A job the suppliers list does not name has said nothing about what it
  reaches, and is the case this whole mapping exists to refuse: a new job
  must start by declaring its hosts, not arrive unexamined.
