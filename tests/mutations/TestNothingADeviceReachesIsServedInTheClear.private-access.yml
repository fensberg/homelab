guard: TestNothingADeviceReachesIsServedInTheClear
file: clusters/core/infrastructure/configs/private-access.yaml
find: "    - name: https\n"
replace: "    - name: http\n"
mentions: "is not served over HTTPS"
why: >
  What a device reaches has no login of its own, so whoever is on the path
  between an enrolled device and the site reads everything the site knows
  about itself. A Service that says it is served in the clear is the first
  thing that would be written when a certificate was in the way, and
  nothing else would notice.
