guard: TestEveryMachineIsGivenItsAddressWhenItIsBuilt
file: modules/infrastructure/cluster/compute.tf
find: "        address = \"${each.value.ip}/24\"\n        gateway = local.dmz_zones[each.value.zone].gateway\n"
replace: "        gateway = local.dmz_zones[each.value.zone].gateway\n"
mentions: "built with no address of its own"
why: >
  A zone's machine was the one kind written without an address, and the
  first one built came up with nothing and could not be configured. Losing
  the line again is losing the machine again, and nothing else says so
  until a converge has waited five minutes for it.
