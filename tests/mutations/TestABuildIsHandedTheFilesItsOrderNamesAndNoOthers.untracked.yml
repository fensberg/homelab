guard: TestABuildIsHandedTheFilesItsOrderNamesAndNoOthers
file: .github/workflows/fabricator.yml
find: 'mapfile -t files < <(git ls-files -- "$read")'
replace: 'mapfile -t files < <(find "$read" -type f)'
mentions: "and it tracks shared/fetch.sh and shared/other.sh"
why: >
  The images are public. A file that is merely on the runner's disk when the
  build starts - something an earlier step rendered, or whatever a link
  points at - is not one a review ever saw, and handing it to a build is how
  it gets into a layer.
