guard: TestTheConfigurationRulesHold
rule: network_routes_no_web
file: clusters/bootstrap/cilium.yaml
find: "  enable-l7-proxy: \"true\"\n"
replace: "  enable-l7-proxy: \"true\"\n  enable-gateway-api: \"true\"\n"
mentions: "sets enable-gateway-api"
why: >
  The network can route the web and is on every machine already, so turning
  it on looks like using what is there. It makes a second thing that answers
  for a hostname, in a policy language nothing else here is written in, and
  nobody removes the front door when they do it.
