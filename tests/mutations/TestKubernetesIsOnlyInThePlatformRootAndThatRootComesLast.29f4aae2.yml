guard: TestKubernetesIsOnlyInThePlatformRootAndThatRootComesLast
file: modules/infrastructure/cluster/outputs.tf
find: 'output "talosconfig" {'
replace: "resource \"kubernetes_namespace\" \"early\" {}\n\noutput \"talosconfig\" {"
mentions: "Everything that talks to the cluster's API belongs to the platform"
why: >
  A kubernetes resource in the root that builds the machines is planned
  before the API server is serving, so the apply dies with connection
  refused and an ignition tears the estate back down; and on a teardown the
  destroy waits on a dying cluster to delete it, and destroys nothing. Both
  happened. The split into two roots is what stops them, and only for
  resources that are in the right one.
