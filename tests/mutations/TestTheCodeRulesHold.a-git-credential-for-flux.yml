guard: TestTheCodeRulesHold
file: modules/infrastructure/platform/variables.tf
find: '  runner_system_namespace = "arc-systems"'
replace: "  flux_git_token          = local.config.source_control.token\n  runner_system_namespace = \"arc-systems\""
mentions: "references a source-control credential"
why: >
  The repository is public and Flux clones it anonymously. A source-control
  token read by OpenTofu is written to state, where a leaked state file hands
  over a live credential for a request that needs none.
