guard: TestNoReferenceNamesAGuardThatIsGone
file: tests/languages.yml
find: "      (TestEveryUnitIsExecutedByATestOrIsADeclaredDebt)."
replace: "      (TestEveryShellUnitIsCovered)."
mentions: "names TestEveryShellUnitIsCovered, which no module declares"
why: >
  A declaration that names a guard is a claim the guard stands behind it. This
  exact line named a test that had been renamed, and the CODEOWNERS entry
  beside it one that was never written, both read as checked for as long as
  nobody looked.
