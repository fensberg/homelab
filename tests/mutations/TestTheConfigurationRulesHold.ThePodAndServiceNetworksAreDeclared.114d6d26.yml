guard: TestTheConfigurationRulesHold
rule: plan_cluster_network
file: modules/infrastructure/cluster/talos.tf
find: "        podSubnets     = [local.pod_cidr]"
replace: "        # podSubnets removed"
mentions: "sets no cluster.network.podSubnets"
why: >
  The cluster's pod and service ranges are its largest address
  commitment and they were undeclared for the whole life of the estate -
  correct values, chosen by nobody, absent from an addressing decision
  that records every other range down to the VM id bands. clusterNetwork
  is fixed at cluster creation, so a wrong one costs a rebuild rather
  than an edit, and a value nobody wrote down cannot be reviewed at all.
