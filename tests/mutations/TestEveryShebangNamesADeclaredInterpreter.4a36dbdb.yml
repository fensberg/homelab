guard: TestEveryShebangNamesADeclaredInterpreter
file: githooks/undeclared-interpreter
create: |
  #!/usr/bin/env python3
  print("nothing here lints this")
mentions: "names an interpreter this estate has no tooling for"
why: >
  The one case the extension check cannot reach. An extensionless file is
  classified by its own name, so declaring githooks/pre-push says nothing
  about what it is written in - and githooks/ is executable code that runs
  on every commit and every push. Without this, adopting a new language is
  as quiet as naming a file. Planted for the same reason as above: there is
  nothing in the tree to edit into a foreign shebang.
