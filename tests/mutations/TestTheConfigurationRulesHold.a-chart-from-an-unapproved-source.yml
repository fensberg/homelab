guard: TestTheConfigurationRulesHold
rule: supplier_charts
file: clusters/core/infrastructure/controllers/cert-manager.yaml
find: "  url: https://charts.jetstack.io"
replace: "  url: https://charts.example.invalid"
mentions: "is not an approved supplier. Add it"
why: >
  A chart decides which images run, so an unapproved chart repository is an
  unapproved registry one level up.
