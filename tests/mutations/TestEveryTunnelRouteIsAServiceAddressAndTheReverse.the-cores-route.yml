guard: TestEveryTunnelRouteIsAServiceAddressAndTheReverse
file: clusters/core/infrastructure/configs/private-access.yaml
find: "  type: ClusterIP\n  clusterIP: ${ADDRESS_PRIVATE_ACCESS}\n"
replace: "  type: ClusterIP\n"
mentions: "declares the route private-access, and no Service"
why: >
  A Service works without the line: Kubernetes gives it an address, the
  front door answers on it from inside the cluster, and nothing looks wrong.
  The estate goes on routing an enrolled device to the address the core
  declared, where nothing is, and every name stops loading.
