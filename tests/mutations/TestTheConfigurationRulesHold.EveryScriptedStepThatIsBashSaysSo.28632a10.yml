guard: TestTheConfigurationRulesHold
rule: scripted_steps
file: modules/infrastructure/cluster/cilium.tf
find: 'interpreter = ["/bin/bash", "-c"]'
replace: 'interpreter = ["/bin/sh", "-c"]'
mentions: "do not name bash as what runs them"
why: >
  Naming sh reads as the portable choice on any machine whose sh accepts
  what the script uses, which is every machine the script is written on.
  Without it the step that applies the network manifest ran from a
  workstation and stopped at its first line on the estate's runner, so a
  merge could not deliver a change to the network at all.
