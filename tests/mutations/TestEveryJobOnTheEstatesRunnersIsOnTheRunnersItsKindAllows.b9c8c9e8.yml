guard: TestEveryJobOnTheEstatesRunnersIsOnTheRunnersItsKindAllows
file: scripts/approved-suppliers.yml
find: "  - job: integration-tests.yml/test\n    kind: can-wait"
replace: "  - job: integration-tests.yml/test\n    kind: cannot-wait"
mentions: "asks for the runners for work that can wait"
why: >
  A job's kind is changed where it is declared and its workflow is left
  asking for the runners it asked for before. The declaration now says
  the nightly tests cannot wait while they run where they are stopped
  first - or, the other way about, a long job is called short and sits
  on the priority runners with everything urgent queued behind it.
  Either way what the job says and where it runs have parted, and the
  promise that priority work waits only moments rests on them agreeing.
