guard: TestEveryImageBuiltHereIsRunByAManifestHere
# A file planted, not a line changed. The runner's image is run by two
# manifests since the runners were split by the priority of their work,
# so taking it out of one leaves it run by the other and proves nothing.
file: .github/spare-image/Dockerfile
create: |
  FROM scratch
mentions: "no manifest here runs one"
why: >
  An image is built here that nothing in this repository runs: a tool
  somebody meant to deploy, or what is left of a workload that was taken
  out by its manifests and not by its Dockerfile. Wherever it does run,
  the HEALTHCHECK checkov is told not to ask for may be the only health
  check there is - and the excuse for not asking rests on everything
  built here running under Kubernetes.
