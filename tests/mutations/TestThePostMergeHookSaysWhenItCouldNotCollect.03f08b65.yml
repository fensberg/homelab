guard: TestThePostMergeHookSaysWhenItCouldNotCollect
file: githooks/post-merge
find: '	echo "sweeper: could not build scripts/sweeper, so finished branches were not taken away" >&2'
replace: "	: # nothing said"
mentions: "said nothing about it"
why: >
  A post-merge hook that cannot build the sweeper and exits quietly is
  indistinguishable from one with nothing to collect. That silent absence
  is precisely how finished branches piled up in an operator's checkout
  for two weeks before this hook existed, with a sweeper that would have
  recognised every one of them.
