guard: TestEveryLineOfThePolicyIsRunByItsOwnTests
file: policy/conftest/rules/workflow_tmpdir/workflow_tmpdir_test.rego
find: "test_no_workflow_is_refused if {\n\tsome msg in workflow_tmpdir.deny with input as []\n\tcontains(msg, \"found no workflows\")\n}\n"
replace: "test_no_workflow_is_refused if {\n\tcount(workflow_tmpdir.deny) >= 0 with input as [wf(base)]\n}\n"
mentions: "workflow_tmpdir/workflow_tmpdir.rego: rows"
why: >
