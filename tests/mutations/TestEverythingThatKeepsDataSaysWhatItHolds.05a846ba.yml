guard: TestEverythingThatKeepsDataSaysWhatItHolds
file: clusters/core/infrastructure/controllers/kube-prometheus-stack.yaml
find: "              storageClassName: outlives-a-machine"
replace: "              storageClassName: openebs-hostpath"
mentions: "which lives on a machine, and the core declares it lives on a node"
why: >
  The volume is moved back to a worker's own disk - to free the
  hypervisor's storage, or by a revert that did not know what else it
  undid - and the declaration still says the history lives on the node.
  The safety officer believes the declaration, so the worker holding
  the site's only copy of its history is cleared for retirement.
