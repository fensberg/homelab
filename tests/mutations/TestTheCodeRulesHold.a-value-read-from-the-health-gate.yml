guard: TestTheCodeRulesHold
file: modules/infrastructure/cluster/outputs.tf
find: 'output "talosconfig" {'
replace: "output \"healthy_nodes\" {\n  value = data.talos_cluster_health.this[0].control_plane_nodes\n}\n\noutput \"talosconfig\" {"
mentions: "reads control_plane_nodes from the health gate"
why: >
  The health gate's only job is the dependency edges pointing at it. Reading a
  value out of it makes it load bearing at plan time again, which is the
  condition that made a plan that changes the machine count time out (#117).
