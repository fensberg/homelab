guard: TestNoTestNamesTheRootItReads
file: tests/go/repo/control_plane_metrics_test.go
reads_source: true
find: '	_, stack := fluxObject(t, kindHelmRelease, "kube-prometheus-stack")'
replace: '	stack := readRepoFile(t, "clusters/core/infrastructure/controllers/kube-prometheus-stack.yaml")'
