guard: TestNoTestNamesTheRootItReads
file: tests/go/repo/converge_in_flight_test.go
reads_source: true
find: "	_, manifest := fluxObject(t, kindHelmRelease, runnerScaleSet)"
replace: '	manifest := repository(t).YAMLDocuments(t, "clusters/core/infrastructure/configs/runner-scale-set.yaml")'
mentions: "a path into the Flux tree"
why: "reads_source, as the entry above.

  The Flux tree is about to become a shared core and a directory per site. A guard that opens
  a manifest by its path would break on that move, or read a directory that no longer holds
  what it checks.

  "
