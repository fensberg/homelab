guard: TestTheConfigurationRulesHold
rule: workflow_shape
file: .github/workflows/pr-validation.yml
find: "run: go test ./..."
replace: 'run: go test ./... > "$TMPDIR/test.out"'
mentions: "reads $TMPDIR"
why: >
  GitHub-hosted runners do not set TMPDIR, so under set -u a reference to
  it fails the step before it does anything. That is how every game
  server update from 17 September failed as "no public build" - a symptom
  pointing at Valve rather than at the line that caused it (#440).
