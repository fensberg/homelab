guard: TestTheBucketTableAgreesWithTheHCL
file: management/estate/site/object-storage.tf
find: 'purposes = toset(["database", "state", "staging", "production"])'
replace: 'purposes = toset(["database", "statedumps", "staging", "production"])'
mentions: "the estate creates buckets for"
why: >
  Renaming one side of a set that is declared twice, and the plausible
  version of it: "statedumps" reads as more descriptive than "state", and
  nothing in the estate's HCL objects. The estate would then grant a
  bucket the site's config never asks for, and the site's config would ask
  the vault for a state grant that is never written - so every site run
  fails at Render, naming a vault field rather than the rename.
