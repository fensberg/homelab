guard: TestTheConfigurationRulesHold
file: clusters/core/infrastructure/configs/runner-scale-set-batch.yaml
find: "runnerScaleSetName: homelab-batch-${SITE}"
replace: "runnerScaleSetName: homelab-spare-${SITE}"
mentions: "so that set of runners serves nothing"
why: >
  A set of runners is added for a job, and the job is never pointed at
  it - the workflow change was a separate step, or the set was renamed
  and the job was not. Everything reconciles and every other check
  passes. The set sits there registered with GitHub, a listener
  running, serving nothing, and is still there a year later because
  nothing ever said it was unused.
