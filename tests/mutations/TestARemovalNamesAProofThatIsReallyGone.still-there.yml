guard: TestARemovalNamesAProofThatIsReallyGone
file: tests/mutations-removed.yml
find: "removed:\n"
replace: "removed:\n  - proof: TestTheSchedulerAChangeIsTriedWithIsTheOneASiteRuns.f4101645.yml\n    reason: to be removed later\n"
mentions: "it is still there"
why: >
  Naming a proof here is what lets it be deleted. A line added ahead of
  time, for a proof that is still in place, is an approval waiting to be
  used: whoever deletes the proof later is refused by nothing, in a change
  that no longer has to say why.
