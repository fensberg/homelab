guard: TestTheConfigurationRulesHold
file: clusters/core/infrastructure/configs/host-metrics.yaml
find: "            first_step: >-\n              Check that the fans turn and the vents are clear.\n"
replace: "            first_step: \"\"\n"
mentions: "does not say the first thing to try"
why: >
  An alert is written by somebody who knows what it means, at a desk, and
  the step they would take is so plain to them that it is not written. It
  is read months later by somebody who does not, from a phone, and what
  they are told is that a sensor reads a number.
