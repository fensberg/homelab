guard: TestTheClusterIsAskedAboutEveryScheduledWorkflow
file: clusters/core/infrastructure/configs/scheduled-workflows.yaml
find: "  scrapeInterval: 15m"
replace: "  scrapeInterval: 5m"
mentions: "A caller with no token is allowed 60"
why: >
  Fifteen minutes reads as slow for an alert, and shortening it is one
  line. At five, six workflows are 72 questions an hour against an
  allowance of sixty for the site's whole address, so GitHub refuses
  some of every hour's - and anything else at the site asking with no
  token is refused with them.
