guard: TestTheConfigurationRulesHold
file: clusters/core/infrastructure/configs/planted-release.yaml
create: |
  ---
  apiVersion: source.toolkit.fluxcd.io/v1
  kind: OCIRepository
  metadata:
    name: planted
    namespace: flux-system
  spec:
    interval: 1m
    url: oci://example.invalid/planted
    ref:
      tag: "1.0.0-1"
mentions: "is not pinned by digest"
why: >
  Without the digest the tag alone decides what production runs, and a
  tag can be moved in the registry with no pull request and nothing in
  git recording it.
