guard: TestAFactCrossingAModuleBoundaryIsDeclared
file: tests/go/harness/scrape.go
reads_source: true
find: "	sort.Strings(failures)"
replace: "	_ = \"latest.tfstate.age\"\n\tsort.Strings(failures)"
mentions: "new instance(s) of a string restated"
why: >
  reads_source, for the same reason as the two entries above.

  The state backup's pointer object, restated in the test module when it
  has one home in homelab/contractor/config. That is precisely the
  regression this guard exists for: the integration tier spelled the
  backup's location out for itself, and when the backups moved it went on
  looking in the old place.
