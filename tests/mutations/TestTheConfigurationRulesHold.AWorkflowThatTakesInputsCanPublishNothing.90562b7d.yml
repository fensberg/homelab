guard: TestTheConfigurationRulesHold
rule: dispatch_inputs
file: .github/workflows/integration-tests.yml
find: "permissions:\n  contents: read\n\n# One at a time."
replace: "permissions:\n  contents: write\n\n# One at a time."
mentions: "may write contents"
why: >
  The workflow still takes which tier and which site from whoever
  dispatches it, and can now push. That is the arrangement the excused
  rule exists to refuse, and the rule is excused for the whole
  repository on the strength of this.
