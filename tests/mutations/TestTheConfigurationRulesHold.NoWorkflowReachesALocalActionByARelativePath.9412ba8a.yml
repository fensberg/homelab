guard: TestTheConfigurationRulesHold
rule: local_action_refs
file: .github/workflows/clerk.yml
find: "uses: $/.github/actions/versions"
replace: "uses: ./.github/actions/versions"
mentions: "reaches a local action with a relative"
why: >
  The form twelve workflows used until zizmor's exemption for it was
  removed. It reads the action out of the workspace, so it depends on a
  checkout having happened and runs the checkout's copy; with no exemption
  left, the scan / workflows lane fails on it, and this says so before a push.
