guard: TestTheConfigurationRulesHold
file: clusters/core/flux-system/gotk-sync.yaml
find: "  ref:\n    branch: main\n  url: https://github.com/fensberg/homelab\n"
replace: "  ref:\n    branch: main\n  secretRef:\n    name: flux-system\n  url: https://github.com/fensberg/homelab\n"
mentions: "gives the GitRepository a secretRef"
why: >
  The repository is public and clones anonymously over https. A secretRef
  on the sync turns an access token into a live attribute of OpenTofu state
  for a request that needs none, and nothing breaks to say so: the sync
  works with it and without it.
