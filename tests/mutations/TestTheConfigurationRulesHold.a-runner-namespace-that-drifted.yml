guard: TestTheConfigurationRulesHold
rule: runner_namespaces
file: config/facts/runner-namespaces.json
find: '"runners": "arc-runners",'
replace: '"runners": "arc-runners-moved",'
mentions: 'where config/facts/runner-namespaces.json makes "arc-runners-moved"'
why: >
  OpenTofu creates the runners' namespace from this fact, and the scale
  set's manifest names it as a literal. Moved on one side only, the release
  is put in a namespace nothing creates, and every job waiting for those
  runners queues for ever.
