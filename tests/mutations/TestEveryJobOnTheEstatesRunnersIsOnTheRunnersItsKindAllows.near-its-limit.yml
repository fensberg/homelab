guard: TestEveryJobOnTheEstatesRunnersIsOnTheRunnersItsKindAllows
file: scripts/approved-suppliers.yml
find: "  - job: pr-validation.yml/vet\n    kind: cannot-wait\n    takes: 1m\n"
replace: "  - job: pr-validation.yml/vet\n    kind: cannot-wait\n    takes: 27m\n"
mentions: "within a fifth of its limit"
why: >
  A job that ordinarily lands near its limit passes or fails by seconds. The
  invariants lane held #772 by 28 of them and killed #767 with no test failed.
