guard: TestTheFluxCoreIsSharedAndASiteDirectoryIsItsWork
file: clusters/core/kustomization.yaml
find: "  - infra-configs.yaml\n"
replace: "  - infra-configs.yaml\n  - ../site0/applications.yaml\n"
mentions: "names site0"
why:
  "The core is what every site runs. One site's work listed in it is every site's work the day
  a second site exists, which is what one shared directory was.

  "
