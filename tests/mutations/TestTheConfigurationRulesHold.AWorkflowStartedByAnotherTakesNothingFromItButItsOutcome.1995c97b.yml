guard: TestTheConfigurationRulesHold
rule: watcher_runs
file: .github/workflows/planted-watcher.yml
create: |
  name: Planted watcher
  on:
    workflow_run:
      workflows: [Anything]
      types: [completed]
  permissions:
    contents: read
  jobs:
    watch:
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:
        - name: Mobilize
          uses: $/.github/workflows/mobilize
          with:
            checkout: "true"
mentions: "does not tell its first step to check nothing out"
why: >
  The workflow runs with the default branch's token for whatever run it
  watches, a fork's pull request included. With a checkout, that run's
  branch is on a privileged runner, which is the whole of what zizmor's
  warning about the trigger is for, and the warning is silenced on the
  strength of this.
