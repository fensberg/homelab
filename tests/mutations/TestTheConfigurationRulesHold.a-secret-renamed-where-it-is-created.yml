guard: TestTheConfigurationRulesHold
rule: plan_flux_source_secret
file: modules/infrastructure/platform/sweeper.tf
find: "    name      = \"hypervisor\"\n    namespace = kubernetes_namespace.sweeper[0].metadata[0].name\n"
replace: "    name      = \"hypervisor-credential\"\n    namespace = kubernetes_namespace.sweeper[0].metadata[0].name\n"
mentions: 'names secretRef "hypervisor", which nothing in this repository creates'
why: >
  The rule reads which secrets OpenTofu creates, to know which a manifest may
  name. The sweeper takes its credential from one; renamed where it is
  created, the manifest names a secret nothing makes, and the pod never
  starts.
