guard: TestTheConfigurationRulesHold
rule: rendered_layer_variables
file: modules/infrastructure/platform/database.tf
find: "    SITE        = var.site\n"
replace: "    SITE_KEY    = var.site\n"
mentions: "names ${SITE} in what it applies (clusters/core/infrastructure/configs), which the release a site runs writes and the checkout's modules no longer do"
why: >
  The secret a layer substitutes from is written by OpenTofu, and a key
  renamed there leaves every layer naming the old one refused whole by
  Flux, while every manifest still reads as it did.
