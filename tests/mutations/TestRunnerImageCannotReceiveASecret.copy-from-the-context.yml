guard: TestRunnerImageCannotReceiveASecret
file: .github/pull-request-runner-image/Dockerfile
find: "COPY --from=go --chown=1001:1001 /usr/local/go"
replace: "COPY --chown=1001:1001 /usr/local/go"
mentions: "Nothing from the repository or the workspace"
why: >
  A COPY with no stage named takes from the build context, which is whatever
  the workflow had on disk when the build began. The image is public and its
  layers are kept: a file that reached one is published, and removing it in
  the next line removes nothing.
