guard: TestEveryConfigurationRuleProvesItself
file: policy/conftest/rules/job_timeout/job_timeout.rego
find: "package rules.job_timeout\n"
replace: "package job_timeout\n"
mentions: "a rule anywhere else never runs and says nothing"
why: >
  Conftest asks one namespace, main, and main collects the packages under
  rules. A rule written in any other package is loaded, compiles, and is
  never asked anything, so every refusal it would make is silently a pass.
