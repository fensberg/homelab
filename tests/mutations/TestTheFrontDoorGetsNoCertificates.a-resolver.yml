guard: TestTheFrontDoorGetsNoCertificates
file: clusters/core/infrastructure/controllers/traefik.yaml
find: "    certificatesResolvers: {}\n"
replace: "    certificatesResolvers:\n      own:\n        acme: {}\n"
mentions: "certificatesResolvers names one"
why: >
  The proxy getting its own certificate is one setting and it works, which
  is why it is the first thing reached for when a certificate is late. It
  is then kept in one pod, renewed by a second owner, and is not the one
  the site's alerting is watching run out.
