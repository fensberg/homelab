# Custom blocks: things built here that deliberately reuse nothing.
#
# The rule, in order (docs/epochs/02-abstraction.md, "A new custom block is
# refused unless somebody says why"): reuse the reusable block that exists; if
# none exists, build one that is reusable; only when it genuinely cannot be
# reusable, build something custom - and say why here. A custom block is not
# forbidden. It costs a reason, the way an unapproved tool costs a pull
# request in scripts/approved-suppliers.yml.
#
# A machine cannot tell a reusable component from a custom one; that is a
# judgement. What it can do is refuse an undeclared one, so an omission and a
# considered exception never look the same. tests/go/repo/custom_blocks_test.go
# finds every candidate by walking the repository, and fails on one that is not
# declared here, and on a declaration that no longer matches anything.
#
# If this ever becomes a box people tick, the criterion has failed, and the
# epoch record should say so rather than the guard being loosened.

# No Kubernetes section. An environment is a list of applications, each an
# overlay of its module, adding only what configures or reaches it; that is a
# shape the guard checks without a list, so nothing here names an application.

# Go functions whose bodies are identical in more than one package. One entry
# per group: every function in it, as "<package directory>.<name>".
go: []
