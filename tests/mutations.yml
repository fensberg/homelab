  # A check on a declaration list rather than on the estate: it asserts that
  # every declared retry implementation still exists, so mutating what it reads
  # means mutating another guard's declaration, which that guard's own entry
  # already proves.
  - test: TestEveryDeclaredRetryStillExists
    reason: meta
  # The tracked-file enumeration every other guard walks, and the list of
  # tracked paths this repository did not author. Both are checks on the
  # harness rather than on the estate: breaking what they read means editing
  # the enumeration itself, and a guard proving its own source was edited
  # proves nothing about the property. Their failure modes are instead pinned
  # from the other side - every guard that enumerates would go vacuous, and the
  # vacuity floors those guards carry are each proved by their own entry.
  - test: TestTheTrackedEnumerationSeesTheWholeRepository
    reason: meta
  - test: TestEveryUnauthoredPathStillExists
    reason: meta
  #
  # A pure function whose test table already contains the failing case. The
  # counterexample is the proof, and it is read where the function is rather
  # than in a ledger a file away.
  - path: tests/go/repo/duplicates_test.go
    reason: table
  - path: tests/go/repo/forkable_test.go
