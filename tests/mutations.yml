  - test: TestClusterImagesComeFromApprovedRegistriesAndArePinned
    owed: true
  - test: TestEveryCheckoutRefusesToPersistCredentials
    owed: true
  - test: TestEveryCommitHookIsPinned
    owed: true
  - test: TestEveryJobHardensTheRunnerFirst
    owed: true
  - test: TestEveryJobIsBounded
    owed: true
  - test: TestEveryPhaseHasASourceFileNamedAfterIt
    owed: true
  - test: TestEveryPinnedVersionCanActuallyBeExported
    owed: true
  - test: TestEverySensitivePathExists
