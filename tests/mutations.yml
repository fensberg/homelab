  # Same form: it pulls the untrusted-zone isolation task's own cmd out of the
  # playbook and runs it against a stub iptables, so it tests the shell that
  # ships rather than a copy of it kept here.
  - path: tests/go/repo/dmz_isolation_test.go
    reason: shipped-shell
  # Same form again: these run scripts/retry.sh itself against a stub command
  # whose failures are scripted, so they test the shell that ships rather than
  # a copy of its logic kept beside them.
  - path: tests/go/repo/retry_test.go
    reason: shipped-shell
  #
  # Asserts a file's executable bit. There is no text to substitute, and a mode
  # is not something a find/replace ledger can express.
  - test: TestTheHookShimsAreExecutable
    reason: file-mode
  #
  # Asks git what is in the WORKING TREE rather than reading a tracked file.
  # The ledger copies tracked files to a scratch directory that is not a git
  # repository, so there is nothing there for `git ls-files --others` to answer
  # about - and the subject is a megabyte-scale binary, which a `create:` block
  # cannot express as YAML either.
  #
  # Proved by hand instead, both directions: a 9 MB executable copied to
  # scripts/sweeper made it name that path, and removing it went
  # green. Run with -count=1, because this reads the repository at runtime and
