  # looks exactly like a repository with no transcripts in it, so the shapes
  # are held to a table of their own - nineteen rows, each a line that must or
  # must not be read as a pasted terminal session.
  - test: TestTheTranscriptShapesMatchWhatTheyClaim
    reason: table
  # The floor-spelling checker. assertsAFloor is compiled Go, so the ledger
  # cannot reach its behaviour - and its counterexamples are exactly what a
  # table is for: a named constant must count as a floor, and a bare variable
  # must not. Both rows are in TestAFloorIsRecognisedHoweverItIsSpelled.
  - test: TestAFloorIsRecognisedHoweverItIsSpelled
    reason: table
  #
