# The mutation ledger: proof that each guard fails when its guard fails.
#
# ─────────────────────────────────────────────────────────────────────────────
#  IF A CHECK POINTED YOU HERE, EDITING THIS FILE IS ALMOST CERTAINLY WRONG.
#
#  An entry failing means one of two things, and neither is fixed here:
#
#    the guard no longer catches what it says it catches - fix the guard;
#    the thing being broken moved or was renamed  - update `find`, not `guard`.
#
#  Deleting an entry makes the red go away and takes the proof with it. That
#  is the exact move this file exists to make visible: `floor` below will
#  refuse it, and .github/sensitive-paths lists this file, so removing one
#  opens a review conversation somebody else has to resolve.
# ─────────────────────────────────────────────────────────────────────────────
#
# Why this exists.
#
# A test written in the same commit as the change it guards, from the same
# mental model, tends to assert that the change is PRESENT rather than that the
# property HOLDS. It passes forever afterwards whatever the code does. This
# repository has shipped several: a workflow test that matched the string
# `go run ./scripts/attestation` and was green for the whole life of a command
# that could never execute; a teardown test that asserted `-refresh=false` was
# in an argument list while the property that actually broke - that a destroy
# sees the real state of the machines - went unasserted.
#
# The reliable way to tell the difference is to break the thing and watch the
# test go red. That was done by hand six times in one evening, and all six
# proofs were gone the moment the terminal closed - which is the "we do not
# hoard things locally" rule, broken by the person who wrote it down.
#
# So each entry is one of those proofs, committed. The runner
# (tests/go/repo/mutation_ledger_test.go) copies the tracked files to a scratch
# directory, checks the guard PASSES there, applies `find` -> `replace`, and
# requires the guard to FAIL and to say `mentions`. Passing before as well as
# failing after is what stops a guard that is broken in some other way from
# counting as proof.
#
# Fields:
#   guard     the test that must fail. Exactly that test, run on its own.
#   file      repository-relative path to break.
#   find      text to replace. Must appear EXACTLY ONCE, or the entry is
#             ambiguous and the runner says so rather than guessing.
#   replace   what to put there.
#   create    instead of find/replace: the contents of a file to plant at
#             `file`, which must not already exist. Some guards have nothing
#             to say until something is PRESENT - the outstanding-patch check
#             skips entirely when no patch is outstanding, which is the normal
#             state - and a substitution cannot reach those, because there is
#             nothing in the tree to substitute.
#   mentions  substring the failure output must contain. This is what stops an
#             entry passing through an unrelated error path - a test that dies
#             on a nil map is red for the wrong reason, and red for the wrong
#             reason is not proof of anything.
#   why       what breaks in the estate if this guard stops working.
#   reads_source
#             opt-in for a `.go` target, which is otherwise refused. Say true
#             only when the guard OPENS the file and inspects its text; say
#             nothing when the guard asserts what the compiled code does. See
#             the paragraph below for why the two differ.
#
# What this cannot judge, said out loud because a guard whose edges nobody
# knows is worse than none: Go BEHAVIOUR. The guards run from a binary compiled
# once from the real tree, so editing a .go file in the scratch copy changes
# nothing about what that binary does, and an entry doing that would pass or
# fail for reasons unrelated to what it claims. The runner refuses a .go target
# rather than letting it look like coverage.
#
# The exception, and it is narrow: a guard that READS source as data. runGuard
# points the repo root at the scratch tree and repoRoot honours it, so a guard
# that opens .go files and inspects their text sees the mutation in full - only
# guards asserting compiled behaviour are blind to it. That is a property of
# the guard rather than of the ledger, which this paragraph used to get wrong
# by stating it as a flat "cannot judge Go source". Such an entry says
# `reads_source: true`, and claiming it wrongly produces an entry that cannot
# fail, which is why it is claimed rather than inferred. Guards over Go behaviour belong in that program's own
# package tests, beside the code, where a counterexample is an ordinary table
# entry - which is also where the comment check's own decision is proved, in
# TestSatisfiedByProseOnlyNamesAPassToFailFlip.

# The number of entries may not fall below this. Raise it when you add one.
#
# A ratchet rather than an exact count, because adding an entry should never
# require editing two places, and removing one should always require a visible,
# reviewable act rather than a quiet deletion. Same shape as
# tests/coverage-baseline.json, for the same reason.
floor: 128

mutations:
  - guard: TestTheGameServerCannotBeGivenAPathIntoTheEstate
    file: modules/applications/valheim/base/second-policy.yaml
    create: |
      ---
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: valheim-extra
        namespace: valheim
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: valheim
        policyTypes:
          - Egress
        egress:
          - {}
    mentions: "permits the game server egress to everything"
    why: >
      NetworkPolicies are additive, so a second file selecting the same pods
      opens the estate without touching the one the guard used to read. The
      diff looks like a new file rather than a weakened rule, and the guard
      stayed green through exactly this shape once already.

  - guard: TestEveryFluxSubstitutionHasAStandInAndTheReverse
    file: tests/flux-substitutions.env
    find: 'ETCD_ENDPOINTS=["192.0.2.10","192.0.2.11","192.0.2.12"]'
    replace: "# ETCD_ENDPOINTS removed"
    mentions: "substitutes to the empty string"
    why: >
      A Flux variable with no stand-in substitutes to nothing, and the
      manifest usually still parses - so CI validates a document that is not
      the one Flux applies. Two of the runner's variables were in exactly that
      state until this guard was written.

  - guard: TestScrapingTheControlPlaneChangesBothHalvesTogether
    file: management/cluster/talos.tf
    find: 'listen-metrics-urls = "http://0.0.0.0:2381"'
    replace: 'listen-metrics-urls-disabled = "http://0.0.0.0:2381"'
    mentions: "does not contain"
    why: >
      The chart scraping etcd and Talos exposing it are two changes in two
      tiers, applied by two different mechanisms. Losing the machine
      configuration half leaves a target permanently red, which is how a
      cluster teaches everybody to stop reading red targets.

  - guard: TestEveryHelmReleaseRetriesRatherThanStalling
    file: clusters/management/infrastructure/controllers/kube-prometheus-stack.yaml
    find: "  install:\n    crds: Create\n    strategy:\n      name: RetryOnFailure"
    replace: "  install:\n    crds: Create\n    strategy:\n      name: RemediateOnFailure"
    mentions: "not RetryOnFailure"
    why: >
      Remediating on failure is how the monitoring stack sat Stalled for two
      days: it could not be admitted until a namespace label arrived from
      OpenTofu, the attempts were spent before that happened, and Flux then
      waited for a person to force a reconcile while every layer behind it
      stopped (#459).

  - guard: TestThePodMTUIsPinnedRatherThanDetected
    file: clusters/bootstrap/cilium-values.yaml
    find: "MTU: 1450"
    replace: "MTU: 1280"
    mentions: "carry no UDP"
    why: >
      Cilium detects the lowest link MTU on a node, which here is the tailnet
      interface at 1280 - an interface pods never leave by. What that costs is
      invisible until something needs a full-sized packet: quic-go will not
      start below 1252 bytes, so the tunnel connector falls back to HTTP/2,
      which carries no UDP and so no game server (#455).

  - guard: TestEveryTunnelRouteIsAServiceAddressAndTheReverse
    file: management/cluster/tunnel.tf
    find: '"game-server" = "10.96.0.46"'
    replace: '"game-server" = "10.96.0.47"'
    mentions: "no Service in git sets clusterIP"
    why: >
      The tunnel route and the Service's fixed address live in files read by
      different tools. Moving one without the other converges cleanly and
      hands an enrolled device a route to an address nothing answers on.

  - guard: TestThePostMergeHookSaysWhenItCouldNotCollect
    file: githooks/post-merge
    find: '	echo "sweeper: could not build scripts/sweeper, so finished branches were not taken away" >&2'
    replace: "	: # nothing said"
    mentions: "said nothing about it"
    why: >
      A post-merge hook that cannot build the sweeper and exits quietly is
      indistinguishable from one with nothing to collect. That silent absence
      is precisely how finished branches piled up in an operator's checkout
      for two weeks before this hook existed, with a sweeper that would have
      recognised every one of them.

  - guard: TestNoWorkflowRestatesAPinnedVersion
    file: .github/workflows/pr-validation.yml
    find: "node-version: ${{ env.NODE_VERSION }}"
    replace: 'node-version: "24.19.0"'
    mentions: "restates a pinned version"
    why: >
      The literal agrees with scripts/versions.env on the day it is written,
      which is exactly why it is dangerous: nothing reports the day it stops
      agreeing. Four workflows carried one, including the lane that reaches
      real hardware, while the pin file's header claimed this test existed.
      The same drift had already put CI on a different OpenTofu from the one
      that converged the estate.

  - guard: TestFluxSourcesOnlyNameSecretsThisRepositoryCreates
    file: clusters/management/infrastructure/configs/flux-production.yaml
    find: "  # NO secretRef, and that is deliberate rather than an omission."
    replace: "  secretRef:\n    name: flux-system"
    mentions: "nothing in this repository creates"
    why: >
      A secretRef naming a secret that does not exist does not degrade to
      anonymous access - the source fails closed with AuthenticationFailed and
      never produces an artifact. Downstream that reads as "Source artifact not
      found", which looks like a missing tag, and the layer applying the source
      has wait:true so it blocks on its own GitRepository until the ignition's
      health gate gives up. One unchecked reference cost a full rebuild.

  - guard: TestPoolMembershipDependsOnTheMachineItPlaces
    file: management/cluster/pools.tf
    find: "vm_id   = proxmox_virtual_environment_vm.talos_worker[each.key].vm_id"
    replace: "vm_id   = each.value.vm_id"
    mentions: "no dependency edge"
    why: >
      The number is identical either way, so nothing about the estate that gets
      built changes and no plan looks different. What is lost is the ordering on
      destroy: without the edge OpenTofu deletes the membership and the machine
      concurrently, Proxmox drops a destroyed VM out of its pool as a side
      effect, and the delete that loses the race asks the API to remove a VM
      that is no longer a member. Proxmox answers HTTP 500 and the teardown
      stops half-done, leaving state and secrets in place on purpose. It failed
      exactly this way twice in one session.

  - guard: TestEveryKubernetesResourceWaitsForTheCluster
    file: management/cluster/workloads.tf
    find: "  depends_on = [data.talos_cluster_health.this]"
    replace: "  # depends_on removed"
    mentions: "does not depend on"
    why: >
      OpenTofu starts everything it can in the first wave. A kubernetes_*
      resource with no edge into the cluster's readiness is created while the
      API server is still starting its static pods, so the provider gets
      connection refused and the apply dies - which on an ignition tears the
      whole estate back down. Two resources were unordered this way at once, and
      neither had anything else wrong with it.

  - guard: TestTheHookShimRunsTheGuardBeforePreCommit
    file: githooks/pre-commit
    find: "./toolshed/security guard-deliveries"
    replace: "true # security used to run here"
    mentions: "does not run"
    why: >
      The shim is the only thing that runs before pre-commit clones and
      installs seven third-party repositories. Without it the check happens
      after the code it exists to refuse has already executed, with the vault
      session's privileges, on the developer's machine.

  - guard: TestTheHookShimFailsOnAFailingGuard
    file: githooks/pre-commit
    find: "set -euo pipefail"
    replace: "set -uo pipefail"
    mentions: "set -e"
    why: >
      Without `set -e` the shim reports a failing guard and lets the commit
      through anyway. A guard that reports rather than refuses is a log line.

  - guard: TestSetupPointsGitAtTheShims
    file: scripts/install-dependencies.sh
    find: "git config core.hooksPath githooks"
    replace: "true # core.hooksPath"
    mentions: "point git at githooks"
    why: >
      Unset, git uses .git/hooks - which pre-commit owns and overwrites - so
      the shim becomes a file nothing invokes. Everything above it is then
      true in the repository and false on the machine.

  - guard: TestEveryTaskAHookInvokesIsInvokable
    file: taskfile.yml
    find: "  delivery-guard:\n    desc:"
    replace: "  delivery-guard:\n    internal: true\n    desc:"
    mentions: "internal"
    why: >
      task refuses to run an internal task from the CLI, so the hook fails
      with a task error rather than a verdict - a guard broken in the
      direction of noise, which is the direction that gets guards switched
      off.

  - guard: TestEveryCommitHookIsAnApprovedSupplier
    file: .pre-commit-config.yaml
    find: "repos:"
    replace: "repos:\n  - repo: https://github.com/example/undeclared\n    rev: v1.0.0\n    hooks:\n      - id: whatever"
    mentions: "approved-suppliers"
    why: >
      This is the static half of the delivery gate - the half CI can answer
      without cloning anything. If it stops noticing an undeclared repository,
      an unapproved supplier reaches every developer's machine and the runner.

  - guard: TestEverySupplierGivesAReason
    file: scripts/approved-suppliers.yml
    find: "    reason: The operator running the state database."
    replace: '    reason: ""'
    mentions: "no reason given"
    why: >
      An entry with no reason is the supply chain widened without anybody
      saying why. The list stops being a decision and becomes a record of
      whatever was convenient.

  - guard: TestEveryOutstandingPatchStillApplies
    file: .github/patches/a-patch-that-cannot-apply.patch
    create: |
      diff --git a/.github/workflows/codeql.yml b/.github/workflows/codeql.yml
      index 1111111..2222222 100644
      --- a/.github/workflows/codeql.yml
      +++ b/.github/workflows/codeql.yml
      @@ -1,3 +1,3 @@
      -name: "A line this workflow has never contained"
      +name: "Something else"
       # context that does not exist either
    mentions: "does not apply to the current tree"
    why: >
      A stale patch is indistinguishable from a live one to whoever has to
      run it, and the person who has to run it is the only one who can - the
      agent cannot write a workflow at all. Planted rather than substituted
      because this guard has nothing to say until a patch is outstanding, and
      the normal state of the repository is that none is.

  # --- Added retroactively -------------------------------------------------
  #
  # Every entry below was proved by hand at the time - the guard was written,
  # the thing it guards was broken, the failure was read, the break was undone
  # - and none of those proofs was committed. Six guards went in that way in
  # one session, by the same hand that built this file to stop exactly that.
  #
  # They are here now because a proof that lived in a terminal is a claim.

  - guard: TestNoGoCommandResolvesAgainstTheRootlessRepository
    file: .github/workflows/sensitive-paths.yml
    find: "go run -C scripts/attestation ."
    replace: "go run ./scripts/attestation"
    mentions: "resolves that path from the repository root"
    why: >
      There is no module at the repository root, so this form fails with
      "cannot find main module" every time it runs. It shipped once and the
      sensitive-path gate failed on its first real pull request with a Go
      error instead of a verdict.

  - guard: TestEverySystemHookIsSkippedInTheFormatLane
    file: .github/workflows/pr-validation.yml
    find: "SKIP: tofu-fmt,go-fmt,delivery-guard"
    replace: "SKIP: tofu-fmt,go-fmt"
    mentions: "is not in the Format lane's SKIP list"
    why: >
      A system hook runs in the Format lane, which installs pre-commit and
      nothing else, so it fails on a binary that lane does not have. The whole
      lane went red on a hook that could never have run in it.

  - guard: TestTheFormatLaneRefusesASupplierBeforeInstallingAnything
    file: .github/workflows/pr-validation.yml
    find: "guard-deliveries -before-install"
    replace: "guard-deliveries"
    mentions: "does not run the supplier gate before installing"
    why: >
      pre-commit installs every hook repository before running any hook, so a
      guard that is itself a hook reports after the download it exists to
      prevent. Without this step the runner fetches and executes seven
      third-party repositories before anything can refuse one.

  - guard: TestKubectlPinTracksTheClusterVersion
    file: scripts/versions.env
    find: "KUBECTL_VERSION=v1.36.4"
    replace: "KUBECTL_VERSION=v1.31.1"
    mentions: "Kubernetes supports a client within one minor"
    why: >
      kubectl supports one minor of skew from the API server. Three numbers
      disagreed at once here - the cluster, the pin, and what the installer
      actually fetched - and no two were within one.

  - guard: TestTheInstallerDoesNotOverrideAPinnedVersion
    file: scripts/install-dependencies.sh
    find: "\tinfo \"installing kubectl ${KUBECTL_VERSION}\""
    replace: "\tKUBECTL_VERSION=\"$(curl -fsSL https://dl.k8s.io/release/stable.txt)\"\n\tinfo \"installing kubectl ${KUBECTL_VERSION}\""
    mentions: "overriding the pin"
    why: >
      Sourcing versions.env and then overwriting the value is worse than not
      pinning: the file still claims to be the single declaration while the
      workstation and the runner image quietly install different versions.

  # --- Proved during the epoch-01 close-out ---------------------------------

  - guard: TestTalosctlPinTracksTheClusterVersion
    file: scripts/versions.env
    find: "TALOSCTL_VERSION=v1.13.8"
    replace: "TALOSCTL_VERSION=v1.9.0"
    mentions: "within one minor of the cluster"
    why: >
      talosctl two minors from the cluster is where commands start behaving
      differently from their documentation - a bad thing to discover while
      running `talosctl rotate-ca` during an incident.

  - guard: TestPlainGitPushIsRefusedByAHook
    file: .pre-commit-config.yaml
    find: "        stages: [pre-push]\n        fail_fast: true"
    replace: "        stages: [pre-push]\n        fail_fast: false"
    mentions: "fail_fast"
    why: >
      Without it a refused push still pays for the whole Go and OpenTofu corpus
      before printing the refusal, which was measured rather than assumed and
      is how a guard gets switched off.

  - guard: TestAWorkstationOnTheHypervisorBridgeDoesNotAcceptRoutes
    file: workstation/provision.yml
    find: '--advertise-tags=''{{ overlay_tag }}''"]'
    replace: '--advertise-tags=''{{ overlay_tag }}'' --accept-routes"]'
    mentions: "incompatible"
    why: >
      The node subnet is in an EVPN VRF with no route back to the tailnet, so
      accepting the advertised route replaces a working LAN path with one that
      carries requests and returns nothing. Three ignitions halted at Verify
      before this was understood.

  - guard: TestNothingIsBuiltOutsideTheToolshed
    file: taskfile.yml
    find: "      - go build -C scripts/signedpush -o ../../toolshed/signedpush .\n      - ./toolshed/signedpush -token"
    replace: "      - go build -C scripts/signedpush -o signedpush .\n      - ./signedpush -token"
    mentions: "toolshed"
    why: >
      One ignore rule per program is one per program to forget, and two were
      forgotten - a 9.4MB binary reached main and a 3.6MB one sat there
      unnoticed. Building anywhere else reopens that.

  - guard: TestRecoveryInstructionsNameTheWorkstationBinary
    file: docs/state-and-secret-rotation.md
    find: "### Restoring\n\n```sh\n./toolshed/contractor restore -site site0"
    replace: "### Restoring\n\n```sh\n./scripts/contractor/contractor restore -site site0"
    mentions: "which only exists in CI"
    why: >
      The path this puts back is the one a real ignition printed on 2026-09-04,
      in the message telling the operator how to recover from a total loss. It
      names a binary that exists only in CI, because the workflows build to
      scripts/contractor/contractor and task build writes toolshed/contractor.
      A recovery instruction that names a file the reader does not have is
      worse than none: it is read at the moment everything else has already
      gone wrong.

  - guard: TestEveryProviderIsADeclaredSupplier
    file: management/cluster/versions.tf
    find: 'kubernetes = { source = "hashicorp/kubernetes"'
    replace: 'kubernetes = { source = "evilcorp/kubernetes"'
    mentions: "is not an approved supplier"
    why: >
      A provider is third-party code downloaded at init time and executed with
      this estate's credentials - the hypervisor API token, the cluster PKI,
      the object storage keys. Swapping one source for another is a single word
      in an HCL block and would otherwise reach the estate with nobody deciding
      to take delivery from that party. The mutation is the exact shape of a
      typosquat.

  - guard: TestRunnerPodsCannotScheduleOntoAControlPlane
    file: clusters/management/infrastructure/configs/runner-scale-set.yaml
    # Anchored on the priority class above it, because this file now carries
    # the same anti-control-plane rule twice - once for the runner and once for
    # the listener - and "operator: DoesNotExist" alone no longer names one spot.
    # The anchor is YAML rather than the comment beside it on purpose:
    # TestNoTestIsSatisfiedByAComment strips comments and re-runs everything.
    find: "priorityClassName: batch\n        affinity:\n          nodeAffinity:\n            requiredDuringSchedulingIgnoredDuringExecution:\n              nodeSelectorTerms:\n                - matchExpressions:\n                    - key: node-role.kubernetes.io/control-plane\n                      operator: DoesNotExist"
    replace: "priorityClassName: batch\n        affinity:\n          nodeAffinity:\n            requiredDuringSchedulingIgnoredDuringExecution:\n              nodeSelectorTerms:\n                - matchExpressions:\n                    - key: node-role.kubernetes.io/control-plane\n                      operator: Exists"
    mentions: "would schedule onto a control-plane node"
    why: >
      One character inverts it. With Exists a CI runner schedules ONLY onto
      control planes, which is the precise arrangement the worker pool was
      built to end - eight concurrent jobs pulling large images beside etcd is
      how a control plane becomes intermittently unwell, and one integration
      run was already killed for it. The guard evaluates the affinity against
      a synthetic node rather than matching its text, because a check for the
      string "DoesNotExist" passes just as happily once the operator has been
      flipped.

  - guard: TestEveryMachineClassIsAssignedAPool
    file: management/cluster/pools.tf
    find: "  for_each = local.workers"
    replace: "  for_each = local.control_plane"
    mentions: "never placed in a pool"
    why: >
      The pools break by addition rather than by deletion - a new class of
      machine is written beside the others and nothing says where it belongs,
      so the hypervisor grows an ungrouped machine and the grouping quietly
      stops being true of everything. This mutation is the shape that failure
      actually takes: the workers keep a pool assignment, so nothing looks
      missing, but no line in pool_members iterates local.workers any more.

  - guard: TestPoolIdsAreScopedToTheSite
    file: management/cluster/pools.tf
    find: 'pool_id = "${local.site_name}-workers"'
    replace: 'pool_id = "workers"'
    mentions: "does not include the site"
    why: >
      Pools are datacenter-scoped, so a bare `workers` collides the moment two
      sites share a Proxmox cluster - and Proxmox answers a collision by
      adopting the other estate's machines into this pool rather than by
      failing. The config supports several sites by design, so the collision is
      expressible rather than theoretical, and it is silent.

  - guard: TestPoolMembershipNamesTheFunctionInTheResourceName
    file: management/cluster/pools.tf
    find: 'resource "proxmox_pool_membership" "workers"'
    replace: 'resource "proxmox_pool_membership" "by_function"'
    mentions: "named for the grouping rather than for a function"
    why: >
      The plan comment renders a resource name and redacts the for_each key,
      because a key can be a hypervisor's real hostname and nothing downstream
      can tell a safe key from an unsafe one. So the function has to live in
      the name: the first version of this file keyed membership by function and
      produced nine identical "<redacted>" rows on the change whose entire
      purpose is that somebody can see which machine is which. This guard is
      what stops the tidier, unreadable form coming back.

  - guard: TestRunnerPodsAreNotBestEffort
    file: clusters/management/infrastructure/configs/runner-scale-set.yaml
    find: "memory: 2Gi"
    replace: "ephemeral-storage: 1Gi"
    mentions: "requests no memory"
    why: >
      A runner with no memory request is BestEffort, which is the first cgroup
      Talos's OOM controller reaches for, and is what killed a thirteen-minute
      integration run. The mutation leaves a requests block behind rather than
      deleting one, because the failure being guarded against is a request
      quietly dropped from an otherwise healthy-looking spec, not a block
      vanishing where a reader would notice it.

  - guard: TestEveryInstalledHookTypeHasAShim
    file: .pre-commit-config.yaml
    find: "default_install_hook_types: [pre-commit, pre-push, commit-msg]"
    replace: "default_install_hook_types: [pre-commit, pre-push, commit-msg, prepare-commit-msg]"
    mentions: "is never invoked"
    why: >
      core.hooksPath replaces .git/hooks rather than merging with it, so a
      stage listed here without a matching shim in githooks/ has a hook that
      exists, is correct, and is never invoked. commit-msg was exactly that:
      two commitlint rules this repository holds deliberately were enforced
      only by CI, so each violation cost a push rather than a second at the
      terminal, and one cost a rewritten branch and a replaced pull request.
      The mutation adds a stage rather than deleting the shim, because the
      failure being guarded against is somebody adding a stage to this config
      and reasonably assuming that is the whole job.

  - guard: TestEveryWorkloadIsSizedPlacedAndGivenAPriority
    file: clusters/management/infrastructure/controllers/openebs.yaml
    find: "      localpv:"
    replace: "      localpvv:"
    mentions: "the cluster has been running without it"
    why: >
      This is the failure the whole table exists for, and it is silent. OpenEBS
      is a subchart, so its provisioner's resources and placement live two
      levels down at localpv-provisioner.localpv rather than at the top level
      the other two charts use. Helm accepts a value at a path no template
      reads without an error, a warning or an event - the manifest says the
      provisioner has requests and is off the control plane, and the pod has
      neither. One misspelt key is the whole distance between configured and
      configured-looking, and nothing else in this repository would notice.

  - guard: TestEveryWorkloadRequiresItsSecurityPropertiesRatherThanInheritingThem
    file: clusters/management/infrastructure/controllers/actions-runner-controller.yaml
    find: "      runAsNonRoot: true"
    replace: "      runAsNonRoot: false"
    mentions: "runAsNonRoot"
    why: >
      The controller does not run as root because its base image says
      USER 65532, and nothing in this repository can see that change. Remove
      the assertion and the property becomes something an upstream rebuild can
      take away with no diff here, no event, and a pod that keeps starting.

  - guard: TestTheRenderedTalosconfigNamesNodesAndEveryEndpoint
    file: management/cluster/talos.tf
    find: "  nodes                = local.node_ips"
    replace: "  nodes                = []"
    mentions: "nodes"
    why: >
      The Talos provider leaves `nodes` empty unless told otherwise, and an
      empty one is not a broken credential - it is a working one on which every
      node-targeted command refuses on first use. The runtime guard in
      writeTalosconfigTo catches it at the moment of use; this catches the
      branch that removed it, which is cheaper by a whole diagnostic.

  - guard: TestEveryHelmReleaseSaysWhereItsPodSpecLives
    file: clusters/management/infrastructure/controllers/undescribed-chart.yaml
    create: |
      ---
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: something-nobody-sized
        namespace: default
      spec:
        interval: 30m
        chart:
          spec:
            chart: something
            version: "1.0.0"
    mentions: "are not described in workloadPods"
    why: >
      A table of the workloads somebody thought about is not a guard, it is a
      list. Without this half, adding a chart and forgetting to describe it
      reads exactly like adding a chart that is fine - the same silence and
      the same exit code, which is the shape of every check this repository has
      had to repair. Planted rather than substituted because the failure only
      exists once a release is PRESENT and undescribed; there is nothing in the
      tree to edit into that state.

  - guard: TestEveryFluxControllerIsPlacedAndGivenAPriority
    file: clusters/management/flux-system/kustomization.yaml
    find: "  - target:\n      kind: Deployment\n    patch: |"
    replace: "  - target:\n      kind: Deployment\n      name: source-controller\n    patch: |"
    mentions: "has no required node affinity after the overlay is applied"
    why: >
      Flux's four controllers are patched as a group, by kind rather than by
      name, precisely so that an upgrade adding or renaming one cannot slip out
      from under the patch. Narrowing the target to a single name still builds -
      kustomize is perfectly happy, and `task validate` stays green - while
      three of the four quietly go back to running wherever the scheduler puts
      them, including on the machines holding quorum. The guard applies the
      patches the way kustomize would and then reads the result, because
      nothing about a well-formed patch says which pods it reached.

  - guard: TestTheTaskfileDiscoversModulesRatherThanListingThem
    file: taskfile.yml
    find: '          go test -C "$dir" ./...'
    replace: "          go test -C scripts/contractor ./..."
    mentions: "vets or tests named modules"
    why: >
      clerk and inspector sat outside both `validate` and `test:go` for their
      whole lives, so neither was compiled or run by anything - not locally,
      not in CI. Every guard written for the clerk had passed only in the
      terminal that wrote it, and would have gone on passing after the code it
      guards stopped working, because nothing ever ran it again. A module is
      added by creating a directory with a go.mod in it, and nothing about that
      act suggests two lists elsewhere need editing, which is exactly why the
      lists are asserted rather than remembered. The sweep is the fix; this
      entry is what stops it turning back into a list.

  - guard: TestEveryGoModuleHasACoverageFloor
    file: tests/coverage-baseline.json
    # Anchored on the KEY rather than on the key and its number. The number is
    # a ratchet every change that adds tests moves, so an entry naming one
    # breaks whenever coverage improves - which is the ledger going red for the
    # opposite of a problem. Found exactly that way when go/clerk went 56 -> 63.8.
    find: '"go/clerk":'
    replace: '"go-clerk-was-here":'
    mentions: "has no floor for"
    why: >
      A module with no floor has its coverage measured and compared against
      nothing. Six of the seven were in that state, two of them modules no task
      ran at all, so the number the gate reported for "go" described one module
      while appearing to describe the project. The floor is written by hand on
      purpose - a floor that ratchets automatically records whatever the last
      green run happened to hit - so the thing that must not be forgotten is
      writing it, and this is what refuses to forget.

  - guard: TestTheCoverageShimDiesWithTheWorkflowStepThatNeedsIt
    file: tests/coverage-baseline.json
    # Anchored on the KEY, not on its number - the third entry this session to
    # break because a coverage figure improved, which is #328's complaint in
    # miniature: a hand-maintained counter every change edits, with other
    # things pointing at its value.
    find: '"go/attestation":'
    replace: '"go": 34,\n    "go/attestation":'
    mentions: "floor for nothing"
    why: >
      A bare "go" key is a floor for nothing once the workflow sweeps every
      module and asks for one key each. Leaving it there puts a number nobody
      chose among the ones somebody did, which is how a baseline here once sat
      ten points below the measured figure without anybody noticing. The guard
      refuses the opposite case too - the workflow asking for a key the
      baseline does not declare - so neither half can happen quietly.

  - guard: TestEveryUnitIsExecutedByATestOrIsADeclaredDebt
    file: tests/coverage-blocklist.yml
    find: "  - ansible:management/hypervisor/hypervisor-prep.yml # 293"
    replace: "  # - ansible:management/hypervisor/hypervisor-prep.yml was here"
    mentions: "executed by no test"
    why: >
      The regime is fail-closed: a unit nothing executes is a failure unless it
      is named as a debt. Removing an entry for something still untested is the
      move that turns a block list back into an allow list, quietly, one line
      at a time - and an allow list cannot tell the difference between a check
      that is absent and a check that is fine. That is not hypothetical here:
      coverage measured one Go module of seven, two modules were run by nothing
      at all, and three whole tiers sat outside the regime with nothing saying
      so.

  - guard: TestTheCoverageGateHoldsItsFloor
    file: scripts/coverage-gate.sh
    find: '	if (c + 0 < f + 0)      { print "regressed" }'
    replace: '	if (c + 0 < -1)         { print "regressed" }'
    mentions: "want 1"
    why: >
      With the comparison against a number nothing can be below, every
      coverage figure reports as held and the gate exits 0 forever - a ratchet
      that has quietly stopped holding anything, which is worse than none
      because the green check says otherwise. Nothing executed this script
      before; the only test that named it read one line of the workflow that
      calls it.

  - guard: TestTheCoverageGateRefusesWhatItCannotJudge
    file: scripts/coverage-gate.sh
    find: "	echo \"known languages: $(jq -r '.baselines | keys | join(\", \")' \"$BASELINE_FILE\")\" >&2\n	exit 2"
    replace: "	echo \"known languages: $(jq -r '.baselines | keys | join(\", \")' \"$BASELINE_FILE\")\" >&2\n	exit 0"
    mentions: "want 2"
    why: >
      A gate asked about a key it has no baseline for cannot judge, and exiting
      0 makes that indistinguishable from judging and passing. This estate's
      rule is that "I was not told what belongs here" and "nothing is wrong"
      must never share an exit code - and this is the exact path a new module
      takes before somebody writes its floor down.

  - guard: TestEveryLocalGuardIsAlsoEnforcedInCI
    file: .pre-commit-config.yaml
    # Not a rename: CI runs whatever the config names, so renaming changes
    # nothing. Moving it to a stage `pre-commit run --all-files` does not run
    # is the regression - green locally, absent in CI, silent either way.
    find: "        entry: task delivery-guard"
    replace: "        entry: task delivery-guard\n        stages: [pre-push]"
    mentions: "enforced nowhere but a git hook"
    why: >
      A git hook is advice: --no-verify skips every one, a fresh clone has none
      installed, and an outside pull request never had any. The supplier guard
      is only a real guard because the Format lane runs the same
      .pre-commit-config.yaml, so renaming it to something no workflow reaches
      turns it back into a courtesy - green locally for whoever has hooks on,
      absent for everybody else, and silent either way.

  - guard: TestNoTierQuietlyLosesTests
    file: tests/coverage-baseline.json
    find: '"integration": 14,'
    replace: '"integration": 99,'
    mentions: "integration tier has"
    why: >
      Unit tests are cheap and the count always rises; the tiers that drive
      real infrastructure are hard, and theirs can fall without anybody
      noticing, because the total still looks healthy. On the day this was
      written the cheap tiers held 513 tests and the three that touch a real
      estate held 25. Raising a floor above the real count stands in for the
      count falling below the floor - the failure this exists to catch.

  - guard: TestEveryEstateSurfaceIsNamedByATestOrIsADeclaredDebt
    file: tests/coverage-blocklist.yml
    find: "  - verb:restore # 298"
    replace: "  # - verb:restore was here"
    mentions: "claimed by no test"
    why: >
      restore is the break-glass path - the thing that brings state back after
      a total loss - and no test in any tier runs it. Quietly dropping its line
      is how a surface stops being tracked without anybody deciding to stop
      tracking it, which is the difference between debt and a gap. The whole
      point of enumerating surfaces from the repository is that a surface
      cannot leave the list by being forgotten, only by being covered.

  - guard: TestEveryGuardThatDiscoversItsSubjectAssertsItFoundSome
    file: tests/go/repo/suppliers_test.go
    reads_source: true
    find: "\t\tt.Fatal(\"no image references found under clusters/, so this test proves nothing\")"
    replace: "\t\t_ = checked // the floor used to be asserted here"
    mentions: "never assert they found any"
    why: >
      This is the first entry to mutate Go source, and it is legitimate for a
      reason the refusal above now states: the guard READS these files as text
      rather than executing them, and runGuard points the repo root at the
      scratch tree, so the mutation is fully visible to it.

      What it proves is that removing a floor from a guard is noticed. The
      floor is the only thing standing between "walked the tree and everything
      is fine" and "walked nothing and said the same" - three defects in this
      estate came from that distinction being invisible - and a floor is
      exactly the kind of line that looks like dead weight to somebody tidying
      up. suppliers_test.go is the right subject because its floor guards the
      supply chain: without it, an image walk that stops matching reports every
      image approved and digest-pinned.

  - guard: TestTheHealthGateWaitsForTheCNI
    file: management/cluster/talos.tf
    find: "    terraform_data.cilium,"
    replace: "    talos_cluster_kubeconfig.this,"
    mentions: "does not depend on"
    why: >
      Replaced with a dependency that is already there rather than deleted, so
      the mutation is the realistic one: somebody tidying a depends_on list and
      leaving it non-empty. The edge is the entire ordering of the ignition -
      bootstrap, install the CNI, nodes go Ready, gate passes - and losing it
      produces no error at all. It produces a ten-minute wait and then a
      complaint about the cluster's health, ten minutes away from the line that
      was actually wrong.

  - guard: TestTheClusterDeclaresNoBuiltInCNIAndNoKubeProxy
    file: management/cluster/talos.tf
    find: '            name = "none"'
    replace: '            name = "flannel"'
    mentions: "cluster.network.cni.name"
    why: >
      Naming Flannel explicitly is the mutation that matters, because it is the
      thing this estate is moving away from and the thing Talos installs if the
      setting is lost. Flannel implements no NetworkPolicy controller, so the
      policies isolating the untrusted workload would be accepted, stored, and
      never evaluated. The failure is silent by construction: everything comes
      up healthy and the isolation simply is not there.

  - guard: TestKubePrismIsDeclaredRatherThanAssumed
    file: management/cluster/talos.tf
    find: "              port    = 7445\n            }\n          }\n        }\n      }),\n\n      # The taint,"
    replace: "              port    = 7446\n            }\n          }\n        }\n      }),\n\n      # The taint,"
    mentions: "7445"
    why: >
      Moved in one patch collection and not the other, which is the realistic
      drift: the port is declared once per collection and as k8sServicePort in
      the Cilium values, and a change that updates the one somebody was looking
      at leaves the rest behind. It breaks the pod network on whichever
      machines took the stale value, with nothing anywhere naming a port.

      The mutation targets the untrusted zone's collection deliberately. This
      guard used to assert only that the file mentioned KubePrism somewhere,
      which a second machine class made insufficient - the zone's agents need
      the endpoint exactly as much as a worker's do, and the check would have
      been satisfied by somebody else's declaration.

  - guard: TestTheRenderedCNIManifestMatchesThePinnedChartVersion
    file: scripts/versions.env
    find: "CILIUM_VERSION=1.20.1"
    replace: "CILIUM_VERSION=1.19.7"
    mentions: "render-cni"
    why: >
      Bumping the pin and forgetting to re-render is the failure this guard
      exists for, so the mutation is exactly that. The committed manifest is
      generated, and a generated file nobody can prove is current silently
      becomes the source of truth while still claiming to be a copy - the
      estate would then be running a version no file in it names.

  - guard: TestTheCNIReachesEveryNodeIncludingTaintedOnes
    file: clusters/bootstrap/cilium.yaml
    find: "      tolerations:\n        - operator: Exists\n\n      volumes:"
    replace: "      tolerations:\n        - key: node-role.kubernetes.io/control-plane\n          operator: Exists\n\n      volumes:"
    mentions: "does not tolerate every taint"
    why: >
      Narrowed to a real, plausible toleration rather than deleted, because
      that is what the regression actually looks like: a keyed toleration reads
      as more careful than a blanket one, and is the change somebody would make
      believing they were tightening things. It silently excludes every taint
      nobody thought to name - which, once the untrusted zone exists, is the
      DMZ node. That node would never reach Ready, and it would look like a
      broken machine rather than a missing line in a chart's values.

  - guard: TestEveryZoneResourceIsKeyedOffItsMachines
    file: management/cluster/compute.tf
    find: "resource \"proxmox_download_file\" \"dmz_disk_image\" {\n  for_each = toset(local.dmz_hypervisors)"
    replace: "resource \"proxmox_download_file\" \"dmz_disk_image\" {\n  for_each = toset(local.all_vm_hypervisors)"
    mentions: "keyed off"
    why: >
      The mutation is the line the resource directly above it uses, which is
      what makes it the plausible one: copying a neighbouring for_each reads as
      consistency rather than as a change of meaning. It pulls a 4.5GB image
      onto every hypervisor forever, including an estate that has deprecated
      its last untrusted workload - and nothing fails, so the only symptom is
      disk somebody notices months later.

  - guard: TestEveryZoneTaskLoopsOverTheZones
    file: management/hypervisor/hypervisor-prep.yml
    find: "      loop: \"{{ dmz_zones }}\"\n      loop_control:\n        label: \"{{ item.name }}\"\n      run_once: true\n      tags: [sdn]\n\n    - name: List subnets on each untrusted zone's vnet"
    replace: "      run_once: true\n      tags: [sdn]\n\n    - name: List subnets on each untrusted zone's vnet"
    mentions: "without looping over the zones"
    why: >
      Dropping the loop from a task that still reads item.vnet is what a
      copy-paste of the block beside it produces, and it leaves the task running
      once against an undefined item on every estate - including one with no
      untrusted workload at all. The loop is the off switch here rather than a
      `when:`, deliberately: a gate has to be remembered on every task, and a
      loop over an empty list cannot run.

      This entry replaced one proving a dmz_count gate. The config changed shape
      from a count to named zones, and the old guard broke while the behaviour
      it cared about did not - a test matching a variable's spelling rather than
      the property it stood for.

  - guard: TestZoneNamesUseAPlaceholder
    file: management/cluster/tests/fixtures/negative-zone-node-count.json
    find: '"example": { "node_count": -1 }'
    replace: '"valheim": { "node_count": -1 }'
    mentions: "names an untrusted zone"
    why: >
      A real workload name in a fixture is what this catches, and the mutation
      uses the one that was actually there before somebody noticed. It is not a
      secret in the way a site or hypervisor name is - nobody is harmed by
      knowing which game runs here - so the reason it stays out is a design one:
      a zone is for untrusted work rather than for one workload, and plumbing
      that names its first tenant is how a general capability quietly becomes
      that tenant's feature.

      The epoch record names the workload, deliberately. That is where the
      motivation belongs. The machinery should read the same whoever moves in
      next.

  - guard: TestBucketsThatOutliveTheEstateAreReleasedBeforeAnythingDeletes
    file: scripts/contractor/internal/phases/sterilize.go
    reads_source: true
    find: "\tforgetKeptBuckets(ctx)\n\temptyObjectStorage(ctx)"
    replace: "\temptyObjectStorage(ctx)\n\tforgetKeptBuckets(ctx)"
    mentions: "before it releases the kept buckets"
    why: >
      reads_source, because this guard reads sterilize.go as text rather than
      executing it - the order of two calls is a property of the file, and the
      scratch copy is the file it reads.

      Reordered rather than deleted, because that is the version somebody
      writes while looking at a stuck teardown instead of at this file: the
      destroy halted on a bucket Cloudflare would not delete, emptying is
      visibly the thing that unsticks it, and moving it earlier looks like
      fixing the order rather than deleting the backups.

      It still reads as correct afterwards. Both calls are present, both run,
      and the teardown completes - which is exactly why the order needs a guard
      rather than a comment.

  - guard: TestTheBucketTableAgreesWithTheHCL
    file: management/cluster/object-storage.tf
    find: 'name       = "${local.site_name}-state"'
    replace: 'name       = "${local.site_name}-statedumps"'
    mentions: "disagree about the name of the"
    why: >
      Renaming one side of a set that is declared twice. This is the drift the
      guard exists for, and the rename is the plausible version of it - a
      bucket called "-statedumps" reads as more descriptive than "-state", and
      nothing in object-storage.tf objects.

      The consequence is invisible from the file being edited. The Go table
      still says "-state", so the Backup phase writes to a bucket OpenTofu
      never created, the teardown releases a bucket that does not exist, and
      the one that does is destroyed with the estate.

  - guard: TestTheBucketTableAgreesWithTheHCL
    file: management/cluster/object-storage.tf
    find: 'name       = "${local.site_name}-staging"'
    replace: "name       = local.object_storage.bucket"
    mentions: "and only"
    why: >
      Naming a workload bucket from the config field instead of the site slug.
      This is the shape of somebody copying the database bucket's name line,
      which is the one line in the file that legitimately looks like this.

      It reads as harmless and is not. The slug is what carries the site, so a
      bucket named from the estate-wide config field is a bucket two sites
      would share - and what they would share is one site's production workload
      data with another's.

  - guard: TestBackupAndRestoreUseTheSameBucket
    file: scripts/contractor/internal/phases/restore.go
    reads_source: true
    find: 'stateBucket, err := config.BucketByKey("state")'
    replace: 'stateBucket, err := config.BucketByKey("database")'
    mentions: "does not resolve its bucket"
    why: >
      reads_source, because this guard opens restore.go and inspects its text
      rather than executing it - which bucket a phase resolves is visible in the
      source, and the scratch copy is the file it reads.

      Pointing restore at the database bucket, which is where these dumps used
      to live. Somebody reading an older runbook, or recovering an estate built
      before the split, writes exactly this.

      It fails in the worst place: a restore finds no backup and says so, while
      an operator is trying to rebuild an estate. The bucket it is reading is
      real and reachable, so nothing looks broken - it just appears that no
      backup was ever taken.

  - guard: TestTheTeardownResolvesTheBucketItEmptiesFromTheTable
    file: scripts/contractor/internal/phases/teardown.go
    reads_source: true
    find: 'database, err := config.BucketByKey("database")'
    replace: 'database, err := config.BucketByKey("state")'
    mentions: "does not resolve the bucket it empties"
    why: >
      reads_source, for the same reason as the restore entry above: the guard
      reads teardown.go as text, so the scratch copy is what it sees.

      Aiming the emptying at the state bucket. The mutation is the shape of a
      copy-paste between two functions in the same file that both resolve a
      bucket the same way.

      Emptying is the irreversible half of a demolish, and this version deletes
      every age-encrypted state dump the estate has - which is #94 restored
      exactly, by a one-word edit, in the file that was changed to fix it.

  - guard: TestAnUnsetDialProducesNoArgument
    file: modules/applications/valheim/image/entrypoint.sh
    find: "\t\tset -- \"$@\" -modifier \"$dial\" \"$value\"\n\tfi"
    replace: "\t\tset -- \"$@\" -modifier \"$dial\" \"$value\"\n\tfi\n\tset -- \"$@\" -modifier \"$dial\" \"$value\""
    mentions: "reached the server as an argument"
    why: >
      Passing the dial unconditionally as well as conditionally, which is what
      "just always pass them" looks like when somebody simplifies this loop.
      Every value the server accepts for a modifier changes the game and there
      is no token meaning "leave this alone", so an empty one is not a harmless
      default - it is an argument the server either rejects or misreads.

  - guard: TestASetDialIsPassedAsAKeyAndValue
    file: modules/applications/valheim/image/entrypoint.sh
    find: 'set -- "$@" -modifier "$dial" "$value"'
    replace: 'set -- "$@" -modifier "$dial"'
    mentions: "missing"
    why: >
      A key with no value. The server would take whatever followed as the
      value, so the next flag becomes the setting - which is the shape of bug
      that produces a world nobody asked for rather than an error.

  - guard: TestAFlagIsOnlyPassedWhenItIsTrue
    file: modules/applications/valheim/image/entrypoint.sh
    find: "\tif [ \"$value\" = \"true\" ]; then"
    replace: "\tif [ -n \"$value\" ]; then"
    mentions: "was passed anyway"
    why: >
      Treating any value as enabling, which reads as a reasonable
      simplification and inverts the meaning of "false". The server has no
      argument that turns one of these off, so passing it turns it ON - and for
      nomap that means the map disappears for every player, silently, from a
      config that says false.

  - guard: TestCrossplayIsPassedAsABareFlag
    file: modules/applications/valheim/image/entrypoint.sh
    find: "\tset -- \"$@\" -crossplay"
    replace: "\tset -- \"$@\" -crossplay true"
    mentions: "given a value"
    why: >
      Giving a flag-only argument a value, which is what somebody writes if
      they assume it is a boolean like the variable that gates it. If the
      server then rejects the argument and falls back to the Steam backend,
      the estate needs an inbound port forward it has deliberately not built,
      and the symptom is players unable to join rather than an error here.

  - guard: TestAMissingValueRefusesToStartAndNamesTheField
    file: modules/applications/valheim/image/entrypoint.sh
    find: "\t\techo \"entrypoint: $required is empty - check the valheim-server Secret\" >&2"
    replace: "\t\techo \"entrypoint: a required value is empty\" >&2"
    mentions: "without naming the field"
    why: >
      The message loses the field's name, which is the only thing this check
      contributes and the easiest thing to lose while tidying a string.

      It is not the same job. `set -u` also refuses, so the mutation still
      exits non-zero - what it takes away is the field's name, leaving
      "parameter not set" from a script the operator has never read, at the
      moment a server will not start. The guard therefore asserts the message
      rather than the exit code, because the message is the whole contribution.

  # Guards that cannot be proved by mutation, and why.
  #
  # Enforced by tests/go/repo/ledger_completeness_test.go: every test function in
  # tests/go/repo must appear either as a `guard:` above or here. That is what
  # was missing when six guards were added in one session and none of their
  # proofs was committed - the ledger held only what somebody remembered to put
  # in it, which is the failure mode of the rule it replaced.
  #
  # An entry may name a `test:` or a whole `path:`.
  #
  # The number of `owed: true` entries may not exceed this, and it may only go
  # down. That is what makes the debt bounded rather than a shrug: a new guard
  # cannot be added to the owed list without another one leaving it.

  - guard: TestEveryJobsEgressIsDeclaredInTheSuppliersList
    file: .github/workflows/sensitive-paths.yml
    find: "            api.github.com:443"
    replace: "            api.github.com:443\n            evil.example.com:443"
    mentions: "which the suppliers list does not declare for it"
    why: >
      A job quietly gaining an endpoint is what this whole mapping exists to
      refuse, and it is the change most likely to look routine in a diff: one
      more line in a list of hosts, in a file somebody is reading for another
      reason. scripts/approved-suppliers.yml says which job may reach what, and
      a workflow that reaches further than its entry has widened this estate's
      outbound surface with nothing to say so.

  # --- deliveries: one lock, one installer, and ordering holds no bypass ----

  - guard: TestNothingInstallsFromPyPIOutsideTakeDelivery
    file: scripts/install-dependencies.sh
    find: '"$(dirname "$0")/take-delivery.sh" ansible-core pre-commit pre-commit-hooks checkov zizmor codespell'
    replace: 'python3 -m pip install --user --break-system-packages "checkov==${CHECKOV_VERSION}"'
    mentions: "installs from a Python package index outside scripts/take-delivery.sh"
    why: >
      A second installer beside take-delivery.sh pins the tool and lets every
      dependency it pulls in resolve fresh on each install - over a hundred
      packages for checkov alone - while the lock sits there looking like the
      thing that decides what arrives (#416).

  - guard: TestOnlyTheExpediteDutyRunsUnderItsCredential
    file: .github/workflows/orders-under-the-bypass.yml
    create: |
      name: "Orders under the bypass"
      on: workflow_dispatch
      permissions:
        contents: read
      jobs:
        order:
          runs-on: ubuntu-latest
          timeout-minutes: 10
          steps:
            - name: Mint the expedite token
              env:
                KEY: ${{ secrets.PROCUREMENT_BOT_PRIVATE_KEY }}
              run: echo minted
            - name: Order the lock
              run: go run -C scripts/procurement . order
    mentions: "runs `procurement order`"
    why: >
      Ordering writes scripts/deliveries.lock, which decides what every lane
      and workstation installs. Run under the expedite credential, that
      decision is taken with a token that may merge without a review - the
      bypass belongs to the expediting duty, not to procurement.

  - guard: TestOnlyTheExpediteDutyRunsUnderItsCredential
    file: .github/workflows/another-duty-under-the-bypass.yml
    create: |
      name: "Another duty under the bypass"
      on: workflow_dispatch
      permissions:
        contents: read
      jobs:
        chore:
          runs-on: ubuntu-latest
          timeout-minutes: 10
          steps:
            - name: Mint the expedite token
              env:
                APP: ${{ secrets.PROCUREMENT_BOT_CLIENT_ID }}
              run: echo minted
            - name: A procurement verb that is not expediting
              run: go run -C scripts/procurement . reconcile-suppliers
    mentions: "which is not an expedite-* verb"
    why: >
      Any procurement duty added later arrives with no permission of its own.
      A workflow that runs it beside the expedite credential widens the
      standing order to whatever that verb does, and nothing in the verb's own
      code would say so.

  - guard: TestHeavyGuardsRunOnEveryPullRequest
    file: .github/workflows/pr-validation.yml
    find: "run: go test ./..."
    replace: "run: go test -short ./..."
    mentions: "runs Go tests with -short"
    why: >
      -short is the push budget. In CI it would skip the mutation ledger, the
      comment-stripping re-run and every other heavy guard with a green
      result, and nothing anywhere would run them.

  - guard: TestEveryAppTokenInputIsFedTheValueItsNameSays
    file: .github/workflows/token-fed-the-wrong-kind-of-id.yml
    create: |
      name: "Token fed the wrong kind of id"
      on: workflow_dispatch
      permissions:
        contents: read
      jobs:
        mint:
          runs-on: ubuntu-latest
          timeout-minutes: 5
          steps:
            - name: Mint a token
              uses: $/.github/workflows/app-token
              with:
                client-id: ${{ secrets.SOMETHING_BOT_APP_ID }}
                private-key: ${{ secrets.SOMETHING_BOT_PRIVATE_KEY }}
    mentions: "Integration not found"
    why: >
      A secret named for the numeric App ID and fed to the client-id input is
      exactly how every expedite token mint failed for a week (#439): the
      name described one value, the input wanted another, and nothing
      compared the two.

  - guard: TestEveryBypassMergeIsJudgedWhereItMerges
    file: .github/workflows/bypass-merge-rides-along.yml
    create: |
      name: "Bypass merge rides along"
      on: workflow_dispatch
      permissions:
        contents: read
      jobs:
        release:
          runs-on: ubuntu-latest
          timeout-minutes: 5
          steps:
            - name: Judge
              run: go run -C scripts/superintendent . enforce-standing-order
            - name: Merge
              run: |
                gh pr merge "$PR" --squash --admin
    mentions: "without --match-head-commit"
    why: >
      The bypass skips review and required checks alike. Without naming the
      commit it judged, a push landing between the verdict and the merge goes
      in unreviewed and unchecked.

  - guard: TestEveryBypassMergeIsJudgedWhereItMerges
    file: .github/workflows/bypass-merge-unjudged.yml
    create: |
      name: "Bypass merge unjudged"
      on: workflow_dispatch
      permissions:
        contents: read
      jobs:
        release:
          runs-on: ubuntu-latest
          timeout-minutes: 5
          steps:
            - name: Merge
              run: |
                gh pr merge "$PR" --squash --admin --match-head-commit "$HEAD"
    mentions: "never runs enforce-standing-order"
    why: >
      The Sensitive Paths check that judges the standing order is one of the
      checks the bypass skips, and it had run under a holder login that
      matched nobody. A merge under the bypass is bounded only by a judgement
      made in the job that merges.

  - guard: TestNoWorkflowStepReadsTMPDIR
    file: .github/workflows/pr-validation.yml
    find: "run: go test ./..."
    replace: 'run: go test ./... > "$TMPDIR/test.out"'
    mentions: "reads $TMPDIR"
    why: >
      GitHub-hosted runners do not set TMPDIR, so under set -u a reference to
      it fails the step before it does anything. That is how every game
      server update from 17 September failed as "no public build" - a symptom
      pointing at Valve rather than at the line that caused it (#440).

  - guard: TestTakeDeliveryInstallsOnlyTheFileTheLockWasOrderedWith
    file: scripts/take-delivery.sh
    find: 'if ! echo "${sha}  ${file}" | sha256sum -c --quiet -; then'
    replace: "if false; then"
    mentions: "installed a file whose hash the lock does not list"
    why: >
      The hash check is the whole of what scripts/deliveries.lock is worth.
      Without it every lane installs exactly as before and stays green, while
      a replaced release asset goes onto every runner and workstation.

  - guard: TestTakeDeliveryHandsPipEveryHashAndEachSharedLineOnce
    file: scripts/take-delivery.sh
    find: '"$venv/bin/python" -m pip install --require-hashes -r'
    replace: "python3 -m pip install --user --break-system-packages --require-hashes -r"
    mentions: "did not run from the isolated environment"
    why: >
      In the user site, a package the OS already ships satisfies the lock with
      no hash compared - Debian's jinja2 did, on the first real run - and the
      locked packages replace the OS's own for every Python program the
      account runs (#423).

  - guard: TestTakeDeliveryTakesTheNamedFileOutOfAnArchive
    file: scripts/take-delivery.sh
    find: 'found="$(find "$work/$name.d" -type f -name "$name")"'
    replace: 'found="$(find "$work/$name.d" -type f -name LICENSE)"'
    mentions: "not the archive's tool"
    why: >
      An archive carries a licence and a readme beside the binary. Taking the
      wrong member installs something that is not the tool under the tool's
      name, and the lane then fails far from the cause.

  - guard: TestTakeDeliveryHandsPipEveryHashAndEachSharedLineOnce
    file: scripts/take-delivery.sh
    find: '"$venv/bin/python" -m pip install --require-hashes -r'
    replace: '"$venv/bin/python" -m pip install -r'
    mentions: "was not told to require hashes"
    why: >
      Without --require-hashes pip treats the hashes as optional, resolves
      whatever it likes for anything unlisted, and installs it - the lock
      becomes a list of suggestions.

  - guard: TestTakeDeliveryRefusesWhatTheLockDoesNotDecide
    file: scripts/take-delivery.sh
    find: 'echo "refusing $name: it is an installer script and nothing here says how to run it" >&2'
    replace: 'sh "$file"'
    mentions: "an installer script ran with flags nobody wrote down"
    why: >
      An installer script is code from a supplier. Running one this script
      has no flags for means running it with whatever defaults it has -
      including falling back to sudo - rather than refusing.

  - guard: TestEverySystemHookIsSkippedInTheFormatLane
    file: .pre-commit-config.yaml
    find: "entry: delivered-python -m pre_commit_hooks.check_yaml"
    replace: "entry: delivered-python -m pre_commit_hooks_extra.check_yaml"
    mentions: "the Format lane does not take delivery of pre-commit-hooks-extra"
    why: >
      A system hook runs in the Format lane only because the lane took
      delivery of its package from the lock. A hook whose package it did not
      take fails there with "No module named", which is a red lane saying
      nothing about the repository.

  - guard: TestSetupWiresTheHooksAndSigning
    file: scripts/install-dependencies.sh
    find: '"$(dirname "$0")/take-delivery.sh" ansible-core pre-commit pre-commit-hooks checkov zizmor codespell'
    replace: '"$(dirname "$0")/take-delivery.sh" ansible-core pre-commit checkov zizmor codespell'
    mentions: "never takes delivery of pre-commit-hooks"
    why: >
      .pre-commit-config.yaml runs pre-commit-hooks as local hooks from this
      install. A workstation set up without it fails every commit on "No
      module named pre_commit_hooks" - or, if an old copy is lying around,
      runs whichever version that was.

  - guard: TestEveryPinnedVersionCanActuallyBeExported
    file: scripts/versions.env
    find: "HADOLINT_VERSION=2.15.1"
    replace: "HADOLINT_SHA256=c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507\nHADOLINT_VERSION=2.15.1"
    mentions: "A checksum does not belong here at all"
    why: >
      versions.env holds decisions. A hash beside a version can be edited by
      hand and nothing asks whether it was ever the file's; the lock is
      written only by ordering. Before #416 this key was exported and
      consumed, and the lane trusted whatever it said.

  - guard: TestZizmorExemptionsAreStillEarned
    file: .github/zizmor.yml
    find: "      - clerk.yml"
    replace: "      - codeql.yml"
    mentions: "no longer uses a relative"
    why: >
      A suppressed finding is invisible by construction, so an exemption that
      has stopped being about anything is the one kind of debt nothing in CI can
      report. The self-repository block exists only because actionlint refuses
      the syntax zizmor asks for; when actionlint ships a release that accepts
      it, the block becomes pure debt and this guard is the only thing that
      would ever say so.

  - guard: TestEveryRelativeActionReferenceIsAccountedFor
    file: .github/zizmor.yml
    find: "      - clerk.yml"
    replace: "      # - clerk.yml"
    mentions: "is not listed in .github/zizmor.yml"
    why: >
      A workflow reaching the local composite action without an entry here fails
      the Workflow Scan lane, which is correct but is a CI-only discovery -
      zizmor is not installed on every machine that can run `task test`. This
      names the file locally in seconds instead, which is the difference between
      a push-and-wait cycle and an edit.

  - guard: TestEveryDependabotEcosystemGroupsItsUpdates
    file: .github/dependabot.yml
    find: "      test-toolchain:\n        applies-to: version-updates"
    replace: "      test-toolchain:\n        applies-to: security-updates"
    mentions: 'want "version-updates"'
    why: >
      Ungrouped, Dependabot opens one pull request per dependency and every one
      of them rewrites the same lockfile, so merging the first leaves the rest
      conflicted - which is a bot manufacturing merge conflicts for a person who
      did not ask for any. The group is what serialises them. Scoping it to
      version-updates is the half that is easy to lose: without that line the
      group also swallows security updates, and a patched vulnerability starts
      waiting for the rest of the week's routine bumps instead of arriving on
      its own.

  - guard: TestTheHookShimsRunTheGuardBeforeAnythingThirdParty
    file: githooks/pre-commit
    find: "./toolshed/security guard-deliveries"
    replace: ": # the guard no longer runs"
    mentions: "the guard never ran"
    why: >
      The shim exists for one reason: pre-commit clones and installs seven
      third-party repositories before it runs any hook, so a supplier guard
      that is itself a pre-commit hook reports after the code it exists to
      refuse has already executed - with the vault session's privileges, on
      the developer's machine. Gating execution is not gating download. A
      guard that stops running here leaves nothing anywhere else checking.

  - guard: TestAFailingGuardStopsTheHookBeforePreCommit
    file: githooks/pre-commit
    find: "set -euo pipefail"
    replace: "set -uo pipefail"
    mentions: "exited 0 with a refusing guard"
    why: >
      Without set -e the shim reports a refusing supplier guard and then
      reaches pre-commit anyway, so the commit proceeds and the unapproved
      delivery is installed. The difference between a guard that refuses and
      one that comments is a single flag, and it is the flag somebody
      removes while debugging a hook.

  - guard: TestEveryShimPassesGitsOwnArgumentsThrough
    file: githooks/commit-msg
    find: "\t--hook-type=commit-msg"
    replace: "\t--hook-type=pre-commit"
    mentions: "did not pass"
    why: >
      commit-msg is the stage that runs commitlint, and this repository
      holds two rules there that CI cannot catch cheaply - no self
      co-authorship, and a lower-case subject. A published commit subject
      cannot be amended, because non_fast_forward applies to every branch
      here, so each violation that reaches a push costs a rewritten branch
      and a replaced pull request. A shim naming the wrong stage runs the
      wrong hooks and looks installed.

  - guard: TestTheShimsFindTheDeliveredPreCommitAndSayWhenThereIsNone
    file: githooks/commit-msg
    find: 'PATH="$HOME/.local/bin:$PATH"'
    replace: "true"
    mentions: "where pre-commit was delivered to ~/.local/bin"
    why: >
      take-delivery.sh puts pre-commit in ~/.local/bin, and the first shell
      after setup often lacks that directory on PATH - Debian adds it only
      if it existed at login. Without the shim adding it, every hook this
      repository relies on refuses to run on exactly the machine that was
      just set up.

  - guard: TestThePlaceholderConfigRefusesOutputThatIsNotJSON
    file: .github/scripts/placeholder-config.sh
    find: 'if ! jq empty "${rendered}" 2>/dev/null; then'
    replace: "if false; then"
    mentions: "exited 0 having written"
    why: >
      Every other check in that script asks whether a substitution was
      MISSED. This one asks whether one went too far, which is the case that
      produced no evidence at all: a marker missing its closing braces lets
      sed run on to the JSON's own, swallowing the structure between them.
      No marker survives and no op:// survives, so the script exits 0 with a
      file that is not JSON - and tofu then fails inside a provider
      configuration block naming neither the script nor the template.

  - guard: TestThePlaceholderConfigRefusesAnUnresolvedMarker
    file: .github/scripts/placeholder-config.sh
    find: 'if grep -q ''{{'' "${rendered}"; then'
    replace: "if false; then"
    mentions: "did not say why"
    why: >
      A template marker the sweep could not match reaches tofu as the
      literal text `{{`, which is a value no provider recognises. The
      refusal is what turns that into an error naming this script and the
      line, rather than one naming whichever provider happened to read the
      key first.

  - guard: TestThePlaceholderConfigRefusesAnUnwrappedVaultReference
    file: .github/scripts/placeholder-config.sh
    find: 'if grep -q ''op://'' "${rendered}"; then'
    replace: "if false; then"
    mentions: "accepted a bare op://"
    why: >
      `op inject` substitutes nothing that is not wrapped in braces, so an
      unwrapped reference is valid JSON that survives every schema check
      after it and reaches whatever reads that key as the literal string
      "op://homelab/...". This is the backstop for the hermetic version of
      the same check, for anything that renders the template without running
      the test suite.

  - guard: TestThePlaceholderConfigRendersTheRealTemplate
    file: .github/scripts/placeholder-config.sh
    find: "\t\"${template}\" >\"${rendered}\""
    replace: "\t\"${template}\" >/dev/null\n\techo '{}' >\"${rendered}\""
    mentions: "the template declares"
    why: >
      Valid JSON is not enough: `{}` is valid JSON and would satisfy every
      other check here while carrying none of the keys management/cluster
      reads. tofu would then fail on a missing attribute and name the HCL
      rather than the substitution that dropped it, which is the confusing
      failure this whole file exists to prevent.

  - guard: TestThePlaceholderConfigKeepsTheShapeProvidersCheck
    file: .github/scripts/placeholder-config.sh
    find: "\t-e 's#\"([a-z_]*_url|url|endpoint)\": *\"\\{\\{[^}]*\\}\\}\"#\"\\1\": \"https://example.invalid/placeholder\"#' \\"
    replace: "\t-e 's#__no_such_key__##' \\"
    mentions: "has no scheme"
    why: >
      The flux provider checks the repository URL has a scheme it recognises
      while validate is still evaluating its configuration block, before any
      resource is read. Without the URL-shaped pass those keys render as the
      bare word `placeholder`, and the Validate lane fails on a provider
      rather than on anything in the change.

  - guard: TestThePodAndServiceNetworksAreDeclared
    file: management/cluster/talos.tf
    find: "          podSubnets     = [local.pod_cidr]"
    replace: "          # podSubnets removed"
    mentions: "declares no podSubnets"
    why: >
      The cluster's pod and service ranges are its largest address
      commitment and they were undeclared for the whole life of the estate -
      correct values, chosen by nobody, absent from an addressing decision
      that records every other range down to the VM id bands. clusterNetwork
      is fixed at cluster creation, so a wrong one costs a rebuild rather
      than an edit, and a value nobody wrote down cannot be reviewed at all.

  - guard: TestThePodAndServiceNetworksCannotCollideWithASite
    file: management/cluster/variables.tf
    find: '  pod_cidr     = "10.244.0.0/16"'
    replace: '  pod_cidr     = "10.0.0.0/8"'
    mentions: "overlaps the site network"
    why: >
      10.0.0.0/8 is the shape a CNI default tends to take and it contains
      every site subnet this estate can define, because site octets are
      asserted 1-95. Pods sharing addresses with the machines they run on is
      routing that works until two things want the same address, and it
      cannot be corrected without rebuilding the cluster.

  - guard: TestCiliumTakesItsPodAddressesFromKubernetes
    file: clusters/bootstrap/cilium.yaml
    find: '  ipam: "kubernetes"'
    replace: '  ipam: "cluster-pool"'
    mentions: 'not "kubernetes"'
    why: >
      In kubernetes mode Cilium takes pod addresses from the podSubnets this
      repository declares. In every other mode it allocates from a pool of
      its own, and its default pool is 10.0.0.0/8 - which swallows every
      site subnet. The manifest still renders, still installs and still
      comes up, so the switch is one word with no other signal.

  - guard: TestTheDNSResolversAreDeclaredInOnePlace
    file: management/cluster/variables.tf
    find: '  dns_resolvers = ["1.1.1.1", "1.0.0.1"]'
    replace: "  dns_resolvers        = [\"1.1.1.1\", \"1.0.0.1\"]\n  fallback_dns_servers = [\"9.9.9.9\"]"
    mentions: "names the resolver"
    why: >
      The resolvers were written out four times - twice in cloud-init and
      twice in Talos's ResolverConfig - which is the duplication the
      one-place rule already forbids for versions, and it fails the same
      way: three get updated and the fourth machine class resolves through
      something nobody meant. It is also the only route a fork has to point
      the estate at internal resolvers.

  - guard: TestTheGameServerCannotBeGivenAPathIntoTheEstate
    file: modules/applications/valheim/base/network-policy.yaml
    find: "            cidr: 172.16.0.0/12"
    replace: "            cidr: 10.0.0.0/8"
    mentions: "permits 10.0.0.0/8"
    why: >
      Opening another private range is the obvious response to the next
      player who cannot connect, and 10.0.0.0/8 is the obvious range because
      it is the one remaining and looks symmetrical with the two beside it.
      It is also the space the whole estate is addressed out of, so it hands
      a public-facing game server a UDP path to the API server, the state
      database, the hypervisor and every other workload. The manifest stays
      valid and the cluster does exactly what it was told.

  - guard: TestTheGameServerCanStillReachPlayersOnOrdinaryNetworks
    file: modules/applications/valheim/base/network-policy.yaml
    find: "            cidr: 172.16.0.0/12"
    replace: "            cidr: 198.51.100.0/24"
    mentions: "no longer permits 172.16.0.0/12"
    why: >
      The converse of the guard above, and it needs saying: a check that
      only ever refuses is satisfied by closing everything. A closed range
      is a player who joins, spawns and is disconnected seconds later with
      nothing anywhere naming this policy - which is what 172.16.0.0/12
      being shut cost every remote player who tried, from a phone hotspot or
      a hotel.

  - guard: TestEveryChartsImagesAreGovernedOrDeclared
    file: scripts/approved-suppliers.yml
    find: "  - chart: openebs\n    pulls_from: docker.io"
    replace: "  - chart: openebs-was-declared-here\n    pulls_from: docker.io"
    mentions: "neither pins its images"
    why: >
      The registries section asserts that every image comes from an approved
      registry and is pinned by digest, and the walk behind it only ever
      reads references written in this repository. A chart pulling its own
      defaults is invisible to it, so 'no unapproved image is committed
      here' and 'no unapproved image runs here' produce the same green.
      Quietly dropping a declaration puts a chart back in that silence - and
      the one that matters most is the storage provisioner handing out the
      volumes the state database sits on.

  - guard: TestNoTerminalTranscriptCarriesARealHostname
    file: docs/a-pasted-transcript.md
    create: |
      # Notes from the run

      Reloading the SDN on the hypervisor:

          root@pve-01:~# pvesh set /cluster/sdn
          pve-01: reloading network config
    mentions: "naming the host"
    why: >
      A real hostname pasted out of a terminal is how names actually leak into
      this repository, and it is the one class the forkability guard cannot
      see: it works on shapes the estate GENERATES, and a bare hostname in
      prose is just a word. CLAUDE.md names the cause - recording evidence
      verbatim is the right instinct and is exactly the operation that carries
      a real name into a public repository without anybody deciding to. It has
      happened: a hypervisor's name sat in a comment in the Ansible playbook
      recording a terminal session, green the whole time. A `create` rather
      than a substitution because the guard has nothing to say until a
      transcript is PRESENT, and the normal state of the tree is that none is.

  - guard: TestTheDeclaredTiersAreTheMeasuredOnes
    file: tests/README.md
    find: "| **fuzz**        | What happens on input nobody thought of?"
    replace: "| **fuzzing**     | What happens on input nobody thought of?"
    mentions: "has no floor for it"
    why: >
      The tier table is the one place a reader looks to find out what tiers
      exist, and nothing checked it against what is actually measured. It had
      already drifted: five tiers declared against eight counted, so tofu, js
      and fuzz were floored and reported on every run while being absent from
      the table. A tier that loses its row goes back to being invisible in
      exactly the way a missing check is - which is the allow-list failure this
      repository spent a day removing one level down.

  - guard: TestEveryCommentPathReplacesItselfRatherThanAppending
    file: .github/workflows/github-script/zz-appends-a-comment.js
    create: |
      module.exports = async ({ github, context }) => {
        const marker = '<!-- planted -->';
        const repo = { owner: context.repo.owner, repo: context.repo.repo };
        const { data: comments } = await github.rest.issues.listComments({
          ...repo, issue_number: context.issue.number,
        });
        const existing = comments.find(c => c.body.startsWith(marker));
        await github.rest.issues.createComment({
          ...repo, issue_number: context.issue.number, body: marker,
        });
      };
    mentions: "finds the previous comment and does not"
    why: >
      A comment with no marker cannot be found again on the next push, so
      every run adds another and the oldest sits at the top. That is noise
      of the specific kind that makes a reviewer stop reading the comments,
      on the lane that comments about changes to real infrastructure - and
      the one path that had this defect went unnoticed for months because
      its job gates on directories that did not exist yet.

  - guard: TestATalosImagePathCarriesItsSchematic
    file: management/cluster/compute.tf
    find: '  file_name               = "talos-${local.talos_version}-${substr(local.schematic_id, 0, 8)}.iso"'
    replace: '  file_name               = "talos-${local.talos_version}.iso"'
    mentions: "does not carry its schematic id"
    why: >
      A schematic id says which extensions are baked into a Talos image, and the
      download resource is identified by its datastore path. With the schematic
      absent from that path, re-minting one - the only way to add, remove or
      move an extension - is not a change: no diff, no fetch, and the
      replace_triggered_by on the template has nothing to fire on. The bump then
      looks applied, with a clean plan and a successful apply, while every node
      keeps the old extensions. That is how a known-vulnerable Tailscale reached
      every machine in the estate and stayed there, and the failure is silence
      rather than an error.

  - guard: TestEveryFluxControllerIsPinnedHere
    file: clusters/management/flux-system/kustomization.yaml
    find: "  - name: ghcr.io/fluxcd/source-controller"
    replace: "  - name: ghcr.io/fluxcd/source-controller-was-here"
    mentions: "does not pin it"
    why: >
      kustomize's image transformer matches on image NAME, so a controller the
      overlay does not name keeps the mutable tag the generated manifest carries
      - on the component that applies everything else in the cluster. The
      overlay still builds, `task validate` still passes, and nothing else
      objects. gotk-components.yaml is rewritten wholesale by `flux bootstrap`,
      so a controller added or renamed upstream arrives without anybody editing
      this file, which is exactly when a hand-maintained list stops matching.

  - guard: TestSetupSaysPushesWillBeRefusedWithoutARegisteredKey
    file: scripts/install-dependencies.sh
    find: "\t\twarn \"could not register the signing key, and pushes WILL be refused without it\""
    replace: "\t\twarn \"could not register the signing key, which is optional\""
    mentions: "did not say that pushes will be refused"
    why: >
      This step presented registering the key as optional once, and it is
      not: the all-branches ruleset wants a VERIFIED signature, so a commit
      signed with a key GitHub does not know is refused exactly like an
      unsigned one. The operator's editor pushed into that refusal with no
      readable reason, and it cost an evening. A setup script that
      understates a requirement is worse than one that says nothing, because
      it is read as reassurance.

  - guard: TestSetupWiresTheHooksAndSigning
    file: scripts/install-dependencies.sh
    find: "\tgit config core.hooksPath githooks"
    replace: "\t: # hooks left where pre-commit put them"
    mentions: "core.hooksPath is"
    why: >
      core.hooksPath REPLACES .git/hooks rather than merging with it, and
      this line is the only thing that sets it. Without it git runs the
      hooks pre-commit generates, the supplier guard in githooks/pre-commit
      becomes a file nobody invokes, and every shim held to a standard
      elsewhere is unreachable. Nothing announces that - the commit succeeds
      and the guard simply never ran.

  - guard: TestSetupIsSafeToReRun
    file: scripts/install-dependencies.sh
    find: "if git -C \"$repo_root\" config --get commit.gpgsign | grep -qx true; then\n\tskip \"commit signing already configured\""
    replace: "if false; then\n\tskip \"commit signing already configured\""
    mentions: "did not recognise that signing was already set up"
    why: >
      Without the already-configured check a re-run generates a new signing
      key, replacing the one GitHub knows about - which turns a working
      setup into refused pushes, on a script whose own header promises it is
      safe to re-run. The person most likely to re-run it is the person who
      just had a push refused.

  - guard: TestThereIsOnlyOneRetryAndANewOneIsRefused
    file: .github/workflows/workload-images.yml
    find: "jobs:"
    replace: "jobs:\n  for attempt in 1 2 3; do\n"
    mentions: "hand-rolls a retry"
    why: >
      There is one retry policy - bounded attempts, never a verdict, every
      attempt reported - and it had three implementations. Three is three
      places for it to drift, and the fourth gets written by somebody who
      knew about none of them. This discovers a retry-shaped loop anywhere
      in the repository rather than checking a list of files, so a
      hand-rolled one cannot be added somewhere nobody thought to look.

  - guard: TestNoGuardSkipsWithoutSayingWhyItIsHonest
    file: tests/go/repo/cni_test.go
    find: "func TestTheHealthGateWaitsForTheCNI(t *testing.T) {"
    replace: "func TestTheHealthGateWaitsForTheCNI(t *testing.T) {\n\tt.Skip(\"undeclared\")"
    reads_source: true
    mentions: "skip without a declared reason"
    why: >
      A skip is fail-open: the run is green and nothing distinguishes 'I
      looked and found nothing' from 'I could not look'. This repository has
      had to repair that shape in a plan summary, a dry run and a registry
      check, each time after somebody noticed rather than because anything
      said so. A new guard that skips must declare what TRUE thing the skip
      reports, and the default is refusal.

  - guard: TestNoGuardDropsAnErrorFromItsOwnSubject
    file: tests/go/repo/cni_test.go
    find: "func TestTheHealthGateWaitsForTheCNI(t *testing.T) {"
    replace: "func TestTheHealthGateWaitsForTheCNI(t *testing.T) {\n\tif err := error(nil); err != nil {\n\t\treturn\n\t}"
    reads_source: true
    mentions: "drop an error from the thing being guarded"
    why: >
      The quiet half of failing open. A guard that could not read its
      subject and carried on leaves every later assertion running against a
      smaller set than it claims to check, and it looks like ordinary Go
      rather than like a skip. The count per file may only fall, so a new
      drop cannot be added without somebody writing the number down.

  - guard: TestEveryKindOfFileIsGovernedOrDeclaredUngoverned
    file: scripts/undeclared-language.rs
    create: |
      fn main() {
          println!("nothing in this estate reads this file");
      }
    mentions: 'covers ".rs"'
    why: >
      Every tool here is bound to a file type, so a language nobody declared
      is a language nothing checks - not linted, not built, not covered, not
      proved, and silent about all of it. The aggregate that used to hold a
      default opinion about unfamiliar files went in #365, which makes this
      the only thing standing between a new extension and no checks at all.
      Planted rather than substituted because the guard has nothing to say
      until an undeclared kind is PRESENT, and no file in the tree can be
      edited into being a different language.

  - guard: TestEveryShebangNamesADeclaredInterpreter
    file: githooks/undeclared-interpreter
    create: |
      #!/usr/bin/env python3
      print("nothing here lints this")
    mentions: "names an interpreter this estate has no tooling for"
    why: >
      The one case the extension check cannot reach. An extensionless file is
      classified by its own name, so declaring githooks/pre-push says nothing
      about what it is written in - and githooks/ is executable code that runs
      on every commit and every push. Without this, adopting a new language is
      as quiet as naming a file. Planted for the same reason as above: there is
      nothing in the tree to edit into a foreign shebang.

  - guard: TestEveryJobHardensTheRunnerFirst
    file: .github/workflows/zz-starts-with-an-unhardened-action.yml
    create: |
      name: planted
      on: push
      jobs:
        planted:
          runs-on: ubuntu-latest
          timeout-minutes: 1
          steps:
            - uses: $/.github/actions/versions
    mentions: "whose own first step is"
    why: >
      A job may now begin with a composite action from this repository instead
      of with harden-runner itself, which is what lets harden-runner be written
      once. That permission is only safe while the action's OWN first step is
      harden-runner - otherwise every step inside it runs unmonitored and the
      job still looks like it starts correctly. Planted, because no workflow in
      the tree starts with an unhardened action to edit into one.

  - guard: TestEveryJobHardensTheRunnerFirst
    file: .github/workflows/zz-starts-with-a-missing-action.yml
    create: |
      name: planted
      on: push
      jobs:
        planted:
          runs-on: ubuntu-latest
          timeout-minutes: 1
          steps:
            - uses: $/.github/workflows/does-not-exist
    mentions: "that action cannot be read"
    why: >
      An action this guard cannot read is an action it cannot say is hardened.
      Treating an unreadable reference as acceptable would turn a typo in the
      path, or an action deleted while a job still names it, into a job that
      passes the first-step rule by being unexaminable.

  - guard: TestEveryCheckoutRefusesToPersistCredentials
    file: .github/actions/versions/action.yml
    find: |
      steps:
          - name: Export pinned versions
    replace: |
      steps:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          - name: Export pinned versions
    mentions: "(inside ./.github/actions/versions)"
    why: >
      Moving checkout into a composite action must not be a way to stop this
      rule applying. A job that calls an action which checks out has checked
      out just the same, and a token left on disk there is reachable by every
      later step of the job. Reading only the job's own steps would have made
      the consolidation quietly exempt every job from it.

  - guard: TestEveryActionCommitIsWrittenOnce
    file: .github/workflows/zz-second-copy-of-checkout.yml
    create: |
      name: planted
      on: push
      jobs:
        planted:
          runs-on: ubuntu-latest
          timeout-minutes: 1
          steps:
            - uses: $/.github/workflows/mobilize
              with:
                egress-policy: block
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
    mentions: "is written in 2 places"
    why: >
      harden-runner was pinned in 31 jobs and checkout in 30, agreeing only
      because nobody had yet made a mistake. The shared actions under
      .github/workflows hold the one literal each, and this is what stops a
      new job reaching past them and writing a second copy - which would pass
      every other check, since it names the right commit today. Planted,
      because once consolidated there is no second copy in the tree to edit.

  - guard: TestEveryActionCommitIsWrittenOnce
    file: .github/workflows/zz-second-codeql-commit.yml
    create: |
      name: planted
      on: push
      jobs:
        planted:
          runs-on: ubuntu-latest
          timeout-minutes: 1
          steps:
            - uses: $/.github/workflows/mobilize
              with:
                egress-policy: block
            - uses: github/codeql-action/autobuild@1111111111111111111111111111111111111111 # v0.0.0
    mentions: "pinned to 2 different commits"
    why: >
      Writing each action PATH once still allows two paths of one repository
      to name two commits - codeql-action's init and analyze are separate
      paths. A commit belongs to the repository, so running two builds of one
      action side by side is exactly the drift consolidation was meant to end.

  - guard: TestEverySharedScriptIsNamedAndEveryNameIsAScript
    file: .github/workflows/github-script/zz-nobody-runs-this.js
    create: |
      module.exports = async () => {};
    mentions: "is not run by any step"
    why: >
      A script beside the shared action runs with a job's token whenever a
      step names it. One nothing names is code with that reach and no reason
      to exist, and the next step to name it inherits whatever it does without
      anybody having read it for that purpose.

  - guard: TestEverySharedScriptIsNamedAndEveryNameIsAScript
    file: .github/workflows/zz-names-a-missing-script.yml
    create: |
      name: planted
      on: push
      jobs:
        planted:
          runs-on: ubuntu-latest
          timeout-minutes: 1
          steps:
            - uses: $/.github/workflows/mobilize
              with:
                egress-policy: block
                checkout: "false"
            - uses: $/.github/workflows/github-script
              with:
                name: nothing-by-this-name
    mentions: "and there is no .github/workflows/github-script/nothing-by-this-name.js"
    why: >
      A step naming a script that is not there fails only when its job runs,
      and the jobs using shared scripts run only on infrastructure changes -
      so the break would surface on exactly the pull request where a reviewer
      needed the plan comment.

  - guard: TestEveryCheckoutRefusesToPersistCredentials
    file: .github/workflows/checkout/action.yml
    find: "persist-credentials: false"
    replace: "persist-credentials: true"
    mentions: "(inside $/.github/workflows/mobilize) (inside $/.github/workflows/checkout)"
    why: >
      Every job now reaches checkout two levels down - through mobilize, then
      checkout - so the token-on-disk rule only holds if the guard descends
      that far. Reading one level would reach mobilize, find no checkout step
      in it, and pass every job while the one checkout in the repository left
      the token behind. The mention requires the two-level path specifically.

  - guard: TestTheFormatLaneRefusesASupplierBeforeInstallingAnything
    file: .github/workflows/setup-go/action.yml
    find: "go-version: ${{ env.GO_VERSION }}"
    replace: 'go-version: "1.26.7"'
    mentions: "sets up Go without reading GO_VERSION"
    why: >
      The Format lane no longer writes a Go version at all; it trusts the
      shared setup-go to read the pin. That trust is only safe while the
      shared action actually does, and a literal there agrees with
      scripts/versions.env exactly until the pin moves - on the lane that runs
      the supplier gate before anything is installed.

  - guard: TestNoCheckoutCanBePointedAtOtherCode
    file: .github/workflows/checkout/action.yml
    find: "persist-credentials: false"
    replace: "persist-credentials: false\n        repository: someone/else"
    mentions: 'gives actions/checkout "repository"'
    why: >
      The clerk checked out a pull request's own code in a run holding its
      App's private key, then built and ran it (#409). The shared checkout's
      ref input is what made that reusable. Allowing only how deep to fetch -
      not refusing ref by name - is what stops the same hole returning as
      repository, or as whatever input checkout grows next.

  - guard: TestNoPrivilegedRunPutsAPullRequestInTheWorkspace
    file: .github/workflows/zz-privileged-reset.yml
    create: |
      name: planted
      on:
        issue_comment:
          types: [created]
      jobs:
        planted:
          runs-on: ubuntu-latest
          timeout-minutes: 1
          steps:
            - name: Put the change where things run
              run: |
                git fetch origin refs/pull/1/head
                git worktree add --detach change FETCH_HEAD
                git reset --hard FETCH_HEAD
    mentions: 'runs "git reset'
    why: >
      A worktree is only a boundary while nothing moves the workspace onto the
      same commit. On a trigger that runs with secrets for anybody's pull
      request, replacing the workspace puts unreviewed code where every later
      step and every ./ action executes from.

  - guard: TestNoPrivilegedRunPutsAPullRequestInTheWorkspace
    file: .github/workflows/zz-privileged-fetch.yml
    create: |
      name: planted
      on: [workflow_run]
      jobs:
        planted:
          runs-on: ubuntu-latest
          timeout-minutes: 1
          steps:
            - name: Fetch the change
              run: git fetch origin refs/pull/1/head
    mentions: "without its own worktree"
    why: >
      In a run holding secrets a pull request is data, and a worktree of its
      own is what keeps it apart from where things execute. A fetch that does
      not make one leaves the next step one checkout away from #409.

  - guard: TestEveryJobSaysWhetherItKeepsRoot
    file: .github/workflows/zz-says-nothing-about-root.yml
    create: |
      name: planted
      on: push
      jobs:
        planted:
          runs-on: ubuntu-latest
          timeout-minutes: 1
          steps:
            - uses: $/.github/workflows/mobilize
              with:
                egress-policy: block
                checkout: "false"
    mentions: "does not say whether it keeps root"
    why: >
      With sudo, any later step in a job can stop harden-runner's agent or
      flush its rules and then call out, so a block holds only as long as
      root is gone (#410). A job that does not say is a job whose answer is
      "keep it" by default, which is the state every job was in.

  - guard: TestEveryJobSaysWhetherItKeepsRoot
    file: .github/workflows/zz-keeps-root-quietly.yml
    create: |
      name: planted
      on: push
      jobs:
        planted:
          runs-on: ubuntu-latest
          timeout-minutes: 1
          steps:
            - uses: $/.github/workflows/mobilize
              with:
                egress-policy: block
                disable-sudo-and-containers: "false"
                checkout: "false"
    mentions: "keeps root with no reason declared"
    why: >
      Keeping root on a GitHub-hosted runner is sometimes right - a Docker
      action, an image build - but it reopens the way a later step can
      switch egress enforcement off, so it is an exception somebody has to
      write down beside the job's egress entry rather than a value in a file.

  - guard: TestEveryJobSaysWhetherItKeepsRoot
    file: .github/workflows/zz-blocks-on-arc.yml
    create: |
      name: planted
      on: push
      jobs:
        planted:
          runs-on: homelab-management
          timeout-minutes: 1
          steps:
            - uses: $/.github/workflows/mobilize
              with:
                egress-policy: block
                disable-sudo-and-containers: "false"
                checkout: "false"
    mentions: "claims egress-policy: block"
    why: >
      harden-runner returns before acting on the ARC runner, so block there
      blocks nothing - and the jobs on that runner hold a token that reads and
      writes the whole vault. A job that reads as restricted while reaching
      anything is worse than one that says audit (#411).

  - guard: TestEveryJobSaysWhetherItKeepsRoot
    file: .github/workflows/zz-disables-sudo-on-arc.yml
    create: |
      name: planted
      on: push
      jobs:
        planted:
          runs-on: homelab-management
          timeout-minutes: 1
          steps:
            - uses: $/.github/workflows/mobilize
              with:
                egress-policy: audit
                disable-sudo-and-containers: "true"
                checkout: "false"
    mentions: 'claims disable-sudo-and-containers: "true"'
    why: >
      The same early return means sudo is not removed on that runner either.
      A setting that reads as a protection and does nothing is a status that
      says something untrue, on exactly the jobs where it would matter most.

