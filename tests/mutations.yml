  # --- the ledger cannot mutate Go source ------------------------------------
  #
  # The guards run from a binary compiled once from the real tree, so an edit
  # to Go source in the scratch copy never reaches them - an entry would pass
  # or fail for reasons unrelated to what it claims. This guard reads Go source
  # and nothing else, so it has no non-Go mutation available.
  #
  # Proved by hand instead: a twelfth subprocess helper was added to
  # internal/run, the guard named it, and it was removed. Worth recording that
  # the first attempt at that proof reported a PASS - go test had cached the
  # previous result, because this guard reads the repository at runtime rather
  # than depending on the package it lives in, so nothing invalidated the
  # cache. Any repo-introspection guard proved by hand needs -count=1, or the
  # proof is of nothing.
  - path: tests/go/repo/enumeration_root_test.go
    reason: go-source
    # It calls repopath.Root from the compiled binary, so no mutation of the
    # scratch tree reaches the answer it checks. Proved by hand, with -count=1
    # for the reason recorded above: repopath's walk was edited to answer one
    # directory too deep, the check failed naming both paths, and the edit was
    # reverted byte for byte. The logic it protects is also unit-tested in
    # scripts/details/repopath: TestANestedClaudeMdDoesNotBecomeTheRoot.
  - path: tests/go/repo/toolbelt_test.go
    reason: go-source
  # Same reason: it reads Go source and nothing else, so the ledger cannot
  # reach it. Proved by hand with -count=1 - restoring the gh invocation in
  # breakground_preconditions.go makes it name the file.
  - path: tests/go/repo/no_gh_dependency_test.go
    reason: go-source
  # Same again. Proved by hand with -count=1: adding an unpinned endpoint var
  # to scripts/security made it name proveAPI, and removing it went green.
  # Two earlier attempts at that proof did NOT fire, which was the guard being
  # right - any test assigning the variable satisfies it, and pointAt's restore
  # closure is an assignment too.
  - path: tests/go/repo/pinned_endpoints_test.go
    reason: go-source

# Tests that legitimately read a comment.
#
# TestNoTestIsSatisfiedByAComment runs the whole package against a copy with
# every whole-line comment stripped out of the YAML it reads, and requires
# every test that passed to still pass. A test that flips was being satisfied
# by prose - which has happened twice here, most recently a tripwire check
# satisfied by the comment ABOVE the step it was meant to be asserting.
#
# An entry here is an exemption, so it costs what an exemption costs: a reason
# somebody can read later.
comment_dependent:
  - test: TestEverySilencedFindingNamesTheGuardThatProvesItMayBe
    reason: >
      The comment is its subject. A tool's own configuration cannot carry a
      reason anywhere else, so the guard a silenced entry names is written in
      the comment above that entry, and a copy with the comments stripped is
      a copy in which every such entry names nothing.
